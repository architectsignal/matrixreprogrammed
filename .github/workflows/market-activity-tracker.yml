name: Market Activity Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '20 5 * * *'
  push:
    branches:
      - main
    paths:
      - 'data/market-activity-watchlist.json'
      - 'scripts/collect-sec-market-activity.js'
      - 'scripts/sec-market-utils.js'
      - 'scripts/build-market-activity-pages.js'
      - 'scripts/integrate-market-activity-data.js'
      - 'scripts/patch-market-watchlists-worker.js'
      - 'scripts/market-activity-test.js'
      - 'market-activity.js'
      - 'market-watchlist.html'
      - 'market-watchlist.js'
      - 'migrations/0003_market_watchlists.sql'
      - '.github/workflows/market-activity-tracker.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'data/market-activity-watchlist.json'
      - 'data/market-activity.json'
      - 'scripts/collect-sec-market-activity.js'
      - 'scripts/sec-market-utils.js'
      - 'scripts/build-market-activity-pages.js'
      - 'scripts/integrate-market-activity-data.js'
      - 'scripts/patch-market-watchlists-worker.js'
      - 'scripts/market-activity-test.js'
      - 'scripts/build-cloudflare-output.js'
      - 'market-activity.js'
      - 'market-watchlist.html'
      - 'market-watchlist.js'
      - 'migrations/0003_market_watchlists.sql'
      - '.github/workflows/market-activity-tracker.yml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'MatrixReprogrammedMarketTracker/1.0 njmgroupfrance@gmail.com' }}

concurrency:
  group: market-activity-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[market-data]')
    name: Collect, compare, validate and publish SEC activity
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic parser and access tests
        run: node scripts/market-activity-test.js

      - name: Collect official SEC filings
        if: github.event_name != 'pull_request'
        env:
          SEC_FORM4_FILINGS_PER_ISSUER: '12'
          SEC_REQUEST_DELAY_MS: '180'
          SEC_REQUEST_TIMEOUT_MS: '30000'
          SEC_PUBLIC_CHANGE_LIMIT: '4000'
        run: node scripts/collect-sec-market-activity.js

      - name: Rebuild canonical structured graph
        run: |
          node scripts/build-structured-investigation-data.js
          node scripts/refine-structured-entity-types.js

      - name: Build and integrate market activity
        run: |
          node scripts/build-market-activity-pages.js
          node scripts/integrate-market-activity-data.js

      - name: Rebuild entity and relationship pages
        run: |
          node scripts/build-entity-registry-page.js
          node scripts/build-relationship-registry-page.js

      - name: Generate evidence-network data and page
        run: node scripts/build-evidence-network-map.js

      - name: Wire evidence-network public routes
        run: node scripts/wire-evidence-network-map.js

      - name: Rebuild Search V3
        run: |
          node scripts/repair-search-system.js
          node scripts/extend-search-with-structured-data.js
          node scripts/build-search-v3-index.js
          node scripts/build-search-v3-runtime.js

      - name: Run complete guarded Cloudflare build
        env:
          SOURCE_DOCUMENTS_PER_RUN: '0'
        run: node scripts/build-cloudflare-output.js

      - name: Commit official market outputs
        if: github.event_name != 'pull_request'
        id: commit
        run: |
          git config user.name "matrix-market-bot"
          git config user.email "actions@github.com"
          git add \
            data/market-activity.json \
            data/market-activity-state.json \
            data/market-holdings \
            data/market-position-changes \
            data/entity-registry.json \
            data/relationship-registry.json \
            market-activity.html \
            market-activity \
            downloads/market-activity.csv \
            entity-registry.html \
            relationship-registry.html \
            evidence-network-map.html \
            data/evidence-network-map.json \
            downloads/evidence-network-map.csv \
            search.html \
            search \
            search.js \
            search-index.json \
            data/search-facets.json \
            sitemap.xml \
            llms.txt \
            || true
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No official market-data changes to commit."
            exit 0
          fi
          git commit -m "Refresh official SEC market activity $(date -u +%F) [market-data] [deploy]"
          pushed=false
          for attempt in 1 2 3; do
            if git push; then
              pushed=true
              break
            fi
            git pull --rebase --autostash origin main
          done
          if [ "$pushed" != true ]; then
            echo "Market activity outputs could not be pushed after three attempts."
            exit 1
          fi
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Verify live tracker and access boundary
        if: github.event_name != 'pull_request' && steps.commit.outputs.committed == 'true'
        env:
          SITE_URL: https://matrixreprogrammed.com
        run: |
          for attempt in $(seq 1 36); do
            tracker=false
            data=false
            csv=false
            unauth=false
            curl --fail --silent --show-error --max-time 20 "$SITE_URL/market-activity.html" | grep -q 'MARKET ACTIVITY TRACKER' && tracker=true || true
            curl --fail --silent --show-error --max-time 20 "$SITE_URL/data/market-activity.json" | grep -q 'U.S. Securities and Exchange Commission EDGAR' && data=true || true
            curl --fail --silent --show-error --max-time 20 "$SITE_URL/downloads/market-activity.csv" | grep -q 'recordType,subject,issuer' && csv=true || true
            status="$(curl --silent --output /tmp/market-watch.json --write-out '%{http_code}' --max-time 20 "$SITE_URL/api/market/watchlists" || true)"
            [ "$status" = '401' ] && grep -q 'Authentication required' /tmp/market-watch.json && unauth=true || true
            if [ "$tracker" = true ] && [ "$data" = true ] && [ "$csv" = true ] && [ "$unauth" = true ]; then
              echo "Official market tracker is live and member watchlists remain authenticated."
              exit 0
            fi
            echo "Waiting for market tracker production deployment ($attempt/36)…"
            sleep 20
          done
          echo "Production did not expose the complete market tracker within the verification window."
          exit 1

      - name: Upload market tracker reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-activity-tracker-${{ github.run_id }}
          path: |
            downloads/market-activity-test.json
            downloads/sec-market-activity-collection-report.json
            downloads/phase6-data-integration.json
            downloads/phase6-worker-patch.json
            data/market-activity.json
          if-no-files-found: ignore
          retention-days: 60
