name: Repair AI Management Production Secret

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/repair-ai-management-secret.yml

permissions:
  contents: read

concurrency:
  group: repair-ai-management-production-secret
  cancel-in-progress: false

jobs:
  repair-and-prove:
    name: Synchronise Worker secret and prove owner health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
      SITE_URL: https://matrixreprogrammed.com
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate repair credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID is missing'; exit 1; }
          test -n "${AI_MANAGEMENT_ADMIN_TOKEN:-}" || { echo 'AI_MANAGEMENT_ADMIN_TOKEN is missing'; exit 1; }
          test "${#AI_MANAGEMENT_ADMIN_TOKEN}" -ge 24 || { echo 'AI_MANAGEMENT_ADMIN_TOKEN is unexpectedly short'; exit 1; }
          echo 'Required repair credentials are present.'

      - name: Synchronise protected Worker secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$AI_MANAGEMENT_ADMIN_TOKEN" | npx wrangler secret put AI_MANAGEMENT_ADMIN_TOKEN --name matrixreprogrammed

      - name: Prove live AI-management health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            status="$(curl --silent --show-error --output /tmp/ai-health.json --write-out '%{http_code}' \
              --header "accept: application/json" \
              --header "x-admin-token: $AI_MANAGEMENT_ADMIN_TOKEN" \
              "$SITE_URL/api/ai-management/admin/health" || true)"
            if [ "$status" = '200' ]; then
              node -e "const fs=require('fs'); const value=JSON.parse(fs.readFileSync('/tmp/ai-health.json','utf8')); if(value.ok!==true||value.schemaReady!==true||value.autonomySchemaReady!==true) process.exit(1); console.log('Live AI-management health passed with both schemas ready.');"
              exit 0
            fi
            echo "Health attempt $attempt returned HTTP $status"
            sleep 5
          done
          echo 'Live AI-management health did not return HTTP 200 after secret synchronisation.'
          cat /tmp/ai-health.json || true
          exit 1

      - name: Prove unauthorised access remains blocked
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/ai-health-unauthorised.json --write-out '%{http_code}' \
            --header 'accept: application/json' \
            "$SITE_URL/api/ai-management/admin/health")"
          test "$status" = '403' || { echo "Unauthorised health request returned HTTP $status instead of 403"; exit 1; }
          echo 'Unauthorised access remains blocked.'
