name: Dispatch Latest Guarded Production Build Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-latest-once-20260725.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: dispatch-latest-guarded-production-once
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical guarded production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[confirmation]=DEPLOY MATRIX REPROGRAMMED'
          echo "Canonical guarded deployment dispatched for the latest main branch."

# Dispatch refresh: verified refresh chain at 0101db06.
