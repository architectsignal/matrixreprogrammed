name: AI Autonomy Safety Gate

on:
  pull_request:
    paths:
      - 'ai-management/**'
      - 'local-agent/**'
      - 'scripts/ai-management-*.mjs'
      - 'scripts/opportunity-hunter-test.mjs'
      - 'scripts/phase12-production-readiness-test.mjs'
      - 'scripts/zero-spend-invariant-test.mjs'
      - 'scripts/run-autonomous-ai-manager.mjs'
      - 'scripts/run-investigation-machine.js'
      - 'src/worker-ai-management.js'
      - 'src/worker-local-job-api.js'
      - 'src/worker-production-autonomy.js'
      - 'src/worker-production.js'
      - 'migrations/phase9_ai_resource_orchestration.sql'
      - 'migrations/phase10_ai_autonomy.sql'
      - 'migrations/phase11_local_job_queue.sql'
      - 'migrations/phase12_opportunity_hunter.sql'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - '.github/workflows/ai-autonomy-safety.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-autonomy-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  autonomy-safety:
    name: Verify zero-spend autonomy boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check autonomy JavaScript syntax
        run: |
          node --check ai-management/local-runtime/hardware-detector.mjs
          node --check ai-management/local-runtime/model-router.mjs
          node --check ai-management/local-runtime/job-queue.mjs
          node --check ai-management/node/local-ai-broker.mjs
          node --check ai-management/policy-engine/zero-spend-invariant.mjs
          node --check ai-management/policy-engine/zero-spend-policy.mjs
          node --check ai-management/provider-adapters/local/openai-compatible-local.mjs
          node --check ai-management/resource-scout/resource-scout.mjs
          node --check ai-management/opportunity-hunter/opportunity-hunter.mjs
          node --check ai-management/compute-resource-scout/compute-resource-scout.mjs
          node --check ai-management/compute-resource-scout/compute-resource-store.mjs
          node --check ai-management/site-director/site-improvement-director.mjs
          node --check local-agent/matrix-local-agent.mjs
          node --check local-agent/control-plane-client.mjs
          node --check scripts/run-autonomous-ai-manager.mjs
          node --check scripts/ai-management-autonomy-test.mjs
          node --check scripts/opportunity-hunter-test.mjs
          node --check scripts/phase12-production-readiness-test.mjs
          node --check scripts/zero-spend-invariant-test.mjs
          node --check src/worker-ai-management.js
          node --check src/worker-local-job-api.js
          node --check src/worker-production-autonomy.js

      - name: Run zero-spend broker foundation tests
        run: |
          node scripts/ai-management-foundation-test.mjs
          node scripts/zero-spend-invariant-test.mjs

      - name: Run autonomy safety and routing tests
        run: |
          node scripts/ai-management-autonomy-test.mjs
          node scripts/opportunity-hunter-test.mjs
          node scripts/phase12-production-readiness-test.mjs

      - name: Run owner-local execution tests
        run: |
          node local-agent/matrix-local-agent.test.mjs
          node local-agent/control-plane-client.test.mjs
          node ai-management/local-runtime/job-queue.test.mjs

      - name: Execute repeat-safe D1 migrations twice in SQLite
        shell: python
        run: |
          import sqlite3
          from pathlib import Path

          database = sqlite3.connect(':memory:')
          migrations = [
              'migrations/phase9_ai_resource_orchestration.sql',
              'migrations/phase10_ai_autonomy.sql',
              'migrations/phase11_local_job_queue.sql',
              'migrations/phase12_opportunity_hunter.sql',
          ]
          for pass_number in (1, 2):
              for migration in migrations:
                  database.executescript(Path(migration).read_text(encoding='utf-8'))
              database.commit()
              print(f'Completed migration pass {pass_number}')

          required = {
              'ai_resources',
              'ai_jobs',
              'ai_resource_candidates',
              'ai_local_runtime_nodes',
              'ai_local_models',
              'ai_model_routing_decisions',
              'ai_site_improvement_runs',
              'ai_site_improvement_actions',
              'ai_local_jobs',
              'ai_local_job_receipts',
              'ai_opportunities',
              'ai_opportunity_hunter_runs',
              'ai_compute_provider_candidates',
              'ai_compute_onboarding_tasks',
              'ai_compute_resources',
              'ai_compute_leases',
          }
          present = {row[0] for row in database.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = required - present
          if missing:
              raise SystemExit(f'Missing migration tables: {sorted(missing)}')

          resource_columns = {row[1] for row in database.execute('PRAGMA table_info(ai_resources)')}
          if 'metadata_json' not in resource_columns:
              raise SystemExit('ai_resources.metadata_json is missing from the repeat-safe phase 9 schema')

          routing_schema = database.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='ai_model_routing_decisions'").fetchone()[0]
          if 'prompt_received = 0' not in routing_schema:
              raise SystemExit('Routing ledger does not structurally prohibit prompt receipt')

          jobs_schema = database.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='ai_local_jobs'").fetchone()[0]
          receipts_schema = database.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='ai_local_job_receipts'").fetchone()[0]
          opportunities_schema = database.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='ai_opportunities'").fetchone()[0]
          hunter_runs_schema = database.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='ai_opportunity_hunter_runs'").fetchone()[0]
          if "job_type IN ('deterministic.hash','llm.generate')" not in jobs_schema:
              raise SystemExit('Local job schema does not enforce the execution allowlist')
          if 'cost_confirmed_zero = 1' not in receipts_schema:
              raise SystemExit('Local job receipts do not structurally enforce zero cost')
          if 'external_network_used = 0' not in receipts_schema:
              raise SystemExit('Local job receipts do not structurally enforce the network boundary')
          if "approval_state IN ('approved-auto','awaiting-owner','quarantined','disabled')" not in opportunities_schema:
              raise SystemExit('Opportunity schema does not enforce approval states')
          if 'zero_spend_lock = 1' not in hunter_runs_schema:
              raise SystemExit('Opportunity Hunter runs do not structurally enforce zero spend')

          compute_lease_schema = database.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='ai_compute_leases'").fetchone()[0]
          if "data_class='public'" not in compute_lease_schema:
              raise SystemExit('Compute leases do not structurally restrict remote capacity to public workloads')

          flags = {row[0]: row[1] for row in database.execute('SELECT flag_name, enabled FROM ai_feature_flags')}
          for flag in [
              'AI_LOCAL_MODEL_ROUTING_ENABLED',
              'AI_SITE_DIRECTOR_ENABLED',
              'AI_RESOURCE_AUTO_APPROVAL_ENABLED',
              'AI_OPPORTUNITY_HUNTER_ENABLED',
              'AI_COMPUTE_RESOURCE_SCOUT_ENABLED',
              'AI_REMOTE_COMPUTE_ROUTING_ENABLED',
          ]:
              if flags.get(flag) != 0:
                  raise SystemExit(f'{flag} must start disabled before reviewed activation')

          duplicate_flags = database.execute('SELECT flag_name,COUNT(*) FROM ai_feature_flags GROUP BY flag_name HAVING COUNT(*)>1').fetchall()
          if duplicate_flags:
              raise SystemExit(f'Duplicate feature flags after rerun: {duplicate_flags}')

          duplicate_resources = database.execute('SELECT resource_id,COUNT(*) FROM ai_resources GROUP BY resource_id HAVING COUNT(*)>1').fetchall()
          if duplicate_resources:
              raise SystemExit(f'Duplicate resources after rerun: {duplicate_resources}')

          print('D1 phases 9 through 12 passed two complete executions with prompt-local, allowlist, public-only remote compute, and zero-spend constraints.')

      - name: Verify fail-closed production configuration
        run: |
          grep -F 'main = "src/worker-production-autonomy.js"' wrangler.toml
          grep -F 'AI_RESOURCE_ZERO_SPEND_LOCK = "true"' wrangler.toml
          grep -F 'AI_RESOURCE_AUTO_APPROVAL_ENABLED = "false"' wrangler.toml
          grep -F 'AI_LOCAL_MODEL_ROUTING_ENABLED = "false"' wrangler.toml
          grep -F 'AI_SITE_DIRECTOR_ENABLED = "false"' wrangler.toml
          grep -F 'AI_OPPORTUNITY_HUNTER_ENABLED = "false"' wrangler.toml
          grep -F 'ZERO_SPEND_INVARIANT_VIOLATION' ai-management/policy-engine/zero-spend-invariant.mjs
          ! grep -E 'prompt:[[:space:]]*body\.prompt|messages:[[:space:]]*body\.messages' src/worker-ai-management.js
          ! grep -E 'shell\.exec|child_process|exec\(' src/worker-local-job-api.js
          grep -F "payment-method-required" ai-management/opportunity-hunter/opportunity-hunter.mjs
          grep -F "owner-approval-required-for-capacity-program" ai-management/opportunity-hunter/opportunity-hunter.mjs
          grep -F 'public_workloads_only: true' ai-management/compute-resource-scout/compute-resource-scout.mjs
          grep -F 'prompt_transfer_allowed: false' ai-management/compute-resource-scout/compute-resource-scout.mjs

      - name: Verify controlled production workflow includes AI release gates
        run: |
          grep -F 'migrations/phase9_ai_resource_orchestration.sql' .github/workflows/deploy.yml
          grep -F 'migrations/phase10_ai_autonomy.sql' .github/workflows/deploy.yml
          grep -F 'migrations/phase11_local_job_queue.sql' .github/workflows/deploy.yml
          grep -F 'migrations/phase12_opportunity_hunter.sql' .github/workflows/deploy.yml
          grep -F "'ai_local_jobs','ai_local_job_receipts'" .github/workflows/deploy.yml
          grep -F "'ai_opportunities','ai_opportunity_hunter_runs'" .github/workflows/deploy.yml
          grep -F 'AI_RESOURCE_ZERO_SPEND_LOCK = "true"' .github/workflows/deploy.yml
          grep -F 'node scripts/verify-live-ai-management.mjs' .github/workflows/deploy.yml
