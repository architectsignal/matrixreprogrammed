name: Cloudflare Zero-Build Proof Refresh

on:
  pull_request:
    paths:
      - 'scripts/cloudflare-live-zero-build-proof.js'
      - 'scripts/cloudflare-live-zero-build-proof-test.js'
      - 'scripts/upgrade-cloudflare-budget-connection-clock.js'
      - 'scripts/upgrade-cloudflare-budget-connection-clock-test.js'
      - '.github/workflows/cloudflare-zero-build-proof-refresh.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/cloudflare-live-zero-build-proof.js'
      - 'scripts/cloudflare-live-zero-build-proof-test.js'
      - 'scripts/upgrade-cloudflare-budget-connection-clock.js'
      - 'scripts/upgrade-cloudflare-budget-connection-clock-test.js'
      - '.github/workflows/cloudflare-zero-build-proof-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  regression:
    name: Prove zero-build verifier fail-closed behavior
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check scripts/cloudflare-live-zero-build-proof.js
          node --check scripts/upgrade-cloudflare-budget-connection-clock.js
          node scripts/cloudflare-live-zero-build-proof-test.js
          node scripts/upgrade-cloudflare-budget-connection-clock-test.js

  refresh-live-proof:
    name: Refresh live Cloudflare Git-build disconnection proof
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Prove Cloudflare integrated Git builds are disconnected
        env:
          CLOUDFLARE_BUILDS_API_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MATRIX_UPDATE_BUDGET_POLICY: 'true'
        run: |
          test -n "$CLOUDFLARE_BUILDS_API_TOKEN"
          test -n "$CLOUDFLARE_PAGES_API_TOKEN"
          node scripts/cloudflare-live-zero-build-proof.js

      - name: Upgrade budget guard to use precise live proof time
        run: node scripts/upgrade-cloudflare-budget-connection-clock.js

      - name: Re-run zero-build budget guard against refreshed proof
        env:
          EXPECTED_CLOUDFLARE_BUILD_MINUTES: '0'
        run: node scripts/cloudflare-usage-budget-guard.js release

      - name: Commit only verified proof and deterministic guard clock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'matrix-cloudflare-proof-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/build-budget-policy.json scripts/cloudflare-usage-budget-guard.js
          if git diff --cached --quiet; then
            echo 'Verified proof already current; nothing to commit.'
            exit 0
          fi
          git commit -m 'Refresh verified Cloudflare zero-build proof'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload non-secret proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-zero-build-proof-${{ github.run_id }}
          path: downloads/cloudflare-live-zero-build-proof.json
          if-no-files-found: ignore
          retention-days: 30
