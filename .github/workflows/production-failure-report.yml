name: Production Deployment Reporter

on:
  workflow_run:
    workflows:
      - Matrix Reprogrammed Production Deploy
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  report-production-result:
    name: Publish sanitized production deployment status
    if: ${{ github.event.workflow_run.conclusion != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download and sanitize production proof
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | startswith("production-proof-")) | .id' | head -n 1)"
          if [ -n "$artifact_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > proof.zip
            unzip -o proof.zip -d proof >/dev/null
          fi
          if [ -s proof/production-build.log ]; then
            tail -n 180 proof/production-build.log \
              | sed -E 's/(TOKEN|SECRET|PASSWORD|AUTHORIZATION|CLIENT_SECRET)[=:][^[:space:]]+/\1=[REDACTED]/Ig' \
              > proof/production-build-tail.txt
          else
            printf 'No production build log was available for run %s.\n' "$RUN_ID" > proof/production-build-tail.txt
          fi
          : > proof/production-success-proof.txt
          if [ -s proof/production-deploy-receipt.json ]; then
            echo 'Production deployment receipt:' >> proof/production-success-proof.txt
            jq '{ok,generatedAt,commit,environment,deploymentTarget,d1,paypal,liveVerification}' proof/production-deploy-receipt.json >> proof/production-success-proof.txt 2>/dev/null || cat proof/production-deploy-receipt.json >> proof/production-success-proof.txt
          fi
          if [ -s proof/live-production-verification.json ]; then
            echo >> proof/production-success-proof.txt
            echo 'Live production verification:' >> proof/production-success-proof.txt
            jq '{ok,checkedAt,expectedSha,mainSha,manifestMatches,healthMatches,paypalBoundary,forumPersistence}' proof/live-production-verification.json >> proof/production-success-proof.txt 2>/dev/null || true
          fi
          if [ ! -s proof/production-success-proof.txt ]; then
            printf 'The run completed without a readable production receipt artifact.\n' > proof/production-success-proof.txt
          fi
          sed -E -i 's/(TOKEN|SECRET|PASSWORD|AUTHORIZATION|CLIENT_SECRET)[=:][^[:space:]]+/\1=[REDACTED]/Ig' proof/production-success-proof.txt

      - name: Update the production status issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          title="Production deployment status"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 100 --json number,title --jq '.[] | select(.title=="Production deployment status") | .number' | head -n 1)"
          if [ "$CONCLUSION" = "success" ]; then
            heading="## Production deployment succeeded"
            detail_heading="## Sanitized deployment proof"
            detail_file="proof/production-success-proof.txt"
          else
            heading="## Production deployment failed"
            detail_heading="## Sanitized build-log tail"
            detail_file="proof/production-build-tail.txt"
          fi
          {
            echo "$heading"
            echo
            echo "- Run: ${RUN_URL}"
            echo "- Commit: \`${HEAD_SHA}\`"
            echo "- Conclusion: **${CONCLUSION}**"
            echo "- Safety state: PayPal production charging remains disabled unless a separately verified live-activation change is merged."
            echo
            echo "$detail_heading"
            echo
            echo '```text'
            cat "$detail_file"
            echo '```'
          } > proof/issue.md
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file proof/issue.md
            gh issue reopen "$existing" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || true
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file proof/issue.md
          fi
