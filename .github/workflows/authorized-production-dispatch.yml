name: Authorized Production Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/production-deploy.trigger
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify authorization marker
        shell: bash
        run: |
          set -euo pipefail
          marker='DEPLOY MATRIX REPROGRAMMED'
          content="$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github.raw+json" "https://api.github.com/repos/${{ github.repository }}/contents/.github/production-deploy.trigger?ref=main")"
          if [ "$content" != "$marker" ]; then
            echo "Production dispatch refused: authorization marker did not match exactly."
            exit 1
          fi
      - name: Dispatch guarded production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main -f confirmation='DEPLOY MATRIX REPROGRAMMED'
