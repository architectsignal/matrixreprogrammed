name: AI AUTH REPAIR DEPLOY — deploy, bind and prove live control plane
run-name: AI AUTH REPAIR — resolve direct Worker endpoint and prove AI health

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-ai-auth-repair-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AI_AUTH_REPAIR_TRIGGER: '2026-08-01T18:17:00+01:00'

jobs:
  repair-deploy-verify:
    if: github.ref_name == 'main'
    name: Deploy latest Worker, bind secrets and prove autonomous AI
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Enforce Cloudflare zero-overage budget
        env:
          CLOUDFLARE_GIT_BUILDS_DISCONNECTED: ${{ vars.CLOUDFLARE_GIT_BUILDS_DISCONNECTED }}
          CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED }}
          CLOUDFLARE_BUILD_MINUTES_USED: ${{ vars.CLOUDFLARE_BUILD_MINUTES_USED }}
          CLOUDFLARE_USAGE_CHECKED_AT_UTC: ${{ vars.CLOUDFLARE_USAGE_CHECKED_AT_UTC }}
          EXPECTED_CLOUDFLARE_BUILD_MINUTES: '0'
        run: node scripts/cloudflare-usage-budget-guard.js release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate protected credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          NORMALIZED_TOKEN="$(printf '%s' "$AI_MANAGEMENT_ADMIN_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          test "$(printf '%s' "$NORMALIZED_TOKEN" | wc -c)" -ge 32
          npx --yes wrangler@latest whoami

      - name: Install locked dependencies
        run: npm ci

      - name: Build deployable site and Worker
        env:
          SOURCE_DOCUMENTS_PER_RUN: '0'
        run: npm run build

      - name: Verify AI contracts
        run: |
          node --check src/worker-production-autonomy.js
          node --check src/worker-ai-management.js
          node --check scripts/verify-live-ai-management.mjs
          node scripts/ai-management-foundation-test.mjs
          node scripts/ai-management-autonomy-test.mjs
          node scripts/cloudflare-worker-routes-test.js

      - name: Build activated zero-spend production configuration
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.toml .wrangler-ai-auth-repair.toml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.wrangler-ai-auth-repair.toml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'AI_RESOURCE_BROKER_ENABLED = "false"': 'AI_RESOURCE_BROKER_ENABLED = "true"',
              'AI_RESOURCE_EXTERNAL_ENABLED = "false"': 'AI_RESOURCE_EXTERNAL_ENABLED = "true"',
              'AI_RESOURCE_LOCAL_ONLY = "true"': 'AI_RESOURCE_LOCAL_ONLY = "false"',
              'AI_RESOURCE_BACKGROUND_ENABLED = "false"': 'AI_RESOURCE_BACKGROUND_ENABLED = "true"',
              'AI_RESOURCE_SCOUT_ENABLED = "false"': 'AI_RESOURCE_SCOUT_ENABLED = "true"',
              'AI_RESOURCE_AUTO_APPROVAL_ENABLED = "false"': 'AI_RESOURCE_AUTO_APPROVAL_ENABLED = "true"',
              'AI_LOCAL_MODEL_ROUTING_ENABLED = "false"': 'AI_LOCAL_MODEL_ROUTING_ENABLED = "true"',
              'AI_SITE_DIRECTOR_ENABLED = "false"': 'AI_SITE_DIRECTOR_ENABLED = "true"',
              'AI_OPPORTUNITY_HUNTER_ENABLED = "false"': 'AI_OPPORTUNITY_HUNTER_ENABLED = "true"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one activation target for {old}')
              text = text.replace(old, new)
          if text.count('AI_RESOURCE_ZERO_SPEND_LOCK = "true"') != 1:
              raise SystemExit('Zero-spend lock missing or ambiguous')
          if '\nworkers_dev = ' not in text:
              text = text.replace('keep_vars = true\n', 'keep_vars = true\nworkers_dev = true\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          npx --yes wrangler@latest deploy --config .wrangler-ai-auth-repair.toml --dry-run

      - name: Deploy repaired autonomous Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config .wrangler-ai-auth-repair.toml

      - name: Resolve canonical workers.dev endpoint from Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(2);process.stdout.write(j.result.subdomain)})")"
          test -n "$SUBDOMAIN"
          DIRECT_WORKER_URL="https://matrixreprogrammed.$SUBDOMAIN.workers.dev"
          echo "AI_DIRECT_WORKER_URL=$DIRECT_WORKER_URL" >> "$GITHUB_ENV"
          echo "Resolved direct Worker endpoint for verification."

      - name: Bind normalized canonical Worker admin secrets after deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NORMALIZED_TOKEN="$(printf '%s' "$AI_MANAGEMENT_ADMIN_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          test -n "$NORMALIZED_TOKEN"
          printf '%s' "$NORMALIZED_TOKEN" | npx --yes wrangler@latest secret put ADMIN_API_TOKEN --config .wrangler-ai-auth-repair.toml
          printf '%s' "$NORMALIZED_TOKEN" | npx --yes wrangler@latest secret put AI_MANAGEMENT_ADMIN_TOKEN --config .wrangler-ai-auth-repair.toml

      - name: Verify live autonomous AI control plane directly
        env:
          SITE_URL: ${{ env.AI_DIRECT_WORKER_URL }}
          ADMIN_API_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          AI_VERIFY_ATTEMPTS: '36'
          AI_VERIFY_DELAY_MS: '5000'
        run: node scripts/verify-live-ai-management.mjs

      - name: Upload authentication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-auth-repair-proof-${{ github.run_id }}
          path: downloads/live-ai-management-verification.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove temporary configuration
        if: always()
        run: rm -f .wrangler-ai-auth-repair.toml

  diagnose-existing-worker:
    if: github.ref_name != 'main'
    name: Diagnose existing autonomous AI without deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Resolve canonical workers.dev endpoint from Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(2);process.stdout.write(j.result.subdomain)})")"
          test -n "$SUBDOMAIN"
          echo "AI_DIRECT_WORKER_URL=https://matrixreprogrammed.$SUBDOMAIN.workers.dev" >> "$GITHUB_ENV"

      - name: Diagnose live autonomous AI directly
        env:
          SITE_URL: ${{ env.AI_DIRECT_WORKER_URL }}
          ADMIN_API_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          AI_VERIFY_ATTEMPTS: '3'
          AI_VERIFY_ROUTE_ATTEMPTS: '6'
          AI_VERIFY_DELAY_MS: '3000'
        run: node scripts/verify-live-ai-management.mjs

      - name: Upload sanitized diagnostic proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-live-diagnostic-${{ github.run_id }}
          path: downloads/live-ai-management-verification.json
          if-no-files-found: error
          retention-days: 7
