name: Synchronize AI Management Admin Token
run-name: "AI AUTH REPAIR — bind production secrets and prove live health"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SYNC AI ADMIN TOKEN'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: matrix-ai-admin-token-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  bind-and-verify:
    name: Bind production AI authentication and verify the direct control plane
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Confirm authorization and credentials
        env:
          CONFIRMATION: ${{ inputs.confirmation || 'SYNC AI ADMIN TOKEN' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'SYNC AI ADMIN TOKEN'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$AI_MANAGEMENT_ADMIN_TOKEN"

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Enforce Cloudflare zero-overage budget
        env:
          CLOUDFLARE_GIT_BUILDS_DISCONNECTED: ${{ vars.CLOUDFLARE_GIT_BUILDS_DISCONNECTED }}
          CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED }}
          CLOUDFLARE_BUILD_MINUTES_USED: ${{ vars.CLOUDFLARE_BUILD_MINUTES_USED }}
          CLOUDFLARE_USAGE_CHECKED_AT_UTC: ${{ vars.CLOUDFLARE_USAGE_CHECKED_AT_UTC }}
          EXPECTED_CLOUDFLARE_BUILD_MINUTES: '0'
        run: node scripts/cloudflare-usage-budget-guard.js release

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify token synchronization contracts
        run: |
          node --check scripts/verify-live-ai-management.mjs
          node scripts/live-ai-verification-classifier.test.mjs
          node scripts/ai-token-sync-workflow-test.js

      - name: Resolve canonical workers.dev endpoint from Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(2);process.stdout.write(j.result.subdomain)})")"
          test -n "$SUBDOMAIN"
          echo "AI_DIRECT_WORKER_URL=https://matrixreprogrammed.$SUBDOMAIN.workers.dev" >> "$GITHUB_ENV"

      - name: Bind canonical Worker admin secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NORMALIZED_TOKEN="$(printf '%s' "$AI_MANAGEMENT_ADMIN_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          test "$(printf '%s' "$NORMALIZED_TOKEN" | wc -c)" -ge 32
          printf '%s' "$NORMALIZED_TOKEN" | npx --yes wrangler@latest secret put ADMIN_API_TOKEN --name matrixreprogrammed
          printf '%s' "$NORMALIZED_TOKEN" | npx --yes wrangler@latest secret put AI_MANAGEMENT_ADMIN_TOKEN --name matrixreprogrammed

      - name: Verify live authenticated AI health
        env:
          SITE_URL: ${{ env.AI_DIRECT_WORKER_URL }}
          ADMIN_API_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          AI_VERIFY_ATTEMPTS: '30'
          AI_VERIFY_DELAY_MS: '5000'
        run: node scripts/verify-live-ai-management.mjs
