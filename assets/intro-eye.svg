<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Eye of Providence seal</title>
  <desc id="desc">An engraved Eye of Providence above an unfinished pyramid, isolated on a transparent background.</desc>
  <defs>
    <radialGradient id="bronze" cx="42%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff7d2"/>
      <stop offset=".18" stop-color="#e8d39b"/>
      <stop offset=".48" stop-color="#9c7a3a"/>
      <stop offset=".72" stop-color="#463015"/>
      <stop offset="1" stop-color="#160d06"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e5b6"/>
      <stop offset=".3" stop-color="#b79654"/>
      <stop offset=".7" stop-color="#6a4c21"/>
      <stop offset="1" stop-color="#241407"/>
    </linearGradient>
    <radialGradient id="iris" cx="45%" cy="42%" r="55%">
      <stop offset="0" stop-color="#fff9d4"/>
      <stop offset=".18" stop-color="#d3a94e"/>
      <stop offset=".52" stop-color="#5e3d14"/>
      <stop offset=".8" stop-color="#160c04"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <filter id="metal" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain"><feFuncA type="table" tableValues="0 .16"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#000" flood-opacity=".86"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="topArc" d="M205 575 A395 395 0 0 1 995 575"/>
    <path id="bottomArc" d="M980 735 A405 405 0 0 1 220 735"/>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <path d="M0 0V9" stroke="#130b04" stroke-width="1.1" opacity=".55"/>
    </pattern>
  </defs>

  <g filter="url(#metal)">
    <circle cx="600" cy="600" r="500" fill="url(#bronze)" stroke="#e7ce8b" stroke-width="14"/>
    <circle cx="600" cy="600" r="470" fill="#161008" stroke="#85672f" stroke-width="5"/>
    <circle cx="600" cy="600" r="452" fill="url(#bronze)" stroke="#171006" stroke-width="8"/>
    <circle cx="600" cy="600" r="422" fill="#20150a" stroke="#d3b56b" stroke-width="4"/>

    <g opacity=".92" stroke="#d6b765" stroke-linecap="round">
      <path d="M600 185V370" stroke-width="9"/>
      <path d="M535 194l27 181M665 194l-27 181M475 212l52 171M725 212l-52 171" stroke-width="6"/>
      <path d="M420 238l78 156M780 238l-78 156M370 270l103 142M830 270L727 412" stroke-width="5"/>
      <path d="M326 309l122 124M874 309L752 433M290 354l139 101M910 354L771 455" stroke-width="4"/>
      <path d="M260 405l153 74M940 405L787 479M240 460l163 45M960 460L797 505" stroke-width="3"/>
    </g>

    <g filter="url(#glow)">
      <path d="M600 205L770 482H430Z" fill="#1a1007" stroke="#f0d98e" stroke-width="9"/>
      <path d="M600 235L735 455H465Z" fill="url(#stone)" stroke="#4b3215" stroke-width="7"/>
      <path d="M482 353Q600 270 718 353Q600 438 482 353Z" fill="#f4df9b" stroke="#1d1107" stroke-width="8"/>
      <path d="M505 353Q600 298 695 353Q600 410 505 353Z" fill="url(#iris)" stroke="#090502" stroke-width="7"/>
      <ellipse cx="600" cy="353" rx="32" ry="50" fill="#050301"/>
      <circle cx="587" cy="333" r="11" fill="#fff8cf"/>
      <path d="M485 347Q600 279 715 347M488 361Q600 432 712 361" fill="none" stroke="#130b04" stroke-width="7"/>
      <g stroke="#3e2810" stroke-width="2.5" opacity=".75">
        <path d="M500 334l-34-18M510 318l-26-29M529 305l-15-34M551 294l-5-37M700 334l34-18M690 318l26-29M671 305l15-34M649 294l5-37"/>
      </g>
    </g>

    <path d="M390 855L500 520H700L810 855Z" fill="url(#stone)" stroke="#150c05" stroke-width="12"/>
    <path d="M390 855L500 520H700L810 855Z" fill="url(#hatch)" opacity=".38"/>
    <g fill="none" stroke="#211205" stroke-width="7">
      <path d="M474 600H726M452 668H748M430 736H770M408 804H792"/>
      <path d="M515 520l-18 80M565 520l-6 80M635 520l6 80M685 520l18 80"/>
      <path d="M497 600l-22 68M559 600l-8 68M641 600l8 68M703 600l22 68"/>
      <path d="M475 668l-24 68M551 668l-8 68M649 668l8 68M725 668l24 68"/>
      <path d="M451 736l-23 68M543 736l-9 68M657 736l9 68M749 736l23 68"/>
    </g>
    <path d="M600 520L390 855H465L635 520Z" fill="#080503" opacity=".72"/>
    <text x="600" y="838" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="42" letter-spacing="9" fill="#e2c77d" stroke="#1b1005" stroke-width="2">MDCCLXXVI</text>

    <g fill="#d9bd74" stroke="#1a0f05" stroke-width="4">
      <path d="M242 770q-78-63-94-150q69 22 105 89q-5-53 21-92q42 70 8 146Z"/>
      <path d="M958 770q78-63 94-150q-69 22-105 89q5-53-21-92q-42 70-8 146Z"/>
    </g>

    <text font-family="Georgia,serif" font-size="67" font-weight="700" letter-spacing="12" fill="#ead18c" stroke="#1c1006" stroke-width="2.2">
      <textPath href="#topArc" startOffset="50%" text-anchor="middle">ANNUIT COEPTIS</textPath>
    </text>
    <text font-family="Georgia,serif" font-size="56" font-weight="700" letter-spacing="7" fill="#ead18c" stroke="#1c1006" stroke-width="2.2">
      <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">NOVUS ORDO SECLORUM</textPath>
    </text>

    <circle cx="600" cy="600" r="500" fill="none" stroke="#120a04" stroke-width="6" stroke-dasharray="2 7"/>
    <circle cx="600" cy="600" r="484" fill="none" stroke="#f1dc9b" stroke-opacity=".55" stroke-width="3"/>
  </g>
</svg>
