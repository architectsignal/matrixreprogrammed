name: Matrix Reprogrammed Production Deploy — Recovery Freeze

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-freeze:
    name: Production is frozen during controlled site recovery
    runs-on: ubuntu-latest
    steps:
      - name: Explain recovery freeze
        run: |
          echo "Automatic production deployment is deliberately frozen."
          echo "Use the recovery/site-mission-restoration branch for repairs."
          echo "A controlled production release must use the confirmed manual fallback only after browser and live acceptance tests pass."
