name: Forum Final Clean Dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forum-final-clean-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cancel-old-and-dispatch-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Cancel every older active controlled production run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --workflow deploy.yml --limit 100 --json databaseId,status,createdAt \
            --repo "$GITHUB_REPOSITORY" \
            --jq '.[] | select(.status != "completed") | .databaseId' > /tmp/active-deploy-runs.txt
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "Cancelling pre-final production run $run_id"
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done < /tmp/active-deploy-runs.txt
          sleep 8

      - name: Dispatch exactly one release from repaired main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Revision 4: late generators are repaired inside the build audit and final reconciliation.
          gh workflow run 'Matrix Reprogrammed Controlled Production Deploy' \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirmation='DEPLOY MATRIX REPROGRAMMED'
          sleep 8
          mkdir -p downloads
          gh run list --workflow deploy.yml --limit 5 \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle \
            > downloads/final-forum-controlled-deploy.json

      - name: Commit exact dispatch receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'forum-final-dispatch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add downloads/final-forum-controlled-deploy.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record final forum production dispatch'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
