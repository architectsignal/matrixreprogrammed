<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Access Required | Matrix Reprogrammed</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="fixes.css">
  <style>body{background:#070707;color:#f2e8ca}.shell{max-width:760px;margin:10vh auto;padding:24px}.panel{border:1px solid rgba(216,181,106,.3);border-radius:20px;padding:24px;background:#0d0b07}.value{color:#d8b56a;font-weight:850}.actions{display:flex;gap:10px;flex-wrap:wrap}</style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="eyebrow">Entitlement Check</div>
      <h1>THIS SECTION IS NOT INCLUDED IN YOUR CURRENT ACCESS.</h1>
      <p>The server denied the request before returning any protected content or hidden metadata.</p>
      <p>Current access: <span id="current-tier" class="value">Unknown</span></p>
      <p>Required access: <span id="required-tier" class="value">Higher membership</span></p>
      <div class="actions"><a class="btn" href="membership.html">View membership options</a><a class="btn alt" href="member-dashboard.html">Return to dashboard</a><a class="btn alt" href="index.html">Public site</a></div>
    </section>
  </main>
  <script>
    const params=new URLSearchParams(location.search);const title=value=>String(value||'').replaceAll('_',' ').replace(/\b\w/g,char=>char.toUpperCase());
    document.getElementById('current-tier').textContent=title(params.get('current')||'registered');
    document.getElementById('required-tier').textContent=title(params.get('required')||'higher membership');
  </script>
</body>
</html>
