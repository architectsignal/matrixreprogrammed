name: Diagnose Release Manifest

on:
  push:
    branches:
      - agent/complete-capital-lists-clean-20260721
    paths:
      - .github/workflows/diagnose-release-manifest.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/complete-capital-lists-clean-20260721
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture and publish manifest command result
        shell: bash
        run: |
          set +e
          mkdir -p _site downloads
          : > downloads/release-manifest-diagnostic.log
          node scripts/patch-homepage-mask-intro.js >> downloads/release-manifest-diagnostic.log 2>&1
          echo "patch_homepage_status=$?" >> downloads/release-manifest-diagnostic.log
          node scripts/patch-release-metadata-routing.js >> downloads/release-manifest-diagnostic.log 2>&1
          echo "patch_routing_status=$?" >> downloads/release-manifest-diagnostic.log
          DEPLOY_COMMIT_SHA="$(git rev-parse HEAD)" node scripts/build-deploy-manifest.js >> downloads/release-manifest-diagnostic.log 2>&1
          echo "manifest_status=$?" >> downloads/release-manifest-diagnostic.log
          DEPLOY_COMMIT_SHA="$(git rev-parse HEAD)" node scripts/build-production-health.js >> downloads/release-manifest-diagnostic.log 2>&1
          echo "health_status=$?" >> downloads/release-manifest-diagnostic.log
          node scripts/publish-release-metadata-assets.js >> downloads/release-manifest-diagnostic.log 2>&1
          echo "publish_status=$?" >> downloads/release-manifest-diagnostic.log
          rm -f .github/workflows/diagnose-release-manifest.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add downloads/release-manifest-diagnostic.log .github/workflows/diagnose-release-manifest.yml
          git commit -m "Record release manifest diagnostic"
          git push origin HEAD:agent/complete-capital-lists-clean-20260721
