name: Daily Sitewide Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: daily-sitewide-refresh
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Refresh seven-day and live intel
        continue-on-error: true
        run: |
          npm run update-seven-day-intel || echo "update-seven-day-intel recorded a source-refresh failure"
          npm run update-live-intel || echo "update-live-intel recorded a source-refresh failure"

      - name: Build site brain and shared systems
        continue-on-error: true
        run: node scripts/daily-sitewide-build-safe.js

      - name: Repair and test deploy-critical systems
        continue-on-error: true
        run: |
          node scripts/newsletter-persistence-test.js
          node scripts/patch-membership-tiers.js
          node scripts/normalize-homepage-mission-copy.js
          node scripts/repair-search-system.js
          node scripts/repair-critical-route-drift.js
          node scripts/compact-cloudflare-search-index.js
          node scripts/site-function-harmony-test.js

      - name: Pressure test refreshed systems
        continue-on-error: true
        run: |
          npm run pressure-test:global-risk-clocks
          npm run pressure-test:live-intel
          npm run pressure-test

      - name: Enforce truthful daily refresh status
        env:
          AUTOMATION_HEALTH_MODE: daily
        run: node scripts/automation-health-gate.js

      - name: Commit healthy refreshed generated files and reports
        run: |
          git config user.name "matrix-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Daily sitewide intelligence refresh [deploy]"
            git push
          fi

      - name: Upload daily refresh reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sitewide-refresh-reports-${{ github.sha }}
          path: |
            downloads/daily-sitewide-build-report.json
            downloads/daily-sitewide-build-report.md
            downloads/critical-route-drift-report.json
            downloads/critical-route-drift-report.md
            downloads/newsletter-worker-patch-report.json
            downloads/newsletter-persistence-test.json
            downloads/newsletter-persistence-test.md
            downloads/search-system-repair-report.json
            downloads/search-runtime-hardening-report.json
            downloads/site-function-harmony-report.json
            downloads/site-function-harmony-report.md
            downloads/cloudflare-search-index-compaction.json
            downloads/membership-tiers-report.json
            downloads/homepage-mission-normalization.json
            downloads/automation-health-daily.json
            downloads/automation-health-daily.md
          if-no-files-found: ignore
          retention-days: 21
