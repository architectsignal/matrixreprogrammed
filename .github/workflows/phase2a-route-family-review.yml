name: Phase 2A Route Family Review Map

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'data/content-tier-taxonomy-policy.json'
      - 'data/content-tier-family-review-rules.json'
      - 'scripts/classify-content-tiers.js'
      - 'scripts/refine-content-tier-review-map.js'
      - '.github/workflows/phase2a-route-family-review.yml'

permissions:
  contents: read

concurrency:
  group: phase2a-route-family-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-map:
    name: Refine route families without enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate review rules and script
        run: |
          node --check scripts/refine-content-tier-review-map.js
          node - <<'NODE'
          const fs = require('fs');
          const policy = JSON.parse(fs.readFileSync('data/content-tier-family-review-rules.json', 'utf8'));
          if (policy.paymentStatus !== 'deferred') throw new Error('Payments must remain deferred');
          if (policy.enforcementMode !== 'report-only') throw new Error('Enforcement must remain report-only');
          if (!Array.isArray(policy.rules) || policy.rules.length < 20) throw new Error('Family review rules are incomplete');
          const ids = policy.rules.map(rule => rule.id);
          if (new Set(ids).size !== ids.length) throw new Error('Duplicate family rule ids');
          NODE

      - name: Record classifiable source hashes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = process.cwd();
          const ignored = new Set(['.git', 'node_modules', '_site', '.wrangler']);
          const extensions = new Set(['.html', '.pdf', '.csv', '.zip', '.docx']);
          const files = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignored.has(entry.name)) continue;
              const target = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(target);
              else {
                const rel = path.relative(root, target).split(path.sep).join('/');
                const ext = path.extname(rel).toLowerCase();
                if (extensions.has(ext) || (ext === '.json' && rel.startsWith('downloads/'))) files.push(rel);
              }
            }
          }
          walk(root);
          const hashes = Object.fromEntries(files.sort().map(file => [file, crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')]));
          fs.mkdirSync('downloads', { recursive: true });
          fs.writeFileSync('downloads/phase2a-source-hashes-before.json', JSON.stringify(hashes, null, 2));
          NODE

      - name: Build refined route-family review map
        run: node scripts/refine-content-tier-review-map.js

      - name: Validate review-only migration map
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('downloads/phase2a-route-family-review-map.json', 'utf8'));
          if (!report.ok || report.mode !== 'report-only') throw new Error('Route-family map is not healthy');
          if (report.paymentStatus !== 'deferred' || report.enforcementMode !== 'report-only') throw new Error('Payment or enforcement boundary changed');
          if (report.summary.totalRows < 1700) throw new Error('Route inventory unexpectedly incomplete');
          if (report.summary.baseUncategorized < 1000) throw new Error('Base uncategorized baseline unexpectedly changed');
          if (report.summary.refinedByFamilyRules < 500) throw new Error(`Too few high-confidence family resolutions: ${report.summary.refinedByFamilyRules}`);
          if (report.summary.unresolvedAfterFamilyReview >= report.summary.baseUncategorized) throw new Error('Family review did not reduce the editorial queue');
          if (report.summary.samePriorityConflicts !== 0 || report.conflicts.length !== 0) throw new Error('Family classification conflicts exist');
          for (const row of report.rows) {
            if (['supporter_3', 'intelligence_6', 'research_pro_9'].includes(row.recommendedTier)) {
              if (!row.publicPreviewRequired) throw new Error(`${row.file}: paid recommendation lacks public preview requirement`);
              if (!row.reviewFlags.includes('public-preview-required-before-tier-enforcement') && row.reviewStage === 'family_refinement') {
                throw new Error(`${row.file}: paid family recommendation lacks enforcement boundary`);
              }
            }
            if (row.recommendedTier === 'internal_only' && row.reviewStage === 'family_refinement' && !row.reviewFlags.includes('internal-candidate-review-before-route-change')) {
              throw new Error(`${row.file}: internal candidate lacks route-change review flag`);
            }
            if (row.category === 'uncategorized' && row.recommendedTier !== 'public') throw new Error(`${row.file}: unresolved route must remain public`);
            if (row.status !== 'recommendation_only' && row.status !== 'review_recommendation_only') throw new Error(`${row.file}: unexpected enforcement status`);
          }
          console.log(`PHASE 2A REVIEW PASS: ${report.summary.refinedByFamilyRules} route-family recommendations; ${report.summary.unresolvedAfterFamilyReview} remain for editorial ownership.`);
          NODE

      - name: Prove current files were not changed
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const before = JSON.parse(fs.readFileSync('downloads/phase2a-source-hashes-before.json', 'utf8'));
          const changed = [];
          for (const [file, expected] of Object.entries(before)) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (actual !== expected) changed.push({ file, expected, actual });
          }
          const report = {
            ok: changed.length === 0,
            checkedFiles: Object.keys(before).length,
            changed,
            boundary: 'The route-family review map must not alter, move, hide, delete, redirect or paywall any existing route or document.'
          };
          fs.writeFileSync('downloads/phase2a-route-family-non-mutation-report.json', JSON.stringify(report, null, 2));
          if (changed.length) throw new Error(JSON.stringify(changed, null, 2));
          console.log(`NON-MUTATION PASS: ${report.checkedFiles} existing files unchanged.`);
          NODE

      - name: Upload route-family review reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2a-route-family-review-${{ github.run_id }}
          path: |
            downloads/phase0-content-tier-classification.json
            downloads/phase0-content-tier-classification.md
            downloads/phase2a-route-family-review-map.json
            downloads/phase2a-route-family-review-map.md
            downloads/phase2a-route-family-non-mutation-report.json
            downloads/phase2a-source-hashes-before.json
          if-no-files-found: error
          retention-days: 30
