name: Hugging Face External Compute Secret Sync
run-name: HUGGING FACE SECRET SYNC — validate and install Worker secret

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SYNC HUGGING FACE TOKEN to authorize secret installation'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: matrixreprogrammed-huggingface-secret-sync
  cancel-in-progress: false

jobs:
  validate-and-sync:
    name: Validate token and install protected Worker secret
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Confirm explicit authorization
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            test "${{ inputs.confirmation }}" = "SYNC HUGGING FACE TOKEN"
          else
            test "${{ github.ref }}" = "refs/heads/main"
          fi

      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Enforce Cloudflare zero-overage budget
        env:
          CLOUDFLARE_GIT_BUILDS_DISCONNECTED: ${{ vars.CLOUDFLARE_GIT_BUILDS_DISCONNECTED }}
          CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED }}
          CLOUDFLARE_BUILD_MINUTES_USED: ${{ vars.CLOUDFLARE_BUILD_MINUTES_USED }}
          CLOUDFLARE_USAGE_CHECKED_AT_UTC: ${{ vars.CLOUDFLARE_USAGE_CHECKED_AT_UTC }}
          EXPECTED_CLOUDFLARE_BUILD_MINUTES: '0'
        run: node scripts/cloudflare-usage-budget-guard.js release

      - name: Validate required credentials without printing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$HUGGINGFACE_API_TOKEN"
          case "$HUGGINGFACE_API_TOKEN" in hf_*) ;; *) echo 'Hugging Face token format is invalid'; exit 1 ;; esac
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $HUGGINGFACE_API_TOKEN" \
            https://huggingface.co/api/whoami-v2 \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x.name)throw new Error('Token validation failed');console.log('Hugging Face token identity validated without exposing credentials.');})"

      - name: Install protected Cloudflare Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HUGGINGFACE_API_TOKEN" | npx --yes wrangler@latest secret put HUGGINGFACE_API_TOKEN --name matrixreprogrammed

      - name: Verify secret name is installed without reading its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest secret list --name matrixreprogrammed --json > secret-list.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('secret-list.json','utf8'));if(!x.some(v=>v.name==='HUGGINGFACE_API_TOKEN'))throw new Error('Worker secret was not installed');console.log('Cloudflare Worker secret name verified.');"
          rm -f secret-list.json
