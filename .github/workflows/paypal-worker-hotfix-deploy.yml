name: PayPal and homepage navigation hotfix
# Final run includes the canonical homepage navigation owner and normalized OAuth credentials.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/paypal-worker-hotfix-deploy.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build repaired Cloudflare output
        run: |
          node scripts/repair-paypal-subscription-create-runtime.js
          npm run cloudflare-output
          node scripts/restore-homepage-navigation.js
          node scripts/cloudflare-worker-routes-test.js
      - name: Deploy repaired Worker and homepage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
