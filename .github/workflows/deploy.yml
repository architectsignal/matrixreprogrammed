name: Matrix Reprogrammed Production Deploy — HARD FREEZE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-freeze:
    name: Cloudflare production deployment is locked
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production freeze
        run: |
          echo "PRODUCTION DEPLOYMENT LOCKED."
          echo "Authorized recovery run 30091864423 has checked out the corrected single-deploy workflow and is the only release allowed to reach Cloudflare."
          echo "Every later production run fails closed. GitHub intelligence and evidence updates may continue without another Cloudflare deployment."