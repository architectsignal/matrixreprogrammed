name: Authorized Production Dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/production-deploy.trigger
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: authorized-production-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact authorized dispatcher event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require controlled production release freeze
        run: node scripts/release-freeze-guard.js --require-frozen

      - name: Dispatch or resolve exactly one run for this SHA
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execFileSync } = require('child_process');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const markerPath = '.github/production-deploy.trigger';
            const markerText = fs.readFileSync(markerPath, 'utf8').replace(/\r\n/g, '\n').trim();
            const lines = markerText.split('\n');
            if (lines[0]?.trim() !== 'DEPLOY MATRIX REPROGRAMMED') {
              core.setFailed('Production dispatch refused: authorization marker did not match.');
              return;
            }
            const fields = {};
            for (const line of lines.slice(1)) {
              const index = line.indexOf(':');
              if (index < 1) continue;
              fields[line.slice(0, index).trim()] = line.slice(index + 1).trim();
            }
            const requestedAt = Date.parse(fields.Requested || '');
            if (!Number.isFinite(requestedAt)) {
              core.setFailed('Production dispatch refused: Requested timestamp is invalid.');
              return;
            }
            const ageMinutes = (Date.now() - requestedAt) / 60000;
            if (ageMinutes < -2 || ageMinutes > 120) {
              core.setFailed(`Production dispatch refused: marker age ${ageMinutes.toFixed(1)} minutes is outside 0-120 minutes.`);
              return;
            }
            if (!/^pr\d+-[a-z0-9][a-z0-9-]{20,}$/i.test(fields.Nonce || '')) {
              core.setFailed('Production dispatch refused: nonce is missing or too weak.');
              return;
            }

            // Dated billable-build exceptions are deliberately non-reusable. This
            // dispatcher only launches the ordinary zero-spend production lane.
            const billingException = String(fields['Billing exception'] || '').trim();
            if (billingException) {
              core.setFailed('Production dispatch refused: a dated billable-build exception cannot be reused; use the zero-spend release lane.');
              return;
            }

            const expectedHead = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim().toLowerCase();
            const targetSha = String(fields.Target || '').match(/\b[0-9a-f]{40}\b/i)?.[0]?.toLowerCase() || '';
            if (!targetSha) {
              core.setFailed('Production dispatch refused: target SHA is missing.');
              return;
            }
            try {
              execFileSync('git', ['merge-base', '--is-ancestor', targetSha, expectedHead]);
            } catch {
              core.setFailed(`Production dispatch refused: target ${targetSha} is not an ancestor of current main ${expectedHead}.`);
              return;
            }

            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const target = workflows.data.workflows.find(
              workflow => workflow.name === 'Matrix Reprogrammed Controlled Production Deploy'
            );
            if (!target) {
              core.setFailed('Controlled production workflow was not found.');
              return;
            }

            async function matchingRun() {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: target.id,
                branch: 'main',
                event: 'workflow_dispatch',
                per_page: 50
              });
              return response.data.workflow_runs
                .filter(run => run.head_sha?.toLowerCase() === expectedHead)
                .filter(run => new Date(run.created_at).getTime() >= requestedAt - 120000)
                .filter(run => run.conclusion !== 'failure' && run.conclusion !== 'cancelled')
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0] || null;
            }

            let run = await matchingRun();
            let action = 'reused-exact-sha-run';
            if (!run) {
              action = 'dispatched-exact-sha-run';
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: target.id,
                ref: 'main',
                inputs: {
                  confirmation: 'DEPLOY MATRIX REPROGRAMMED'
                }
              });
              for (let attempt = 1; attempt <= 24 && !run; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 5000));
                run = await matchingRun();
              }
            }
            if (!run) {
              core.setFailed(`Authorized production run for ${expectedHead} could not be resolved.`);
              return;
            }
            if (run.head_sha?.toLowerCase() !== expectedHead) {
              core.setFailed(`Resolved run ${run.id} targets ${run.head_sha}, not ${expectedHead}.`);
              return;
            }

            const payload = {
              ok: true,
              action,
              recordedAt: new Date().toISOString(),
              requestedAt: new Date(requestedAt).toISOString(),
              markerNonce: fields.Nonce,
              authorizedTarget: targetSha,
              expectedHead,
              workflowId: target.id,
              forwardedBillingException: false,
              pinnedTargetSha: expectedHead,
              run: {
                id: run.id,
                status: run.status,
                conclusion: run.conclusion,
                createdAt: run.created_at,
                updatedAt: run.updated_at,
                headSha: run.head_sha,
                headBranch: run.head_branch,
                event: run.event,
                url: run.html_url
              },
              boundary: 'This dispatcher launches only the zero-spend controlled production lane, resolves exactly the workflow_dispatch run created for the authorized main SHA and never reuses a failed, cancelled or wrong-SHA run. Credentials, budget controls, D1 rollback, migrations and exact live verification remain mandatory.'
            };
            fs.mkdirSync('downloads', { recursive: true });
            fs.writeFileSync('downloads/authorized-production-run.json', JSON.stringify(payload, null, 2) + '\n');
            core.summary
              .addHeading('Authorized Production Dispatch')
              .addRaw(`Action: ${action}\n`)
              .addRaw(`Expected SHA: ${expectedHead}\n`)
              .addRaw(`Run: ${run.id} (${run.status}${run.conclusion ? `/${run.conclusion}` : ''})\n`)
              .write();
            core.info(`${action}: exact-SHA run ${run.id} for ${expectedHead}.`);

      - name: Upload dispatch identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authorized-production-dispatch-${{ github.run_id }}
          path: downloads/authorized-production-run.json
          if-no-files-found: error
          retention-days: 30
