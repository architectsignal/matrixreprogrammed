name: Investigation Source Policy Recovery

on:
  pull_request:
    paths:
      - 'ai-management/node/investigation-broker.mjs'
      - 'ai-management/config/investigation-source-policies.json'
      - 'ai-management/policy-engine/zero-spend-policy.mjs'
      - 'ai-management/policy-engine/zero-spend-invariant.mjs'
      - 'ai-management/provider-adapters/datasets/approved-public-source-http.mjs'
      - 'data/investigation-source-registry.json'
      - 'scripts/investigation-source-policy-test.mjs'
      - '.github/workflows/investigation-source-policy.yml'
  push:
    paths:
      - 'ai-management/node/investigation-broker.mjs'
      - 'ai-management/config/investigation-source-policies.json'
      - 'ai-management/policy-engine/zero-spend-policy.mjs'
      - 'ai-management/policy-engine/zero-spend-invariant.mjs'
      - 'ai-management/provider-adapters/datasets/approved-public-source-http.mjs'
      - 'data/investigation-source-registry.json'
      - 'scripts/investigation-source-policy-test.mjs'
      - '.github/workflows/investigation-source-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  source-policy-recovery:
    name: Prove exact-source zero-spend recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check broker and regression syntax
        run: |
          node --check ai-management/node/investigation-broker.mjs
          node --check scripts/investigation-source-policy-test.mjs

      - name: Run aged-policy recovery regression
        run: node scripts/investigation-source-policy-test.mjs
