name: MLC Blackout Voice One Shot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate four ElevenLabs lines
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          mkdir -p artifacts/mlc-blackout-voice
          node <<'NODE'
          const fs = require('fs');
          const key = process.env.ELEVENLABS_API_KEY;
          const voice = process.env.ELEVENLABS_VOICE_ID;
          if (!key || !voice) throw new Error('ElevenLabs secrets missing');
          const lines = [
            ["01_dont_call_me.mp3","DON'T CALL ME!"],
            ["02_dont_text_me.mp3","DON'T TEXT ME!"],
            ["03_dont_email_me.mp3","DON'T EMAIL ME!"],
            ["04_i_am_dead.mp3","I AM DEAD!"]
          ];
          (async()=>{
            for (const [name,text] of lines) {
              const url = `https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(voice)}?output_format=mp3_44100_128`;
              const res = await fetch(url,{
                method:'POST',
                headers:{'xi-api-key':key,'Content-Type':'application/json','Accept':'audio/mpeg'},
                body:JSON.stringify({
                  text,
                  model_id:'eleven_multilingual_v2',
                  voice_settings:{stability:0.18,similarity_boost:0.84,style:0.98,use_speaker_boost:true}
                })
              });
              if(!res.ok) throw new Error(`ElevenLabs failed ${res.status}: ${(await res.text()).slice(0,300)}`);
              fs.writeFileSync('artifacts/mlc-blackout-voice/'+name,Buffer.from(await res.arrayBuffer()));
              console.log('generated',name);
            }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Upload voice artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlc-blackout-voice
          path: artifacts/mlc-blackout-voice
          retention-days: 1
