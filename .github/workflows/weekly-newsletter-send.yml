name: Weekly Newsletter Manual Fallback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-newsletter-manual-fallback
  cancel-in-progress: false

jobs:
  send-newsletter:
    name: Run current weekly campaign through the live email lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Send weekly campaign through current live Worker
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$ADMIN_API_TOKEN" ]; then
            echo "::error::ADMIN_API_TOKEN GitHub secret is missing. The production Cloudflare cron remains the authoritative scheduled sender."
            exit 1
          fi
          curl --fail-with-body -X POST "https://matrixreprogrammed.com/api/email/admin/run-automation" \
            -H "x-admin-token: $ADMIN_API_TOKEN" \
            -H "accept: application/json" \
            -H "content-type: application/json" \
            --data '{"kind":"weekly","source":"github-manual-fallback"}'
