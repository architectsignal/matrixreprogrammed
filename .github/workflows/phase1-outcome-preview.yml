name: Phase 1 Outcome Briefings Canonical Preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/build-outcome-canonical-previews.js'
      - 'data/outcome-briefings.json'
      - 'data/intelligence-record.schema.json'
      - 'data/access-tier-policy.json'
      - '.github/workflows/phase1-outcome-preview.yml'

permissions:
  contents: read

concurrency:
  group: phase1-outcome-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Validate non-destructive Outcome Briefings previews
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate adapter syntax
        run: node --check scripts/build-outcome-canonical-previews.js

      - name: Record protected source hashes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const files = [
            'data/outcome-briefings.json',
            'data/access-tier-policy.json',
            'data/intelligence-record.schema.json',
            'membership.html'
          ];
          const hashes = Object.fromEntries(files.map(file => [
            file,
            crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')
          ]));
          fs.mkdirSync('downloads/canonical-outcome-preview', { recursive: true });
          fs.writeFileSync('downloads/canonical-outcome-preview/source-hashes-before.json', JSON.stringify(hashes, null, 2));
          NODE

      - name: Build Outcome Briefings canonical previews
        run: node scripts/build-outcome-canonical-previews.js

      - name: Validate scenario boundaries and structure
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const schema = JSON.parse(fs.readFileSync('data/intelligence-record.schema.json', 'utf8'));
          const output = JSON.parse(fs.readFileSync('downloads/canonical-outcome-preview/outcome-briefings.canonical-preview.json', 'utf8'));
          if (output.mode !== 'preview-only') throw new Error('Preview mode changed');
          if (output.paymentStatus !== 'deferred') throw new Error('Payment boundary changed');
          if (output.enforcementMode !== 'report-only') throw new Error('Tier enforcement changed');
          if (!output.records.length || output.recordCount !== output.records.length) throw new Error('Outcome preview count invalid');
          const required = schema.required || [];
          const allowedVectors = new Set(schema.$defs.convergenceVector.properties.vector.enum);
          let inspected = 0;
          for (const record of output.records) {
            inspected += 1;
            for (const field of required) {
              if (record[field] === undefined || record[field] === null) throw new Error(`${record.id}: missing ${field}`);
            }
            if (record.recordType !== 'scenario') throw new Error(`${record.id}: not a scenario`);
            if (record.evidence.claimClass !== 'scenario_analysis') throw new Error(`${record.id}: invalid claim class`);
            if (record.status !== 'review') throw new Error(`${record.id}: scenario was published prematurely`);
            if (record.speculativeConclusion.label !== 'speculative') throw new Error(`${record.id}: speculation label missing`);
            if (!record.speculativeConclusion.conditions.length || !record.speculativeConclusion.falsifiers.length) throw new Error(`${record.id}: scenario conditions incomplete`);
            if (!record.counterAnalysis.alternativeExplanations.length) throw new Error(`${record.id}: counter-analysis missing`);
            if (!record.missingEvidence.length || !record.watchNext.length) throw new Error(`${record.id}: evidence or watch queue missing`);
            if (!/does not prove coordinated elite control/i.test(record.missionAssessment.boundary)) throw new Error(`${record.id}: mission boundary unsafe`);
            for (const vector of record.missionAssessment.convergenceVectors) {
              if (!allowedVectors.has(vector.vector)) throw new Error(`${record.id}: invalid convergence vector`);
              if (vector.score > 2) throw new Error(`${record.id}: preview convergence score too high`);
              if (vector.coordinationStatus !== 'not_shown') throw new Error(`${record.id}: coordination overclaimed`);
            }
          }
          console.log(`OUTCOME PREVIEW PASS: ${inspected} scenario records validated.`);
          NODE

      - name: Prove protected files were not changed
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const before = JSON.parse(fs.readFileSync('downloads/canonical-outcome-preview/source-hashes-before.json', 'utf8'));
          const changed = [];
          for (const [file, expected] of Object.entries(before)) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (actual !== expected) changed.push({ file, expected, actual });
          }
          const report = {
            ok: changed.length === 0,
            generatedAt: new Date().toISOString(),
            checkedFiles: Object.keys(before).length,
            changed,
            boundary: 'Outcome preview generation must not modify the source briefing, schema, tier policy or membership page.'
          };
          fs.writeFileSync('downloads/canonical-outcome-preview/non-mutation-report.json', JSON.stringify(report, null, 2));
          if (changed.length) throw new Error(JSON.stringify(changed, null, 2));
          console.log(`NON-MUTATION PASS: ${report.checkedFiles} protected files unchanged.`);
          NODE

      - name: Upload Outcome preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-outcome-preview-${{ github.run_id }}
          path: downloads/canonical-outcome-preview/
          if-no-files-found: error
          retention-days: 30
