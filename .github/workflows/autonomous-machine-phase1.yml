name: Autonomous Machine Phase 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/autonomous-machine/**'
      - 'docs/autonomous-intelligence-machine/**'
      - 'data/autonomous-machine/**'
      - '.github/workflows/autonomous-machine-phase1.yml'

permissions:
  contents: read

jobs:
  phase1-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Phase 1 publication remains disabled
        env:
          AIM_PUBLICATION_MODE: disabled
        run: node scripts/autonomous-machine/phase1-self-test.js

      - name: Verify Phase 1.1 official RSS remains review only
        env:
          AIM_PUBLICATION_MODE: disabled
        run: node scripts/autonomous-machine/phase1.1-self-test.js

      - name: Verify Phase 1.2 creates route proposals only
        env:
          AIM_PUBLICATION_MODE: disabled
        run: node scripts/autonomous-machine/phase1.2-self-test.js

      - name: Verify Phase 1.3 creates signed handoffs only
        env:
          AIM_PUBLICATION_MODE: disabled
        run: node scripts/autonomous-machine/phase1.3-self-test.js

      - name: Verify Phase 1.4 creates staging previews only
        env:
          AIM_PUBLICATION_MODE: disabled
        run: node scripts/autonomous-machine/phase1.4-self-test.js

      - name: Verify Phase 1.5 applies previews to disposable copies only
        env:
          AIM_PUBLICATION_MODE: disabled
        run: node scripts/autonomous-machine/phase1.5-self-test.js

      - name: Verify Phase 1.6 creates advisory signed change requests only
        env:
          AIM_PUBLICATION_MODE: disabled
        run: node scripts/autonomous-machine/phase1.6-self-test.js

      - name: Verify Phase 1.7 creates signed human decisions only
        env:
          AIM_PUBLICATION_MODE: disabled
        run: node scripts/autonomous-machine/phase1.7-self-test.js

      - name: Verify Phase 1.8 creates read-only mapping plans only
        env:
          AIM_PUBLICATION_MODE: disabled
        run: node scripts/autonomous-machine/phase1.8-self-test.js
