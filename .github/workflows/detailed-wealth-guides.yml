name: Detailed Wealth Guide Library

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/detailed-wealth-guides.trigger

permissions:
  contents: write

concurrency:
  group: detailed-wealth-guide-library
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build detailed subject library
        id: build
        shell: bash
        run: |
          set +e
          mkdir -p downloads
          {
            echo '=== PRECISE SOURCE REPAIR ==='
            node scripts/repair-detailed-wealth-guide-builder.js
            REPAIR_STATUS=$?
            echo "repair_status=$REPAIR_STATUS"
            if [ "$REPAIR_STATUS" -ne 0 ]; then exit "$REPAIR_STATUS"; fi
            echo '=== SUBSTANTIVE GUIDE ENRICHMENT ==='
            node scripts/enrich-detailed-wealth-guide-builder.js
            ENRICH_STATUS=$?
            echo "enrich_status=$ENRICH_STATUS"
            if [ "$ENRICH_STATUS" -ne 0 ]; then exit "$ENRICH_STATUS"; fi
            echo '=== WRAPPING AND PAGINATION REPAIR ==='
            node scripts/repair-detailed-wealth-guide-layout.js
            LAYOUT_REPAIR_STATUS=$?
            echo "layout_repair_status=$LAYOUT_REPAIR_STATUS"
            if [ "$LAYOUT_REPAIR_STATUS" -ne 0 ]; then exit "$LAYOUT_REPAIR_STATUS"; fi
            echo '=== WIRE LAYOUT REGRESSION INTO COMPLETE PIPELINE ==='
            node scripts/wire-wealth-pdf-layout-test.js
            WIRING_STATUS=$?
            echo "wiring_status=$WIRING_STATUS"
            if [ "$WIRING_STATUS" -ne 0 ]; then exit "$WIRING_STATUS"; fi
            echo '=== NODE SYNTAX CHECK ==='
            node --check scripts/build-detailed-wealth-guides.js
            node --check scripts/wealth-pdf-layout-test.js
            SYNTAX_STATUS=$?
            echo "syntax_status=$SYNTAX_STATUS"
            if [ "$SYNTAX_STATUS" -ne 0 ]; then exit "$SYNTAX_STATUS"; fi
            echo '=== BUILD 16 DETAILED GUIDES ==='
            node scripts/build-detailed-wealth-guides.js
            BUILD_STATUS=$?
            echo "build_status=$BUILD_STATUS"
            if [ "$BUILD_STATUS" -ne 0 ]; then exit "$BUILD_STATUS"; fi
            echo '=== STRICT CONTENT QUALITY TEST ==='
            node scripts/detailed-wealth-guides-test.js
            CONTENT_STATUS=$?
            echo "content_status=$CONTENT_STATUS"
            if [ "$CONTENT_STATUS" -ne 0 ]; then exit "$CONTENT_STATUS"; fi
            echo '=== STRUCTURAL LAYOUT REGRESSION TEST ==='
            node scripts/wealth-pdf-layout-test.js
            LAYOUT_STATUS=$?
            echo "layout_status=$LAYOUT_STATUS"
            exit "$LAYOUT_STATUS"
          } 2>&1 | tee downloads/detailed-wealth-guides-build.log
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit "$STATUS"

      - name: Upload complete diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detailed-wealth-guide-proof-${{ github.run_id }}
          path: |
            downloads/detailed-wealth-guides-build.log
            downloads/detailed-wealth-guide-builder-repair.json
            downloads/detailed-wealth-guide-enrichment.json
            downloads/detailed-wealth-guide-layout-repair.json
            downloads/wealth-pdf-layout-wiring.json
            downloads/detailed-wealth-guides-test.json
            downloads/wealth-pdf-layout-test.json
            downloads/wealth-guides/index.json
            data/detailed-wealth-guides.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit exact tested library
        if: steps.build.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/build-detailed-wealth-guides.js \
            scripts/build-all-branded-download-pdfs.js \
            downloads/wealth-guides \
            downloads/detailed-wealth-guide-builder-repair.json \
            downloads/detailed-wealth-guide-enrichment.json \
            downloads/detailed-wealth-guide-layout-repair.json \
            downloads/wealth-pdf-layout-wiring.json \
            downloads/detailed-wealth-guides-test.json \
            downloads/wealth-pdf-layout-test.json \
            data/making-money-core.json \
            data/detailed-wealth-guides.json \
            making-money.js making-money.html \
            scripts/build-deep-pdf-intelligence.mjs
          if git diff --cached --quiet; then
            echo "Detailed wealth guide library already matches the tested source."
            exit 0
          fi
          git commit -m "Repair and republish wealth PDF visual layout [deploy]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Main advanced during guide publication; retrying."
          done
          exit 1
