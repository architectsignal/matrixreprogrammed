<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Heroes Fighting the Matrix Card | Matrix Reprogrammed</title>
<meta name="description" content="Source-led dossier card from the Heroes Fighting the Matrix deck."/>
<link rel="stylesheet" href="styles.css"/>
<link rel="stylesheet" href="reader-experience.css"/>
<style>
:root{--accent:#61d6b4;--pale:#d7fff4}.dossier-layout{display:grid;grid-template-columns:minmax(270px,390px) minmax(0,1fr);gap:1.25rem;align-items:start}.visual{position:sticky;top:1rem}.hero-card{position:relative;min-height:610px;border:2px solid var(--accent);border-radius:28px;padding:1.1rem;background:radial-gradient(circle at 50% 23%,color-mix(in srgb,var(--accent) 28%,#070a09),#020303 72%);overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.34)}.hero-card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 16px,color-mix(in srgb,var(--accent) 7%,transparent) 17px),linear-gradient(135deg,transparent 28%,color-mix(in srgb,var(--accent) 15%,transparent) 50%,transparent 72%)}.card-inner{position:relative;z-index:1}.card-top{display:flex;justify-content:space-between}.rank{font:700 2.2rem Georgia,serif;color:var(--pale)}.icon{font-size:2.5rem;color:var(--accent)}.orb{width:230px;height:230px;border:5px solid var(--accent);border-radius:50%;margin:2rem auto;display:grid;place-items:center;box-shadow:inset 0 0 55px color-mix(in srgb,var(--accent) 18%,transparent),0 0 45px color-mix(in srgb,var(--accent) 20%,transparent)}.initials{font:700 5.4rem Georgia,serif;color:#f8f6ee;letter-spacing:.07em}.hero-card h1{text-align:center;font-size:1.65rem;margin:.5rem 0}.lane{text-align:center;color:var(--pale);min-height:3.2rem}.score{text-align:center;font:700 1.2rem Georgia,serif}.bar{height:14px;border:1px solid var(--accent);border-radius:999px;background:#151b19;overflow:hidden}.bar span{display:block;height:100%;background:var(--accent)}.boundary{text-align:center;font-size:.76rem;color:#c7d0cd;border-top:1px solid color-mix(in srgb,var(--accent) 42%,transparent);padding-top:1rem;margin-top:1rem}.box{border:1px solid rgba(255,255,255,.13);border-radius:20px;padding:1rem;background:rgba(0,0,0,.36);margin-bottom:1rem}.source{border:1px solid rgba(255,255,255,.12);border-radius:15px;padding:.8rem;margin:.55rem 0;background:rgba(0,0,0,.3)}.source a{overflow-wrap:anywhere}.badge{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:.15rem .45rem;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em}.nav-ranks{display:flex;justify-content:space-between;gap:1rem;margin-top:1rem}.loading{padding:2rem;border:1px solid rgba(255,255,255,.14);border-radius:18px}
@media(max-width:780px){.dossier-layout{grid-template-columns:1fr}.visual{position:static}}
@media print{header,.reader-governor-strip,.details,.footer,.cta-row{display:none!important}.dossier-layout{display:block}.visual{position:static;max-width:430px;margin:auto}.hero-card{min-height:690px;box-shadow:none}}
</style>
</head>
<body><canvas id="matrix"></canvas><div class="page">
<header class="wrap topbar"><a class="brand" href="index.html"><img src="sigil.png" alt="Matrix Reprogrammed sigil"/> MATRIX REPROGRAMMED</a><nav class="nav"><a href="heroes-fighting-matrix-deck.html">Heroes Deck</a><a href="heroes-fighting-matrix-research-ledger.html">Source Ledger</a><a href="deck-expansion-hub.html">Deck Hub</a></nav></header>
<section class="reader-governor-strip"><div><strong>Matrix Reprogrammed</strong><span>Documented contribution, sources and editorial boundaries.</span></div><nav><a href="evidence-vault.html">Evidence</a><a href="research-tools.html">Research</a><a href="search.html">Search</a></nav></section>
<main class="wrap section"><div id="dossier" class="loading">Loading dossier...</div></main>
<footer class="footer wrap"><p><strong>Boundary:</strong> documented public contribution is not endorsement of every view, claim or act.</p></footer></div><script src="matrix.js"></script>
<script>
const suitFiles=['data/heroes-fighting-matrix/keys.json','data/heroes-fighting-matrix/shields.json','data/heroes-fighting-matrix/torches.json','data/heroes-fighting-matrix/swords.json'];
const suits={KEYS:{icon:'⌘',name:'Keys',color:'#61d6b4',pale:'#d7fff4'},SHIELDS:{icon:'⬡',name:'Shields',color:'#63aee8',pale:'#d6edff'},TORCHES:{icon:'✦',name:'Torches',color:'#e5a84f',pale:'#ffe4b3'},SWORDS:{icon:'⚔',name:'Swords',color:'#d85d62',pale:'#ffd5d7'}};
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
const initials=name=>name.split(/\s+/).map(part=>part[0]).join('').slice(0,3).toUpperCase();
const params=new URLSearchParams(location.search);const id=params.get('id')||'roger-dingledine';
Promise.all(suitFiles.map(url=>fetch(url).then(r=>{if(!r.ok)throw new Error(url);return r.json();}))).then(groups=>{const cards=groups.flat().sort((a,b)=>a.rank-b.rank);const card=cards.find(item=>item.id===id);if(!card)throw new Error('Card not found');const suit=suits[card.suit];document.documentElement.style.setProperty('--accent',suit.color);document.documentElement.style.setProperty('--pale',suit.pale);document.title=`${card.name} | Heroes Fighting the Matrix`;const previous=cards.find(item=>item.rank===card.rank-1);const next=cards.find(item=>item.rank===card.rank+1);document.getElementById('dossier').className='dossier-layout';document.getElementById('dossier').innerHTML=`<aside class="visual"><article class="hero-card"><div class="card-inner"><div class="card-top"><span class="rank">#${card.rank}</span><span class="icon">${suit.icon}</span></div><div class="orb"><span class="initials">${esc(initials(card.name))}</span></div><h1>${esc(card.name)}</h1><p class="lane">${esc(card.lane)}</p><div class="score">RESISTANCE SCORE ${card.score}/100</div><div class="bar"><span style="width:${card.score}%"></span></div><div class="boundary">DOCUMENTED CONTRIBUTION · NOT TOTAL ENDORSEMENT</div></div></article><div class="cta-row"><button class="btn" onclick="window.print()">Print / Save Card</button><a class="btn alt" href="heroes-fighting-matrix-deck.html">Full Deck</a></div></aside><section class="details"><div class="eyebrow">Heroes Fighting the Matrix · ${esc(suit.name)} · Rank ${card.rank}</div><h1>${esc(card.name)}</h1><p class="lead">${esc(card.lane)}</p><div class="box"><h2>Documented contribution</h2><p>${esc(card.contribution)}</p></div><div class="box"><h2>Why this person is included</h2><p>${esc(card.whyIncluded)}</p></div><div class="box"><h2>Confidence and boundary</h2><p><span class="badge">${esc(card.confidence)}</span></p><p>${esc(card.caveat)}</p><p><strong>EDITORIAL RESISTANCE DECK · DOCUMENTED PUBLIC CONTRIBUTION · NOT ENDORSEMENT OF EVERY VIEW OR ACT</strong></p></div><h2>Source route</h2>${card.sources.map((source,index)=>`<div class="source"><span class="badge">${esc(source.type||'source')}</span><h3>${index+1}. ${esc(source.label)}</h3><a href="${esc(source.url)}" rel="noopener noreferrer">Open source record</a></div>`).join('')}<div class="nav-ranks">${previous?`<a href="?id=${encodeURIComponent(previous.id)}">← #${previous.rank} ${esc(previous.name)}</a>`:'<span></span>'}${next?`<a href="?id=${encodeURIComponent(next.id)}">#${next.rank} ${esc(next.name)} →</a>`:'<span></span>'}</div></section>`;if(params.get('print')==='1')setTimeout(()=>window.print(),500);}).catch(error=>{document.getElementById('dossier').innerHTML='<h1>Dossier unavailable</h1><p>The requested card could not be loaded. Return to the full deck or research ledger.</p><a class="btn" href="heroes-fighting-matrix-deck.html">Open Full Deck</a>';console.error(error);});
</script>
</body></html>
