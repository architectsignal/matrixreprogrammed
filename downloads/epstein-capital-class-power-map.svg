<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Epstein Capital Class Power Map</title><desc id="desc">Stylized Matrix Reprogrammed source-first map of wealth, tech, philanthropy, politics and media nodes from EFTA01104262. Association is not guilt.</desc><defs><radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#171a22"/><stop offset="1" stop-color="#040507"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>.t{font:700 24px Arial,sans-serif;fill:#f5f2df}.s{font:600 16px Arial,sans-serif;fill:#c9c3a6}.n{fill:#0d1117;stroke:#f7d34c;stroke-width:3}.g{stroke:#86efac;stroke-width:2;opacity:.5}.r{stroke:#ff4d4d;stroke-width:3;opacity:.55}.b{stroke:#7dd3fc;stroke-width:2;opacity:.55}.small{font:600 13px Arial,sans-serif;fill:#f5f2df}.warn{font:700 18px Arial,sans-serif;fill:#ffdf6e}</style></defs><rect width="1600" height="1000" fill="url(#bg)"/><text x="80" y="75" class="t">EPSTEIN CONNECTIONS MAP — THE AMERICAN CAPITAL CLASS</text><text x="80" y="110" class="s">Source: EFTA01104262 / EFTA01104263 · Map node ≠ guilt · every line requires its own evidence class</text><circle cx="800" cy="500" r="78" fill="#1b0b0b" stroke="#ff4d4d" stroke-width="4" filter="url(#glow)"/><text x="800" y="493" text-anchor="middle" class="t">SOURCE</text><text x="800" y="522" text-anchor="middle" class="small">EFTA01104262</text><g opacity=".95"><line x1="800" y1="500" x2="315" y2="245" class="g"/><line x1="800" y1="500" x2="540" y2="170" class="g"/><line x1="800" y1="500" x2="1050" y2="170" class="g"/><line x1="800" y1="500" x2="1290" y2="250" class="g"/><line x1="800" y1="500" x2="310" y2="730" class="b"/><line x1="800" y1="500" x2="580" y2="825" class="r"/><line x1="800" y1="500" x2="1030" y2="820" class="g"/><line x1="800" y1="500" x2="1290" y2="720" class="b"/></g><g><circle cx="315" cy="245" r="85" class="n"/><text x="315" y="238" text-anchor="middle" class="small">HEDGE FUNDS</text><text x="315" y="260" text-anchor="middle" class="small">BANKS / PE</text></g><g><circle cx="540" cy="170" r="80" class="n"/><text x="540" y="164" text-anchor="middle" class="small">TECH</text><text x="540" y="186" text-anchor="middle" class="small">VENTURE</text></g><g><circle cx="1050" cy="170" r="83" class="n"/><text x="1050" y="164" text-anchor="middle" class="small">FOUNDATIONS</text><text x="1050" y="186" text-anchor="middle" class="small">PHILANTHROPY</text></g><g><circle cx="1290" cy="250" r="86" class="n"/><text x="1290" y="244" text-anchor="middle" class="small">POLITICS</text><text x="1290" y="266" text-anchor="middle" class="small">ACCESS</text></g><g><circle cx="310" cy="730" r="82" class="n"/><text x="310" y="724" text-anchor="middle" class="small">MEDIA</text><text x="310" y="746" text-anchor="middle" class="small">REPUTATION</text></g><g><circle cx="580" cy="825" r="86" class="n"/><text x="580" y="819" text-anchor="middle" class="small">CONNECTORS</text><text x="580" y="841" text-anchor="middle" class="small">SOCIAL GATES</text></g><g><circle cx="1030" cy="820" r="88" class="n"/><text x="1030" y="814" text-anchor="middle" class="small">BILLIONAIRE</text><text x="1030" y="836" text-anchor="middle" class="small">TRACKER</text></g><g><circle cx="1290" cy="720" r="86" class="n"/><text x="1290" y="714" text-anchor="middle" class="small">PROPERTY</text><text x="1290" y="736" text-anchor="middle" class="small">JETS / ASSETS</text></g><text x="80" y="930" class="warn">MATRIX RULE: document the node, classify the evidence, then map money, access, property, travel and institution routes.</text></svg>