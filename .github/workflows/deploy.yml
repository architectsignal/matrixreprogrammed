name: Matrix Reprogrammed Controlled Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY MATRIX REPROGRAMMED to authorize production
        required: true
        type: string

concurrency:
  group: matrixreprogrammed-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  controlled-production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Confirm explicit manual production release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirmation }}" != "DEPLOY MATRIX REPROGRAMMED" ]; then
            echo 'Production release refused: confirmation text did not match.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build and verify exact release
        run: |
          npm run build
          node scripts/forum-persistence-d1-test.js
          node scripts/cloudflare-worker-routes-test.js
          node scripts/phase7-paypal-sandbox-rehearsal-test.mjs
          node scripts/phase8-autonomous-sandbox-readiness-test.mjs
          node scripts/recovery-worker-api-contract-test.js
          python3 scripts/recovery-d1-rehearsal.py
          node --check src/worker-paypal-sandbox-rehearsal.js
          node scripts/d1-export-command-test.js
          npx --yes wrangler@latest deploy --dry-run
      - name: Capture D1 rollback bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          npx --yes wrangler@latest d1 time-travel info matrix-members --json > downloads/d1-time-travel-bookmark.json
          node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('downloads/d1-time-travel-bookmark.json','utf8'));
          if(!payload?.bookmark||String(payload.bookmark).length<8) throw new Error('Invalid D1 rollback bookmark');
          fs.writeFileSync('downloads/d1-rollback-proof.json',JSON.stringify({ok:true,database:'matrix-members',method:'Cloudflare D1 Time Travel bookmark',bookmark:payload.bookmark,restoreCommand:`wrangler d1 time-travel restore matrix-members --bookmark=${payload.bookmark}`},null,2));
          NODE
      - name: Apply idempotent D1 migration chain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest d1 execute matrix-members --remote --file=migrations/0001_membership_foundation.sql --yes
          npx --yes wrangler@latest d1 execute matrix-members --remote --file=migrations/0004_forum_persistence.sql --yes
          npx --yes wrangler@latest d1 execute matrix-members --remote --file=migrations/phase4_email_lifecycle.sql --yes
          npx --yes wrangler@latest d1 execute matrix-members --remote --file=migrations/phase5_member_experience.sql --yes
          npx --yes wrangler@latest d1 execute matrix-members --remote --file=migrations/phase6_paypal_subscriptions.sql --yes
          npx --yes wrangler@latest d1 execute matrix-members --remote --file=migrations/phase7_paypal_sandbox_rehearsal.sql --yes
          npx --yes wrangler@latest d1 execute matrix-members --remote --file=migrations/phase8_paypal_sandbox_bootstrap.sql --yes
      - name: Preserve payment switches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT environment,checkout_enabled FROM paypal_runtime_settings ORDER BY environment;" --json > downloads/paypal-runtime-settings.json
          node - <<'NODE'
          const rows=JSON.parse(require('fs').readFileSync('downloads/paypal-runtime-settings.json','utf8')).flatMap(x=>x.results||x.result?.results||[]);
          const sandbox=rows.find(x=>x.environment==='sandbox');
          const live=rows.find(x=>x.environment==='live');
          if(!sandbox||Number(sandbox.checkout_enabled)!==0) throw new Error('Sandbox checkout must remain closed outside an explicit rehearsal');
          if(!live) throw new Error('Missing live checkout state');
          console.log(`live checkout state preserved at ${Number(live.checkout_enabled)}.`);
          NODE
      - name: Deploy exact reconciled assets and Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
