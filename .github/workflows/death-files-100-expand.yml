name: Expand and Validate 100 Death Files

on:
  push:
    branches:
      - agent/death-files-100
    paths:
      - data/death-files-catalog.b64.*
      - scripts/expand-death-files-100.js
      - scripts/death-files-pressure-test.js
      - .github/workflows/death-files-100-expand.yml

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  expand-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout expansion branch
        uses: actions/checkout@v4
        with:
          ref: agent/death-files-100
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Expand exact 100-case catalogue
        run: node scripts/expand-death-files-100.js

      - name: Build all dossiers and year archives
        run: node scripts/build-death-files.js

      - name: Run fail-closed 100-dossier pressure test
        run: node scripts/death-files-pressure-test.js

      - name: Verify catalogue boundaries
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const data=require('./data/death-files.json');
          if(data.dossiers.length!==100) throw new Error('Expected exactly 100 dossiers');
          if(!data.dossiers.every(item=>Number(item.year)>=1963)) throw new Error('A dossier predates JFK');
          if(!data.dossiers.every(item=>item.speculationRequired===true)) throw new Error('A dossier lacks mandatory speculation review');
          const gaddafi=data.dossiers.find(item=>item.slug==='muammar-gaddafi');
          if(!gaddafi||!gaddafi.speculation.includes('Why conspiracy theories exist:')) throw new Error('Gaddafi speculation analysis missing');
          console.log('Catalogue boundary verified: JFK to present, 100 cases, detailed speculation on every case.');
          NODE

      - name: Commit generated canonical dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/death-files.json downloads/death-files-100-catalogue.json downloads/death-files-index.json downloads/death-files-index.md downloads/death-files-pressure-test.json
          if ! git diff --cached --quiet; then
            git commit -m 'Generate canonical 100-case Death Files archive'
            git push origin agent/death-files-100
          fi

      - name: Upload validation proof
        uses: actions/upload-artifact@v4
        with:
          name: death-files-100-validation-${{ github.run_id }}
          path: |
            downloads/death-files-100-catalogue.json
            downloads/death-files-pressure-test.json
            downloads/death-files-index.json
          retention-days: 60
