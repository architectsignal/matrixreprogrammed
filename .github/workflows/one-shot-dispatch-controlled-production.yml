name: One-shot controlled production dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/one-shot-controlled-production.trigger

permissions:
  actions: write
  contents: write

jobs:
  dispatch-controlled-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch or locate existing controlled production workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const firstTriggerAt = Date.parse('2026-07-19T12:47:40Z');
            const workflows = await github.rest.actions.listRepoWorkflows({
              owner,
              repo,
              per_page: 100
            });
            const target = workflows.data.workflows.find(
              workflow => workflow.name === 'Matrix Reprogrammed Controlled Production Deploy'
            );
            if (!target) {
              core.setFailed('Controlled production workflow was not found.');
              return;
            }

            async function recentTargetRun() {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: target.id,
                event: 'workflow_dispatch',
                branch: 'main',
                per_page: 30
              });
              return runs.data.workflow_runs.find(
                run => Date.parse(run.created_at) >= firstTriggerAt
              ) || null;
            }

            let run = await recentTargetRun();
            let dispatched = false;
            if (!run) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: target.id,
                ref: 'main',
                inputs: {
                  confirmation: 'DEPLOY MATRIX REPROGRAMMED'
                }
              });
              dispatched = true;
              for (let attempt = 0; attempt < 12 && !run; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 2500));
                run = await recentTargetRun();
              }
            }

            const receipt = {
              ok: Boolean(run),
              dispatched,
              checkedAt: new Date().toISOString(),
              targetWorkflowId: target.id,
              targetWorkflowName: target.name,
              targetWorkflowPath: target.path,
              run: run ? {
                id: run.id,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                headSha: run.head_sha,
                createdAt: run.created_at,
                updatedAt: run.updated_at,
                htmlUrl: run.html_url
              } : null
            };

            const path = '.github/one-shot-controlled-production.receipt.json';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              message: 'Record controlled production dispatch receipt',
              content: Buffer.from(`${JSON.stringify(receipt, null, 2)}\n`).toString('base64'),
              ...(sha ? { sha } : {})
            });

            if (!run) {
              core.setFailed('Controlled production workflow did not appear after dispatch.');
              return;
            }
            core.info(`Controlled production run ${run.id}: ${run.status} ${run.html_url}`);
