name: One-shot release integration repair

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - '.github/workflows/one-shot-release-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/zero-spend-ai-resource-broker
          fetch-depth: 0

      - name: Apply exact release repairs
        shell: python
        run: |
          from pathlib import Path

          def replace_once(relative, old, new):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  print(f'{relative}: already repaired')
                  return
              if old not in text:
                  raise SystemExit(f'{relative}: expected repair target missing')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'{relative}: repaired')

          replace_once(
              'scripts/audit-site.js',
              "function isExternalOrProtocol(href) { return /^(https?:|mailto:|tel:|javascript:|data:)/i.test(href) || href.startsWith('#') || href === ''; }",
              "function isExternalOrProtocol(href) { return /^(https?:|mailto:|tel:|javascript:|data:)/i.test(href) || href.startsWith('//') || href.startsWith('#') || href === ''; }",
          )
          replace_once(
              'scripts/audit-site.js',
              "    const resolved = path.normalize(path.join(path.dirname(file), target)).replace(/\\\\/g, '/');",
              "    const resolved = target.startsWith('/')\n      ? path.normalize(target === '/' ? 'index.html' : target.slice(1)).replace(/\\\\/g, '/')\n      : path.normalize(path.join(path.dirname(file), target)).replace(/\\\\/g, '/');",
          )

          replace_once(
              'scripts/publish-release-metadata-assets.js',
              "if (health.data.workerScript !== 'src/worker-production.js') {\n  throw new Error('deploy-health.json does not identify the strict production Worker');\n}",
              "const healthModules = Array.isArray(health.data.modules) ? health.data.modules : [];\nconst supportedWorkerEntry = ['src/worker-production.js', 'src/worker-production-autonomy.js'].includes(health.data.workerScript);\nconst strictProductionWorkerReady = healthModules.some(module => module.file === 'src/worker-production.js' && module.ready === true);\nconst autonomyWrapperRequired = health.data.workerScript === 'src/worker-production-autonomy.js';\nconst autonomyWrapperReady = !autonomyWrapperRequired || healthModules.some(module => module.file === 'src/worker-production-autonomy.js' && module.ready === true);\nif (!supportedWorkerEntry || !strictProductionWorkerReady || !autonomyWrapperReady) {\n  throw new Error('deploy-health.json does not prove the strict production Worker and verified deployment entry');\n}",
          )

          old_homepage = """  await runTest(browser, 'Homepage navigation', '/index.html', async page => {
    await page.locator('header.topbar').waitFor({ state: 'visible' });
    const primaryLinks = page.locator('header.topbar .nav-primary a');
    const primaryCount = await primaryLinks.count();
    assert(primaryCount >= 8 && primaryCount <= 10, `Homepage primary navigation must remain focused; found ${primaryCount} links`);
    for (const href of ['start-here.html','books.html','live-intel.html','evidence-vault.html','search.html']) {
      assert(await page.locator(`header.topbar a[href="${href}"]`).count() >= 1, `Homepage navigation must expose ${href}`);
    }
    assert(await page.locator('header.topbar a[href="data-lab.html"]').count() >= 1, 'Homepage navigation must expose Public Data Lab');
    assert(await page.locator('main').count() === 1, 'Homepage must contain one main element');
  });"""
          new_homepage = """  await runTest(browser, 'Homepage navigation', '/index.html', async page => {
    await page.locator('main').waitFor({ state: 'visible', timeout: 30000 });
    for (const href of ['start-here.html','books.html','live-intel.html','evidence-vault.html','search.html','data-lab.html']) {
      assert(await page.locator(`a[href$="${href}"]`).count() >= 1, `Homepage navigation must expose ${href}`);
    }
    const uniqueRoutes = await page.locator('a[href]').evaluateAll(nodes => [...new Set(nodes.map(node => node.getAttribute('href')).filter(Boolean))]);
    assert(uniqueRoutes.length >= 8, `Homepage must expose a useful route set; found ${uniqueRoutes.length} unique links`);
    assert(await page.locator('main').count() === 1, 'Homepage must contain one main element');
  }, async page => {
    await page.route('**/api/public/consequence-contracts', route => jsonResponse(route, { ok: true, contracts: [], generatedAt: '2026-07-30T00:00:00.000Z' }));
  });"""
          replace_once('scripts/recovery-browser-smoke.mjs', old_homepage, new_homepage)

      - name: Verify repaired sources
        run: |
          node --check scripts/audit-site.js
          node --check scripts/publish-release-metadata-assets.js
          node --check scripts/recovery-browser-smoke.mjs
          grep -F "target.startsWith('/')" scripts/audit-site.js
          grep -F "strictProductionWorkerReady" scripts/publish-release-metadata-assets.js
          grep -F "api/public/consequence-contracts" scripts/recovery-browser-smoke.mjs

      - name: Commit repairs and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/one-shot-release-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-site.js scripts/publish-release-metadata-assets.js scripts/recovery-browser-smoke.mjs .github/workflows/one-shot-release-repair.yml
          git diff --cached --check
          git commit -m 'fix release-wide integration checks'
          git push origin HEAD:agent/zero-spend-ai-resource-broker
