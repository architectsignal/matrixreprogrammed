name: Matrix Money Intelligence Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'
  push:
    branches:
      - main
    paths:
      - .github/money-intelligence-refresh.trigger

permissions:
  contents: write

concurrency:
  group: matrix-money-intelligence-refresh
  cancel-in-progress: false

jobs:
  refresh-build-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Refresh and build money intelligence
        env:
          MATRIX_MONEY_REFRESH: '1'
          MATRIX_MONEY_REQUIRE_LIVE: '1'
        run: |
          node --check scripts/build-money-intelligence-expansion.js
          node --check scripts/build-detailed-wealth-guides.js
          node --check scripts/detailed-wealth-guides-test.js
          node scripts/build-money-intelligence-expansion.js
          node scripts/money-intelligence-expansion-test.js
          node scripts/build-detailed-wealth-guides.js
          node scripts/detailed-wealth-guides-test.js

      - name: Commit generated public system
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/money-intelligence-registry.json \
            data/money-search-index.json \
            data/money-intelligence-brief-feed.json \
            data/wealth-methods.json \
            data/making-money-core.json \
            data/detailed-wealth-guides.json \
            data/history/money-intelligence \
            follow-the-money \
            making-money/guides \
            downloads/wealth-guides \
            downloads/detailed-wealth-guides-test.json \
            scripts/build-deep-pdf-intelligence.mjs \
            scripts/build-all-branded-download-pdfs.js \
            money-expansion.css money-category.js making-money-methods.js making-money.js \
            money-search.html money-search.js money-graph.html money-graph.js \
            follow-the-money.html making-money.html index.html welcome-gate.js \
            daily-command-brief.html daily-brain-brief.html download-center.html \
            newsletter.html optin-center.html src/worker-intelligence-reports.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Rebuild detailed subject-specific wealth guides [deploy]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Main advanced during money refresh; retrying from the latest branch."
          done
          echo "Unable to publish refreshed money outputs after three attempts."
          exit 1

      - name: Upload wealth guide proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detailed-wealth-guides-${{ github.run_id }}
          path: |
            downloads/detailed-wealth-guides-test.json
            downloads/wealth-guides/index.json
          if-no-files-found: error
          retention-days: 30

      - name: Release handoff
        run: echo "The scheduled guarded dispatcher will deploy the latest tested main exactly once."
