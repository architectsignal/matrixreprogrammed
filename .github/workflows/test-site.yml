name: Test Site

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ test, atlas-layers-upgrade, develop ]
  workflow_dispatch:

concurrency:
  group: test-site-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Build and pressure test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Full build and pressure tests
        id: full_build
        shell: bash
        run: |
          set +e
          mkdir -p downloads
          npm run build 2>&1 | tee downloads/test-site-full-build.log
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Atlas Layers test
        if: always()
        run: node scripts/atlas-layers-test.js

      - name: Migration Flow test
        if: always()
        run: node scripts/migration-flow-test.js

      - name: Risk Clocks and Forum Cloudflare test
        if: always()
        run: node scripts/global-risk-clocks-test.js

      - name: Update cadence audit
        if: always()
        run: node scripts/update-cadence-test.js

      - name: Upload build and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matrixreprogrammed-test-site-${{ github.sha }}
          path: |
            _site
            downloads/test-site-full-build.log
            downloads/final-production-reconcile.json
            downloads/final-release-sanitize.json
            downloads/membership-tiers-report.json
            downloads/voluntary-support-store-patch.json
            downloads/store-commercial-terms.json
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve full-build failure
        if: steps.full_build.outputs.status != '0'
        run: exit 1
