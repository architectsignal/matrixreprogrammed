# Cloudflare Workers deployment configuration
# Production deploy path: GitHub Actions runs npm run build then npx wrangler deploy.
# The strict production wrapper blocks false-success forum responses and delegates all other traffic.
# Inner compatibility Worker retained behind the strict boundary: main = "src/worker-forum-persistence.js"

name = "matrixreprogrammed"
main = "src/worker-production.js"
compatibility_date = "2026-06-25"

# Runtime payment credentials and activation switches are managed in the Cloudflare dashboard.
# keep_vars prevents Wrangler deployments from deleting unrelated dashboard values.
keep_vars = true

routes = [
  { pattern = "matrixreprogrammed.com/*", zone_name = "matrixreprogrammed.com" },
  { pattern = "www.matrixreprogrammed.com/*", zone_name = "matrixreprogrammed.com" }
]

[triggers]
crons = ["5 6 * * *", "15 7 * * 1"]

[vars]
EMAIL_AUTOMATION_ENABLED = "true"
EMAIL_TRANSACTIONAL_ENABLED = "true"
BREVO_DOMAIN_AUTHENTICATED = "true"
EMAIL_RETRY_QUARANTINE_BEFORE = "2026-07-18T00:00:00.000Z"
INTELLIGENCE_REPORT_BATCH_LIMIT = "100"
MEMBERS_FROM_EMAIL = "members@matrixreprogrammed.com"
MEMBERS_FROM_NAME = "Matrix Reprogrammed"
MEMBERS_REPLY_TO_EMAIL = "njmgroupfrance@gmail.com"
MEMBERS_REPLY_TO_NAME = "Matrix Reprogrammed Support"
ENABLE_KV_COMPATIBILITY_MIRROR = "false"

# Non-active compatibility markers retained for the Phase 7 sandbox audit only.
# PAYPAL_ENVIRONMENT = "sandbox"
# PAYPAL_SANDBOX_ENABLED = "true"
# PAYPAL_PRODUCTION_ENABLED = "false"

[assets]
directory = "./_site"
binding = "ASSETS"
run_worker_first = true

# Compatibility mirror and recovery source for historical forum posts.
[[kv_namespaces]]
binding = "FORUM_POSTS"
id = "99996d87016d4285a833707cbda5232f"

# Authoritative membership, forum, consent, session and payment database.
[[d1_databases]]
binding = "MEMBERS_DB"
database_name = "matrix-members"
database_id = "c6e465d3-4e36-4a00-b8f8-309447240c52"
