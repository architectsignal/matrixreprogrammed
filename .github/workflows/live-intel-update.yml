name: Live Intel Update

on:
  schedule:
    # Focused current-source collection every six hours.
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/update-triggers/live-intel.txt'

permissions:
  contents: write
  actions: write

concurrency:
  group: live-intel-current-window
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  update-live-intel:
    name: Collect, validate, publish, and preserve current intelligence
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout current production branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Collect current RSS, Atom, official, and discovery records
        run: node scripts/update-seven-day-intel.js

      - name: Build truthful Live Intel surfaces
        run: node scripts/build-live-intel-machine.js

      - name: Build current Daily Epstein update
        run: |
          node scripts/build-daily-epstein-update.js
          node scripts/build-epstein-sighting-watch.js

      - name: Refresh intelligence state for every tracked card
        run: |
          node scripts/build-card-live-updates.js
          node scripts/repair-card-live-coverage.js

      - name: Scan public pages for figure freshness
        run: node scripts/update-site-freshness-report.js

      - name: Enforce current-window, Epstein, card, and source-date truth
        run: |
          node scripts/live-intel-pressure-test.js
          node scripts/live-machine-dependants-test.js
          node --check investigation-pulse.js

      - name: Publish validated outputs on the latest main
        id: publish
        shell: bash
        env:
          SOURCE_SNAPSHOT_DIR: ${{ runner.temp }}/matrix-live-intel-source
        run: |
          set -euo pipefail
          git config user.name "matrix-live-intel-bot"
          git config user.email "actions@users.noreply.github.com"

          rm -rf "$SOURCE_SNAPSHOT_DIR"
          mkdir -p "$SOURCE_SNAPSHOT_DIR/data" "$SOURCE_SNAPSHOT_DIR/downloads"
          for file in \
            data/live-intel.json \
            data/intel-vault.json \
            downloads/seven-day-intel.json \
            downloads/intel-vault.json \
            downloads/intel-vault.md; do
            if [ -f "$file" ]; then
              mkdir -p "$SOURCE_SNAPSHOT_DIR/$(dirname "$file")"
              cp "$file" "$SOURCE_SNAPSHOT_DIR/$file"
            fi
          done

          rebuild_on_latest_main() {
            git fetch origin main
            git reset --hard origin/main

            node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const snapshotRoot = process.env.SOURCE_SNAPSHOT_DIR;
          const pairs = [
            'data/live-intel.json',
            'data/intel-vault.json',
            'downloads/seven-day-intel.json',
            'downloads/intel-vault.json',
            'downloads/intel-vault.md'
          ];
          const readJson = file => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return {}; } };
          const snapshotLive = readJson(path.join(snapshotRoot, 'data/live-intel.json'));
          const currentLive = readJson('data/live-intel.json');
          const snapshotTime = Date.parse(snapshotLive.updated || snapshotLive.lastCheckedAt || 0) || 0;
          const currentTime = Date.parse(currentLive.updated || currentLive.lastCheckedAt || 0) || 0;
          if (snapshotTime >= currentTime) {
            for (const rel of pairs) {
              const source = path.join(snapshotRoot, rel);
              if (!fs.existsSync(source)) continue;
              fs.mkdirSync(path.dirname(rel), { recursive: true });
              fs.copyFileSync(source, rel);
            }
            console.log(`Preserved validated source window ${snapshotLive.updated || snapshotLive.lastCheckedAt || 'unknown'} over repository window ${currentLive.updated || currentLive.lastCheckedAt || 'unknown'}.`);
          } else {
            console.log(`Repository source window ${currentLive.updated || currentLive.lastCheckedAt || 'unknown'} is newer; keeping it.`);
          }
          NODE

            node scripts/build-live-intel-machine.js
            node scripts/build-daily-epstein-update.js
            node scripts/build-epstein-sighting-watch.js
            node scripts/build-card-live-updates.js
            node scripts/repair-card-live-coverage.js
            node scripts/update-site-freshness-report.js
            node scripts/live-intel-pressure-test.js
            node scripts/live-machine-dependants-test.js
            node --check investigation-pulse.js

            git add \
              data/live-intel.json \
              data/intel-vault.json \
              data/site-freshness-report.json \
              data/daily-epstein-update.json \
              data/epstein-sighting-scan.json \
              data/card-live-updates.json \
              data/live-machine-status.json \
              downloads/seven-day-intel.json \
              downloads/intel-vault.json \
              downloads/intel-vault.md \
              downloads/live-intel-latest.json \
              downloads/live-intel-latest.md \
              downloads/site-freshness-report.md \
              downloads/daily-epstein-update.md \
              downloads/epstein-sighting-watch.json \
              downloads/epstein-sighting-watch.md \
              downloads/card-live-updates.md \
              downloads/card-live-coverage-repair.json \
              downloads/card-live-coverage-repair.md \
              downloads/live-machine-status.md \
              downloads/live-machine-dependants-test.json \
              downloads/live-machine-dependants-test.md \
              site-freshness-report.html \
              live-intel.html \
              daily-epstein-update.html \
              epstein-sighting-watch.html \
              epstein-sighting-submit.html \
              index.html \
              news.html \
              evidence-vault.html \
              epstein-files.html \
              videos.html \
              books.html \
              search-index.json \
              sitemap.xml \
              llms.txt

            node - <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const feed = JSON.parse(fs.readFileSync('data/card-live-updates.json', 'utf8'));
          for (const card of feed.cards || []) {
            const route = String(card.route || '').replace(/^\//, '').split(/[?#]/)[0];
            if (route.endsWith('.html') && fs.existsSync(route)) execFileSync('git', ['add', '--', route], { stdio: 'inherit' });
          }
          NODE
          }

          for attempt in 1 2 3; do
            rebuild_on_latest_main
            if git diff --cached --quiet; then
              echo "Latest main already contains the validated intelligence state."
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git commit -m "Refresh Live Intel, Epstein and card intelligence $(date -u +%FT%H:%MZ) [deploy]"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Main advanced during publication attempt $attempt; rebuilding validated outputs on the newest main."
          done

          echo "Validated intelligence output could not be published after three latest-main rebuilds."
          exit 1

      - name: Dispatch guarded production deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy.yml \
            --ref main \
            -f confirmation='DEPLOY MATRIX REPROGRAMMED'
          echo "Controlled production deployment dispatched for main commit ${{ steps.publish.outputs.commit_sha }}."

      - name: Upload collection and dependant proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-intel-current-window-${{ github.sha }}
          path: |
            data/live-intel.json
            data/intel-vault.json
            data/daily-epstein-update.json
            data/epstein-sighting-scan.json
            data/card-live-updates.json
            data/live-machine-status.json
            downloads/live-intel-latest.json
            downloads/live-intel-latest.md
            downloads/daily-epstein-update.md
            downloads/card-live-updates.md
            downloads/card-live-coverage-repair.json
            downloads/live-machine-dependants-test.json
            downloads/site-freshness-report.md
            live-intel.html
            daily-epstein-update.html
            epstein-sighting-watch.html
          if-no-files-found: error
          retention-days: 21
