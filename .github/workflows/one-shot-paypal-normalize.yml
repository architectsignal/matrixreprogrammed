name: One-shot PayPal normalization
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-paypal-normalize.yml
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: { confirmation: 'DEPLOY MATRIX REPROGRAMMED' }
            });
            await new Promise(resolve => setTimeout(resolve, 5000));
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'deploy.yml',
              branch: 'main',
              event: 'workflow_dispatch',
              per_page: 10
            });
            const started = runs.data.workflow_runs.find(run => new Date(run.created_at) >= new Date(Date.now() - 120000));
            const receipt = {
              ok: Boolean(started),
              purpose: 'Normalize Cloudflare-managed PayPal credentials before OAuth',
              recordedAt: new Date().toISOString(),
              run: started ? { id: started.id, status: started.status, headSha: started.head_sha, htmlUrl: started.html_url } : null
            };
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: '.github/paypal-normalization-deploy-receipt.json',
              message: 'Record PayPal normalization deployment',
              content: Buffer.from(JSON.stringify(receipt, null, 2) + '\n').toString('base64'),
              branch: 'main'
            });
