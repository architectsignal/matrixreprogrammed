name: Site Recovery Functional Inventory

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrixreprogrammed-site-recovery-inventory-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  inventory:
    name: Inventory routes, controls, data and runtime ownership
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout proposed recovery changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rebuild clean intelligence outputs
        id: rebuild
        shell: bash
        run: |
          set +e
          mkdir -p downloads
          : > downloads/recovery-entity-rebuild.log
          node --check scripts/repair-entity-exposure-object-names.js >> downloads/recovery-entity-rebuild.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            node --check scripts/rebuild-clean-entity-outputs.js >> downloads/recovery-entity-rebuild.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            node scripts/rebuild-clean-entity-outputs.js >> downloads/recovery-entity-rebuild.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            node --check scripts/rebuild-master-brief-outputs.js >> downloads/recovery-entity-rebuild.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            node scripts/rebuild-master-brief-outputs.js >> downloads/recovery-entity-rebuild.log 2>&1
            code=$?
          fi
          cat downloads/recovery-entity-rebuild.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build and verify Cloudflare output
        id: cloudflare
        if: steps.rebuild.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          : > downloads/recovery-cloudflare-output.log
          node --check scripts/version-cloudflare-assets.js >> downloads/recovery-cloudflare-output.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            node scripts/build-cloudflare-output.js >> downloads/recovery-cloudflare-output.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            node scripts/version-cloudflare-assets.js >> downloads/recovery-cloudflare-output.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            node scripts/public-data-lab-output-test.js >> downloads/recovery-cloudflare-output.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            node scripts/recovery-worker-api-contract-test.js >> downloads/recovery-cloudflare-output.log 2>&1
            code=$?
          fi
          if [ "$code" -eq 0 ]; then
            python3 scripts/recovery-d1-rehearsal.py >> downloads/recovery-cloudflare-output.log 2>&1
            code=$?
          fi
          cat downloads/recovery-cloudflare-output.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run critical browser journeys
        id: browser
        if: steps.cloudflare.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          mkdir -p downloads/recovery-browser
          : > downloads/recovery-browser-smoke.log
          export PLAYWRIGHT_BROWSERS_PATH=0
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.55.0 >> downloads/recovery-browser-smoke.log 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then
            npx playwright install --with-deps chromium >> downloads/recovery-browser-smoke.log 2>&1
            code=$?
          fi
          server_pid=""
          cleanup() {
            if [ -n "$server_pid" ]; then kill "$server_pid" >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          if [ "$code" -eq 0 ]; then
            python3 -m http.server 4173 --bind 127.0.0.1 --directory _site >> downloads/recovery-browser-smoke.log 2>&1 &
            server_pid=$!
            ready=0
            for attempt in $(seq 1 40); do
              if curl -fsS http://127.0.0.1:4173/index.html >/dev/null 2>&1; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "Local recovery server did not become ready." >> downloads/recovery-browser-smoke.log
              code=1
            fi
          fi
          if [ "$code" -eq 0 ]; then
            RECOVERY_BASE_URL=http://127.0.0.1:4173 node scripts/recovery-browser-smoke.mjs >> downloads/recovery-browser-smoke.log 2>&1
            code=$?
          fi
          cat downloads/recovery-browser-smoke.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and run inventory scanner
        if: steps.rebuild.outputs.exit_code == '0'
        run: |
          node --check scripts/recovery-functional-inventory.js
          node --check scripts/recovery-functional-inventory-refine.js
          node --check scripts/recovery-functional-inventory-bindings.js
          node scripts/recovery-functional-inventory.js
          node scripts/recovery-functional-inventory-refine.js
          node scripts/recovery-functional-inventory-bindings.js

      - name: Trace remaining output owners
        if: steps.rebuild.outputs.exit_code == '0'
        run: |
          node --check scripts/recovery-trace-output-owners.js
          node scripts/recovery-trace-output-owners.js

      - name: Publish inventory summary
        if: steps.rebuild.outputs.exit_code == '0'
        run: |
          cat downloads/recovery-functional-inventory.md >> "$GITHUB_STEP_SUMMARY"
          cat downloads/recovery-output-owner-trace.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f downloads/cloudflare-asset-versioning.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Cloudflare asset versioning" >> "$GITHUB_STEP_SUMMARY"
            node -e "const r=require('./downloads/cloudflare-asset-versioning.json'); console.log('- ok: '+r.ok+'\n- assets: '+r.assetCount+'\n- pages changed: '+r.pagesChanged+'\n- references versioned: '+r.referencesVersioned+'\n- unresolved: '+r.unresolved.length+'\n- unversioned: '+r.unversioned.length+'\n- unsafe immutable headers: '+r.unsafeImmutable)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f downloads/recovery-browser-smoke.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Browser journeys" >> "$GITHUB_STEP_SUMMARY"
            node -e "const r=require('./downloads/recovery-browser-smoke.json'); console.log('- ok: '+r.ok+'\n- passed: '+r.passed+'/'+r.tests+'\n- failed: '+r.failed)" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f downloads/recovery-d1-rehearsal.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## D1 rehearsal" >> "$GITHUB_STEP_SUMMARY"
            python3 - <<'PY'
import json
r=json.load(open('downloads/recovery-d1-rehearsal.json'))
print(f"- ok: {r['ok']}")
print(f"- checks: {r['passed']}/{r['tests']}")
print(f"- migrations: {r['migrationCount']}")
PY
          fi

      - name: Upload complete inventory and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-functional-inventory-${{ github.run_id }}
          path: |
            downloads/recovery-functional-inventory.json
            downloads/recovery-functional-inventory.md
            downloads/recovery-entity-output-rebuild.json
            downloads/recovery-master-output-rebuild.json
            downloads/recovery-entity-rebuild.log
            downloads/recovery-cloudflare-output.log
            downloads/cloudflare-asset-versioning.json
            downloads/public-data-lab-output-test.json
            downloads/recovery-worker-api-contract-test.json
            downloads/recovery-d1-rehearsal.json
            downloads/recovery-browser-smoke.json
            downloads/recovery-browser-smoke.log
            downloads/recovery-browser/
            downloads/recovery-machine-input-sanitize.json
            downloads/recovery-output-owner-trace.json
            downloads/recovery-output-owner-trace.md
          if-no-files-found: error
          retention-days: 30

      - name: Fail on recovery gate error
        if: steps.rebuild.outputs.exit_code != '0' || steps.cloudflare.outputs.exit_code != '0' || steps.browser.outputs.exit_code != '0'
        run: exit 1
