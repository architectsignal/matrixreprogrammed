name: One-shot Cloudflare Route-safe Production Repair

on:
  push:
    branches:
      - main
    paths:
      - .github/repair-cloudflare-route-deploy.trigger
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-shot-cloudflare-route-safe-repair
  cancel-in-progress: false

jobs:
  build-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Build route-safe controlled deployment file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text(encoding='utf-8')
          marker = '          # Preserve existing Cloudflare zone routes during routine releases.\n'
          anchor = '          npx --yes wrangler@latest deploy --config .wrangler-production.toml 2>&1 | tee downloads/wrangler-deploy.log\n'
          if marker in text:
              print('Route-safe deploy patch already present.')
          else:
              if text.count(anchor) != 1:
                  raise SystemExit('Exact Cloudflare deploy command is missing or ambiguous; refusing automatic repair.')
              indent = '          '
              route_strip = (
                  indent
                  + "python3 -c 'from pathlib import Path; p=Path(\".wrangler-production.toml\"); "
                  + "t=p.read_text(encoding=\"utf-8\"); s=t.find(\"routes = [\\\\n\"); "
                  + "e=t.find(\"\\\\n]\\\\n\", s); "
                  + "assert s >= 0 and e > s and \"matrixreprogrammed.com/*\" in t[s:e] and \"www.matrixreprogrammed.com/*\" in t[s:e], \"production routes block missing\"; "
                  + "p.write_text(t[:s] + t[e+3:], encoding=\"utf-8\")'\n"
              )
              text = text.replace(anchor, marker + route_strip + anchor, 1)
              path.write_text(text, encoding='utf-8')
              print('Installed route-safe deploy patch.')
          PY
          grep -F 'Preserve existing Cloudflare zone routes during routine releases.' .github/workflows/deploy.yml
          grep -F 'python3 -c' .github/workflows/deploy.yml | grep -F '.wrangler-production.toml'

      - name: Upload privileged-apply patch
        uses: actions/upload-artifact@v4
        with:
          name: route-safe-deploy-patch-${{ github.run_id }}
          path: .github/workflows/deploy.yml
          if-no-files-found: error
          retention-days: 7
