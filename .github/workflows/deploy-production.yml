name: Deploy Production (Manual Controlled Fallback)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to run the manual Cloudflare fallback release'
        required: true
        default: 'NO'

permissions:
  contents: read
  actions: read

concurrency:
  group: matrixreprogrammed-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Manual D1 migration and strict Cloudflare fallback
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record exact main commit
        run: echo "DEPLOY_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build complete site
        env:
          SOURCE_DOCUMENTS_PER_RUN: '0'
        run: npm run build

      - name: Verify and reconcile release
        env:
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
        run: |
          node scripts/forum-persistence-d1-test.js
          node scripts/cloudflare-worker-routes-test.js
          node scripts/phase7-paypal-sandbox-rehearsal-test.mjs
          node scripts/phase8-autonomous-sandbox-readiness-test.mjs
          node --check src/worker-email-lifecycle.js
          node --check src/worker-member-experience.js
          node --check src/worker-paypal-subscriptions.js
          node --check src/worker-paypal-sandbox-bootstrap-v2.js
          node --check src/worker-paypal-sandbox-bootstrap.js
          node --check src/worker-paypal-sandbox-rehearsal.js
          node --check src/worker-production.js
          node --check scripts/build-production-deploy-receipt.js
          node scripts/final-production-reconcile.js
          node scripts/production-freshness-guard.js
          node scripts/production-sync-test.js
          node scripts/production-deploy-guard.js
          npx --yes wrangler@latest deploy --dry-run

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'CLOUDFLARE_API_TOKEN is missing' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'CLOUDFLARE_ACCOUNT_ID is missing' && exit 1)
          npx --yes wrangler@latest whoami
          npx --yes wrangler@latest d1 info matrix-members

      - name: Export private D1 rollback snapshot
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads/private-migration
          backup="downloads/private-migration/matrix-members-before-${DEPLOY_COMMIT_SHA}.sql"
          npx --yes wrangler@latest d1 export matrix-members --remote --output "$backup" --yes
          test -s "$backup"
          echo "sha256=$(sha256sum "$backup" | awk '{print $1}')" > downloads/d1-backup-proof.txt

      - name: Apply idempotent D1 migration chain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            migrations/0001_membership_foundation.sql
            migrations/0004_forum_persistence.sql
            migrations/phase4_email_lifecycle.sql
            migrations/phase4_email_lifecycle_portability.sql
            migrations/phase5_member_experience.sql
            migrations/phase5_member_experience_timestamp_fix.sql
            migrations/phase6_paypal_subscriptions.sql
            migrations/phase6_paypal_failure_counter_fix.sql
            migrations/phase7_paypal_sandbox_rehearsal.sql
            migrations/phase8_paypal_sandbox_bootstrap.sql
          )
          : > downloads/d1-migration.log
          for migration in "${migrations[@]}"; do
            npx --yes wrangler@latest d1 execute matrix-members --remote --file="$migration" --yes 2>&1 | tee -a downloads/d1-migration.log
          done
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT type,name FROM sqlite_master WHERE name IN ('paypal_sandbox_rehearsal_runs','paypal_sandbox_rehearsal_evidence','paypal_active_sandbox_rehearsal','paypal_sandbox_rehearsal_summary','paypal_sandbox_bootstrap_status','paypal_sandbox_bootstrap_health') ORDER BY type,name;" --json > downloads/payment-schema-verification.json
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT environment,checkout_enabled,activation_reason FROM paypal_runtime_settings ORDER BY environment;" --json > downloads/paypal-runtime-settings.json
          node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('downloads/paypal-runtime-settings.json','utf8'));
          const schema=JSON.parse(fs.readFileSync('downloads/payment-schema-verification.json','utf8'));
          const rows=value=>value.flatMap(item=>item.results||item.result?.results||[]);
          if(rows(payload).some(row=>Number(row.checkout_enabled)!==0)) throw new Error('PayPal checkout must remain disabled during fallback deployment');
          const names=new Set(rows(schema).map(row=>row.name));
          const required=['paypal_sandbox_rehearsal_runs','paypal_sandbox_rehearsal_evidence','paypal_active_sandbox_rehearsal','paypal_sandbox_rehearsal_summary','paypal_sandbox_bootstrap_status','paypal_sandbox_bootstrap_health'];
          const missing=required.filter(name=>!names.has(name));
          if(missing.length) throw new Error(`Payment schema missing: ${missing.join(', ')}`);
          NODE
          rm -rf downloads/private-migration

      - name: Deploy strict Worker and exact assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: Verify live production
        env:
          SITE_URL: https://matrixreprogrammed.com
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_VERIFY_ATTEMPTS: '36'
          LIVE_VERIFY_DELAY_MS: '10000'
        run: node scripts/verify-live-production.js

      - name: Build sanitized production deployment receipt
        env:
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
        run: node scripts/build-production-deploy-receipt.js

      - name: Upload fallback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-production-proof-${{ github.run_id }}
          path: |
            downloads/deploy-manifest.json
            downloads/deploy-health.json
            downloads/production-sync-test.json
            downloads/production-deploy-guard-report.json
            downloads/final-production-reconcile.json
            downloads/live-production-verification.json
            downloads/phase7-paypal-sandbox-rehearsal-test.json
            downloads/phase8-autonomous-sandbox-readiness-test.json
            downloads/production-deploy-receipt.json
            downloads/d1-backup-proof.txt
            downloads/d1-migration.log
            downloads/payment-schema-verification.json
            downloads/paypal-runtime-settings.json
          if-no-files-found: ignore
          retention-days: 60
