name: PDF Evidence Extraction

on:
  workflow_dispatch:
  schedule:
    - cron: '5 6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pdf-evidence-extraction.yml'
      - 'scripts/discover-source-pdfs.js'
      - 'scripts/extract-pdf-documents.js'
      - 'scripts/extend-search-with-documents.js'
      - 'scripts/document-extraction-test.js'
      - 'data/investigation-source-registry.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pdf-evidence-extraction.yml'
      - 'scripts/discover-source-pdfs.js'
      - 'scripts/extract-pdf-documents.js'
      - 'scripts/extend-search-with-documents.js'
      - 'scripts/document-extraction-test.js'
      - 'data/investigation-source-registry.json'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: pdf-evidence-extraction-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    name: Discover, hash, extract, OCR, index and verify PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout current revision
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Install open-source PDF and OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils \
            ocrmypdf \
            tesseract-ocr \
            tesseract-ocr-eng \
            ghostscript \
            python3-img2pdf

      - name: Run full existing site build first
        run: npm run build

      - name: Discover linked PDFs from registered source pages
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          INVESTIGATION_MODE: daily
          SOURCE_DOCUMENT_DISCOVERY_CONCURRENCY: '4'
          SOURCE_DOCUMENT_DISCOVERY_TIMEOUT_MS: '25000'
        run: node scripts/discover-source-pdfs.js daily

      - name: Download, hash, deduplicate and extract PDFs
        env:
          INVESTIGATION_MODE: daily
          DOCUMENT_EXTRACTION_MAX_DOCUMENTS: '12'
          DOCUMENT_EXTRACTION_MAX_BYTES: '26214400'
          DOCUMENT_EXTRACTION_TIMEOUT_MS: '45000'
          DOCUMENT_OCR_CONFIDENCE_SAMPLE_PAGES: '5'
          DOCUMENT_ARTIFACT_NAME: pdf-evidence-${{ github.run_id }}
          DOCUMENT_ARTIFACT_RETENTION_DAYS: '90'
        run: node scripts/extract-pdf-documents.js daily

      - name: Rebuild investigation and document search indexes
        run: |
          node scripts/repair-search-system.js
          node scripts/extend-search-with-investigations.js
          node scripts/extend-search-with-documents.js

      - name: Verify search, OCR, provenance and evidence boundaries
        run: |
          node scripts/search-investigation-smoke-test.js
          node scripts/document-extraction-test.js
          node scripts/audit-site.js

      - name: Commit public document outputs
        if: github.event_name != 'pull_request'
        id: commit
        run: |
          git config user.name "matrix-document-bot"
          git config user.email "actions@github.com"
          git add \
            data/source-snapshot-index.json \
            data/source-document-links.json \
            data/document-extraction-index.json \
            data/document-library.json \
            data/document-text \
            document-library.html \
            search.html \
            search.js \
            search-index.json \
            || true
          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No new public document outputs to commit."
            exit 0
          fi
          git commit -m "Extract and index public-record PDFs $(date -u +%F) [deploy]"
          git push || (git pull --rebase --autostash origin main && git push)
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Upload original PDFs and private extraction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-evidence-${{ github.run_id }}
          path: |
            downloads/document-archive/
            downloads/source-document-discovery-report.json
            downloads/document-extraction-report.json
            downloads/document-extraction-test.json
            downloads/search-investigation-smoke-test.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Verify production document route and search index
        if: github.event_name != 'pull_request' && steps.commit.outputs.committed == 'true'
        env:
          SITE_URL: https://matrixreprogrammed.com
        run: |
          for attempt in $(seq 1 30); do
            page_ok=false
            json_ok=false
            search_ok=false
            curl --fail --silent --show-error --max-time 20 "$SITE_URL/document-library.html" | grep -q 'DOCUMENT LIBRARY' && page_ok=true || true
            curl --fail --silent --show-error --max-time 20 "$SITE_URL/data/document-library.json" | grep -qi 'unreviewed source record' && json_ok=true || true
            curl --fail --silent --show-error --max-time 20 "$SITE_URL/search-index.json" | grep -q 'document-library.html' && search_ok=true || true
            if [ "$page_ok" = true ] && [ "$json_ok" = true ] && [ "$search_ok" = true ]; then
              echo "Production document extraction outputs are live and searchable."
              exit 0
            fi
            echo "Waiting for production deployment ($attempt/30)…"
            sleep 20
          done
          echo "Production did not expose the document route, public JSON and search entry within ten minutes."
          exit 1
