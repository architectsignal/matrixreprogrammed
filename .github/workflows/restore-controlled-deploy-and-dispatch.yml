name: Restore Controlled Deploy and Release Death Files

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/restore-controlled-deploy-and-dispatch.yml

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  restore-validate-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore manual-only controlled production guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy.yml')
          source=p.read_text()
          source=source.replace("  push:\n    branches:\n      - main\n    paths:\n      - data/production-deploy-request.json\n","")
          source=source.replace('  cancel-in-progress: true','  cancel-in-progress: false')
          if '\n  push:' in source:
              raise SystemExit('Controlled deploy still has a push trigger')
          if 'cancel-in-progress: false' not in source:
              raise SystemExit('Controlled deploy concurrency guard is not restored')
          if 'workflow_dispatch:' not in source or 'DEPLOY MATRIX REPROGRAMMED' not in source:
              raise SystemExit('Controlled manual confirmation gate is missing')
          p.write_text(source)
          PY
          node scripts/behind-the-curtain-living-access-test.js

      - name: Commit restored deploy guard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Restore manual-only controlled production guard'
            git push origin main
          fi

      - name: Dispatch guarded Death Files production release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -f ref=main \
            -f 'inputs[confirmation]=DEPLOY MATRIX REPROGRAMMED'
          echo 'Guarded Death Files production release dispatched from restored main.'