name: Matrix Reprogrammed Deep Site Audit

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_audit:
        description: 'Run live Cloudflare and Chromium proof'
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '20 3 * * 0'

concurrency:
  group: matrixreprogrammed-deep-site-audit
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deep-audit:
    name: Rebuild and audit every page, function, link and eligible live route
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record exact audit commit
        run: echo "AUDIT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Resolve audit mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "RUN_LIVE_AUDIT=false" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_live_audit }}" = "false" ]; then
            echo "RUN_LIVE_AUDIT=false" >> "$GITHUB_ENV"
          else
            echo "RUN_LIVE_AUDIT=true" >> "$GITHUB_ENV"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build complete site and Worker assets twice
        env:
          SOURCE_DOCUMENTS_PER_RUN: '0'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p downloads
          echo '===== BUILD PASS 1 =====' | tee downloads/deep-audit-build.log
          npm run build 2>&1 | tee -a downloads/deep-audit-build.log
          echo '===== BUILD PASS 2 =====' | tee -a downloads/deep-audit-build.log
          npm run build 2>&1 | tee -a downloads/deep-audit-build.log

      - name: Reconcile exact Cloudflare bundle
        env:
          DEPLOY_COMMIT_SHA: ${{ env.AUDIT_COMMIT_SHA }}
        run: node scripts/final-production-reconcile.js

      - name: Repair deterministic deep-audit blockers after all mutators
        run: node scripts/repair-deep-audit-v2-blockers.js

      - name: Exhaustive static audit
        id: static_audit
        continue-on-error: true
        run: node scripts/deep-production-site-audit-v2.js --static

      - name: Existing audit suite
        id: existing_audits
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p downloads
          : > downloads/deep-audit-existing-suite.log
          failed=0
          run_audit() {
            name="$1"; shift
            echo "===== $name =====" | tee -a downloads/deep-audit-existing-suite.log
            "$@" 2>&1 | tee -a downloads/deep-audit-existing-suite.log
            code=${PIPESTATUS[0]}
            echo "EXIT $code" | tee -a downloads/deep-audit-existing-suite.log
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          run_audit "full-site-function-tool-audit" node scripts/full-site-function-tool-audit.js --postbuild
          run_audit "site-function-harmony-test" node scripts/site-function-harmony-test.js
          run_audit "link-audit" node tools/link-audit.js
          run_audit "audit-site" node scripts/audit-site.js
          run_audit "pressure-test-site" node scripts/pressure-test-site.js
          run_audit "site-wide-function-audit" node scripts/site-wide-function-audit.js --postbuild
          exit "$failed"

      - name: Wait for exact commit to reach Cloudflare
        if: env.RUN_LIVE_AUDIT == 'true'
        id: deploy_wait
        continue-on-error: true
        env:
          SITE_URL: https://matrixreprogrammed.com
          EXPECTED_COMMIT_SHA: ${{ env.AUDIT_COMMIT_SHA }}
          ADMIN_API_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          DEPLOY_WAIT_ATTEMPTS: '72'
          DEPLOY_WAIT_DELAY_MS: '10000'
        run: node scripts/wait-for-live-deploy-commit.js

      - name: Exhaustive live audit V3
        if: env.RUN_LIVE_AUDIT == 'true'
        id: live_audit
        continue-on-error: true
        env:
          SITE_URL: https://matrixreprogrammed.com
          ADMIN_API_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
        run: node scripts/deep-production-live-audit-v3.js

      - name: Chromium browser interaction smoke
        if: env.RUN_LIVE_AUDIT == 'true'
        id: browser_smoke
        continue-on-error: true
        env:
          SITE_URL: https://matrixreprogrammed.com
          ADMIN_API_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/live-browser-interaction-smoke.mjs

      - name: Publish sanitized audit summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            function load(name) {
              try { return JSON.parse(fs.readFileSync(path.join(process.cwd(), 'downloads', name), 'utf8')); }
              catch { return null; }
            }
            const staticReport = load('deep-production-site-audit-static.json');
            const liveReport = load('deep-production-site-audit-live.json');
            const browserReport = load('live-browser-interaction-smoke.json');
            const deployWait = load('deep-audit-live-deploy-wait.json');
            const liveRequired = process.env.RUN_LIVE_AUDIT === 'true';
            const hard = [staticReport, ...(liveRequired ? [liveReport, browserReport] : [])].filter(Boolean).flatMap(report => report.hardIssues || []);
            const staticPassed = staticReport?.ok === true && '${{ steps.static_audit.outcome }}' === 'success' && '${{ steps.existing_audits.outcome }}' === 'success';
            const livePassed = !liveRequired || (liveReport?.ok === true && browserReport?.ok === true && deployWait?.ok === true && '${{ steps.deploy_wait.outcome }}' === 'success' && '${{ steps.live_audit.outcome }}' === 'success' && '${{ steps.browser_smoke.outcome }}' === 'success');
            const status = staticPassed && livePassed ? 'PASS' : 'FAIL';
            const body = [
              `## Deep Site Audit ${status}`,
              '',
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: \`${process.env.AUDIT_COMMIT_SHA || context.sha}\``,
              `Mode: ${liveRequired ? 'build + static + live + browser' : 'build + static push gate'}`,
              `Static passed: ${staticPassed}`,
              `Live proof required: ${liveRequired}`,
              `Live passed: ${livePassed}`,
              '',
              `### Hard issues (${hard.length})`,
              hard.length ? hard.slice(0, 180).map(item => `- ${item}`).join('\n') : '- None',
              '',
              'No credentials, payment actions, forum posts, login emails or customer data are created by this audit.'
            ].join('\n').slice(0, 60000);
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 94, body });

      - name: Enforce eligible audit result
        if: always()
        env:
          STATIC_OUTCOME: ${{ steps.static_audit.outcome }}
          EXISTING_OUTCOME: ${{ steps.existing_audits.outcome }}
          DEPLOY_WAIT_OUTCOME: ${{ steps.deploy_wait.outcome }}
          LIVE_OUTCOME: ${{ steps.live_audit.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_smoke.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          function load(file) { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; } }
          const staticReport = load('downloads/deep-production-site-audit-static.json');
          const liveReport = load('downloads/deep-production-site-audit-live.json');
          const browserReport = load('downloads/live-browser-interaction-smoke.json');
          const deployWait = load('downloads/deep-audit-live-deploy-wait.json');
          const liveRequired = process.env.RUN_LIVE_AUDIT === 'true';
          const staticOk = staticReport?.ok === true && process.env.STATIC_OUTCOME === 'success' && process.env.EXISTING_OUTCOME === 'success';
          const liveOk = !liveRequired || (liveReport?.ok === true && browserReport?.ok === true && deployWait?.ok === true && process.env.DEPLOY_WAIT_OUTCOME === 'success' && process.env.LIVE_OUTCOME === 'success' && process.env.BROWSER_OUTCOME === 'success');
          const ok = staticOk && liveOk;
          console.log(JSON.stringify({ ok, mode: liveRequired ? 'full-live' : 'push-static', staticOk, liveOk }, null, 2));
          if (!ok) process.exit(1);
          NODE

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-site-audit-${{ github.run_id }}
          path: |
            downloads/deep-audit-build.log
            downloads/deep-audit-existing-suite.log
            downloads/deep-audit-live-deploy-wait.json
            downloads/deep-production-site-audit-static.json
            downloads/deep-production-site-audit-static.md
            downloads/deep-production-site-audit-live.json
            downloads/deep-production-site-audit-live.md
            downloads/live-browser-interaction-smoke.json
            downloads/live-browser-interaction-smoke.md
            downloads/deep-audit-v2-blocker-repair.json
            downloads/full-site-function-tool-audit.json
            downloads/full-site-function-tool-audit.md
            downloads/site-function-harmony-report.json
            downloads/site-function-harmony-report.md
            downloads/link-audit-report.json
            downloads/site-audit-report.json
            downloads/site-pressure-report.json
            downloads/site-wide-function-audit.json
            downloads/final-production-reconcile.json
          if-no-files-found: ignore
          retention-days: 60
