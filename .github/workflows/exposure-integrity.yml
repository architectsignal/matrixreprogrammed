name: Exposure Integrity Gate

on:
  pull_request:
    paths:
      - 'data/exposure-integrity-policy.json'
      - 'data/criminal-conduct-registry.json'
      - 'data/epstein-dossier-overlap-registry.json'
      - 'data/dark-speculation-claims.json'
      - 'data/evidence-weighted-relationship-graph.json'
      - 'data/clock-wall.json'
      - 'data/latest-public-drops.json'
      - 'scripts/*exposure-integrity*.js'
      - 'scripts/build-dossier-accountability-overlays.js'
      - 'scripts/align-mission-acceptance-copy.js'
      - 'scripts/finalize-search-first-accountability-home.js'
      - 'scripts/refine-accountability-question-ledger.js'
      - 'scripts/search-first-accountability-home-pressure-test.js'
      - 'scripts/build-public-consequence-contracts.js'
      - 'scripts/finalize-public-consequence-runtime.js'
      - 'scripts/public-consequence-contracts-pressure-test.js'
      - 'public-consequence-contracts.js'
      - '.github/workflows/exposure-integrity.yml'
  push:
    branches:
      - main
      - 'agent/elite-exposure-integrity-v2'
    paths:
      - 'data/exposure-integrity-policy.json'
      - 'data/criminal-conduct-registry.json'
      - 'data/epstein-dossier-overlap-registry.json'
      - 'data/dark-speculation-claims.json'
      - 'data/evidence-weighted-relationship-graph.json'
      - 'data/clock-wall.json'
      - 'data/latest-public-drops.json'
      - 'scripts/*exposure-integrity*.js'
      - 'scripts/build-dossier-accountability-overlays.js'
      - 'scripts/align-mission-acceptance-copy.js'
      - 'scripts/finalize-search-first-accountability-home.js'
      - 'scripts/refine-accountability-question-ledger.js'
      - 'scripts/search-first-accountability-home-pressure-test.js'
      - 'scripts/build-public-consequence-contracts.js'
      - 'scripts/finalize-public-consequence-runtime.js'
      - 'scripts/public-consequence-contracts-pressure-test.js'
      - 'public-consequence-contracts.js'
      - '.github/workflows/exposure-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exposure-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Syntax-check Exposure Integrity and accountability scripts
        run: |
          node --check scripts/build-exposure-integrity-engine.js
          node --check scripts/run-exposure-integrity-engine.js
          node --check scripts/prepare-exposure-integrity-inputs.js
          node --check scripts/finalize-exposure-integrity-engine.js
          node --check scripts/dedupe-exposure-integrity-records.js
          node --check scripts/finalize-exposure-clean-routes.js
          node --check scripts/exposure-integrity-predators-link.js
          node --check scripts/exposure-integrity-pressure-test.js
          node --check scripts/finalize-search-first-accountability-home.js
          node --check scripts/refine-accountability-question-ledger.js
          node --check scripts/search-first-accountability-home-pressure-test.js
          node --check scripts/build-public-consequence-contracts.js
          node --check scripts/finalize-public-consequence-runtime.js
          node --check scripts/public-consequence-contracts-pressure-test.js
          node --check public-consequence-contracts.js

      - name: Build dossier accountability inputs
        run: node scripts/build-dossier-accountability-overlays.js

      - name: Prepare canonical registries
        run: node scripts/prepare-exposure-integrity-inputs.js

      - name: Generate evidence ledger and Hit List
        run: node scripts/run-exposure-integrity-engine.js

      - name: Finalize user-facing classifications and routes
        run: |
          node scripts/finalize-exposure-integrity-engine.js
          node scripts/dedupe-exposure-integrity-records.js
          node scripts/finalize-exposure-clean-routes.js
          node scripts/exposure-integrity-predators-link.js

      - name: Run fail-closed Exposure Integrity pressure test
        run: node scripts/exposure-integrity-pressure-test.js

      - name: Build search-first homepage, Open Question Ledger and Accountability Twins
        run: |
          node scripts/finalize-search-first-accountability-home.js
          node scripts/refine-accountability-question-ledger.js

      - name: Run fail-closed accountability homepage pressure test
        run: node scripts/search-first-accountability-home-pressure-test.js

      - name: Upload Exposure Integrity and future-accountability proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exposure-integrity-proof-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            data/exposure-integrity-engine.json
            data/exposure-evidence-ledger.json
            data/cinematic-hit-list.json
            data/accountability-question-ledger.json
            data/public-consequence-contracts.json
            downloads/exposure-integrity-report.json
            downloads/exposure-integrity-pressure-test.json
            downloads/exposure-integrity-input-report.json
            downloads/exposure-predators-hit-list-link.json
            downloads/search-first-accountability-home-report.json
            downloads/accountability-question-ledger-refinement.json
            downloads/search-first-accountability-home-pressure-test.json
            downloads/public-consequence-contracts-report.json
            downloads/public-consequence-contracts-pressure-test.json
            downloads/public-consequence-contracts.csv
            hit-list.html
            predators-in-power.html
            index.html
            accountability-home.css
            accountability-home.js
            search-query-handoff.js
            public-consequence-contracts.html
            public-consequence-contracts.css
            public-consequence-contracts.js
