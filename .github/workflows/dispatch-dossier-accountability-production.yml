name: Dispatch Dossier Accountability Production Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-dossier-accountability-production.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: dossier-accountability-production-dispatch
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  dispatch-controlled-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate dossier accountability release
        shell: bash
        run: |
          set -euo pipefail
          test -s data/epstein-dossier-overlap-registry.json
          test -s scripts/build-dossier-accountability-overlays.js
          grep -q "build-dossier-accountability-overlays.js" scripts/align-mission-acceptance-copy.js
          node --check scripts/build-dossier-accountability-overlays.js
          node - <<'NODE'
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('data/epstein-dossier-overlap-registry.json', 'utf8'));
          const gates = registry.subjects && registry.subjects['bill-gates'];
          if (!gates || !Array.isArray(gates.records) || !gates.records.some(r => r.publicationStatus === 'approved' && /^https:\/\//.test(r.sourceUrl || ''))) {
            throw new Error('Approved, source-linked Bill Gates Epstein record is missing.');
          }
          const routes = new Set(gates.dossierRoutes || []);
          for (const route of ['top-52/bill-gates.html', 'billionaire-briefs/bill-gates.html']) {
            if (!routes.has(route)) throw new Error(`Required Gates route missing: ${route}`);
          }
          console.log('Dossier accountability release request validated.');
          NODE

      - name: Dispatch controlled production workflow
        id: dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cutoff = new Date('2026-07-28T10:30:00Z');
            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const target = workflows.data.workflows.find(workflow => workflow.path === '.github/workflows/deploy.yml' || workflow.name === 'Matrix Reprogrammed Controlled Production Deploy');
            if (!target) {
              core.setFailed('Controlled production workflow deploy.yml was not found.');
              return;
            }
            const recentRun = async () => {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: target.id,
                event: 'workflow_dispatch',
                branch: 'main',
                per_page: 30
              });
              return (runs.data.workflow_runs || [])
                .filter(run => new Date(run.created_at) >= cutoff)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0] || null;
            };
            let run = await recentRun();
            let action = 'reused-existing-dossier-accountability-release';
            if (!run) {
              action = 'dispatched-dossier-accountability-release-once';
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: target.id,
                ref: 'main',
                inputs: { confirmation: 'DEPLOY MATRIX REPROGRAMMED' }
              });
              for (let attempt = 1; attempt <= 24 && !run; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 5000));
                run = await recentRun();
              }
            }
            if (!run) {
              core.setFailed('Production dispatch was accepted but its workflow run could not be resolved.');
              return;
            }
            const payload = {
              ok: true,
              releaseId: 'dossier-epstein-criminal-accountability-20260728',
              action,
              dispatcherRunId: Number(process.env.GITHUB_RUN_ID),
              productionRunId: run.id,
              productionRunNumber: run.run_number,
              status: run.status,
              conclusion: run.conclusion,
              event: run.event,
              headBranch: run.head_branch,
              headSha: run.head_sha,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              url: run.html_url,
              targetFeatureCommit: '39ff6061430c4ec43e17003a1ac7ee3d53530f29',
              targetAuthorizationCommit: '39747d16d156698549243c99b965b37191cf0e06',
              recordedAt: new Date().toISOString(),
              boundary: 'Exactly one production workflow-dispatch run created after the release cutoff is used. Later manual reruns of this dispatcher reuse that run rather than creating a duplicate.'
            };
            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/dossier-accountability-production-dispatch.json', JSON.stringify(payload, null, 2) + '\n');
            core.info(`${action}: production run ${run.id} (${run.status}${run.conclusion ? `/${run.conclusion}` : ''}).`);

      - name: Record exact production run identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/dossier-accountability-production-dispatch.json
          if git diff --cached --quiet; then
            echo 'Production dispatch receipt is already current.'
            exit 0
          fi
          git commit -m 'Record dossier accountability production dispatch'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo 'Could not push production dispatch receipt.'
          exit 1
