name: Capture Current Deploy Status

on:
  push:
    branches: [ main ]
    paths:
      - '.github/update-triggers/deploy-status.txt'

permissions:
  contents: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Capture controlled deploy and Live Intel workflow states
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/matrix-deploy-status" downloads
          gh run list --workflow deploy.yml --limit 20 --json databaseId,status,conclusion,headSha,headBranch,event,createdAt,updatedAt,url,displayTitle > "$RUNNER_TEMP/matrix-deploy-status/current-controlled-deploy-runs.json"
          gh run list --workflow live-intel-update.yml --limit 20 --json databaseId,status,conclusion,headSha,headBranch,event,createdAt,updatedAt,url,displayTitle > "$RUNNER_TEMP/matrix-deploy-status/current-live-intel-runs.json"

      - name: Commit diagnostic snapshot without losing concurrent main changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'matrix-deploy-status-bot'
          git config user.email 'actions@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p downloads
            cp "$RUNNER_TEMP/matrix-deploy-status/current-controlled-deploy-runs.json" downloads/current-controlled-deploy-runs.json
            cp "$RUNNER_TEMP/matrix-deploy-status/current-live-intel-runs.json" downloads/current-live-intel-runs.json
            git add downloads/current-controlled-deploy-runs.json downloads/current-live-intel-runs.json
            if git diff --cached --quiet; then
              echo 'Deployment status snapshot unchanged.'
              exit 0
            fi
            git commit -m 'Capture current controlled deployment status'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during deployment status capture attempt $attempt; retrying on the newest main."
          done

          echo 'Unable to publish deployment status snapshot after four retries.'
          exit 1
