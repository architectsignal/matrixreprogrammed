name: Observe Current Production Run

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Matrix Reprogrammed Controlled Production Deploy
    types:
      - completed

permissions:
  actions: read
  contents: read

concurrency:
  group: observe-current-production-run
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Snapshot latest controlled production run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Matrix Reprogrammed Controlled Production Deploy" --limit 1 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url,event)"
          node - "$run_json" <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(process.argv[2]||'[]');
          if(!rows.length) throw new Error('No controlled production run found');
          const run=rows[0];
          fs.mkdirSync('downloads',{recursive:true});
          fs.writeFileSync('downloads/current-production-run.json',JSON.stringify({
            ok:run.status==='completed'&&run.conclusion==='success',
            observedAt:new Date().toISOString(),
            ...run,
            boundary:'Observer is permanently read-only and never commits status timestamps to main.'
          },null,2)+'\n');
          NODE
      - name: Upload read-only production status
        uses: actions/upload-artifact@v4
        with:
          name: current-production-run-${{ github.run_id }}
          path: downloads/current-production-run.json
          if-no-files-found: error
          retention-days: 14
