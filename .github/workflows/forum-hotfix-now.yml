name: Forum Hotfix Now

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forum-hotfix-now.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: forum-hotfix-now
  cancel-in-progress: false

jobs:
  repair-commit-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply forum page consistency
        run: node scripts/repair-forum-page-consistency.js

      - name: Prove authenticated D1 member posting
        run: |
          node scripts/forum-member-posting-test.js
          node --check forum.js
          node --check src/worker.js
          node --check src/worker-member-experience.js
          node --check src/worker-forum-persistence.js
          node --check src/worker-production.js

      - name: Commit unified forum source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'matrix-forum-hotfix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            forum.js \
            forum.html \
            dark-speculation-forum.html \
            epstein-alive-board.html \
            member-login.html \
            src/worker.js \
            src/worker-member-experience.js \
            src/worker-forum-persistence.js \
            scripts/repair-forum-page-consistency.js \
            scripts/forum-member-posting-test.js \
            scripts/final-production-reconcile.js
          if ! git diff --cached --quiet; then
            git commit -m 'Unify all forums on verified member D1 posting'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Cancel every active controlled production run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh run list --workflow deploy.yml --limit 100 --json databaseId,status \
            --repo "$GITHUB_REPOSITORY" \
            --jq '.[] | select(.status != "completed") | .databaseId' > /tmp/active-deploys.txt
          while read -r run_id; do
            [ -n "$run_id" ] || continue
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done < /tmp/active-deploys.txt
          sleep 8

      - name: Dispatch one clean guarded release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run 'Matrix Reprogrammed Controlled Production Deploy' \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f confirmation='DEPLOY MATRIX REPROGRAMMED'
