name: Focused Identity Overlay Live Proof

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/identity-overlay-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: identity-overlay-live-proof
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  RELEASE_SHA: '28f3423471112b6529640cf1b17f9f7cc227c156'
  RELEASE_WORKER_VERSION: 'd7f814a8-ae27-4581-bd74-c905d5f42b3c'

jobs:
  focused-live-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Record proof run start
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const receipt = {
            ok: null,
            status: 'in_progress',
            runId: Number(process.env.GITHUB_RUN_ID),
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
            workflow: process.env.GITHUB_WORKFLOW,
            release: 'identity-affiliation-ownership-overlay',
            releaseSha: process.env.RELEASE_SHA,
            releaseWorkerVersion: process.env.RELEASE_WORKER_VERSION,
            startedAt: new Date().toISOString(),
            url: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          };
          fs.mkdirSync('data', {recursive: true});
          fs.writeFileSync('data/identity-affiliation-overlay-proof-run.json', `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/identity-affiliation-overlay-proof-run.json
          git commit -m 'Record identity overlay live proof start'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Run focused fail-closed live proof
        id: proof
        env:
          SITE_URL: https://matrixreprogrammed.com
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const site = String(process.env.SITE_URL || 'https://matrixreprogrammed.com').replace(/\/$/, '');
          const releaseSha = String(process.env.RELEASE_SHA || '');
          const releaseWorkerVersion = String(process.env.RELEASE_WORKER_VERSION || '');
          const requiredRecordIds = ['jeffrey-epstein', 'tom-cruise', 'john-travolta', 'orsini-family'];
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          const parseJson = text => { try { return JSON.parse(text); } catch { return null; } };

          function requestHeaders(path, extra = {}) {
            const isData = /(?:\/api\/|\.(?:json|js|css)(?:\?|$))/i.test(path);
            return {
              accept: isData ? 'application/json,text/plain;q=0.9,*/*;q=0.8' : 'text/html,application/xhtml+xml;q=0.9,*/*;q=0.8',
              'accept-language': 'en-GB,en;q=0.9',
              'cache-control': 'no-cache',
              pragma: 'no-cache',
              'user-agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36 MatrixIdentityProof/2.0',
              ...extra
            };
          }

          async function fetchRoute(path, options = {}) {
            const method = String(options.method || 'GET').toUpperCase();
            const hosts = [site, site.includes('://www.') ? site.replace('://www.', '://') : site.replace('://', '://www.')];
            let last = null;
            for (let attempt = 1; attempt <= 4; attempt += 1) {
              for (const host of hosts) {
                const join = path.includes('?') ? '&' : '?';
                const url = method === 'GET' || method === 'HEAD'
                  ? `${host}${path}${join}identity_overlay_proof=${Date.now()}-${attempt}`
                  : `${host}${path}`;
                try {
                  const response = await fetch(url, {
                    redirect: 'follow',
                    ...options,
                    headers: requestHeaders(path, options.headers || {}),
                    signal: AbortSignal.timeout(20000)
                  });
                  const text = await response.text();
                  last = {
                    url,
                    status: response.status,
                    ok: response.ok,
                    text,
                    json: parseJson(text),
                    headers: Object.fromEntries(response.headers.entries())
                  };
                  if (response.status !== 403 && response.status !== 429 && response.status < 500) return last;
                } catch (error) {
                  last = {url, status: 0, ok: false, text: '', json: null, headers: {}, error: error.message};
                }
              }
              await sleep(attempt * 4000);
            }
            return last;
          }

          async function verifyOnce() {
            const [home, runtime, overlayJs, overlayCss, overlayData, nested, health, manifest] = await Promise.all([
              fetchRoute('/'),
              fetchRoute('/matrix.js'),
              fetchRoute('/identity-affiliation-overlay.js?v=1.0.1'),
              fetchRoute('/identity-affiliation-overlay.css?v=1.0.1'),
              fetchRoute('/data/identity-affiliation-overlay.json?v=1.0.1'),
              fetchRoute('/controlled-opposition/andrew-tate.html'),
              fetchRoute('/deploy-health.json'),
              fetchRoute('/deploy-manifest.json')
            ]);

            const data = overlayData.json || {};
            const healthData = health.json || {};
            const manifestData = manifest.json || {};
            const recordIds = [...new Set((Array.isArray(data.records) ? data.records : []).map(record => record && record.id).filter(Boolean))];
            const liveSha = String(manifestData.commitSha || healthData.buildSha || '');
            const shaPattern = /^[a-f0-9]{40}$/i;

            const forumHealthBefore = await fetchRoute('/forum-health');
            const forumFeed = await fetchRoute('/forum-feed-main');
            const beforeCount = Number(forumHealthBefore.json?.storedPostCount);
            const anonymousForumWrite = await fetchRoute('/submit-main-post', {
              method: 'POST',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify({
                title: `Identity overlay proof ${releaseSha.slice(0, 12)}`,
                message: 'This anonymous verification request must be rejected without mutation.',
                category: 'health check',
                name: 'Matrix System Check'
              })
            });
            const forumHealthAfter = await fetchRoute('/forum-health');
            const afterCount = Number(forumHealthAfter.json?.storedPostCount);

            const paypalConfig = await fetchRoute('/api/paypal/config');
            const paypalCheckout = await fetchRoute('/api/paypal/checkout-intent', {
              method: 'POST',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify({tier: 'supporter'})
            });
            const paypalCreate = await fetchRoute('/api/paypal/subscription/create', {
              method: 'POST',
              headers: {'content-type': 'application/json'},
              body: JSON.stringify({tier: 'supporter'})
            });
            const emailAdminHealth = await fetchRoute('/api/email/admin/health');

            const checks = {
              publicSiteResponds: home.ok && /MATRIX REPROGRAMMED|MAP THE STRUCTURE/i.test(home.text),
              runtimeLoadsOverlay: runtime.ok && runtime.text.includes('identity-affiliation-overlay.js?v=1.0.1'),
              runtimeUsesStableBase: runtime.ok && runtime.text.includes('MATRIX_RUNTIME_BASE'),
              overlayJavascriptLive: overlayJs.ok && overlayJs.text.includes('MatrixIdentityOverlay') && overlayJs.text.includes('ENGINE_BASE'),
              overlayStylesLive: overlayCss.ok && overlayCss.text.length > 1000,
              overlayDataLive: overlayData.ok && data.title === 'Identity, Affiliation & Ownership Evidence Overlay',
              starterRecordsPresent: requiredRecordIds.every(id => recordIds.includes(id)),
              nestedDossierLoadsSharedRuntime: nested.ok && /(?:\.\.\/)?matrix\.js/.test(nested.text),
              deploymentManifestHealthy: manifest.ok && shaPattern.test(String(manifestData.commitSha || '')),
              deploymentHealthHealthy: health.ok && healthData.ok === true && healthData.manifestMatches === true,
              deploymentShaConsistent: shaPattern.test(liveSha) && healthData.buildSha === manifestData.commitSha && healthData.manifestSha === manifestData.commitSha,
              forumD1Health: forumHealthBefore.ok
                && forumHealthBefore.headers['x-matrix-origin'] === 'cloudflare-worker-forum-d1'
                && forumHealthBefore.json?.persistent === true
                && forumHealthBefore.json?.d1Connected === true
                && Number.isFinite(beforeCount),
              forumD1Read: forumFeed.ok
                && forumFeed.headers['x-matrix-origin'] === 'cloudflare-worker-forum-d1'
                && forumFeed.json?.persistent === true
                && forumFeed.json?.board === 'main'
                && Array.isArray(forumFeed.json?.posts),
              anonymousForumWriteRejected: anonymousForumWrite.status === 401
                && anonymousForumWrite.headers['x-matrix-origin'] === 'cloudflare-worker-forum-d1'
                && anonymousForumWrite.json?.authenticated === false
                && anonymousForumWrite.json?.saved === false,
              anonymousForumWriteDidNotMutate: forumHealthAfter.ok && Number.isFinite(afterCount) && afterCount === beforeCount,
              paypalConfigProtected: paypalConfig.status === 401
                && paypalConfig.headers['x-matrix-origin'] === 'cloudflare-worker-paypal-subscriptions'
                && paypalConfig.json?.authenticated === false,
              paypalCheckoutProtected: paypalCheckout.status === 401
                && paypalCheckout.headers['x-matrix-origin'] === 'cloudflare-worker-paypal-subscriptions'
                && paypalCheckout.json?.authenticated === false,
              paypalCreateProtected: paypalCreate.status === 401
                && paypalCreate.headers['x-matrix-origin'] === 'cloudflare-worker-paypal-subscriptions'
                && paypalCreate.json?.authenticated === false,
              emailAdminBoundaryProtected: [401, 403, 404].includes(emailAdminHealth.status)
            };

            return {
              ok: Object.values(checks).every(Boolean),
              checkedAt: new Date().toISOString(),
              site,
              releaseSha,
              releaseWorkerVersion,
              liveSha,
              liveShaAdvancedBeyondRelease: Boolean(liveSha && liveSha !== releaseSha),
              checks,
              recordIds,
              forum: {
                beforeCount,
                afterCount,
                feedCount: Number(forumFeed.json?.count),
                anonymousWriteStatus: anonymousForumWrite.status
              },
              statuses: {
                home: home.status,
                matrixRuntime: runtime.status,
                overlayJavascript: overlayJs.status,
                overlayStyles: overlayCss.status,
                overlayData: overlayData.status,
                nestedDossier: nested.status,
                deployHealth: health.status,
                deployManifest: manifest.status,
                forumHealth: forumHealthBefore.status,
                forumFeed: forumFeed.status,
                anonymousForumWrite: anonymousForumWrite.status,
                paypalConfig: paypalConfig.status,
                paypalCheckout: paypalCheckout.status,
                paypalCreate: paypalCreate.status,
                emailAdminHealth: emailAdminHealth.status
              }
            };
          }

          (async () => {
            let proof = null;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              proof = await verifyOnce();
              proof.attempt = attempt;
              if (proof.ok) break;
              await sleep(attempt * 8000);
            }
            fs.mkdirSync('data', {recursive: true});
            fs.mkdirSync('downloads', {recursive: true});
            fs.writeFileSync('data/identity-affiliation-overlay-live-proof.json', `${JSON.stringify(proof, null, 2)}\n`);
            fs.writeFileSync('downloads/identity-affiliation-overlay-live-proof.json', `${JSON.stringify(proof, null, 2)}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `proof_ok=${proof.ok ? 'true' : 'false'}\n`);
            console.log(JSON.stringify(proof, null, 2));
          })().catch(error => {
            const proof = {
              ok: false,
              checkedAt: new Date().toISOString(),
              releaseSha,
              releaseWorkerVersion,
              error: error.stack || error.message
            };
            fs.mkdirSync('data', {recursive: true});
            fs.mkdirSync('downloads', {recursive: true});
            fs.writeFileSync('data/identity-affiliation-overlay-live-proof.json', `${JSON.stringify(proof, null, 2)}\n`);
            fs.writeFileSync('downloads/identity-affiliation-overlay-live-proof.json', `${JSON.stringify(proof, null, 2)}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'proof_ok=false\n');
            console.error(error);
          });
          NODE

      - name: Record focused proof result
        if: always()
        env:
          PROOF_OK: ${{ steps.proof.outputs.proof_ok }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const proofPath = 'data/identity-affiliation-overlay-live-proof.json';
          const proof = fs.existsSync(proofPath) ? JSON.parse(fs.readFileSync(proofPath, 'utf8')) : {ok: false, error: 'proof file missing'};
          const receiptPath = 'data/identity-affiliation-overlay-proof-run.json';
          const existing = fs.existsSync(receiptPath) ? JSON.parse(fs.readFileSync(receiptPath, 'utf8')) : {};
          const receipt = {
            ...existing,
            ok: proof.ok === true,
            status: proof.ok === true ? 'success' : 'failure',
            completedAt: new Date().toISOString(),
            liveSha: proof.liveSha || null,
            proofFile: proofPath,
            failedChecks: Object.entries(proof.checks || {}).filter(([, ok]) => !ok).map(([name]) => name),
            error: proof.error || null
          };
          fs.writeFileSync(receiptPath, `${JSON.stringify(receipt, null, 2)}\n`);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/identity-affiliation-overlay-proof-run.json
          if [ -f data/identity-affiliation-overlay-live-proof.json ]; then
            git add data/identity-affiliation-overlay-live-proof.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record focused identity overlay live proof'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Upload focused live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-overlay-focused-live-proof-${{ github.run_id }}
          path: |
            downloads/identity-affiliation-overlay-live-proof.json
            data/identity-affiliation-overlay-proof-run.json
          if-no-files-found: error
          retention-days: 60

      - name: Enforce successful proof
        if: always()
        shell: bash
        run: |
          test '${{ steps.proof.outputs.proof_ok }}' = 'true'
