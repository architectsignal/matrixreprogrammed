# Manual read-only credential verification requested 2026-08-06 before the final production release.
name: Cloudflare Production Credential Preflight

on:
  pull_request:
    paths:
      - '.github/workflows/cloudflare-production-credential-preflight.yml'
      - 'scripts/cloudflare-production-credential-preflight.mjs'
      - 'scripts/cloudflare-production-credential-preflight-contract-test.js'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloudflare-production-credential-preflight.yml'
      - 'scripts/cloudflare-production-credential-preflight.mjs'
      - 'scripts/cloudflare-production-credential-preflight-contract-test.js'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  contract:
    name: Prove the preflight is read-only and fail-fast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout proposed preflight
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify production credential preflight contract
        run: node scripts/cloudflare-production-credential-preflight-contract-test.js

      - name: Upload preflight contract proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-credential-preflight-contract-${{ github.run_id }}
          path: downloads/cloudflare-production-credential-preflight-contract-test.json
          if-no-files-found: error
          retention-days: 30

  preflight:
    name: Verify production Cloudflare and D1 access without mutation
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run read-only Cloudflare production credential preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN || secrets.ADMIN_API_TOKEN }}
        run: node scripts/cloudflare-production-credential-preflight.mjs

      - name: Upload sanitized production preflight proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-production-credential-preflight-${{ github.run_id }}
          path: downloads/cloudflare-production-credential-preflight.json
          if-no-files-found: error
          retention-days: 60

      - name: Publish sanitized preflight status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const title = 'Cloudflare Production Credential Preflight';
            const reportPath = path.join(process.cwd(), 'downloads', 'cloudflare-production-credential-preflight.json');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let report = null;
            try { report = JSON.parse(fs.readFileSync(reportPath, 'utf8')); } catch {}
            const ok = report?.ok === true;
            const status = ok ? 'PASS' : 'FAIL';
            const checks = Array.isArray(report?.checks) ? report.checks : [];
            const failures = Array.isArray(report?.failures) ? report.failures : ['Sanitized preflight report was not produced.'];
            const checkLines = checks.length
              ? checks.map(check => `- ${check.ok ? 'PASS' : 'FAIL'} — ${check.label}: ${check.diagnostic || 'no diagnostic'}`).join('\n')
              : '- No Cloudflare read check completed.';
            const failureLines = failures.length ? failures.map(failure => `- ${failure}`).join('\n') : '- None';
            const body = `# Cloudflare Production Credential Preflight\n\nStatus: **${status}**\n\nChecked: ${report?.checkedAt || new Date().toISOString()}\n\nWorkflow run: ${runUrl}\n\nDatabase: \`${report?.database || 'matrix-members'}\`\n\n## Read-only checks\n\n${checkLines}\n\n## Failures\n\n${failureLines}\n\n## Next action\n\n${report?.nextAction || 'Inspect the workflow artifact. No deployment or D1 mutation was attempted.'}\n\n## Safety boundary\n\n${report?.boundary || 'The preflight does not deploy, execute SQL, mutate D1, write secrets, change routes or modify application data.'}`;
            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title \"${title}\"`
            });
            const existing = search.data.items.find(item => item.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
                state: 'open'
              });
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Preflight **${status}**. Run: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
