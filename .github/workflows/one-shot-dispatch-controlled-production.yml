name: One-shot controlled production dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/one-shot-controlled-production.trigger
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-controlled-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing controlled production workflow once
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseBase = 'c738ef55057d9928329c9927a040e2f6c6bf207d';

            const response = await github.rest.actions.listRepoWorkflows({
              owner,
              repo,
              per_page: 100
            });
            const target = response.data.workflows.find(
              workflow => workflow.name === 'Matrix Reprogrammed Controlled Production Deploy'
            );
            if (!target) {
              core.setFailed('Controlled production workflow was not found.');
              return;
            }

            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: target.id,
              branch: 'main',
              per_page: 20
            });

            for (const run of runs.data.workflow_runs) {
              if (!['queued', 'in_progress', 'completed', 'waiting', 'pending'].includes(run.status)) continue;
              try {
                const comparison = await github.rest.repos.compareCommits({
                  owner,
                  repo,
                  base: releaseBase,
                  head: run.head_sha
                });
                if (comparison.data.status === 'identical' || comparison.data.status === 'ahead') {
                  core.info(`A controlled production run already covers this release: ${run.html_url}`);
                  return;
                }
              } catch (error) {
                core.warning(`Could not compare release base with run ${run.id}: ${error.message}`);
              }
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: target.id,
              ref: 'main',
              inputs: {
                confirmation: 'DEPLOY MATRIX REPROGRAMMED'
              }
            });
            core.info(`Dispatched controlled production workflow ${target.id} on main.`);
