name: Daily Sitewide Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Refresh seven-day and live intel
        run: |
          npm run update-seven-day-intel || echo "update-seven-day-intel recorded a soft failure"
          npm run update-live-intel || echo "update-live-intel recorded a soft failure"

      - name: Build site brain and shared systems
        run: |
          node scripts/daily-sitewide-build-safe.js || echo "daily-sitewide-build-safe recorded a soft failure; continuing with latest available artifacts"

      - name: Pressure test refreshed systems
        run: |
          npm run pressure-test:global-risk-clocks || echo "global risk clocks pressure test recorded a soft failure"
          npm run pressure-test:live-intel || echo "live intel pressure test recorded a soft failure"
          npm run pressure-test || echo "general pressure test recorded a soft failure"

      - name: Commit refreshed generated files
        run: |
          git config user.name "matrix-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Daily sitewide intelligence refresh"
            git push
          fi
