name: Dispatch Identity Overlay Production Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/identity-overlay-production-dispatch.yml'
      - 'data/identity-affiliation-overlay-release.json'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: identity-overlay-production-dispatch
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  dispatch-controlled-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          test -s data/identity-affiliation-overlay-release.json
          node - <<'NODE'
          const fs = require('fs');
          const release = JSON.parse(fs.readFileSync('data/identity-affiliation-overlay-release.json', 'utf8'));
          if (release.release !== 'identity-affiliation-ownership-overlay') throw new Error('Unexpected release name');
          if (release.target !== 'production') throw new Error('Release target is not production');
          console.log(`Validated ${release.release} ${release.engineVersion} for ${release.target}.`);
          NODE

      - name: Dispatch controlled production workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          response_code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/dispatches" \
            -d '{"ref":"main","inputs":{"confirmation":"DEPLOY MATRIX REPROGRAMMED"}}')"
          if [ "$response_code" != '204' ]; then
            cat /tmp/dispatch-response.txt
            echo "Workflow dispatch failed with HTTP $response_code"
            exit 1
          fi
          echo 'Controlled production workflow accepted the dispatch.'

      - name: Resolve production workflow run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const repository = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const started = Date.parse(process.env.DISPATCH_STARTED_AT) - 15000;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'X-GitHub-Api-Version': '2022-11-28'
          };
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            let selected = null;
            for (let attempt = 1; attempt <= 18; attempt += 1) {
              const url = `https://api.github.com/repos/${repository}/actions/workflows/deploy.yml/runs?event=workflow_dispatch&branch=main&per_page=20`;
              const response = await fetch(url, {headers});
              if (!response.ok) throw new Error(`Run lookup failed: ${response.status}`);
              const payload = await response.json();
              selected = (payload.workflow_runs || [])
                .filter(run => Date.parse(run.created_at) >= started)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0] || null;
              if (selected) break;
              await sleep(5000);
            }
            if (!selected) throw new Error('Dispatched production workflow run was not found');
            const receipt = {
              ok: true,
              release: 'identity-affiliation-ownership-overlay',
              dispatcherRunId: Number(process.env.GITHUB_RUN_ID),
              productionRunId: selected.id,
              productionRunNumber: selected.run_number,
              status: selected.status,
              conclusion: selected.conclusion,
              event: selected.event,
              headBranch: selected.head_branch,
              headSha: selected.head_sha,
              createdAt: selected.created_at,
              updatedAt: selected.updated_at,
              url: selected.html_url,
              recordedAt: new Date().toISOString()
            };
            fs.writeFileSync('data/identity-affiliation-overlay-dispatch.json', JSON.stringify(receipt, null, 2) + '\n');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `production_run_id=${selected.id}\nproduction_run_url=${selected.html_url}\n`);
            console.log(JSON.stringify(receipt, null, 2));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Record production dispatch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/identity-affiliation-overlay-dispatch.json
          if git diff --cached --quiet; then
            echo 'Dispatch receipt already current.'
            exit 0
          fi
          git commit -m 'Record identity overlay production dispatch'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Report production run
        run: |
          echo "Production run: ${{ steps.resolve.outputs.production_run_id }}"
          echo "URL: ${{ steps.resolve.outputs.production_run_url }}"
