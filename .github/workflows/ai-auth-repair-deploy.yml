name: AI AUTH REPAIR DEPLOY — normalize, deploy, bind and prove live control plane
run-name: AI AUTH REPAIR — deploy latest Worker, bind normalized secrets, prove live health

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-auth-repair-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-ai-auth-repair-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  AI_AUTH_REPAIR_TRIGGER: '2026-08-01T17:44:00+01:00'

jobs:
  repair-deploy-verify:
    name: Normalize authentication, deploy Worker and verify autonomous AI
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Validate protected credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          NORMALIZED_TOKEN="$(printf '%s' "$AI_MANAGEMENT_ADMIN_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          test -n "$NORMALIZED_TOKEN"
          test "$(printf '%s' "$NORMALIZED_TOKEN" | wc -c)" -ge 32
          npx --yes wrangler@latest whoami

      - name: Install locked dependencies
        run: npm ci

      - name: Build exact deployable site and Worker
        env:
          SOURCE_DOCUMENTS_PER_RUN: '0'
        run: npm run build

      - name: Verify repaired authentication and AI contracts
        run: |
          node --check src/worker-production-autonomy.js
          node --check src/worker-ai-management.js
          node --check scripts/verify-live-ai-management.mjs
          node scripts/ai-management-foundation-test.mjs
          node scripts/ai-management-autonomy-test.mjs
          node scripts/cloudflare-worker-routes-test.js

      - name: Build reviewed autonomous production configuration
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.toml .wrangler-ai-auth-repair.toml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.wrangler-ai-auth-repair.toml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'AI_RESOURCE_BROKER_ENABLED = "false"': 'AI_RESOURCE_BROKER_ENABLED = "true"',
              'AI_RESOURCE_EXTERNAL_ENABLED = "false"': 'AI_RESOURCE_EXTERNAL_ENABLED = "true"',
              'AI_RESOURCE_LOCAL_ONLY = "true"': 'AI_RESOURCE_LOCAL_ONLY = "false"',
              'AI_RESOURCE_BACKGROUND_ENABLED = "false"': 'AI_RESOURCE_BACKGROUND_ENABLED = "true"',
              'AI_RESOURCE_SCOUT_ENABLED = "false"': 'AI_RESOURCE_SCOUT_ENABLED = "true"',
              'AI_RESOURCE_AUTO_APPROVAL_ENABLED = "false"': 'AI_RESOURCE_AUTO_APPROVAL_ENABLED = "true"',
              'AI_LOCAL_MODEL_ROUTING_ENABLED = "false"': 'AI_LOCAL_MODEL_ROUTING_ENABLED = "true"',
              'AI_SITE_DIRECTOR_ENABLED = "false"': 'AI_SITE_DIRECTOR_ENABLED = "true"',
              'AI_OPPORTUNITY_HUNTER_ENABLED = "false"': 'AI_OPPORTUNITY_HUNTER_ENABLED = "true"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one activation target for {old}')
              text = text.replace(old, new)
          if text.count('AI_RESOURCE_ZERO_SPEND_LOCK = "true"') != 1:
              raise SystemExit('Zero-spend lock missing or ambiguous')
          if '\nworkers_dev = ' not in text:
              text = text.replace('keep_vars = true\n', 'keep_vars = true\nworkers_dev = true\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          npx --yes wrangler@latest deploy --config .wrangler-ai-auth-repair.toml --dry-run

      - name: Deploy repaired autonomous Worker and capture direct endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config .wrangler-ai-auth-repair.toml 2>&1 | tee /tmp/wrangler-ai-deploy.log
          DIRECT_WORKER_URL="$(sed -r 's/\x1B\[[0-9;]*[mK]//g' /tmp/wrangler-ai-deploy.log | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -n 1 | sed 's/[),.;]*$//')"
          if [ -z "$DIRECT_WORKER_URL" ]; then
            echo 'Wrangler did not expose a direct workers.dev URL; refusing an unverifiable deployment.' >&2
            cat /tmp/wrangler-ai-deploy.log >&2
            exit 1
          fi
          echo "AI_DIRECT_WORKER_URL=$DIRECT_WORKER_URL" >> "$GITHUB_ENV"
          echo "Direct Worker verification endpoint captured."

      - name: Bind normalized canonical Worker admin secrets after deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NORMALIZED_TOKEN="$(printf '%s' "$AI_MANAGEMENT_ADMIN_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          test -n "$NORMALIZED_TOKEN"
          printf '%s' "$NORMALIZED_TOKEN" | npx --yes wrangler@latest secret put ADMIN_API_TOKEN --config .wrangler-ai-auth-repair.toml
          printf '%s' "$NORMALIZED_TOKEN" | npx --yes wrangler@latest secret put AI_MANAGEMENT_ADMIN_TOKEN --config .wrangler-ai-auth-repair.toml

      - name: Verify live autonomous AI control plane directly
        env:
          SITE_URL: ${{ env.AI_DIRECT_WORKER_URL }}
          ADMIN_API_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          AI_VERIFY_ATTEMPTS: '36'
          AI_VERIFY_DELAY_MS: '5000'
        run: node scripts/verify-live-ai-management.mjs

      - name: Upload authentication proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-auth-repair-proof-${{ github.run_id }}
          path: downloads/live-ai-management-verification.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove temporary configuration
        if: always()
        run: rm -f .wrangler-ai-auth-repair.toml
