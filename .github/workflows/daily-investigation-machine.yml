name: Daily Investigation Machine

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily-investigation-machine.yml'
      - 'scripts/run-investigation-machine.js'
      - 'scripts/publish-investigation-matrix-events.mjs'
      - 'scripts/publish-investigation-matrix-events.test.mjs'
      - 'scripts/monitor-source-changes.js'
      - 'scripts/harden-source-change-preservation.js'
      - 'scripts/source-change-preservation-test.js'
      - 'scripts/source-change-preservation-hardening-test.js'
      - 'scripts/build-cloudflare-output.js'
      - 'scripts/extend-search-with-investigations.js'
      - 'scripts/repair-investigation-source-registry.js'
      - 'scripts/repair-investigation-data-integrity.js'
      - 'scripts/patch-conclusion-integrity-cards.js'
      - 'scripts/enforce-mission-data-contracts.js'
      - 'scripts/build-daily-watch.js'
      - 'scripts/stabilize-daily-watch-and-build-dossiers.js'
      - 'scripts/build-daily-watch-history.js'
      - 'scripts/inject-daily-watch-surfaces.js'
      - 'scripts/mission-orchestration-audit.js'
      - 'scripts/record-live-intel-check.js'
      - 'scripts/production-freshness-guard.js'
      - 'data/mission-orchestration-standard.json'
      - 'data/production-freshness-policy.json'
      - 'data/investigation-source-registry.json'
      - 'evidence-archive/**'
  schedule:
    - cron: '20 5 * * *'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: daily-investigation-machine
  cancel-in-progress: true

jobs:
  investigate:
    name: Search records, preserve changes and publish evidence-bounded conclusions
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair moved official source routes
        run: node scripts/repair-investigation-source-registry.js

      - name: Run daily investigation source search
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          INVESTIGATION_MODE: daily
          INVESTIGATION_CONCURRENCY: '4'
          INVESTIGATION_TIMEOUT_MS: '25000'
        run: node scripts/run-investigation-machine.js daily

      - name: Preserve registered sources and detect changes
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          INVESTIGATION_MODE: daily
          SOURCE_MONITOR_CONCURRENCY: '4'
          SOURCE_MONITOR_TIMEOUT_MS: '25000'
        run: node scripts/monitor-source-changes.js daily

      - name: Harden preservation and download linked evidence
        env:
          INVESTIGATION_MODE: daily
          SOURCE_DOCUMENTS_PER_RUN: '4'
          SOURCE_DOCUMENT_MAX_BYTES: '12582912'
          SOURCE_DOCUMENT_TIMEOUT_MS: '35000'
        run: node scripts/harden-source-change-preservation.js daily

      - name: Refresh Live Intel and the stable cinematic hit list
        run: |
          node scripts/update-live-intel.js
          node scripts/record-live-intel-check.js
          node scripts/update-seven-day-intel.js
          node scripts/build-outcome-briefings.js
          node scripts/build-daily-brain-brief.js
          node scripts/build-investigation-pages.js
          node scripts/build-mission-intelligence-10.js
          node scripts/build-live-intel-machine.js
          node scripts/patch-conclusion-integrity-cards.js
          node scripts/enforce-mission-data-contracts.js
          node scripts/build-daily-watch.js
          node scripts/inject-daily-watch-surfaces.js
          node scripts/mission-orchestration-audit.js
          node scripts/production-freshness-guard.js

      - name: Rebuild and verify search and preservation
        run: |
          node scripts/repair-search-system.js
          node scripts/extend-search-with-investigations.js
          node scripts/search-investigation-smoke-test.js
          node scripts/source-change-preservation-test.js
          node scripts/source-change-preservation-hardening-test.js
          node scripts/final-investigation-hardening.js

      - name: Publish source changes into the Living Matrix
        env:
          SITE_URL: https://matrixreprogrammed.com
          SITE_FALLBACK_URL: https://matrixreprogrammed.njmgroupfrance.workers.dev
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: node scripts/publish-investigation-matrix-events.mjs

      - name: Advisory site audit
        continue-on-error: true
        run: node scripts/audit-site.js

      - name: Commit daily investigation outputs
        run: |
          if node scripts/release-freeze-guard.js --is-frozen; then
            echo "Controlled production release freeze active; daily investigation validated but will not move main."
            exit 0
          fi
          git config user.name "matrix-investigation-bot"
          git config user.email "actions@github.com"
          git add \
            data/mission-orchestration-standard.json \
            data/mission-data-contract-report.json \
            data/daily-watch.json \
            data/daily-watch-dossiers.json \
            data/daily-watch-incumbents.json \
            data/daily-watch-history.json \
            data/weekly-watch-delta.json \
            data/clock-wall.json \
            data/investigation-source-registry.json \
            data/investigation-source-state.json \
            data/investigation-ledger.json \
            data/investigation-ledger-archive.json \
            data/daily-investigation-conclusions.json \
            data/weekly-investigation-conclusions.json \
            data/investigation-status.json \
            data/investigation-source-pulls/daily-latest.json \
            data/source-snapshot-index.json \
            data/source-change-ledger.json \
            data/source-change-public.json \
            data/source-snapshots \
            data/live-intel.json \
            data/homepage-command-surface.json \
            data/daily-command-brief.json \
            data/daily-power-conclusions.json \
            data/evidence-weighted-relationship-graph.json \
            data/outcome-briefings.json \
            data/daily-brain-brief.json \
            evidence-archive \
            index.html \
            investigation-machine.html \
            daily-watch.html \
            weekly-watch-delta.html \
            daily-command-brief.html \
            daily-investigation-conclusions.html \
            weekly-investigation-report.html \
            investigation-source-ledger.html \
            source-changes.html \
            daily-power-conclusions.html \
            live-intel.html \
            daily-brain-brief.html \
            outcome-briefings.html \
            investigation-pulse.js \
            search.html \
            search.js \
            search-index.json \
            fixes.css \
            downloads/daily-watch.md \
            downloads/weekly-watch-delta.md \
            downloads/daily-watch-publication-report.json \
            downloads/daily-watch-ranking-decision.json \
            downloads/daily-watch-history-report.json \
            downloads/investigation-data-integrity-repair.json \
            downloads/mission-data-contract-report.json \
            downloads/mission-orchestration-audit.json \
            downloads/mission-orchestration-audit.md \
            downloads/daily-investigation-conclusions.md \
            downloads/weekly-investigation-report.md \
            downloads/investigation-source-ledger.md \
            downloads/investigation-machine-run-report.json \
            downloads/source-change-monitor-report.json \
            downloads/source-change-preservation-hardening-report.json \
            downloads/source-change-preservation-test.json \
            downloads/source-change-preservation-hardening-test.json \
            downloads/search-investigation-smoke-test.json \
            downloads/final-investigation-hardening.json \
            downloads/search-system-repair-report.json \
            downloads/conclusion-integrity-report.json \
            downloads/production-freshness-guard.json \
            || true
          if git diff --cached --quiet; then
            echo "No meaningful daily investigation changes to commit."
            exit 0
          fi
          git commit -m "Daily investigation and stable hit list $(date -u +%F) [deploy]"
          git push || (git pull --rebase --autostash origin main && git push)

      - name: Upload investigation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-investigation-${{ github.run_id }}
          path: |
            downloads/investigation-machine-run-report.json
            downloads/investigation-data-integrity-repair.json
            downloads/source-change-monitor-report.json
            downloads/source-change-preservation-hardening-report.json
            downloads/source-change-preservation-test.json
            downloads/source-change-preservation-hardening-test.json
            downloads/search-investigation-smoke-test.json
            downloads/daily-investigation-conclusions.md
            downloads/investigation-source-ledger.md
            downloads/conclusion-integrity-report.json
            downloads/production-freshness-guard.json
            downloads/daily-watch.md
            downloads/weekly-watch-delta.md
            downloads/daily-watch-publication-report.json
            downloads/daily-watch-ranking-decision.json
            downloads/daily-watch-history-report.json
            downloads/mission-data-contract-report.json
            downloads/mission-orchestration-audit.json
            downloads/mission-orchestration-audit.md
            data/investigation-source-pulls/daily-latest.json
            data/investigation-source-state.json
            data/investigation-ledger.json
            data/investigation-ledger-archive.json
            data/daily-watch.json
            data/daily-watch-dossiers.json
            data/daily-watch-incumbents.json
            data/daily-watch-history.json
            data/weekly-watch-delta.json
          if-no-files-found: ignore
          retention-days: 30
