      <stop offset="0.5" stop-color="#fff8dc"/>
      <stop offset="0.78" stop-color="#cdbb88"/>
      <stop offset="1" stop-color="#f5e9c8"/>
    </linearGradient>
    <radialGradient id="forehead" cx="50%" cy="24%" r="62%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset=".42" stop-color="#f6e9c4" stop-opacity=".18"/>
      <stop offset="1" stop-color="#6b5632" stop-opacity=".28"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
