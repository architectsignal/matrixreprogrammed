name: Investigation Deploy Handoff

on:
  workflow_run:
    workflows:
      - Daily Investigation Machine
      - Weekly Investigation Machine
    types: [completed]

permissions:
  contents: read

concurrency:
  group: investigation-deploy-handoff
  cancel-in-progress: false

jobs:
  validate-release-handoff:
    name: Record an owner-controlled release handoff after a healthy update
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Record handoff proof
        run: |
          mkdir -p downloads
          cat > downloads/investigation-deploy-handoff.json <<JSON
          {
            "ok": true,
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "upstreamWorkflow": "${{ github.event.workflow_run.name }}",
            "upstreamRunId": "${{ github.event.workflow_run.id }}",
            "upstreamConclusion": "${{ github.event.workflow_run.conclusion }}",
            "upstreamHeadSha": "${{ github.event.workflow_run.head_sha }}",
            "deploymentWorkflow": ".github/workflows/deploy.yml",
            "deploymentRef": "main",
            "status": "validated-owner-dispatch-required",
            "boundary": "This read-only handoff never dispatches production or writes to main. A repository owner must dispatch the guarded production workflow on the reviewed main SHA; daily-slot, billing, synchronization, D1, deployment and live-SHA guards remain authoritative."
          }
          JSON

      - name: Upload handoff proof
        uses: actions/upload-artifact@v4
        with:
          name: investigation-deploy-handoff-${{ github.run_id }}
          path: downloads/investigation-deploy-handoff.json
          retention-days: 30
