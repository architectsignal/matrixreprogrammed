name: Record Predators Hit List Repair Dispatcher Run

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/record-live-exposure-verification-run.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  record-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve Predators Hit List repair dispatcher
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const expectedHeadSha = '4aa3645b73177ac90ee90210c939da6c0d214ddd';
            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const target = workflows.data.workflows.find(workflow => workflow.path === '.github/workflows/dispatch-predators-hit-list-repair.yml');
            if (!target) {
              core.setFailed('Predators Hit List repair dispatcher workflow was not found.');
              return;
            }
            let resolved = null;
            for (let attempt = 1; attempt <= 30; attempt += 1) {
              const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: target.id, branch: 'main', per_page: 30 });
              resolved = (runs.data.workflow_runs || []).find(run => run.head_sha === expectedHeadSha) || null;
              if (resolved && resolved.status === 'completed') break;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            if (!resolved) {
              core.setFailed('Predators Hit List repair dispatcher run could not be resolved.');
              return;
            }
            const payload = {
              ok: resolved.status === 'completed' && resolved.conclusion === 'success',
              workflowId: target.id,
              workflowName: target.name,
              runId: resolved.id,
              runNumber: resolved.run_number,
              status: resolved.status,
              conclusion: resolved.conclusion,
              event: resolved.event,
              headSha: resolved.head_sha,
              createdAt: resolved.created_at,
              updatedAt: resolved.updated_at,
              url: resolved.html_url,
              recordedAt: new Date().toISOString()
            };
            fs.mkdirSync('data', { recursive: true });
            fs.writeFileSync('data/predators-hit-list-dispatcher-run.json', JSON.stringify(payload, null, 2) + '\n');
            core.info(`Predators Hit List dispatcher ${resolved.id}: ${resolved.status}/${resolved.conclusion || 'pending'}`);

      - name: Commit dispatcher receipt
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/predators-hit-list-dispatcher-run.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record Predators Hit List repair dispatcher run'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
