name: Homepage intro production hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/one-shot-controlled-production.trigger

permissions:
  contents: write

concurrency:
  group: homepage-intro-production-hotfix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate Worker-bundled intro payload
        run: |
          set -euo pipefail
          mkdir -p _site/assets data
          cp assets/matrix-intro-video-1.txt _site/assets/matrix-intro-video-1.txt
          cp assets/matrix-intro-video-2.txt _site/assets/matrix-intro-video-2.txt
          test "$(wc -c < assets/matrix-intro-video-1.txt)" -gt 1000
          test "$(wc -c < assets/matrix-intro-video-2.txt)" -gt 1000
          node - <<'NODE'
          const fs = require('fs');
          const version = '20260725-video-v6';
          const parts = [1, 2].map(part => fs
            .readFileSync(`assets/matrix-intro-video-${part}.txt`, 'utf8')
            .replace(/\s+/g, ''));
          if (parts.some(part => part.length < 1000 || !/^[A-Za-z0-9+/=]+$/.test(part))) {
            throw new Error('One or more intro video parts are not valid base64');
          }
          const base64 = parts.join('');
          const mp4 = Buffer.from(base64, 'base64');
          if (mp4.length < 10000) throw new Error(`Intro MP4 is too small: ${mp4.length}`);
          if (mp4.slice(4, 8).toString('ascii') !== 'ftyp') throw new Error('Intro payload is not an MP4');
          const moduleText = [
            `// Generated by homepage intro deployment · ${version}`,
            `export const INTRO_VIDEO_PARTS = Object.freeze(${JSON.stringify(parts)});`,
            `export const INTRO_VIDEO_META = Object.freeze(${JSON.stringify({ generated: true, version, decodedBytes: mp4.length, sourceParts: parts.length })});`,
            ''
          ].join('\n');
          fs.writeFileSync('src/intro-video-data.generated.js', moduleText);
          fs.writeFileSync('data/homepage-intro-packaged-bytes.txt', String(mp4.length));
          console.log(`Worker-bundled validated intro MP4: ${mp4.length} bytes`);
          NODE
          node --check src/intro-video-data.generated.js
          node --check src/worker-production-intro-hotfix.js
          node --check src/worker-production-intro-hotfix-cdn.js
          grep -q '"generated":true' src/intro-video-data.generated.js
          grep -q 'worker-bundled-payload' src/worker-production-intro-hotfix-cdn.js

      - name: Deploy Worker-bundled homepage intro
        id: deploy_intro
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.intro-hotfix.toml

      - name: Verify live forced replay and bundled MP4 payload
        id: verify_intro
        if: steps.deploy_intro.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            nonce="$(date +%s)-$attempt"
            home="$(curl -fsSL -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/?intro=1&hotfix=$nonce" || true)"
            runtime="$(curl -fsSL -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/homepage-intro-hotfix-v6.js?v=20260725-video-v6&hotfix=$nonce" || true)"
            rm -f /tmp/matrix-intro-part-1.txt /tmp/matrix-intro-part-2.txt /tmp/matrix-intro-part-1.headers /tmp/matrix-intro-part-2.headers
            curl -fsSL -D /tmp/matrix-intro-part-1.headers -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/_matrix-intro-part/1?v=20260725-video-v6&hotfix=$nonce" -o /tmp/matrix-intro-part-1.txt || true
            curl -fsSL -D /tmp/matrix-intro-part-2.headers -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/_matrix-intro-part/2?v=20260725-video-v6&hotfix=$nonce" -o /tmp/matrix-intro-part-2.txt || true
            if printf '%s' "$home" | grep -q 'data-homepage-intro-v6' \
              && printf '%s' "$home" | grep -q 'homepage-intro-hotfix-v6.js' \
              && printf '%s' "$runtime" | grep -q '/_matrix-intro-part/1' \
              && grep -qi '^x-matrix-intro-source: worker-bundled-payload' /tmp/matrix-intro-part-1.headers \
              && grep -qi '^x-matrix-intro-source: worker-bundled-payload' /tmp/matrix-intro-part-2.headers \
              && test -s /tmp/matrix-intro-part-1.txt \
              && test -s /tmp/matrix-intro-part-2.txt; then
              node - <<'NODE'
              const fs = require('fs');
              const parts = [1, 2].map(part => fs
                .readFileSync(`/tmp/matrix-intro-part-${part}.txt`, 'utf8')
                .replace(/\s+/g, ''));
              if (parts.some(part => !/^[A-Za-z0-9+/=]+$/.test(part))) process.exit(1);
              const mp4 = Buffer.from(parts.join(''), 'base64');
              if (mp4.length < 10000 || mp4.slice(4, 8).toString('ascii') !== 'ftyp') process.exit(1);
              fs.writeFileSync('data/homepage-intro-live-bytes.txt', String(mp4.length));
              console.log(`VERIFIED: live Worker-bundled intro decodes to MP4 (${mp4.length} bytes).`);
              NODE
              exit 0
            fi
            sleep 5
          done
          echo 'Homepage intro verification failed.' >&2
          exit 1

      - name: Record exact hotfix result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy_intro.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_intro.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const deployOutcome = process.env.DEPLOY_OUTCOME || 'unknown';
          const verifyOutcome = process.env.VERIFY_OUTCOME || 'unknown';
          const packagedBytes = Number(fs.readFileSync('data/homepage-intro-packaged-bytes.txt', 'utf8')) || 0;
          const liveBytes = fs.existsSync('data/homepage-intro-live-bytes.txt')
            ? Number(fs.readFileSync('data/homepage-intro-live-bytes.txt', 'utf8')) || 0
            : 0;
          const result = {
            ok: deployOutcome === 'success' && verifyOutcome === 'success' && liveBytes === packagedBytes && liveBytes > 10000,
            version: '20260725-video-v6',
            recordedAt: new Date().toISOString(),
            runId: Number(process.env.RUN_ID || 0),
            runAttempt: Number(process.env.RUN_ATTEMPT || 0),
            headSha: process.env.HEAD_SHA || '',
            deployOutcome,
            verifyOutcome,
            packagedBytes,
            liveBytes,
            payloadMatches: liveBytes > 0 && liveBytes === packagedBytes,
            source: 'Cloudflare Worker-bundled video payload',
            forcedReplayUrl: 'https://matrixreprogrammed.com/?intro=1'
          };
          fs.mkdirSync('data', { recursive: true });
          fs.writeFileSync('data/homepage-intro-hotfix-result.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result));
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/homepage-intro-hotfix-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record Worker-bundled homepage intro result'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail when deployment or verification failed
        if: steps.deploy_intro.outcome != 'success' || steps.verify_intro.outcome != 'success'
        run: exit 1
