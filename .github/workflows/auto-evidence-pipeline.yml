name: Auto Evidence Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '33 3 * * *'

permissions:
  contents: write

concurrency:
  group: auto-evidence-pipeline
  cancel-in-progress: false

jobs:
  scan:
    name: Scan official evidence indexes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run auto evidence scanner
        run: node scripts/auto-evidence-pipeline.js

      - name: Build and audit site
        run: npm run build

      - name: Commit scan changes
        run: |
          if git diff --quiet; then
            echo "No evidence pipeline changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auto-evidence-pipeline-report.json data/auto-evidence-latest.json downloads/auto-evidence-pipeline-report.md _site downloads deploy-status.json search-index.json site-quality-report.html site-freshness-report.html || true
          git add .
          git commit -m "Auto evidence pipeline update"
          git push
