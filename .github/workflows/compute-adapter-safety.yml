name: Compute Adapter Safety

on:
  pull_request:
    paths:
      - 'ai-management/provider-adapters/compute/**'
      - 'ai-management/node/remote-compute-broker.mjs'
      - 'ai-management/compute-resource-scout/**'
      - 'ai-management/config/compute-providers.json'
      - 'scripts/compute-adapter-test.mjs'
      - '.github/workflows/compute-adapter-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compute-adapter-safety:
    name: Public-only zero-spend compute adapters
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify adapter syntax
        run: |
          node --check ai-management/provider-adapters/compute/compute-adapter-guard.mjs
          node --check ai-management/provider-adapters/compute/kaggle-kernel-cli.mjs
          node --check ai-management/provider-adapters/compute/huggingface-gradio-zerogpu.mjs
          node --check ai-management/provider-adapters/compute/owner-http-compute.mjs
          node --check ai-management/provider-adapters/compute/remote-compute-session.mjs
          node --check ai-management/node/remote-compute-broker.mjs
          node --check scripts/compute-adapter-test.mjs

      - name: Run deterministic adapter tests
        run: node scripts/compute-adapter-test.mjs

      - name: Prove protected boundaries remain structural
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Remote compute accepts public workloads only" ai-management/provider-adapters/compute/compute-adapter-guard.mjs
          grep -F "prompt-transfer-boundary-missing" ai-management/provider-adapters/compute/compute-adapter-guard.mjs
          grep -F "billing-hard-stop-unverified" ai-management/provider-adapters/compute/compute-adapter-guard.mjs
          grep -F "quota-hard-stop-reached" ai-management/provider-adapters/compute/compute-adapter-guard.mjs
          grep -F "Kaggle workspace is missing kernel-metadata.json" ai-management/provider-adapters/compute/kaggle-kernel-cli.mjs
          grep -F "Gradio API name is not allowlisted" ai-management/provider-adapters/compute/huggingface-gradio-zerogpu.mjs
          grep -F "Owner compute task type is not allowlisted" ai-management/provider-adapters/compute/owner-http-compute.mjs
          ! grep -R -E "multiple accounts|rotate identities|bypass quota|simulate activity" ai-management/provider-adapters/compute scripts/compute-adapter-test.mjs
