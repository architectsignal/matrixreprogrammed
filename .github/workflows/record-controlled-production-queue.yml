name: Record Controlled Production Queue

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/record-controlled-production-queue.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  record-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Record latest controlled production runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const target = workflows.data.workflows.find(workflow => workflow.path === '.github/workflows/deploy.yml' || workflow.name === 'Matrix Reprogrammed Controlled Production Deploy');
            if (!target) {
              core.setFailed('Controlled production workflow was not found.');
              return;
            }
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: target.id,
              event: 'workflow_dispatch',
              branch: 'main',
              per_page: 15
            });
            const runs = (response.data.workflow_runs || []).map(run => ({
              id: run.id,
              runNumber: run.run_number,
              status: run.status,
              conclusion: run.conclusion,
              headSha: run.head_sha,
              createdAt: run.created_at,
              updatedAt: run.updated_at,
              url: run.html_url
            }));
            const payload = {
              ok: true,
              workflowId: target.id,
              workflowName: target.name,
              observedAt: new Date().toISOString(),
              targetRunId: 30372275747,
              runs
            };
            const path = 'data/controlled-production-queue.json';
            const content = Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              message: 'Record controlled production queue',
              content,
              branch: 'main',
              ...(sha ? { sha } : {})
            });
            core.info(JSON.stringify(payload));
