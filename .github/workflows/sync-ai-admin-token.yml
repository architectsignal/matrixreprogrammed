name: Synchronize AI Management Admin Token
run-name: "AI AUTH REPAIR — deploy, bind secrets, prove live health"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type SYNC AI ADMIN TOKEN'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: matrix-ai-admin-token-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy-bind-and-verify:
    name: Deploy repaired AI authentication, bind secrets and verify live control plane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Confirm authorization and credentials
        env:
          CONFIRMATION: ${{ inputs.confirmation || 'SYNC AI ADMIN TOKEN' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = 'SYNC AI ADMIN TOKEN'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$AI_MANAGEMENT_ADMIN_TOKEN"

      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Enforce Cloudflare zero-overage budget
        env:
          CLOUDFLARE_GIT_BUILDS_DISCONNECTED: ${{ vars.CLOUDFLARE_GIT_BUILDS_DISCONNECTED }}
          CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED }}
          CLOUDFLARE_BUILD_MINUTES_USED: ${{ vars.CLOUDFLARE_BUILD_MINUTES_USED }}
          CLOUDFLARE_USAGE_CHECKED_AT_UTC: ${{ vars.CLOUDFLARE_USAGE_CHECKED_AT_UTC }}
          EXPECTED_CLOUDFLARE_BUILD_MINUTES: '0'
        run: node scripts/cloudflare-usage-budget-guard.js release

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify repaired Worker syntax
        run: |
          node --check src/worker-production-autonomy.js
          node --check src/worker-ai-management.js
          node --check scripts/verify-live-ai-management.mjs
          node scripts/live-ai-verification-classifier.test.mjs

      - name: Build activated production configuration
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.toml .wrangler-ai-auth-repair.toml
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.wrangler-ai-auth-repair.toml')
          text = p.read_text(encoding='utf-8')
          replacements = {
            'AI_RESOURCE_BROKER_ENABLED = "false"': 'AI_RESOURCE_BROKER_ENABLED = "true"',
            'AI_RESOURCE_EXTERNAL_ENABLED = "false"': 'AI_RESOURCE_EXTERNAL_ENABLED = "true"',
            'AI_RESOURCE_LOCAL_ONLY = "true"': 'AI_RESOURCE_LOCAL_ONLY = "false"',
            'AI_RESOURCE_BACKGROUND_ENABLED = "false"': 'AI_RESOURCE_BACKGROUND_ENABLED = "true"',
            'AI_RESOURCE_SCOUT_ENABLED = "false"': 'AI_RESOURCE_SCOUT_ENABLED = "true"',
            'AI_RESOURCE_AUTO_APPROVAL_ENABLED = "false"': 'AI_RESOURCE_AUTO_APPROVAL_ENABLED = "true"',
            'AI_LOCAL_MODEL_ROUTING_ENABLED = "false"': 'AI_LOCAL_MODEL_ROUTING_ENABLED = "true"',
            'AI_SITE_DIRECTOR_ENABLED = "false"': 'AI_SITE_DIRECTOR_ENABLED = "true"',
            'AI_OPPORTUNITY_HUNTER_ENABLED = "false"': 'AI_OPPORTUNITY_HUNTER_ENABLED = "true"',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'Missing activation target: {old}')
            text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Deploy latest repaired Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config .wrangler-ai-auth-repair.toml

      - name: Bind canonical Worker admin secrets after deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$AI_MANAGEMENT_ADMIN_TOKEN" | npx --yes wrangler@latest secret put ADMIN_API_TOKEN --config .wrangler-ai-auth-repair.toml
          printf '%s' "$AI_MANAGEMENT_ADMIN_TOKEN" | npx --yes wrangler@latest secret put AI_MANAGEMENT_ADMIN_TOKEN --config .wrangler-ai-auth-repair.toml

      - name: Verify live authenticated AI health
        env:
          SITE_URL: https://matrixreprogrammed.com
          ADMIN_API_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN }}
          AI_VERIFY_ATTEMPTS: '30'
          AI_VERIFY_DELAY_MS: '5000'
        run: node scripts/verify-live-ai-management.mjs

      - name: Remove temporary configuration
        if: always()
        run: rm -f .wrangler-ai-auth-repair.toml
