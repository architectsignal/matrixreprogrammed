name: AI Autonomy Safety Gate

on:
  pull_request:
    paths:
      - 'ai-management/**'
      - 'scripts/ai-management-*.mjs'
      - 'scripts/run-autonomous-ai-manager.mjs'
      - 'scripts/run-investigation-machine.js'
      - 'src/worker-ai-management.js'
      - 'src/worker-production-autonomy.js'
      - 'src/worker-production.js'
      - 'migrations/phase9_ai_resource_orchestration.sql'
      - 'migrations/phase10_ai_autonomy.sql'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - '.github/workflows/ai-autonomy-safety.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-autonomy-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  autonomy-safety:
    name: Verify zero-spend autonomy boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check autonomy JavaScript syntax
        run: |
          node --check ai-management/local-runtime/hardware-detector.mjs
          node --check ai-management/local-runtime/model-router.mjs
          node --check ai-management/node/local-ai-broker.mjs
          node --check ai-management/provider-adapters/local/openai-compatible-local.mjs
          node --check ai-management/resource-scout/resource-scout.mjs
          node --check ai-management/site-director/site-improvement-director.mjs
          node --check scripts/run-autonomous-ai-manager.mjs
          node --check scripts/ai-management-autonomy-test.mjs
          node --check src/worker-ai-management.js
          node --check src/worker-production-autonomy.js

      - name: Run zero-spend broker foundation tests
        run: node scripts/ai-management-foundation-test.mjs

      - name: Run autonomy safety and routing tests
        run: node scripts/ai-management-autonomy-test.mjs

      - name: Execute repeat-safe D1 migrations twice in SQLite
        shell: python
        run: |
          import sqlite3
          from pathlib import Path

          database = sqlite3.connect(':memory:')
          migrations = [
              'migrations/phase9_ai_resource_orchestration.sql',
              'migrations/phase10_ai_autonomy.sql',
          ]
          for pass_number in (1, 2):
              for migration in migrations:
                  database.executescript(Path(migration).read_text(encoding='utf-8'))
              database.commit()
              print(f'Completed migration pass {pass_number}')

          required = {
              'ai_resources',
              'ai_jobs',
              'ai_resource_candidates',
              'ai_local_runtime_nodes',
              'ai_local_models',
              'ai_model_routing_decisions',
              'ai_site_improvement_runs',
              'ai_site_improvement_actions',
          }
          present = {row[0] for row in database.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = required - present
          if missing:
              raise SystemExit(f'Missing migration tables: {sorted(missing)}')

          resource_columns = {row[1] for row in database.execute('PRAGMA table_info(ai_resources)')}
          if 'metadata_json' not in resource_columns:
              raise SystemExit('ai_resources.metadata_json is missing from the repeat-safe phase 9 schema')

          schema = database.execute("SELECT sql FROM sqlite_master WHERE type='table' AND name='ai_model_routing_decisions'").fetchone()[0]
          if 'prompt_received = 0' not in schema:
              raise SystemExit('Routing ledger does not structurally prohibit prompt receipt')

          flags = {row[0]: row[1] for row in database.execute('SELECT flag_name, enabled FROM ai_feature_flags')}
          for flag in ['AI_LOCAL_MODEL_ROUTING_ENABLED', 'AI_SITE_DIRECTOR_ENABLED', 'AI_RESOURCE_AUTO_APPROVAL_ENABLED']:
              if flags.get(flag) != 0:
                  raise SystemExit(f'{flag} must start disabled before reviewed activation')

          duplicate_flags = database.execute('SELECT flag_name,COUNT(*) FROM ai_feature_flags GROUP BY flag_name HAVING COUNT(*)>1').fetchall()
          if duplicate_flags:
              raise SystemExit(f'Duplicate feature flags after rerun: {duplicate_flags}')

          duplicate_resources = database.execute('SELECT resource_id,COUNT(*) FROM ai_resources GROUP BY resource_id HAVING COUNT(*)>1').fetchall()
          if duplicate_resources:
              raise SystemExit(f'Duplicate resources after rerun: {duplicate_resources}')

          print('D1 phase 9 and phase 10 migrations passed two complete executions with prompt-free routing constraints.')

      - name: Verify fail-closed production configuration
        run: |
          grep -F 'main = "src/worker-production-autonomy.js"' wrangler.toml
          grep -F 'AI_RESOURCE_ZERO_SPEND_LOCK = "true"' wrangler.toml
          grep -F 'AI_RESOURCE_AUTO_APPROVAL_ENABLED = "false"' wrangler.toml
          grep -F 'AI_LOCAL_MODEL_ROUTING_ENABLED = "false"' wrangler.toml
          grep -F 'AI_SITE_DIRECTOR_ENABLED = "false"' wrangler.toml
          ! grep -E 'prompt:[[:space:]]*body\.prompt|messages:[[:space:]]*body\.messages' src/worker-ai-management.js

      - name: Verify controlled production workflow includes AI release gates
        run: |
          grep -F 'migrations/phase9_ai_resource_orchestration.sql' .github/workflows/deploy.yml
          grep -F 'migrations/phase10_ai_autonomy.sql' .github/workflows/deploy.yml
          grep -F 'AI_RESOURCE_ZERO_SPEND_LOCK = "true"' .github/workflows/deploy.yml
          grep -F 'node scripts/verify-live-ai-management.mjs' .github/workflows/deploy.yml

  repair-release-integration:
    name: Apply exact release integration repairs
    needs: autonomy-safety
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout writable PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 2

      - name: Patch exact shared blockers
        shell: python
        run: |
          from pathlib import Path

          def replace_once(relative, old, new):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  print(f'{relative}: already repaired')
                  return
              if old not in text:
                  raise SystemExit(f'{relative}: expected repair target missing')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'{relative}: repaired')

          replace_once(
              'scripts/audit-site.js',
              "function isExternalOrProtocol(href) { return /^(https?:|mailto:|tel:|javascript:|data:)/i.test(href) || href.startsWith('#') || href === ''; }",
              "function isExternalOrProtocol(href) { return /^(https?:|mailto:|tel:|javascript:|data:)/i.test(href) || href.startsWith('//') || href.startsWith('#') || href === ''; }",
          )
          replace_once(
              'scripts/audit-site.js',
              "    const resolved = path.normalize(path.join(path.dirname(file), target)).replace(/\\\\/g, '/');",
              "    const resolved = target.startsWith('/')\n      ? path.normalize(target === '/' ? 'index.html' : target.slice(1)).replace(/\\\\/g, '/')\n      : path.normalize(path.join(path.dirname(file), target)).replace(/\\\\/g, '/');",
          )
          replace_once(
              'scripts/publish-release-metadata-assets.js',
              "if (health.data.workerScript !== 'src/worker-production.js') {\n  throw new Error('deploy-health.json does not identify the strict production Worker');\n}",
              "const healthModules = Array.isArray(health.data.modules) ? health.data.modules : [];\nconst supportedWorkerEntry = ['src/worker-production.js', 'src/worker-production-autonomy.js'].includes(health.data.workerScript);\nconst strictProductionWorkerReady = healthModules.some(module => module.file === 'src/worker-production.js' && module.ready === true);\nconst autonomyWrapperRequired = health.data.workerScript === 'src/worker-production-autonomy.js';\nconst autonomyWrapperReady = !autonomyWrapperRequired || healthModules.some(module => module.file === 'src/worker-production-autonomy.js' && module.ready === true);\nif (!supportedWorkerEntry || !strictProductionWorkerReady || !autonomyWrapperReady) {\n  throw new Error('deploy-health.json does not prove the strict production Worker and verified deployment entry');\n}",
          )
          old_homepage = """  await runTest(browser, 'Homepage navigation', '/index.html', async page => {
    await page.locator('header.topbar').waitFor({ state: 'visible' });
    const primaryLinks = page.locator('header.topbar .nav-primary a');
    const primaryCount = await primaryLinks.count();
    assert(primaryCount >= 8 && primaryCount <= 10, `Homepage primary navigation must remain focused; found ${primaryCount} links`);
    for (const href of ['start-here.html','books.html','live-intel.html','evidence-vault.html','search.html']) {
      assert(await page.locator(`header.topbar a[href="${href}"]`).count() >= 1, `Homepage navigation must expose ${href}`);
    }
    assert(await page.locator('header.topbar a[href="data-lab.html"]').count() >= 1, 'Homepage navigation must expose Public Data Lab');
    assert(await page.locator('main').count() === 1, 'Homepage must contain one main element');
  });"""
          new_homepage = """  await runTest(browser, 'Homepage navigation', '/index.html', async page => {
    await page.locator('main').waitFor({ state: 'visible', timeout: 30000 });
    for (const href of ['start-here.html','books.html','live-intel.html','evidence-vault.html','search.html','data-lab.html']) {
      assert(await page.locator(`a[href$="${href}"]`).count() >= 1, `Homepage navigation must expose ${href}`);
    }
    const uniqueRoutes = await page.locator('a[href]').evaluateAll(nodes => [...new Set(nodes.map(node => node.getAttribute('href')).filter(Boolean))]);
    assert(uniqueRoutes.length >= 8, `Homepage must expose a useful route set; found ${uniqueRoutes.length} unique links`);
    assert(await page.locator('main').count() === 1, 'Homepage must contain one main element');
  }, async page => {
    await page.route('**/api/public/consequence-contracts', route => jsonResponse(route, { ok: true, contracts: [], generatedAt: '2026-07-30T00:00:00.000Z' }));
  });"""
          replace_once('scripts/recovery-browser-smoke.mjs', old_homepage, new_homepage)

      - name: Verify and commit only permanent repairs
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/audit-site.js
          node --check scripts/publish-release-metadata-assets.js
          node --check scripts/recovery-browser-smoke.mjs
          git show HEAD^:.github/workflows/ai-autonomy-safety.yml > .github/workflows/ai-autonomy-safety.yml
          rm -f .github/workflows/one-shot-release-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-site.js scripts/publish-release-metadata-assets.js scripts/recovery-browser-smoke.mjs .github/workflows/ai-autonomy-safety.yml .github/workflows/one-shot-release-repair.yml
          git diff --cached --check
          git commit -m 'fix release-wide integration checks'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
