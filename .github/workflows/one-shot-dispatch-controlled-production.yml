name: One-shot homepage intro emergency deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/one-shot-controlled-production.trigger

permissions:
  actions: read
  contents: write

concurrency:
  group: matrix-homepage-intro-emergency-v6
  cancel-in-progress: true

jobs:
  deploy-homepage-intro-hotfix:
    name: Deploy and verify homepage intro v6
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Confirm isolated hotfix files
        shell: bash
        run: |
          set -euo pipefail
          test -s src/worker-production-intro-hotfix.js
          test -s wrangler.intro-hotfix.toml
          grep -q '20260725-video-v6' src/worker-production-intro-hotfix.js
          grep -q 'worker-production-intro-hotfix.js' wrangler.intro-hotfix.toml
          grep -q 'run_worker_first = true' wrangler.intro-hotfix.toml

      - name: Wait for authoritative production deployment to stop
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const blockingRunId = 30161462181;
            for (let attempt = 1; attempt <= 120; attempt += 1) {
              try {
                const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: blockingRunId });
                core.info(`Authoritative production run ${blockingRunId}: ${run.status}/${run.conclusion || 'pending'} (check ${attempt}/120)`);
                if (run.status === 'completed') return;
              } catch (error) {
                if (error.status === 404) {
                  core.info('Blocking production run no longer resolves; continuing with isolated hotfix.');
                  return;
                }
                throw error;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setFailed(`Authoritative production run ${blockingRunId} did not complete before the hotfix deadline.`);

      - name: Confirm Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest whoami

      - name: Deploy isolated homepage intro hotfix
        id: deploy
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.intro-hotfix.toml

      - name: Verify live homepage and video payload
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          verified=0
          for attempt in $(seq 1 30); do
            nonce="$(date +%s)-$attempt"
            echo "Live intro verification attempt $attempt/30"
            homepage="$(curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/?intro=1&hotfix=$nonce" || true)"
            runtime="$(curl --fail --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/homepage-intro-hotfix-v6.js?v=$nonce" || true)"
            part1="$(curl --fail --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/_matrix-intro-part/1?v=$nonce" || true)"
            part2="$(curl --fail --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/_matrix-intro-part/2?v=$nonce" || true)"
            if printf '%s' "$homepage" | grep -q 'data-homepage-intro-v6' \
              && printf '%s' "$homepage" | grep -q 'homepage-intro-hotfix-v6.js?v=20260725-video-v6' \
              && printf '%s' "$homepage" | grep -q 'homepage-intro-hotfix-v6.css?v=20260725-video-v6' \
              && printf '%s' "$runtime" | grep -q 'matrix-homepage-intro-seen-v6' \
              && printf '%s' "$runtime" | grep -q '/_matrix-intro-part/1' \
              && test "${#part1}" -gt 1000 \
              && test "${#part2}" -gt 1000 \
              && printf '%s' "$part1" | grep -q '^AAAAIGZ0eXB'; then
              verified=1
              break
            fi
            sleep 5
          done
          test "$verified" -eq 1
          echo "Homepage intro v6 is live with versioned HTML injection, runtime, CSS and both MP4 data parts."

      - name: Record exact hotfix result
        if: always()
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          node - <<'NODE'
          const fs = require('fs');
          const deploy = process.env.DEPLOY_OUTCOME || 'unknown';
          const verify = process.env.VERIFY_OUTCOME || 'unknown';
          const ok = deploy === 'success' && verify === 'success';
          const payload = {
            ok,
            version: '20260725-video-v6',
            recordedAt: new Date().toISOString(),
            runId: Number(process.env.RUN_ID),
            runAttempt: Number(process.env.RUN_ATTEMPT),
            headSha: process.env.HEAD_SHA,
            deployOutcome: deploy,
            verifyOutcome: verify,
            blockingProductionRun: 30161462181,
            forcedReplayUrl: 'https://matrixreprogrammed.com/?intro=1',
            scope: 'Isolated homepage intro delivery Worker; existing production API, D1, membership, forum, email and welcome/ElevenLabs gate are delegated unchanged.'
          };
          fs.writeFileSync('data/homepage-intro-hotfix-result.json', JSON.stringify(payload, null, 2) + '\n');
          console.log(JSON.stringify(payload));
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/homepage-intro-hotfix-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record homepage intro v6 production result"
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
          done
          exit 1

      - name: Fail when deployment or verification failed
        if: always() && (steps.deploy.outcome != 'success' || steps.verify.outcome != 'success')
        shell: bash
        run: |
          echo "Homepage intro hotfix failed: deploy=${{ steps.deploy.outcome }} verify=${{ steps.verify.outcome }}"
          exit 1
