name: One-shot homepage intro emergency deploy

on:
  push:
    branches:
      - main
    paths:
      - .github/one-shot-controlled-production.trigger

permissions:
  contents: read

concurrency:
  group: matrix-homepage-intro-emergency-v6
  cancel-in-progress: false

jobs:
  deploy-homepage-intro-hotfix:
    name: Deploy and verify homepage intro v6
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Confirm isolated hotfix files
        shell: bash
        run: |
          set -euo pipefail
          test -s src/worker-production-intro-hotfix.js
          test -s wrangler.intro-hotfix.toml
          grep -q '20260725-video-v6' src/worker-production-intro-hotfix.js
          grep -q 'worker-production-intro-hotfix.js' wrangler.intro-hotfix.toml
          grep -q 'run_worker_first = true' wrangler.intro-hotfix.toml

      - name: Confirm Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest whoami

      - name: Deploy isolated homepage intro hotfix
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.intro-hotfix.toml

      - name: Verify live homepage and video payload
        shell: bash
        run: |
          set -euo pipefail
          nonce="$(date +%s)"
          homepage="$(curl --fail --silent --show-error --location --max-time 30 -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/?intro=1&hotfix=$nonce")"
          printf '%s' "$homepage" | grep -q 'data-homepage-intro-v6'
          printf '%s' "$homepage" | grep -q 'homepage-intro-hotfix-v6.js?v=20260725-video-v6'
          printf '%s' "$homepage" | grep -q 'homepage-intro-hotfix-v6.css?v=20260725-video-v6'
          runtime="$(curl --fail --silent --show-error --max-time 30 "https://matrixreprogrammed.com/homepage-intro-hotfix-v6.js?v=$nonce")"
          printf '%s' "$runtime" | grep -q 'matrix-homepage-intro-seen-v6'
          printf '%s' "$runtime" | grep -q '/_matrix-intro-part/1'
          part1="$(curl --fail --silent --show-error --max-time 30 "https://matrixreprogrammed.com/_matrix-intro-part/1?v=$nonce")"
          part2="$(curl --fail --silent --show-error --max-time 30 "https://matrixreprogrammed.com/_matrix-intro-part/2?v=$nonce")"
          test "${#part1}" -gt 1000
          test "${#part2}" -gt 1000
          printf '%s' "$part1" | grep -q '^AAAAIGZ0eXB'
          echo "Homepage intro v6 is live with versioned HTML injection, runtime, CSS and both MP4 data parts."
