name: Hugging Face Secret Sync Once
run-name: HUGGING FACE SECRET SYNC — validate and install protected Worker secret

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: matrixreprogrammed-hf-secret-sync-once
  cancel-in-progress: false

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[hf-secret-sync]')
    name: Validate token and install protected Worker secret
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate required credentials without printing them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$HUGGINGFACE_API_TOKEN"
          case "$HUGGINGFACE_API_TOKEN" in
            hf_*) ;;
            *) echo 'Hugging Face token format is invalid'; exit 1 ;;
          esac
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $HUGGINGFACE_API_TOKEN" \
            https://huggingface.co/api/whoami-v2 \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x.name)throw new Error('Token validation failed');console.log('Hugging Face token identity validated without exposing credentials.');})"

      - name: Install protected Cloudflare Worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$HUGGINGFACE_API_TOKEN" | npx --yes wrangler@latest secret put HUGGINGFACE_API_TOKEN --name matrixreprogrammed

      - name: Verify secret name without reading its value
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest secret list --name matrixreprogrammed --json > secret-list.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('secret-list.json','utf8'));if(!x.some(v=>v.name==='HUGGINGFACE_API_TOKEN'))throw new Error('Worker secret was not installed');console.log('Cloudflare Worker secret name verified.');"
          rm -f secret-list.json
