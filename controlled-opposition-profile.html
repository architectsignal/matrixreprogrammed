<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Controlled Opposition Card Profile | Matrix Reprogrammed</title><meta name="description" content="Deep profile view for Controlled Opposition Deck cards."/><link rel="stylesheet" href="styles.css"/><link rel="stylesheet" href="reader-experience.css"/><style>.profile-card{border:1px solid rgba(216,181,106,.35);border-radius:24px;padding:1.2rem;background:linear-gradient(150deg,rgba(24,0,0,.95),rgba(0,0,0,.95))}.score{font-size:3rem;font-weight:900;color:#d8b56a}.pillrow{display:flex;gap:.4rem;flex-wrap:wrap}.pillrow span{font-size:.75rem;border:1px solid rgba(216,181,106,.25);border-radius:999px;padding:.25rem .55rem;color:#d8b56a}</style></head><body><canvas id="matrix"></canvas><div class="page"><header class="wrap topbar"><a class="brand" href="index.html"><img src="sigil.png" alt="Matrix Reprogrammed sigil"/> MATRIX REPROGRAMMED</a><nav class="nav"><a href="controlled-opposition-deck.html">Controlled Opposition</a><a href="top-52-power-deck.html">People Deck</a><a href="institution-deck.html">Institution Deck</a><a href="search.html">Search</a></nav></header><main class="wrap section"><div id="profile" class="profile-card"><h1>Loading card profile…</h1></div></main><footer class="footer wrap"><p><strong>Boundary:</strong> this is a narrative-analysis profile, not proof of control, payment, handling, deception, criminality, or unlawful conduct.</p></footer></div><script>function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function slug(s){return String(s??'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}const params=new URLSearchParams(location.search);const wanted=params.get('card')||'';fetch('data/controlled-opposition-deck.json').then(r=>r.json()).then(data=>{const card=(data.deck||[]).map(c=>({rank:c[0],name:c[1],suit:c[2],score:c[3],lane:c[4]})).find(c=>slug(c.name)===wanted)||null;const box=document.getElementById('profile');if(!card){box.innerHTML='<h1>Card not found</h1><p><a class="btn" href="controlled-opposition-deck.html">Back to deck</a></p>';return}document.title=card.name+' | Controlled Opposition Deck';box.innerHTML='<div class="eyebrow">Controlled Opposition Deck · Card '+card.rank+'</div><h1>'+esc(card.name)+'</h1><p class="lead">'+esc(card.lane)+'</p><div class="score">'+card.score+'<small>/100</small></div><div class="pillrow"><span>'+esc(card.suit)+'</span><span>narrative lane</span><span>update priority</span><span>evidence boundary</span></div><h2>Deeper information route</h2><p>This profile is the card-level research route. Use it to connect the card to public records, platform incentives, audience capture patterns, controversy timelines, claim boundaries, and future source updates.</p><h2>Evidence boundary</h2><p>Inclusion does not prove the person is controlled, paid, handled, knowingly deceptive, criminal, or acting unlawfully. It only marks a public narrative-analysis lane for further source review.</p><div class="cta-row"><a class="btn" href="search.html?q='+encodeURIComponent(card.name)+'">Search this name</a><a class="btn alt" href="controlled-opposition-deck.html">Back to deck</a><a class="btn alt" href="data/controlled-opposition-deck.json">Deck data</a></div>'}).catch(()=>{document.getElementById('profile').innerHTML='<h1>Deck data unavailable</h1>'})</script><script src="matrix.js"></script></body></html>
