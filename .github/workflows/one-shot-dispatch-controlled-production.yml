name: Production Dispatch — HARD FREEZE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-freeze:
    name: Automatic production dispatch is locked
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production cost freeze
        run: |
          echo "AUTOMATIC PRODUCTION DISPATCH LOCKED."
          echo "There is no push trigger, schedule, workflow dispatch to another deployment workflow, Wrangler command, or Cloudflare deployment command here."
          echo "The intelligence machine may continue committing and pushing changes to GitHub without deploying them."
