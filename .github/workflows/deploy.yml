name: Matrix Reprogrammed Controlled Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY MATRIX REPROGRAMMED to authorize the controlled production release'
        required: true
        type: string
      billing_exception:
        description: 'One-day owner exception; leave blank unless the 2026-08-02 billable build is explicitly authorized'
        required: false
        default: ''
        type: string

concurrency:
  group: matrixreprogrammed-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  refresh-build-guard-deploy-verify:
    name: Refresh, migrate, deploy and prove autonomous AI production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - name: Checkout exact dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 501

      - name: Prove checkout is pinned to dispatch SHA
        env:
          MATRIX_DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$MATRIX_DISPATCH_SHA"

      - name: Confirm explicit production release authority
        env:
          MATRIX_PRODUCTION_CONFIRMATION: ${{ inputs.confirmation }}
          MATRIX_PRODUCTION_ACTOR: ${{ github.actor }}
          MATRIX_WORKFLOW_EVENT: ${{ github.event_name }}
          MATRIX_BILLING_EXCEPTION: ${{ inputs.billing_exception }}
        run: node scripts/verify-one-shot-production-authorization.js

      - name: Enforce Cloudflare budget or one-day owner exception
        env:
          CLOUDFLARE_GIT_BUILDS_DISCONNECTED: ${{ vars.CLOUDFLARE_GIT_BUILDS_DISCONNECTED }}
          CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED }}
          CLOUDFLARE_BUILD_MINUTES_USED: ${{ vars.CLOUDFLARE_BUILD_MINUTES_USED }}
          CLOUDFLARE_USAGE_CHECKED_AT_UTC: ${{ vars.CLOUDFLARE_USAGE_CHECKED_AT_UTC }}
          EXPECTED_CLOUDFLARE_BUILD_MINUTES: '0'
          CLOUDFLARE_ONE_TIME_BILLABLE_BUILD_AUTHORIZATION: ${{ inputs.billing_exception }}
        shell: bash
        run: |
          if [[ "$CLOUDFLARE_ONE_TIME_BILLABLE_BUILD_AUTHORIZATION" == "OWNER AUTHORIZED ONE BILLABLE BUILD 2026-08-02" ]]; then
            node scripts/cloudflare-usage-budget-guard.js owner-exception
          else
            node scripts/cloudflare-usage-budget-guard.js release
          fi

      - name: Record exact dispatched commit to deploy
        run: echo "DEPLOY_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh investigation data or prove current sources are fresh
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          INVESTIGATION_MODE: daily
          INVESTIGATION_CONCURRENCY: '4'
          INVESTIGATION_TIMEOUT_MS: '25000'
          MATRIX_REQUIRE_PRODUCTION_FRESHNESS: '1'
        run: node scripts/run-production-intelligence-refresh.js

      - name: Build complete site and Worker assets
        env:
          SOURCE_DOCUMENTS_PER_RUN: '0'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p downloads
          npm run build 2>&1 | tee downloads/production-build.log

      - name: Verify critical runtime, D1 and autonomous AI contracts
        run: |
          node scripts/production-release-state-test.js
          node scripts/forum-persistence-d1-test.js
          node scripts/cloudflare-worker-routes-test.js
          node scripts/phase4-email-lifecycle-test.mjs
          node scripts/phase7-paypal-sandbox-rehearsal-test.mjs
          node scripts/phase8-autonomous-sandbox-readiness-test.mjs
          node scripts/recovery-worker-api-contract-test.js
          python3 scripts/recovery-d1-rehearsal.py
          node scripts/ai-management-foundation-test.mjs
          node scripts/ai-management-autonomy-test.mjs
          node scripts/opportunity-hunter-test.mjs
          node scripts/opportunity-hunter-worker-test.mjs
          node scripts/opportunity-provider-adapter-test.mjs
          node scripts/compute-capacity-manager-test.mjs
          node scripts/capacity-growth-controller-test.mjs
          node scripts/capacity-growth-worker-contract-test.mjs
          node scripts/capacity-growth-worker-integration-test.mjs
          node scripts/zero-cost-compute-golden-test.mjs
          node scripts/phase12-production-readiness-test.mjs
          node scripts/matrix-synergy-test.mjs
          node scripts/living-matrix-acceptance-test.mjs
          node scripts/publish-investigation-matrix-events.test.mjs
          node scripts/value-hunter-golden-test.mjs
          node scripts/value-code-improvement-test.mjs
          node scripts/phase15-value-hunter-contract-test.mjs
          node scripts/value-hunter-worker-integration-test.mjs
          node scripts/permissionless-harvester-golden-test.mjs
          node scripts/phase16-permissionless-harvester-contract-test.mjs
          node scripts/permissionless-harvester-worker-integration-test.mjs
          node scripts/matrix-operating-system-contract-test.mjs
          node scripts/matrix-operating-system-worker-integration-test.mjs
          node scripts/phase17-migration-rehearsal.mjs
          node scripts/build-public-investigation-corpus.js
          node scripts/public-investigation-test.mjs
          python3 scripts/phase13-migration-rehearsal.py
          node local-agent/matrix-local-agent.test.mjs
          node local-agent/control-plane-client.test.mjs
          node local-agent/local-benchmark.test.mjs
          node local-agent/matrix-local-host.test.mjs
          node local-agent/matrix-local-supervisor.test.mjs
          node local-agent/matrix-local-cli.test.mjs
          node ai-management/local-runtime/job-queue.test.mjs
          node --check src/worker-production.js
          node --check src/worker-production-autonomy.js
          node --check src/worker-member-experience.js
          node --check src/worker-matrix-synergy.js
          node --check src/worker-living-matrix.js
          node --check src/worker-value-hunter.js
          node --check src/worker-permissionless-value.js
          node --check src/worker-matrix-operations.js
          node --check src/matrix-event-emitter.js
          node --check src/matrix-synergy-core.js
          node --check ai-management/living-matrix/living-matrix-cycle.mjs
          node --check ai-management/value-hunter/value-hunter-core.mjs
          node --check ai-management/value-hunter/financial-firewall.mjs
          node --check ai-management/value-hunter/value-collector.mjs
          node --check ai-management/provider-adapters/value/official-html-links.mjs
          find ai-management/value-hunter/permissionless -type f -name '*.mjs' -print0 | xargs -0 -n1 node --check
          node --check local-agent/permissionless-harvester-cli.mjs
          node --check local-agent/matrix-operations-cli.mjs
          node --check ai-management/matrix-core/matrix-constitution.mjs
          node --check ai-management/matrix-core/matrix-operating-system.mjs
          node --check scripts/publish-investigation-matrix-events.mjs
          node --check src/worker-ai-management.js
          node --check src/worker-local-job-api.js
          node --check src/worker-opportunity-hunter.js
          node --check ai-management/provider-adapters/opportunity/zero-spend-public-http.mjs
          node --check scripts/run-autonomous-ai-manager.mjs
          node --check scripts/verify-live-ai-management.mjs
          node scripts/live-ai-verification-classifier.test.mjs
          node scripts/d1-export-command-test.js
          npx --yes wrangler@latest deploy --dry-run

      - name: Reconcile final generated pages
        env:
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
        run: node scripts/final-production-reconcile.js

      - name: Fail closed on stale or incomplete output
        run: |
          node scripts/production-freshness-guard.js
          node scripts/production-sync-test.js

      - name: Production deploy guard
        env:
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
        run: |
          node scripts/production-deploy-guard.js
          node scripts/behind-the-curtain-production-guard.js

      - name: Confirm Cloudflare and owner-verification credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN || secrets.ADMIN_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$AI_MANAGEMENT_ADMIN_TOKEN"
          npx --yes wrangler@latest whoami
          npx --yes wrangler@latest d1 info matrix-members

      - name: Capture D1 rollback bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          npx --yes wrangler@latest d1 time-travel info matrix-members --json > downloads/d1-time-travel-bookmark.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('downloads/d1-time-travel-bookmark.json','utf8'));
          if (!payload?.bookmark || String(payload.bookmark).length < 8) throw new Error('Invalid D1 rollback bookmark');
          fs.writeFileSync('downloads/d1-rollback-proof.json', JSON.stringify({
            ok: true,
            commit: process.env.DEPLOY_COMMIT_SHA,
            database: 'matrix-members',
            bookmark: payload.bookmark,
            createdAt: new Date().toISOString(),
            restoreCommand: `wrangler d1 time-travel restore matrix-members --bookmark=${payload.bookmark}`
          }, null, 2));
          NODE

      - name: Verify D1 rollback proof before release
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const rollback = JSON.parse(fs.readFileSync('downloads/d1-rollback-proof.json','utf8'));
          if(!rollback.ok||!rollback.bookmark) throw new Error('Validated D1 rollback point is missing');
          if (rollback.commit !== process.env.DEPLOY_COMMIT_SHA) throw new Error('D1 rollback point is not bound to the deployment commit');
          if (!String(rollback.restoreCommand || '').includes(String(rollback.bookmark))) throw new Error('D1 rollback restore command is incomplete');
          console.log(`Validated D1 rollback point ${rollback.bookmark} for ${rollback.commit}.`);
          NODE

      - name: Apply repeat-safe D1 migration chain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            migrations/0001_membership_foundation.sql
            migrations/0004_forum_persistence.sql
            migrations/phase4_email_lifecycle.sql
            migrations/phase4_email_lifecycle_portability.sql
            migrations/phase5_member_experience.sql
            migrations/phase5_member_experience_timestamp_fix.sql
            migrations/phase6_paypal_subscriptions.sql
            migrations/phase6_paypal_failure_counter_fix.sql
            migrations/phase7_paypal_sandbox_rehearsal.sql
            migrations/phase8_paypal_sandbox_bootstrap.sql
            migrations/phase9_ai_resource_orchestration.sql
            migrations/phase10_ai_autonomy.sql
            migrations/phase11_local_job_queue.sql
            migrations/phase12_opportunity_hunter.sql
            migrations/phase13_matrix_synergy.sql
            migrations/public_investigation_api.sql
            migrations/phase14_living_matrix.sql
            migrations/phase15_matrix_value_hunter.sql
            migrations/phase16_permissionless_value_harvester.sql
            migrations/phase17_matrix_operating_system.sql
          )
          : > downloads/d1-migration.log
          for migration in "${migrations[@]}"; do
            test -s "$migration"
            echo "===== APPLY $migration =====" | tee -a downloads/d1-migration.log
            npx --yes wrangler@latest d1 execute matrix-members --remote --file="$migration" --yes 2>&1 | tee -a downloads/d1-migration.log
          done

      - name: Verify migrated D1 schema and preserve payment switches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT type,name FROM sqlite_master WHERE name IN ('members','member_sessions','subscriptions','audit_log','paypal_runtime_settings','ai_resources','ai_jobs','ai_audit_log','ai_feature_flags','ai_resource_candidates','ai_local_runtime_nodes','ai_local_models','ai_model_routing_decisions','ai_site_improvement_runs','ai_site_improvement_actions','ai_local_jobs','ai_local_job_receipts','ai_opportunities','ai_opportunity_hunter_runs','ai_compute_provider_candidates','ai_compute_onboarding_tasks','ai_compute_resources','ai_compute_leases','matrix_events','matrix_missions','matrix_contributions','matrix_impact_trail','matrix_rewards','matrix_human_actions','matrix_models','matrix_model_benchmarks','matrix_capabilities','matrix_learning_ledger','matrix_public_investigations','matrix_public_investigation_evidence','matrix_public_investigation_rate_limits','matrix_living_cycles','matrix_event_dispatches','matrix_living_projections','matrix_page_dependencies','matrix_value_jurisdictions','matrix_value_sources','matrix_value_claimants','matrix_value_destinations','matrix_value_mandates','matrix_value_objectives','matrix_value_opportunities','matrix_value_entitlement_evidence','matrix_value_claim_queue','matrix_value_operations','matrix_value_receipts','matrix_value_audit','matrix_value_cycles','matrix_value_learning','matrix_permissionless_protocols','matrix_permissionless_markets','matrix_permissionless_opportunities','matrix_permissionless_simulations','matrix_permissionless_execution_intents','matrix_permissionless_receipts','matrix_permissionless_workers','matrix_permissionless_strategy_statistics','matrix_permissionless_cycles','matrix_constitution','matrix_system_components','matrix_operating_missions','matrix_capability_snapshots','matrix_daily_baselines','matrix_learning_effects','matrix_boot_runs','matrix_watchdog_events','matrix_delegations','matrix_action_receipts') ORDER BY type,name;" --json > downloads/d1-schema-verification.json
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT sql FROM sqlite_master WHERE type='table' AND name IN ('ai_local_jobs','ai_local_job_receipts','ai_opportunities','ai_opportunity_hunter_runs','ai_compute_leases','matrix_contributions','matrix_human_actions') ORDER BY name;" --json > downloads/d1-autonomy-schema.json
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT environment,checkout_enabled,activation_reason FROM paypal_runtime_settings ORDER BY environment;" --json > downloads/paypal-runtime-settings.json
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT resource_id,billing_enabled,payment_method_present,monetary_cost_per_unit_eur,billing_risk FROM ai_resources ORDER BY resource_id;" --json > downloads/d1-ai-zero-spend-resources.json
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT 'objective' AS record_type,objective_id AS record_id,target_net_minor AS value_minor,status AS state FROM matrix_value_objectives UNION ALL SELECT 'mandate',mandate_id,maximum_fee_minor,CASE WHEN active=1 AND auto_collect_proven_entitlements=1 THEN 'active-auto' ELSE 'inactive' END FROM matrix_value_mandates UNION ALL SELECT 'source-count','official-sources',COUNT(*),MIN(source_status) FROM matrix_value_sources;" --json > downloads/d1-value-hunter.json
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT 'protocol' AS record_type,protocol_key AS record_id,execution_status AS state FROM matrix_permissionless_protocols UNION ALL SELECT 'flag',flag_name,CASE WHEN enabled=1 THEN 'enabled' ELSE 'disabled' END FROM ai_feature_flags WHERE flag_name LIKE 'MATRIX_PERMISSIONLESS_%' OR flag_name='MATRIX_DISTRIBUTED_DISCOVERY_ENABLED';" --json > downloads/d1-permissionless-harvester.json
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT constitution_id,law_text,law_sha256,immutable,authority_expansion_by_learning FROM matrix_constitution; SELECT delegation_id,maximum_amount_minor,active,constitutional_law_sha256 FROM matrix_delegations; SELECT flag_name,enabled FROM ai_feature_flags WHERE flag_name IN ('MATRIX_OPERATING_SYSTEM_ENABLED','MATRIX_TECHNOLOGY_EVOLUTION_ENABLED') ORDER BY flag_name;" --json > downloads/d1-matrix-operating-system.json
          node - <<'NODE'
          const fs = require('fs');
          const rows = payload => payload.flatMap(item => item.results || item.result?.results || []);
          const schema = JSON.parse(fs.readFileSync('downloads/d1-schema-verification.json','utf8'));
          const autonomy = JSON.parse(fs.readFileSync('downloads/d1-autonomy-schema.json','utf8'));
          const payment = JSON.parse(fs.readFileSync('downloads/paypal-runtime-settings.json','utf8'));
          const resources = JSON.parse(fs.readFileSync('downloads/d1-ai-zero-spend-resources.json','utf8'));
          const valueHunter = JSON.parse(fs.readFileSync('downloads/d1-value-hunter.json','utf8'));
          const permissionless = JSON.parse(fs.readFileSync('downloads/d1-permissionless-harvester.json','utf8'));
          const matrixOperations = JSON.parse(fs.readFileSync('downloads/d1-matrix-operating-system.json','utf8'));
          const required = ['members','member_sessions','subscriptions','audit_log','paypal_runtime_settings','ai_resources','ai_jobs','ai_audit_log','ai_feature_flags','ai_resource_candidates','ai_local_runtime_nodes','ai_local_models','ai_model_routing_decisions','ai_site_improvement_runs','ai_site_improvement_actions','ai_local_jobs','ai_local_job_receipts','ai_opportunities','ai_opportunity_hunter_runs','ai_compute_provider_candidates','ai_compute_onboarding_tasks','ai_compute_resources','ai_compute_leases','matrix_events','matrix_missions','matrix_contributions','matrix_impact_trail','matrix_rewards','matrix_human_actions','matrix_models','matrix_model_benchmarks','matrix_capabilities','matrix_learning_ledger','matrix_public_investigations','matrix_public_investigation_evidence','matrix_public_investigation_rate_limits','matrix_living_cycles','matrix_event_dispatches','matrix_living_projections','matrix_page_dependencies','matrix_value_jurisdictions','matrix_value_sources','matrix_value_claimants','matrix_value_destinations','matrix_value_mandates','matrix_value_objectives','matrix_value_opportunities','matrix_value_entitlement_evidence','matrix_value_claim_queue','matrix_value_operations','matrix_value_receipts','matrix_value_audit','matrix_value_cycles','matrix_value_learning','matrix_permissionless_protocols','matrix_permissionless_markets','matrix_permissionless_opportunities','matrix_permissionless_simulations','matrix_permissionless_execution_intents','matrix_permissionless_receipts','matrix_permissionless_workers','matrix_permissionless_strategy_statistics','matrix_permissionless_cycles','matrix_constitution','matrix_system_components','matrix_operating_missions','matrix_capability_snapshots','matrix_daily_baselines','matrix_learning_effects','matrix_boot_runs','matrix_watchdog_events','matrix_delegations','matrix_action_receipts'];
          const names = new Set(rows(schema).map(row => row.name));
          const missing = required.filter(name => !names.has(name));
          if (missing.length) throw new Error(`Missing D1 objects: ${missing.join(', ')}`);
          const sql = rows(autonomy).map(row => String(row.sql || '')).join('\n');
          const valueRows = rows(valueHunter);
          if (!sql.includes("job_type IN ('deterministic.hash','llm.generate')")) throw new Error('Local job allowlist missing');
          if (!sql.includes('cost_confirmed_zero = 1')) throw new Error('Local receipt zero-cost constraint missing');
          if (!sql.includes('external_network_used = 0')) throw new Error('Local receipt network constraint missing');
          if (!sql.includes("approval_state IN ('approved-auto','awaiting-owner','quarantined','disabled')")) throw new Error('Opportunity approval-state constraint missing');
          if (!sql.includes('zero_spend_lock = 1')) throw new Error('Opportunity run zero-spend constraint missing');
          if (!sql.includes("data_class='public'")) throw new Error('Compute lease public-only constraint missing');
          if (!sql.includes("evidence_class IN ('VERIFIED','SPECULATION','SECURITY_QUARANTINE')")) throw new Error('Matrix evidence boundary missing');
          if (sql.toLowerCase().includes('editorial')) throw new Error('Human action queue became an editorial fallback');
          const objective = valueRows.find(row => row.record_type === 'objective' && row.record_id === 'value-milestone-eur-10000');
          const mandate = valueRows.find(row => row.record_type === 'mandate' && row.record_id === 'owner-standing-auto-collection-v1');
          const sourceCount = valueRows.find(row => row.record_type === 'source-count');
          if (!objective || Number(objective.value_minor) !== 1000000 || objective.state !== 'active') throw new Error('Value Hunter EUR 10,000 objective is not active');
          if (!mandate || Number(mandate.value_minor) !== 0 || mandate.state !== 'active-auto') throw new Error('Value Hunter zero-fee standing mandate is not active');
          if (!sourceCount || Number(sourceCount.value_minor) < 10) throw new Error('Value Hunter official source registry is incomplete');
          const permissionlessRows = rows(permissionless);
          const morpho = permissionlessRows.find(row => row.record_type === 'protocol' && row.record_id === 'morpho:8453');
          if (!morpho || morpho.state !== 'simulation') throw new Error('Morpho must remain simulation-only until production certification');
          for (const row of permissionlessRows.filter(row => row.record_type === 'flag')) {
            if (row.state !== 'disabled') throw new Error(`${row.record_id} must remain disabled before production certification`);
          }
          const matrixRows = rows(matrixOperations);
          const constitution = matrixRows.find(row => row.constitution_id === 'matrix-law-v1');
          if (!constitution || constitution.law_text !== 'CAUSE NO HARM OR LOSS.' || constitution.law_sha256 !== '2f440056e992d3edbe9dcfd60a5c9d24397bb28d68e29d1d3ed476e84021b189' || Number(constitution.immutable) !== 1 || Number(constitution.authority_expansion_by_learning) !== 0) throw new Error('Matrix constitutional law is missing or altered');
          for (const delegation of matrixRows.filter(row => row.delegation_id)) {
            if (Number(delegation.maximum_amount_minor) !== 0) throw new Error(`${delegation.delegation_id} unexpectedly grants financial authority`);
            if (delegation.constitutional_law_sha256 !== constitution.law_sha256) throw new Error(`${delegation.delegation_id} is not bound to the constitutional law`);
          }
          const matrixFlags = new Map(matrixRows.filter(row => row.flag_name).map(row => [row.flag_name, Number(row.enabled)]));
          if (matrixFlags.get('MATRIX_OPERATING_SYSTEM_ENABLED') !== 1 || matrixFlags.get('MATRIX_TECHNOLOGY_EVOLUTION_ENABLED') !== 1) throw new Error('Internal Matrix operations/evolution flags are not enabled');
          const settings = rows(payment);
          const sandbox = settings.find(row => row.environment === 'sandbox');
          const live = settings.find(row => row.environment === 'live');
          if (!sandbox || !live) throw new Error('Missing PayPal runtime settings');
          if (Number(sandbox.checkout_enabled) !== 0) throw new Error('Sandbox checkout must remain closed outside an explicit rehearsal');
          for (const resource of rows(resources)) {
            if (Number(resource.billing_enabled) !== 0) throw new Error(`${resource.resource_id} billing enabled`);
            if (Number(resource.payment_method_present) !== 0) throw new Error(`${resource.resource_id} has payment method`);
            if (Number(resource.monetary_cost_per_unit_eur) !== 0) throw new Error(`${resource.resource_id} has non-zero cost`);
            if (resource.billing_risk !== 'none') throw new Error(`${resource.resource_id} has billing risk`);
          }
          console.log(`D1 phases 9-13 verified with zero-spend compute, automatic evidence classification, provider-only human actions and live PayPal checkout state preserved at ${Number(live.checkout_enabled)}.`);
          NODE

      - name: Activate approved AI autonomy flags under the zero-spend lock
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="UPDATE ai_feature_flags SET enabled=CASE WHEN flag_name='AI_RESOURCE_LOCAL_ONLY' THEN 0 ELSE 1 END, reason='Owner-authorized controlled production activation with zero-spend and prompt-local boundaries', updated_by='controlled-production-deploy', updated_at=CURRENT_TIMESTAMP WHERE flag_name IN ('AI_RESOURCE_BROKER_ENABLED','AI_RESOURCE_EXTERNAL_ENABLED','AI_RESOURCE_LOCAL_ONLY','AI_RESOURCE_ZERO_SPEND_LOCK','AI_RESOURCE_BACKGROUND_ENABLED','AI_RESOURCE_SCOUT_ENABLED','AI_RESOURCE_AUTO_APPROVAL_ENABLED','AI_LOCAL_MODEL_ROUTING_ENABLED','AI_SITE_DIRECTOR_ENABLED','AI_OPPORTUNITY_HUNTER_ENABLED','AI_COMPUTE_RESOURCE_SCOUT_ENABLED');" --yes
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT flag_name,enabled,value_json,reason,updated_by,updated_at FROM ai_feature_flags WHERE flag_name LIKE 'AI_%' ORDER BY flag_name;" --json > downloads/d1-ai-feature-flags.json
          node - <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('downloads/d1-ai-feature-flags.json','utf8'));
          const rows = payload.flatMap(item => item.results || item.result?.results || []);
          const flags = new Map(rows.map(row => [row.flag_name, Number(row.enabled)]));
          const active = ['AI_RESOURCE_BROKER_ENABLED','AI_RESOURCE_EXTERNAL_ENABLED','AI_RESOURCE_ZERO_SPEND_LOCK','AI_RESOURCE_BACKGROUND_ENABLED','AI_RESOURCE_SCOUT_ENABLED','AI_RESOURCE_AUTO_APPROVAL_ENABLED','AI_LOCAL_MODEL_ROUTING_ENABLED','AI_SITE_DIRECTOR_ENABLED','AI_OPPORTUNITY_HUNTER_ENABLED','AI_COMPUTE_RESOURCE_SCOUT_ENABLED'];
          for (const flag of active) if (flags.get(flag) !== 1) throw new Error(`${flag} was not activated`);
          if (flags.get('AI_RESOURCE_LOCAL_ONLY') !== 0) throw new Error('AI_RESOURCE_LOCAL_ONLY must be disabled for approved public retrieval');
          NODE

      - name: Build reviewed production Worker configuration
        shell: bash
        run: |
          set -euo pipefail
          cp wrangler.toml .wrangler-production.toml
          python3 - <<'PY'
          from pathlib import Path
          config = Path('.wrangler-production.toml')
          text = config.read_text(encoding='utf-8')
          replacements = {
              'AI_RESOURCE_BROKER_ENABLED = "false"': 'AI_RESOURCE_BROKER_ENABLED = "true"',
              'AI_RESOURCE_EXTERNAL_ENABLED = "false"': 'AI_RESOURCE_EXTERNAL_ENABLED = "true"',
              'AI_RESOURCE_LOCAL_ONLY = "true"': 'AI_RESOURCE_LOCAL_ONLY = "false"',
              'AI_RESOURCE_BACKGROUND_ENABLED = "false"': 'AI_RESOURCE_BACKGROUND_ENABLED = "true"',
              'AI_RESOURCE_SCOUT_ENABLED = "false"': 'AI_RESOURCE_SCOUT_ENABLED = "true"',
              'AI_RESOURCE_AUTO_APPROVAL_ENABLED = "false"': 'AI_RESOURCE_AUTO_APPROVAL_ENABLED = "true"',
              'AI_LOCAL_MODEL_ROUTING_ENABLED = "false"': 'AI_LOCAL_MODEL_ROUTING_ENABLED = "true"',
              'AI_SITE_DIRECTOR_ENABLED = "false"': 'AI_SITE_DIRECTOR_ENABLED = "true"',
              'AI_OPPORTUNITY_HUNTER_ENABLED = "false"': 'AI_OPPORTUNITY_HUNTER_ENABLED = "true"',
              'AI_COMPUTE_RESOURCE_SCOUT_ENABLED = "false"': 'AI_COMPUTE_RESOURCE_SCOUT_ENABLED = "true"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one activation target for {old}')
              text = text.replace(old, new)
          if text.count('AI_RESOURCE_ZERO_SPEND_LOCK = "true"') != 1:
              raise SystemExit('Zero-spend lock is missing or ambiguous')
          for required_true in (
              'MATRIX_VALUE_HUNTER_ENABLED = "true"',
              'MATRIX_VALUE_AUTO_COLLECTION_ENABLED = "true"',
              'MATRIX_OPERATING_SYSTEM_ENABLED = "true"',
              'MATRIX_TECHNOLOGY_EVOLUTION_ENABLED = "true"',
          ):
              if text.count(required_true) != 1:
                  raise SystemExit(f'Required Matrix runtime gate is missing or ambiguous: {required_true}')
          if '\nworkers_dev = ' not in text:
              text = text.replace('keep_vars = true\n', 'keep_vars = true\nworkers_dev = true\n', 1)
          config.write_text(text, encoding='utf-8')
          PY
          grep -F 'AI_RESOURCE_ZERO_SPEND_LOCK = "true"' .wrangler-production.toml
          grep -F 'AI_OPPORTUNITY_HUNTER_ENABLED = "true"' .wrangler-production.toml
          grep -F 'AI_COMPUTE_RESOURCE_SCOUT_ENABLED = "true"' .wrangler-production.toml
          grep -F 'MATRIX_VALUE_HUNTER_ENABLED = "true"' .wrangler-production.toml
          grep -F 'MATRIX_VALUE_AUTO_COLLECTION_ENABLED = "true"' .wrangler-production.toml
          grep -F 'MATRIX_OPERATING_SYSTEM_ENABLED = "true"' .wrangler-production.toml
          npx --yes wrangler@latest deploy --config .wrangler-production.toml --dry-run

      - name: Deploy exact reconciled assets and autonomous D1 Worker to Cloudflare
        id: cloudflare_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config .wrangler-production.toml 2>&1 | tee downloads/wrangler-deploy.log

      - name: Resolve canonical workers.dev endpoint from Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          SUBDOMAIN="$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success||!j.result?.subdomain)process.exit(2);process.stdout.write(j.result.subdomain)})")"
          test -n "$SUBDOMAIN"
          echo "AI_DIRECT_WORKER_URL=https://matrixreprogrammed.$SUBDOMAIN.workers.dev" >> "$GITHUB_ENV"
          echo "Resolved direct Worker endpoint for owner-only verification."

      - name: Bind normalized canonical Worker admin secrets after deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN || secrets.ADMIN_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          NORMALIZED_TOKEN="$(printf '%s' "$AI_MANAGEMENT_ADMIN_TOKEN" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          test "$(printf '%s' "$NORMALIZED_TOKEN" | wc -c)" -ge 32
          printf '%s' "$NORMALIZED_TOKEN" | npx --yes wrangler@latest secret put ADMIN_API_TOKEN --config .wrangler-production.toml
          printf '%s' "$NORMALIZED_TOKEN" | npx --yes wrangler@latest secret put AI_MANAGEMENT_ADMIN_TOKEN --config .wrangler-production.toml

      - name: Verify live autonomous AI control plane
        id: ai_verify
        env:
          SITE_URL: ${{ env.AI_DIRECT_WORKER_URL }}
          AI_MANAGEMENT_ADMIN_TOKEN: ${{ secrets.AI_MANAGEMENT_ADMIN_TOKEN || secrets.ADMIN_API_TOKEN }}
          AI_VERIFY_ATTEMPTS: '36'
          AI_VERIFY_DELAY_MS: '5000'
        run: node scripts/verify-live-ai-management.mjs

      - name: Verify live independent Pyramid
        id: pyramid_verify
        env:
          SITE_URL: https://matrixreprogrammed.com
          PYRAMID_VERIFY_ATTEMPTS: '36'
          PYRAMID_VERIFY_DELAY_MS: '10000'
        run: node scripts/verify-live-behind-the-curtain.js

      - name: Verify live routes, exact SHA and protected boundaries
        id: live_verify
        env:
          SITE_URL: https://matrixreprogrammed.com
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_VERIFY_ATTEMPTS: '36'
          LIVE_VERIFY_DELAY_MS: '10000'
        run: node -r ./scripts/verify-live-production-fetch-fallback.js scripts/verify-live-production.js

      - name: Build sanitized production deployment receipt
        id: receipt
        continue-on-error: true
        env:
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
        run: node scripts/build-production-deploy-receipt.js

      - name: Classify deployment, live verification and receipt state
        if: always()
        env:
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
          CLOUDFLARE_DEPLOY_OUTCOME: ${{ steps.cloudflare_deploy.outcome }}
          AI_VERIFY_OUTCOME: ${{ steps.ai_verify.outcome }}
          PYRAMID_VERIFY_OUTCOME: ${{ steps.pyramid_verify.outcome }}
          LIVE_VERIFY_OUTCOME: ${{ steps.live_verify.outcome }}
          RECEIPT_OUTCOME: ${{ steps.receipt.outcome }}
        run: node scripts/classify-production-release-state.js

      - name: Remove temporary production configuration
        if: always()
        run: rm -f .wrangler-production.toml

      - name: Upload production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-proof-${{ github.run_id }}
          path: |
            downloads/one-shot-production-authorization.json
            downloads/production-build.log
            downloads/deploy-manifest.json
            downloads/deploy-health.json
            downloads/live-ai-management-verification.json
            downloads/live-behind-the-curtain-verification.json
            downloads/live-production-verification.json
            downloads/production-deploy-receipt.json
            downloads/production-release-state.json
            downloads/d1-time-travel-bookmark.json
            downloads/d1-rollback-proof.json
            downloads/d1-migration.log
            downloads/d1-schema-verification.json
            downloads/d1-autonomy-schema.json
            downloads/d1-ai-zero-spend-resources.json
            downloads/d1-value-hunter.json
            downloads/d1-permissionless-harvester.json
            downloads/d1-matrix-operating-system.json
            downloads/d1-ai-feature-flags.json
            downloads/paypal-runtime-settings.json
            downloads/wrangler-deploy.log
          if-no-files-found: ignore
          retention-days: 60
