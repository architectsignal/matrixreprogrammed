name: Live Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed pages
        run: |
          set -e
          BASE="https://matrixreprogrammed.com"
          FALLBACK="https://matrixreprogrammed.njmgroupfrance.workers.dev"
          mkdir -p smoke

          check_page() {
            path="$1"
            expected="$2"
            echo "Checking $BASE$path for: $expected"
            output="smoke/${path//\//_}.html"
            status="$(curl -L --silent --show-error --max-time 25 -w '%{http_code}' "$BASE$path" -o "$output" || true)"
            if [ "$status" = "403" ] && grep -qi 'Just a moment\.\.\.' "$output" && grep -qi 'cloudflare' "$output"; then
              echo "Custom domain returned a recognized Cloudflare challenge; verifying the same public route through the canonical Worker."
              status="$(curl -L --silent --show-error --max-time 25 -w '%{http_code}' "$FALLBACK$path" -o "$output" || true)"
            fi
            case "$status" in 2??|3??) ;; *) echo "HTTP $status for $path"; exit 1 ;; esac
            grep -i "$expected" "$output" >/dev/null
          }

          check_page "/" "MATRIX REPROGRAMMED"
          check_page "/books" "THE BOOK ARCHIVE"
          check_page "/books.html" "THE BOOK ARCHIVE"
          check_page "/news" "Latest 7 Days"
          check_page "/news.html" "Human Cost Evidence Panel"
          check_page "/amazon-store" "THE BOOK WALL"
          check_page "/amazon-store-books.html" "THE BOOK WALL"
          check_page "/black-file.html" "Black File"
          check_page "/book-as-above-so-below.html" "As Above"

          echo "Live smoke test passed."
