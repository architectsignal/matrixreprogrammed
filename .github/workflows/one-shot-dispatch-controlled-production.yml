name: One-shot controlled production dispatch

on:
  push:
    branches:
      - main
    paths:
      - .github/one-shot-controlled-production.trigger

permissions:
  actions: write
  contents: write

jobs:
  dispatch-controlled-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch fresh controlled production workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const supersededRunId = 29687662933;
            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const target = workflows.data.workflows.find(
              workflow => workflow.name === 'Matrix Reprogrammed Controlled Production Deploy'
            );
            if (!target) {
              core.setFailed('Controlled production workflow was not found.');
              return;
            }

            async function freshTargetRun() {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: target.id,
                event: 'workflow_dispatch',
                branch: 'main',
                per_page: 30
              });
              return runs.data.workflow_runs.find(run => run.id !== supersededRunId) || null;
            }

            let run = await freshTargetRun();
            let dispatched = false;
            if (!run) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: target.id,
                ref: 'main',
                inputs: { confirmation: 'DEPLOY MATRIX REPROGRAMMED' }
              });
              dispatched = true;
              for (let attempt = 0; attempt < 16 && !run; attempt += 1) {
                await new Promise(resolve => setTimeout(resolve, 2500));
                run = await freshTargetRun();
              }
            }

            const receipt = {
              ok: Boolean(run),
              dispatched,
              checkedAt: new Date().toISOString(),
              supersededRunId,
              targetWorkflowId: target.id,
              targetWorkflowName: target.name,
              targetWorkflowPath: target.path,
              run: run ? {
                id: run.id,
                status: run.status,
                conclusion: run.conclusion,
                event: run.event,
                headSha: run.head_sha,
                createdAt: run.created_at,
                updatedAt: run.updated_at,
                htmlUrl: run.html_url
              } : null
            };

            const receiptPath = '.github/one-shot-controlled-production.receipt.json';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path: receiptPath, ref: 'main' });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: receiptPath,
              branch: 'main',
              message: 'Record fresh controlled production dispatch receipt',
              content: Buffer.from(`${JSON.stringify(receipt, null, 2)}\n`).toString('base64'),
              ...(sha ? { sha } : {})
            });

            if (!run) {
              core.setFailed('Fresh controlled production workflow did not appear after dispatch.');
              return;
            }
            core.info(`Fresh controlled production run ${run.id}: ${run.status} ${run.html_url}`);
