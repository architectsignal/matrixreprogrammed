name: Matrix Reprogrammed Deep Site Audit

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 0'

concurrency:
  group: matrixreprogrammed-deep-site-audit
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deep-audit:
    name: Rebuild and audit every page, function, link and live route
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record exact audit commit
        run: echo "AUDIT_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build complete site and Worker assets
        env:
          SOURCE_DOCUMENTS_PER_RUN: '0'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p downloads
          npm run build 2>&1 | tee downloads/deep-audit-build.log

      - name: Reconcile exact Cloudflare bundle
        env:
          DEPLOY_COMMIT_SHA: ${{ env.AUDIT_COMMIT_SHA }}
        run: node scripts/final-production-reconcile.js

      - name: Exhaustive static audit
        id: static_audit
        continue-on-error: true
        run: node scripts/deep-production-site-audit-v2.js --static

      - name: Existing audit suite
        id: existing_audits
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p downloads
          : > downloads/deep-audit-existing-suite.log
          failed=0
          run_audit() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a downloads/deep-audit-existing-suite.log
            "$@" 2>&1 | tee -a downloads/deep-audit-existing-suite.log
            code=${PIPESTATUS[0]}
            echo "EXIT $code" | tee -a downloads/deep-audit-existing-suite.log
            if [ "$code" -ne 0 ]; then failed=1; fi
          }
          run_audit "full-site-function-tool-audit" node scripts/full-site-function-tool-audit.js --postbuild
          run_audit "site-function-harmony-test" node scripts/site-function-harmony-test.js
          run_audit "link-audit" node tools/link-audit.js
          run_audit "audit-site" node scripts/audit-site.js
          run_audit "pressure-test-site" node scripts/pressure-test-site.js
          run_audit "site-wide-function-audit" node scripts/site-wide-function-audit.js --postbuild
          exit "$failed"

      - name: Wait for exact commit to reach Cloudflare
        id: deploy_wait
        continue-on-error: true
        env:
          SITE_URL: https://matrixreprogrammed.com
          EXPECTED_COMMIT_SHA: ${{ env.AUDIT_COMMIT_SHA }}
          DEPLOY_WAIT_ATTEMPTS: '72'
          DEPLOY_WAIT_DELAY_MS: '10000'
        run: node scripts/wait-for-live-deploy-commit.js

      - name: Exhaustive live audit
        id: live_audit
        continue-on-error: true
        env:
          SITE_URL: https://matrixreprogrammed.com
        run: node scripts/deep-production-site-audit-v2.js --live

      - name: Publish sanitized audit summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            function load(name) {
              try { return JSON.parse(fs.readFileSync(path.join(process.cwd(), 'downloads', name), 'utf8')); }
              catch { return null; }
            }
            const staticReport = load('deep-production-site-audit-static.json');
            const liveReport = load('deep-production-site-audit-live.json');
            const deployWait = load('deep-audit-live-deploy-wait.json');
            const reports = [staticReport, liveReport].filter(Boolean);
            const hard = reports.flatMap(report => report.hardIssues || []);
            const warnings = reports.flatMap(report => report.warnings || []);
            const coverage = reports.map(report => `- ${report.mode} v${report.version || 1}: ${JSON.stringify(report.stats || {})}`).join('\n') || '- No deep report was produced; inspect the build log.';
            const stageStatus = {
              static: '${{ steps.static_audit.outcome }}',
              existing: '${{ steps.existing_audits.outcome }}',
              deployWait: '${{ steps.deploy_wait.outcome }}',
              live: '${{ steps.live_audit.outcome }}'
            };
            const status = reports.length === 2 && reports.every(report => report.ok) && deployWait?.ok === true && Object.values(stageStatus).every(value => value === 'success') ? 'PASS' : 'FAIL';
            const hardLines = hard.length ? hard.slice(0, 180).map(item => `- ${item}`).join('\n') : '- None';
            const warningLines = warnings.length ? warnings.slice(0, 80).map(item => `- ${item}`).join('\n') : '- None';
            const body = [
              `## Deep Site Audit ${status}`,
              '',
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Commit: \`${process.env.AUDIT_COMMIT_SHA || context.sha}\``,
              `Generated: ${new Date().toISOString()}`,
              `Stages: ${JSON.stringify(stageStatus)}`,
              `Live commit synchronized: ${deployWait?.ok === true}`,
              '',
              '### Coverage', coverage,
              '',
              `### Hard issues (${hard.length})`, hardLines,
              hard.length > 180 ? `\n- … ${hard.length - 180} additional hard issues are retained in the workflow artifact.` : '',
              '',
              `### Warnings (${warnings.length})`, warningLines,
              warnings.length > 80 ? `\n- … ${warnings.length - 80} additional warnings are retained in the workflow artifact.` : '',
              '',
              'No credentials, secret values or customer data are included in this summary.'
            ].join('\n').slice(0, 60000);
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: 94, body });

      - name: Enforce combined audit result
        if: always()
        env:
          STATIC_OUTCOME: ${{ steps.static_audit.outcome }}
          EXISTING_OUTCOME: ${{ steps.existing_audits.outcome }}
          DEPLOY_WAIT_OUTCOME: ${{ steps.deploy_wait.outcome }}
          LIVE_OUTCOME: ${{ steps.live_audit.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          function load(file) { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; } }
          const staticReport = load('downloads/deep-production-site-audit-static.json');
          const liveReport = load('downloads/deep-production-site-audit-live.json');
          const deployWait = load('downloads/deep-audit-live-deploy-wait.json');
          const outcomes = [process.env.STATIC_OUTCOME, process.env.EXISTING_OUTCOME, process.env.DEPLOY_WAIT_OUTCOME, process.env.LIVE_OUTCOME];
          const ok = staticReport?.ok === true && liveReport?.ok === true && deployWait?.ok === true && outcomes.every(value => value === 'success');
          if (!ok) {
            console.error(JSON.stringify({ ok, outcomes, staticOk: staticReport?.ok ?? null, liveOk: liveReport?.ok ?? null, deploySynchronized: deployWait?.ok ?? null }, null, 2));
            process.exit(1);
          }
          console.log('Combined static, legacy-suite, exact-deploy and live audit result passed.');
          NODE

      - name: Upload complete audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deep-site-audit-${{ github.run_id }}
          path: |
            downloads/deep-audit-build.log
            downloads/deep-audit-existing-suite.log
            downloads/deep-audit-live-deploy-wait.json
            downloads/deep-production-site-audit-static.json
            downloads/deep-production-site-audit-static.md
            downloads/deep-production-site-audit-live.json
            downloads/deep-production-site-audit-live.md
            downloads/full-site-function-tool-audit.json
            downloads/full-site-function-tool-audit.md
            downloads/site-function-harmony-report.json
            downloads/site-function-harmony-report.md
            downloads/link-audit-report.json
            downloads/site-audit-report.json
            downloads/site-pressure-report.json
            downloads/site-wide-function-audit.json
            downloads/final-production-reconcile.json
            downloads/deep-audit-accessibility-metadata-repair.json
            downloads/deep-audit-public-defect-repair.json
            downloads/voluntary-support-store-patch.json
          if-no-files-found: ignore
          retention-days: 60
