name: Money Intelligence Compatibility Check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'follow-the-money.html'
      - 'making-money.html'
      - 'follow-the-money/**'
      - 'making-money/**'
      - 'money-*.js'
      - 'money-*.html'
      - 'money-*.css'
      - 'src/money-overlap-graph.html'
      - 'src/money-overlap-graph.js'
      - 'src/money-command-center.js'
      - 'src/money-category-detailed.js'
      - 'data/follow-the-money-top-100.json'
      - 'data/making-money-core.json'
      - 'data/detailed-wealth-guides.json'
      - 'data/money-intelligence-registry.json'
      - 'data/money-overlap-graph.json'
      - 'data/money-search-index.json'
      - 'data/money-intelligence-brief-feed.json'
      - 'data/wealth-methods.json'
      - 'scripts/build-money-intelligence-system.js'
      - 'scripts/build-money-intelligence-expansion.js'
      - 'scripts/build-complete-capital-lists.js'
      - 'scripts/refine-trust-structure-coverage.js'
      - 'scripts/normalize-capital-record-details.js'
      - 'scripts/complete-capital-lists-test.js'
      - 'scripts/build-money-overlap-map.js'
      - 'scripts/money-overlap-map-test.js'
      - 'scripts/install-intelligence-reporting-system.js'
      - 'scripts/build-detailed-wealth-guides.js'
      - 'scripts/detailed-wealth-guides-test.js'
      - 'scripts/money-intelligence-expansion-test.js'
      - 'scripts/build-all-branded-download-pdfs.js'
      - 'scripts/build-deep-pdf-intelligence.mjs'
      - 'scripts/deep-pdf-intelligence-test.js'
      - 'scripts/money-intelligence-system-test.js'
      - 'src/worker-intelligence-reports.js'
      - '.github/workflows/money-intelligence.yml'
      - '.github/workflows/money-intelligence-refresh.yml'

permissions:
  contents: read

concurrency:
  group: money-intelligence-compatibility-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate legacy and current money generators
        env:
          MATRIX_MONEY_REFRESH: '1'
          MATRIX_MONEY_REQUIRE_LIVE: '1'
        run: |
          node --check scripts/build-money-intelligence-system.js
          node --check scripts/build-money-intelligence-expansion.js
          node --check scripts/build-complete-capital-lists.js
          node --check scripts/refine-trust-structure-coverage.js
          node --check scripts/normalize-capital-record-details.js
          node --check scripts/complete-capital-lists-test.js
          node --check scripts/build-money-overlap-map.js
          node --check scripts/money-overlap-map-test.js
          node --check scripts/install-intelligence-reporting-system.js
          node --check src/money-overlap-graph.js
          node --check src/money-command-center.js
          node --check src/money-category-detailed.js
          node --check money-graph.js
          node --check money-command-center.js
          node --check scripts/build-detailed-wealth-guides.js
          node --check scripts/detailed-wealth-guides-test.js
          node scripts/build-money-intelligence-system.js
          node scripts/build-all-branded-download-pdfs.js
          node scripts/build-black-file-pdf.js
          node scripts/money-intelligence-system-test.js
          node scripts/deep-pdf-intelligence-test.js
          node scripts/build-money-intelligence-expansion.js
          node scripts/money-intelligence-expansion-test.js
          node scripts/build-complete-capital-lists.js
          node scripts/refine-trust-structure-coverage.js
          node scripts/normalize-capital-record-details.js
          node scripts/complete-capital-lists-test.js
          node scripts/build-money-overlap-map.js
          node scripts/money-overlap-map-test.js
          node scripts/build-detailed-wealth-guides.js
          node scripts/detailed-wealth-guides-test.js

      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: money-intelligence-compatibility-${{ github.run_id }}
          path: |
            downloads/deep-pdf-intelligence-test.json
            downloads/deep-pdf-intelligence-test-failure.json
            downloads/detailed-wealth-guides-test.json
            downloads/wealth-guides/index.json
            data/detailed-wealth-guides.json
            data/money-intelligence-brief-feed.json
            data/money-overlap-graph.json
            data/money-intelligence-registry.json
          if-no-files-found: warn
          retention-days: 14
