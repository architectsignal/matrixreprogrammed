name: Forum Repair Idempotence And Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/forum-repair-idempotence.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: forum-repair-idempotence
  cancel-in-progress: false

jobs:
  patch-test-commit-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make forum repairs repeat-safe
        run: |
          node - <<'NODE'
          const fs=require('fs');

          {
            const file='scripts/repair-forum-member-posting.js';
            let source=fs.readFileSync(file,'utf8');
            const before=`function replaceOrFail(source, before, after, label) {
            if (source.includes(after)) return source;
            if (!source.includes(before)) throw new Error(\`${'${label}'} anchor is missing\`);
            return source.replace(before, after);
          }`.replace(/^          /gm,'');
            const after=`function replaceOrFail(source, before, after, label) {
            if (source.includes(after)) return source;
            if (label === 'domain-wide session clear cookie' && source.includes("function authClearCookies(){return ['matrix_session_v2=; Domain=matrixreprogrammed.com; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax','matrix_session=; Path=/; Max-Age=0; HttpOnly; Secure; SameSite=Lax']}")) return source;
            if (!source.includes(before)) throw new Error(\`${'${label}'} anchor is missing\`);
            return source.replace(before, after);
          }`.replace(/^          /gm,'');
            if(!source.includes(after)){
              if(!source.includes(before))throw new Error('repair-forum-member-posting replaceOrFail anchor missing');
              source=source.replace(before,after);
              fs.writeFileSync(file,source);
            }
          }

          {
            const file='scripts/repair-forum-page-consistency.js';
            let source=fs.readFileSync(file,'utf8');
            const before=`for (const relative of ['forum.html', 'dark-speculation-forum.html', 'epstein-alive-board.html']) {
            const html = read(relative);
            if (!html.includes('forum.js?v=20260720-forum-member-posting-v3')) throw new Error(\`${'${relative}'} does not load the repaired forum client\`);
            if (!html.includes('id="forum-member-status"')) throw new Error(\`${'${relative}'} does not expose member-session status\`);
            if (!html.includes('id="signal-board-form"')) throw new Error(\`${'${relative}'} has no posting form\`);
            if (!html.includes('class="signal-lock-message"')) throw new Error(\`${'${relative}'} has no authenticated posting lock\`);
          }`.replace(/^          /gm,'');
            const after=`for (const relative of ['forum.html', 'dark-speculation-forum.html', 'epstein-alive-board.html']) {
            let html = read(relative);
            html = html.replace(/<script src="forum\\.js(?:\\?[^\"]*)?"><\\/script>/g, '<script src="forum.js?v=20260720-forum-member-posting-v3"></script>');
            if (!html.includes('forum.js?v=20260720-forum-member-posting-v3')) html = html.replace('</body>', '<script src="forum.js?v=20260720-forum-member-posting-v3"></script></body>');
            write(relative, html);
            if (!html.includes('forum.js?v=20260720-forum-member-posting-v3')) throw new Error(\`${'${relative}'} does not load the repaired forum client\`);
            if (!html.includes('id="forum-member-status"')) throw new Error(\`${'${relative}'} does not expose member-session status\`);
            if (!html.includes('id="signal-board-form"')) throw new Error(\`${'${relative}'} has no posting form\`);
            if (!html.includes('class="signal-lock-message"')) throw new Error(\`${'${relative}'} has no authenticated posting lock\`);
          }`.replace(/^          /gm,'');
            if(!source.includes(after)){
              if(!source.includes(before))throw new Error('repair-forum-page-consistency validation loop anchor missing');
              source=source.replace(before,after);
              fs.writeFileSync(file,source);
            }
          }
          NODE

      - name: Prove repeated forum repair and exact D1 contract
        run: |
          node scripts/repair-forum-member-posting.js
          node scripts/repair-forum-login-canonical.js
          node scripts/repair-forum-session-compatibility.js
          node scripts/repair-forum-page-consistency.js
          node scripts/forum-member-posting-test.js
          node scripts/repair-forum-member-posting.js
          node scripts/repair-forum-login-canonical.js
          node scripts/repair-forum-session-compatibility.js
          node scripts/repair-forum-page-consistency.js
          node scripts/forum-member-posting-test.js
          node --check forum.js
          node --check src/worker.js
          node --check src/worker-member-experience.js
          node --check src/worker-forum-persistence.js
          node --check src/worker-production.js

      - name: Commit repeat-safe forum owners
        run: |
          git config user.name 'forum-idempotence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            scripts/repair-forum-member-posting.js \
            scripts/repair-forum-page-consistency.js \
            scripts/cloudflare-worker-routes-test.js \
            scripts/final-production-reconcile.js \
            forum.js forum.html dark-speculation-forum.html epstein-alive-board.html member-login.html \
            src/worker.js src/worker-member-experience.js src/worker-forum-persistence.js
          if ! git diff --cached --quiet; then
            git commit -m 'Make authenticated forum repair repeat-safe'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep $((attempt * 2))
            done
          fi

      - name: Cancel stale production runs and dispatch one clean release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run list --workflow deploy.yml --limit 100 --json databaseId,status \
            --repo "$GITHUB_REPOSITORY" --jq '.[] | select(.status != "completed") | .databaseId' > /tmp/active.txt
          while read -r run_id; do [ -z "$run_id" ] || gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true; done < /tmp/active.txt
          sleep 8
          gh workflow run 'Matrix Reprogrammed Controlled Production Deploy' \
            --repo "$GITHUB_REPOSITORY" --ref main -f confirmation='DEPLOY MATRIX REPROGRAMMED'
          sleep 8
          mkdir -p downloads
          gh run list --workflow deploy.yml --limit 5 --repo "$GITHUB_REPOSITORY" \
            --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle \
            > downloads/idempotent-forum-controlled-deploy.json

      - name: Commit exact production dispatch receipt
        run: |
          git config user.name 'forum-idempotence-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add downloads/idempotent-forum-controlled-deploy.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record idempotent forum production dispatch'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
