name: Controlled Release Status Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-status-snapshot.yml'
      - '.github/release-status-snapshot.trigger'
  workflow_run:
    workflows:
      - Matrix Reprogrammed Controlled Production Deploy
      - Matrix Money Intelligence Refresh
      - Detailed Wealth Guide Library
      - Wealth PDF Visual Proof Package
      - Epstein AI Detective Docket
      - Card Artwork Automation
      - Permanent Release Metadata Repair
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: controlled-release-status-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Read current workflow states
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p data /tmp/matrix-release-status
          read_runs() {
            local workflow="$1"
            local output="$2"
            if gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --limit 12 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url,event > "$output"; then
              return 0
            fi
            echo '[]' > "$output"
          }
          read_runs deploy.yml /tmp/matrix-release-status/deploy.json
          read_runs money-intelligence-refresh.yml /tmp/matrix-release-status/money.json
          read_runs detailed-wealth-guides.yml /tmp/matrix-release-status/wealth-guides.json
          read_runs wealth-pdf-visual-proof.yml /tmp/matrix-release-status/wealth-pdf-visual-proof.json
          read_runs epstein-ai-detective.yml /tmp/matrix-release-status/epstein.json
          read_runs card-artwork-automation.yml /tmp/matrix-release-status/artwork.json
          read_runs permanent-release-metadata-repair.yml /tmp/matrix-release-status/release-metadata.json
          node - <<'NODE'
          const fs=require('fs');
          const read=name=>JSON.parse(fs.readFileSync(`/tmp/matrix-release-status/${name}.json`,'utf8'));
          const deploy=read('deploy');
          const money=read('money');
          const wealthGuides=read('wealth-guides');
          const wealthPdfVisualProof=read('wealth-pdf-visual-proof');
          const epstein=read('epstein');
          const artwork=read('artwork');
          const releaseMetadata=read('release-metadata');
          const latest=runs=>runs[0]||null;
          const production=latest(deploy);
          const payload={
            ok:Boolean(production&&production.status==='completed'&&production.conclusion==='success'),
            observedAt:new Date().toISOString(),
            production,
            moneyIntelligence:latest(money),
            detailedWealthGuides:latest(wealthGuides),
            wealthPdfVisualProof:latest(wealthPdfVisualProof),
            epsteinAiDetective:latest(epstein),
            cardArtwork:latest(artwork),
            releaseMetadataRepair:latest(releaseMetadata),
            recent:{production:deploy,moneyIntelligence:money,detailedWealthGuides:wealthGuides,wealthPdfVisualProof,epsteinAiDetective:epstein,cardArtwork:artwork,releaseMetadataRepair:releaseMetadata},
            boundary:'A dispatched, queued or in-progress run is not a successful deployment. Production is live only after the controlled deployment and exact no-cache verification complete successfully.'
          };
          fs.writeFileSync('data/release-run-status.json',JSON.stringify(payload,null,2)+'\n');
          NODE
      - name: Commit status only when changed
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/release-run-status.json
          if git diff --cached --quiet; then
            echo "Release status unchanged"
            exit 0
          fi
          git commit -m "Record current release workflow status"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
          done
          exit 1
