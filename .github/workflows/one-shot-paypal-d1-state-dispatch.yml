name: One-shot PayPal D1 state repair dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/one-shot-paypal-d1-state.trigger

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch controlled production workflow and record run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: { confirmation: 'DEPLOY MATRIX REPROGRAMMED' }
            });
            await new Promise(resolve => setTimeout(resolve, 4000));
            const runs = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'deploy.yml',
              branch: 'main',
              event: 'workflow_dispatch',
              per_page: 10
            });
            const run = runs.data.workflow_runs[0];
            if (!run) throw new Error('Controlled production run was not found after dispatch');
            const payload = JSON.stringify({
              ok: true,
              dispatchedAt: new Date().toISOString(),
              purpose: 'Repair PayPal subscription creation D1 status compatibility',
              run: { id: run.id, status: run.status, headSha: run.head_sha, htmlUrl: run.html_url }
            }, null, 2) + '\n';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path: '.github/one-shot-paypal-d1-state-run.json', ref: 'main' });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: '.github/one-shot-paypal-d1-state-run.json',
              message: 'Record PayPal D1 repair production run',
              content: Buffer.from(payload).toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {})
            });