name: Ensure AI Speculation Link

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: ensure-ai-speculation-link-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-link-owner:
    name: Verify Answer Engine link owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify generator-owned links
        run: node scripts/ai-speculation-link-owner-test.js
