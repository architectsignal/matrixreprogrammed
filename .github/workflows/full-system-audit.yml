name: Full System Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '47 10 * * *'
  workflow_run:
    workflows:
      - Matrix Reprogrammed Production Deploy
    types:
      - completed
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'data/**'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - '**.html'
      - '**.css'
      - '**.js'

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: full-system-audit-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  full-system-audit:
    name: Current architecture, every public output, live routes and search
    runs-on: ubuntu-latest
    timeout-minutes: 100
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Checkout audited commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run current full system audit
        env:
          DEPLOY_COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          SOURCE_DOCUMENTS_PER_RUN: '0'
        run: node scripts/full-system-audit.js

      - name: Crawl live routes, external links, datasets and conclusions
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: https://matrixreprogrammed.com
        run: node scripts/manual-deep-site-audit.js

      - name: Verify live search and investigation queries
        if: github.event_name != 'pull_request'
        env:
          SITE_URL: https://matrixreprogrammed.com
          SEARCH_TEST_LIVE: 'true'
        run: node scripts/search-investigation-smoke-test.js

      - name: Upload full system audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-audit-reports-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            downloads/full-system-audit.json
            downloads/full-system-audit.md
            downloads/exhaustive-public-site-audit.json
            downloads/exhaustive-public-site-audit.md
            downloads/search-investigation-smoke-test.json
            downloads/manual-deep-site-audit.json
            downloads/manual-deep-site-audit.md
            downloads/site-function-harmony-report.json
            downloads/site-function-harmony-report.md
            downloads/cloudflare-worker-routes-test.json
            downloads/cloudflare-focused-pressure-wrapper.json
            downloads/production-sync-test.json
            downloads/production-freshness-guard.json
            downloads/production-deploy-guard-report.json
            downloads/forum-persistence-d1-test.json
            downloads/deploy-health.json
            downloads/deploy-manifest.json
            data/investigation-status.json
            data/investigation-ledger.json
            data/daily-investigation-conclusions.json
            data/weekly-investigation-conclusions.json
          if-no-files-found: ignore
          retention-days: 21

      - name: Post audit report to GitHub issue
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const title = 'Full System Audit Report';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const readJson = file => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; } };
            const full = readJson(path.join(process.cwd(), 'downloads', 'full-system-audit.json'));
            const deep = readJson(path.join(process.cwd(), 'downloads', 'manual-deep-site-audit.json'));
            const search = readJson(path.join(process.cwd(), 'downloads', 'search-investigation-smoke-test.json'));
            const status = full?.ok && (!deep || deep.ok) && (!search || search.ok) ? 'PASS' : 'FAIL';
            let reportMd = fs.existsSync(path.join(process.cwd(), 'downloads', 'full-system-audit.md'))
              ? fs.readFileSync(path.join(process.cwd(), 'downloads', 'full-system-audit.md'), 'utf8')
              : '# Full System Audit\n\nReport missing.';
            if (reportMd.length > 55000) reportMd = reportMd.slice(0, 55000) + '\n\n_Report truncated. Open the workflow artifact for the full report._';
            const summary = `\n\n## Machine Summary\n\n- Status: ${status}\n- Commit: ${full?.summary?.deploySha ?? 'unknown'}\n- Critical command failures: ${full?.summary?.failedCriticalCommands ?? 'unknown'}\n- Critical system failures: ${full?.summary?.failedCriticalSystems ?? 'unknown'}\n- Warnings: ${full?.summary?.warningCount ?? 'unknown'}\n- Live audit: ${deep ? (deep.ok ? 'PASS' : 'FAIL') : 'not run'}\n- Search audit: ${search ? (search.ok ? 'PASS' : 'FAIL') : 'not run'}\n- Forum: D1 authoritative\n- Payments: deferred; no payment taken\n`;
            const body = `# Latest Full System Audit\n\nStatus: **${status}**\n\nWorkflow run: ${runUrl}\n${summary}\n---\n\n${reportMd}`;
            const found = await github.rest.search.issuesAndPullRequests({ q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"` });
            if (found.data.items.length) {
              const issue_number = found.data.items[0].number;
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body: `Full System Audit finished with **${status}**.\n\nRun: ${runUrl}` });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['full-system-audit'] });
            }
