name: Deploy Production (Accepted Artifact Manual Fallback)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY ACCEPTED ARTIFACT'
        required: true
        default: 'NO'
      critical_run_id:
        description: 'Successful Paid Launch Critical Gate run ID'
        required: true
      passing_sha:
        description: 'Exact 40-character SHA that passed that critical gate'
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: matrixreprogrammed-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Manual staging and production deploy of one accepted artifact
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: ${{ github.event.inputs.confirm == 'DEPLOY ACCEPTED ARTIFACT' }}
    steps:
      - name: Validate immutable input format
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.passing_sha }}" =~ ^[0-9a-f]{40}$ ]] || { echo 'passing_sha must be a full lowercase commit SHA'; exit 1; }
          [[ "${{ inputs.critical_run_id }}" =~ ^[0-9]+$ ]] || { echo 'critical_run_id must be numeric'; exit 1; }

      - name: Checkout the exact accepted SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.passing_sha }}
          fetch-depth: 0

      - name: Record and prove accepted SHA
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "${{ inputs.passing_sha }}"
          git merge-base --is-ancestor "$actual_sha" origin/main || { echo 'Accepted SHA is not contained in main'; exit 1; }
          echo "DEPLOY_COMMIT_SHA=$actual_sha" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=$actual_sha" >> "$GITHUB_ENV"
          rm -rf _site
          mkdir -p downloads

      - name: Download exact artifact from the named critical-gate run
        uses: actions/download-artifact@v4
        with:
          name: paid-launch-artifact-${{ inputs.passing_sha }}
          run-id: ${{ inputs.critical_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Verify immutable artifact provenance and hashes
        shell: bash
        run: |
          set -euo pipefail
          test -d _site
          test -s _site/build-provenance.json
          test -s downloads/paid-launch-passing-sha.txt
          test -s downloads/paid-launch-deploy-manifest.sha256
          test -s downloads/paid-launch-deploy-manifest.digest
          test "$(tr -d '\r\n' < downloads/paid-launch-passing-sha.txt)" = "$DEPLOY_COMMIT_SHA"
          sha256sum -c downloads/paid-launch-deploy-manifest.digest
          sha256sum -c downloads/paid-launch-deploy-manifest.sha256
          node - <<'NODE'
          const fs=require('fs');
          const provenance=JSON.parse(fs.readFileSync('_site/build-provenance.json','utf8'));
          if(provenance.sourceSha!==process.env.DEPLOY_COMMIT_SHA)throw new Error(`Artifact provenance ${provenance.sourceSha} differs from ${process.env.DEPLOY_COMMIT_SHA}`);
          console.log(`Manual fallback accepted artifact verified: ${provenance.sourceSha}`);
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies without rebuilding
        run: npm ci

      - name: Recheck Worker, route, OSINT and payment boundaries
        run: |
          node scripts/cloudflare-worker-routes-test.js
          node scripts/worker-route-context-matrix-test.js
          node scripts/osint-tools-test.js
          node scripts/phase7-paypal-sandbox-rehearsal-test.mjs
          node scripts/phase8-autonomous-sandbox-readiness-test.mjs
          node --check src/worker.js
          node --check src/worker-email-lifecycle.js
          node --check src/worker-member-experience.js
          node --check src/worker-paypal-subscriptions.js
          node --check src/worker-paypal-sandbox-rehearsal.js
          node --check src/worker-production.js
          npx --yes wrangler@latest deploy --config wrangler.staging.jsonc --dry-run
          npx --yes wrangler@latest deploy --config wrangler.jsonc --dry-run

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'CLOUDFLARE_API_TOKEN is missing' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'CLOUDFLARE_ACCOUNT_ID is missing' && exit 1)
          npx --yes wrangler@latest whoami
          npx --yes wrangler@latest d1 info matrix-members

      - name: Deploy accepted artifact to isolated staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.staging.jsonc 2>&1 | tee downloads/manual-staging-deploy.log
          staging_url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' downloads/manual-staging-deploy.log | tail -n 1 || true)"
          test -n "$staging_url"
          echo "STAGING_URL=$staging_url" >> "$GITHUB_ENV"
          printf '%s\n' "$staging_url" > downloads/manual-staging-url.txt
          sha256sum -c downloads/paid-launch-deploy-manifest.sha256

      - name: Apply and validate isolated staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            migrations/0001_membership_foundation.sql
            migrations/0004_forum_persistence.sql
            migrations/phase4_email_lifecycle.sql
            migrations/phase4_email_lifecycle_portability.sql
            migrations/phase5_member_experience.sql
            migrations/phase5_member_experience_timestamp_fix.sql
            migrations/phase6_paypal_subscriptions.sql
            migrations/phase6_paypal_failure_counter_fix.sql
            migrations/phase7_paypal_sandbox_rehearsal.sql
            migrations/phase8_paypal_sandbox_bootstrap.sql
          )
          : > downloads/manual-staging-d1-migration.log
          for migration in "${migrations[@]}"; do
            npx --yes wrangler@latest d1 execute MEMBERS_DB --config wrangler.staging.jsonc --remote --file="$migration" --yes 2>&1 | tee -a downloads/manual-staging-d1-migration.log
          done
          npx --yes wrangler@latest d1 execute MEMBERS_DB --config wrangler.staging.jsonc --remote --command="SELECT type,name FROM sqlite_master WHERE name IN ('members','member_sessions','subscriptions','paypal_runtime_settings','member_effective_entitlements','member_download_eligibility') ORDER BY type,name;" --json > downloads/manual-staging-schema.json
          npx --yes wrangler@latest d1 execute MEMBERS_DB --config wrangler.staging.jsonc --remote --command="SELECT environment,checkout_enabled FROM paypal_runtime_settings ORDER BY environment;" --json > downloads/manual-staging-paypal-switches.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=value=>value.flatMap(item=>item.results||item.result?.results||[]);
          const schema=rows(JSON.parse(fs.readFileSync('downloads/manual-staging-schema.json','utf8')));
          const names=new Set(schema.map(row=>row.name));
          for(const name of ['members','member_sessions','subscriptions','paypal_runtime_settings','member_effective_entitlements','member_download_eligibility'])if(!names.has(name))throw new Error(`Staging missing ${name}`);
          const switches=rows(JSON.parse(fs.readFileSync('downloads/manual-staging-paypal-switches.json','utf8')));
          if(switches.some(row=>Number(row.checkout_enabled)!==0))throw new Error('Staging checkout must remain disabled');
          NODE

      - name: Verify isolated staging SHA and fail-closed routes
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$STAGING_URL/build-provenance.json" > downloads/manual-staging-provenance.json
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$STAGING_URL/api/auth/health" > downloads/manual-staging-auth-health.json
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$STAGING_URL/api/paypal/health" > downloads/manual-staging-paypal-health.json
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_URL/api/member/me")" = '401'
          test "$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_URL/api/tools/config")" = '401'
          node - <<'NODE'
          const fs=require('fs');
          const provenance=JSON.parse(fs.readFileSync('downloads/manual-staging-provenance.json','utf8'));
          const auth=JSON.parse(fs.readFileSync('downloads/manual-staging-auth-health.json','utf8'));
          const paypal=JSON.parse(fs.readFileSync('downloads/manual-staging-paypal-health.json','utf8'));
          if(provenance.sourceSha!==process.env.DEPLOY_COMMIT_SHA)throw new Error('Staging SHA mismatch');
          if(!auth.d1Connected||!auth.authSchemaReady||auth.transactionalEmailConfigured)throw new Error('Staging authentication boundary invalid');
          if(paypal.environment!=='sandbox'||paypal.configured)throw new Error('Staging PayPal boundary invalid');
          NODE
          sha256sum -c downloads/paid-launch-deploy-manifest.sha256

      - name: Capture production D1 rollback bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 time-travel info matrix-members --json > downloads/d1-time-travel-bookmark.json
          node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('downloads/d1-time-travel-bookmark.json','utf8'));
          if(!payload||typeof payload.bookmark!=='string'||payload.bookmark.trim().length<8)throw new Error('Valid D1 rollback bookmark missing');
          fs.writeFileSync('downloads/d1-rollback-proof.json',JSON.stringify({ok:true,commit:process.env.DEPLOY_COMMIT_SHA,createdAt:new Date().toISOString(),database:'matrix-members',method:'Cloudflare D1 Time Travel bookmark',bookmark:payload.bookmark,restoreCommand:`wrangler d1 time-travel restore matrix-members --bookmark=${payload.bookmark}`},null,2));
          NODE

      - name: Apply and validate production D1 migrations with PayPal disabled
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          migrations=(
            migrations/0001_membership_foundation.sql
            migrations/0004_forum_persistence.sql
            migrations/phase4_email_lifecycle.sql
            migrations/phase4_email_lifecycle_portability.sql
            migrations/phase5_member_experience.sql
            migrations/phase5_member_experience_timestamp_fix.sql
            migrations/phase6_paypal_subscriptions.sql
            migrations/phase6_paypal_failure_counter_fix.sql
            migrations/phase7_paypal_sandbox_rehearsal.sql
            migrations/phase8_paypal_sandbox_bootstrap.sql
          )
          : > downloads/d1-migration.log
          for migration in "${migrations[@]}"; do
            npx --yes wrangler@latest d1 execute matrix-members --remote --file="$migration" --yes 2>&1 | tee -a downloads/d1-migration.log
          done
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT environment,checkout_enabled,activation_reason FROM paypal_runtime_settings ORDER BY environment;" --json > downloads/paypal-runtime-settings.json
          node - <<'NODE'
          const fs=require('fs');
          const payload=JSON.parse(fs.readFileSync('downloads/paypal-runtime-settings.json','utf8'));
          const rows=payload.flatMap(item=>item.results||item.result?.results||[]);
          if(rows.some(row=>Number(row.checkout_enabled)!==0))throw new Error('Production PayPal checkout must remain disabled');
          NODE
          sha256sum -c downloads/paid-launch-deploy-manifest.sha256

      - name: Deploy exact accepted artifact to production routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc 2>&1 | tee downloads/manual-production-deploy.log

      - name: Verify live production and accepted SHA
        env:
          SITE_URL: https://matrixreprogrammed.com
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_VERIFY_ATTEMPTS: '36'
          LIVE_VERIFY_DELAY_MS: '10000'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live-production.js
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "$SITE_URL/build-provenance.json" > downloads/live-build-provenance.json
          node - <<'NODE'
          const fs=require('fs');
          const live=JSON.parse(fs.readFileSync('downloads/live-build-provenance.json','utf8'));
          if(live.sourceSha!==process.env.DEPLOY_COMMIT_SHA)throw new Error(`Live SHA ${live.sourceSha} differs from accepted SHA ${process.env.DEPLOY_COMMIT_SHA}`);
          NODE

      - name: Upload manual fallback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-accepted-artifact-proof-${{ github.run_id }}
          path: |
            downloads/paid-launch-passing-sha.txt
            downloads/paid-launch-deploy-manifest.sha256
            downloads/paid-launch-deploy-manifest.digest
            downloads/manual-staging-deploy.log
            downloads/manual-staging-url.txt
            downloads/manual-staging-d1-migration.log
            downloads/manual-staging-schema.json
            downloads/manual-staging-paypal-switches.json
            downloads/manual-staging-provenance.json
            downloads/manual-staging-auth-health.json
            downloads/manual-staging-paypal-health.json
            downloads/d1-time-travel-bookmark.json
            downloads/d1-rollback-proof.json
            downloads/d1-migration.log
            downloads/paypal-runtime-settings.json
            downloads/manual-production-deploy.log
            downloads/live-production-verification.json
            downloads/live-build-provenance.json
          if-no-files-found: ignore
          retention-days: 60
