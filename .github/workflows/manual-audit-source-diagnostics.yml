name: Manual Audit Source Diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run canonical build and final reconciliation
        shell: bash
        run: |
          mkdir -p diagnostics
          set +e
          npm run build > diagnostics/build.log 2>&1
          echo $? > diagnostics/build.exit
          node scripts/final-production-reconcile.js > diagnostics/reconcile.log 2>&1
          echo $? > diagnostics/reconcile.exit
          set -e
      - name: Run manual deep audit and capture full output
        shell: bash
        run: |
          set +e
          node scripts/manual-deep-site-audit.js > diagnostics/manual-deep-audit.log 2>&1
          echo $? > diagnostics/manual-deep-audit.exit
          cp downloads/manual-deep-site-audit.json diagnostics/ 2>/dev/null || true
          cp downloads/manual-deep-site-audit.md diagnostics/ 2>/dev/null || true
          cp downloads/public-site-error-repair.json diagnostics/ 2>/dev/null || true
          set -e
      - name: Upload complete diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: manual-audit-source-diagnostics
          path: diagnostics/
          if-no-files-found: error
