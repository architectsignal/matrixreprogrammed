name: Phase 3 Preview Generation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'data/phase3-preview-generation-policy.json'
      - 'data/phase3-locked-section-policy.json'
      - 'data/phase3-tier-matrix-policy.json'
      - 'data/phase3-public-private-policy.json'
      - 'data/phase3-canonical-taxonomy.json'
      - 'scripts/build-phase3-preview-generation.js'
      - 'scripts/build-phase3-locked-section-simulation.js'
      - 'scripts/build-phase3-tier-matrix.js'
      - 'scripts/build-phase3-public-private-classification.js'
      - '.github/workflows/phase3-preview-generation.yml'

permissions:
  contents: read

concurrency:
  group: phase3-preview-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Generate isolated category and access previews
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate preview policies and scripts
        run: |
          node -e "JSON.parse(require('fs').readFileSync('data/phase3-preview-generation-policy.json','utf8'))"
          node --check scripts/build-phase3-preview-generation.js
          node --check scripts/build-phase3-locked-section-simulation.js
          node --check scripts/build-phase3-tier-matrix.js
          node --check scripts/build-phase3-public-private-classification.js

      - name: Record protected file hashes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const files = [
            'data/phase3-preview-generation-policy.json',
            'data/phase3-locked-section-policy.json',
            'data/phase3-tier-matrix-policy.json',
            'data/phase3-public-private-policy.json',
            'data/phase3-canonical-taxonomy.json',
            'membership.html',
            'wrangler.toml',
            'src/worker-production.js',
            'src/worker-forum-persistence.js',
            'scripts/final-production-reconcile.js'
          ];
          const hashes = Object.fromEntries(files.map(file => [file, crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')]));
          fs.writeFileSync('/tmp/phase3-preview-protected-before.json',JSON.stringify(hashes,null,2));
          NODE

      - name: Clean generated upstream and preview outputs
        run: |
          rm -rf downloads/phase3-preview-generation downloads/phase3-locked-section-simulation downloads/phase3-tier-matrix downloads/phase3-public-private-classification
          rm -f downloads/phase0-content-tier-classification.json downloads/phase0-content-tier-classification.md
          rm -f downloads/phase2a-route-family-review-map.json downloads/phase2a-route-family-review-map.md

      - name: Build Phase 3 structural preview
        run: node scripts/build-phase3-preview-generation.js

      - name: Validate complete preview coverage and isolation
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const policy = JSON.parse(fs.readFileSync('data/phase3-preview-generation-policy.json','utf8'));
          const matrix = JSON.parse(fs.readFileSync('downloads/phase3-tier-matrix/tier-matrix.json','utf8'));
          const manifest = JSON.parse(fs.readFileSync('downloads/phase3-preview-generation/manifest.json','utf8'));
          const catalogue = JSON.parse(fs.readFileSync('downloads/phase3-preview-generation/catalogue.json','utf8'));
          const routes = JSON.parse(fs.readFileSync('downloads/phase3-preview-generation/route-manifest.json','utf8'));
          const navigation = JSON.parse(fs.readFileSync('downloads/phase3-preview-generation/navigation-report.json','utf8'));
          if (!manifest.ok || !catalogue.ok || !routes.ok || !navigation.ok) throw new Error('Phase 3 preview package is not healthy');
          if (manifest.mode !== 'preview-only' || policy.mode !== 'preview-only') throw new Error('Preview-only boundary changed');
          if (catalogue.recordCount !== matrix.rows.length || manifest.summary.importantItems !== matrix.rows.length) throw new Error('Tier-matrix coverage is incomplete');
          if (new Set(catalogue.records.map(item => item.canonicalId)).size !== catalogue.recordCount) throw new Error('Catalogue IDs are not unique');
          const publicExpected = matrix.rows.filter(row => !['internal_only','restricted_sensitive'].includes(row.targetAccessClass)).length;
          if (manifest.summary.publicItemPreviews !== publicExpected) throw new Error(`Expected ${publicExpected} public previews, received ${manifest.summary.publicItemPreviews}`);
          if (manifest.summary.targetItemPreviews !== matrix.rows.length) throw new Error('Target-access preview coverage is incomplete');
          if (manifest.summary.orphanRoutes !== 0 || navigation.orphanCount !== 0 || manifest.summary.safetyErrors !== 0 || manifest.safetyErrors.length) throw new Error('Orphaned or unsafe preview routes remain');
          if (routes.routeCount !== manifest.summary.totalRoutes || new Set(routes.routes.map(route => route.route)).size !== routes.routeCount) throw new Error('Preview route manifest contains duplicates or incomplete coverage');
          const routeSet = new Set(routes.routes.map(route => route.route));
          for (const item of catalogue.records) {
            if (!routeSet.has(item.targetPreviewRoute)) throw new Error(`${item.sourcePath}: target preview route missing`);
            if (['internal_only','restricted_sensitive'].includes(item.targetAccessClass)) {
              if (item.publicPreviewRoute !== null) throw new Error(`${item.sourcePath}: internal or restricted item received a public preview`);
            } else if (!item.publicPreviewRoute || !routeSet.has(item.publicPreviewRoute)) {
              throw new Error(`${item.sourcePath}: public preview route missing`);
            }
            if (item.migrationState !== 'preview_generated') throw new Error(`${item.sourcePath}: migration state not advanced to preview_generated`);
          }
          for (const route of routes.routes) {
            if (!route.route.startsWith(policy.namespace)) throw new Error(`Route escaped preview namespace: ${route.route}`);
            const target = path.join('downloads/phase3-preview-generation',route.outputFile);
            if (!fs.existsSync(target)) throw new Error(`Missing preview file: ${route.outputFile}`);
            if (route.outputFile.endsWith('.html')) {
              const html = fs.readFileSync(target,'utf8');
              if (!html.includes('noindex,nofollow,noarchive') || !html.includes('data-phase3-preview-route=')) throw new Error(`${route.outputFile}: preview safety marker missing`);
              if (/<script|<form/i.test(html)) throw new Error(`${route.outputFile}: executable script or form detected`);
              if (/createSubscription|checkout-intent|paypal\.buttons|fetch\s*\(|XMLHttpRequest|\/api\//i.test(html)) throw new Error(`${route.outputFile}: active service marker detected`);
            }
          }
          if (manifest.routeMovement !== false || manifest.redirectActivation !== false || manifest.searchMutation !== false || manifest.navigationMutation !== false || manifest.lockedSectionEnforcement !== false || manifest.authenticationActivation !== false || manifest.entitlementActivation !== false || manifest.emailDeliveryActivation !== false || manifest.paymentActivation !== false || manifest.contentMutation !== false) throw new Error('A protected action was activated');
          console.log(`PHASE 3 PREVIEW PASS: ${manifest.summary.htmlPages} static pages; zero orphans; zero safety errors.`);
          NODE

      - name: Snapshot deterministic preview hashes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = 'downloads/phase3-preview-generation';
          function walk(dir,out=[]) { for (const entry of fs.readdirSync(dir,{withFileTypes:true})) { const target=path.join(dir,entry.name); if(entry.isDirectory()) walk(target,out); else out.push(target); } return out; }
          const hashes = Object.fromEntries(walk(root).sort().map(file => [path.relative(root,file).split(path.sep).join('/'),crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')]));
          fs.writeFileSync('/tmp/phase3-preview-first-hashes.json',JSON.stringify(hashes,null,2));
          NODE

      - name: Rebuild and prove deterministic preview
        run: |
          rm -rf downloads/phase3-preview-generation downloads/phase3-locked-section-simulation downloads/phase3-tier-matrix downloads/phase3-public-private-classification
          rm -f downloads/phase0-content-tier-classification.json downloads/phase0-content-tier-classification.md
          rm -f downloads/phase2a-route-family-review-map.json downloads/phase2a-route-family-review-map.md
          node scripts/build-phase3-preview-generation.js
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = 'downloads/phase3-preview-generation';
          const before = JSON.parse(fs.readFileSync('/tmp/phase3-preview-first-hashes.json','utf8'));
          function walk(dir,out=[]) { for (const entry of fs.readdirSync(dir,{withFileTypes:true})) { const target=path.join(dir,entry.name); if(entry.isDirectory()) walk(target,out); else out.push(target); } return out; }
          const after = Object.fromEntries(walk(root).sort().map(file => [path.relative(root,file).split(path.sep).join('/'),crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')]));
          if (JSON.stringify(before) !== JSON.stringify(after)) {
            const changed = [...new Set([...Object.keys(before),...Object.keys(after)])].filter(file => before[file] !== after[file]);
            throw new Error(`Phase 3 preview output is not deterministic:\n${changed.slice(0,100).join('\n')}`);
          }
          console.log(`DETERMINISM PASS: ${Object.keys(after).length} preview files reproduced byte-for-byte.`);
          NODE

      - name: Prove protected files were not changed
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const before = JSON.parse(fs.readFileSync('/tmp/phase3-preview-protected-before.json','utf8'));
          const changed = [];
          for (const [file,expected] of Object.entries(before)) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (actual !== expected) changed.push({file,expected,actual});
          }
          const report = {ok:changed.length===0,checkedFiles:Object.keys(before).length,changed,boundary:'Phase 3 preview generation must not alter policies, membership, Workers, live routes or deployment guards.'};
          fs.writeFileSync('downloads/phase3-preview-generation/non-mutation-report.json',JSON.stringify(report,null,2));
          if(changed.length) throw new Error(JSON.stringify(changed,null,2));
          console.log(`NON-MUTATION PASS: ${report.checkedFiles} protected files unchanged.`);
          NODE

      - name: Upload Phase 3 preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-preview-generation-${{ github.run_id }}
          path: downloads/phase3-preview-generation/
          if-no-files-found: error
          retention-days: 30
