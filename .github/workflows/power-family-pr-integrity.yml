name: Power-Family PR Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - '.power-family-ci-trigger'
      - 'behind-the-curtain-capstone.html'
      - 'behind-the-curtain-symbolic-capstone.html'
      - 'power-family-intelligence-layer.js'
      - 'power-family-intelligence-layer.css'
      - 'data/power-family-intelligence-layer.json'
      - 'data/power-family-curated-people.json'
      - 'data/behind-the-curtain-family-access.json'
      - 'data/behind-the-curtain-capstone.json'
      - 'scripts/power-family-intelligence-layer.runtime.js'
      - 'scripts/reconcile-power-family-capstone.js'
      - 'scripts/compact-cloudflare-search-index.js'
      - 'scripts/patch-power-family-public-gateways.js'
      - 'scripts/behind-the-curtain-production-guard.js'
      - 'scripts/ensure-search-query-handoff.js'
      - 'scripts/behind-the-curtain-production-guard-v2.js'
      - '.github/workflows/power-family-pr-integrity.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax and JSON validation
        run: |
          node --check power-family-intelligence-layer.js
          node --check behind-the-curtain-capstone.js
          node --check scripts/power-family-intelligence-layer.runtime.js
          node --check scripts/reconcile-power-family-capstone.js
          node --check scripts/compact-cloudflare-search-index.js
          node --check scripts/patch-power-family-public-gateways.js
          node --check scripts/behind-the-curtain-production-guard-v2.js
          node --check scripts/ensure-search-query-handoff.js
          node - <<'NODE'
          const fs=require('fs');
          for(const file of [
            'data/power-family-intelligence-layer.json',
            'data/power-family-curated-people.json',
            'data/behind-the-curtain-family-access.json',
            'data/behind-the-curtain-capstone.json',
            'data/behind-the-curtain-pyramid.json',
            'data/behind-the-curtain-people-registry.json'
          ]) JSON.parse(fs.readFileSync(file,'utf8'));
          NODE
      - name: Prepare exact subsystem bundle fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data
          for file in index.html start-here.html behind-the-curtain.html behind-the-curtain-access.html behind-the-curtain-access-v2.js behind-the-curtain-capstone.html behind-the-curtain-symbolic-capstone.html behind-the-curtain-capstone.js power-family-intelligence-layer.js power-family-intelligence-layer.css; do cp "$file" "_site/$file"; done
          cp index.html _site/index
          cp start-here.html _site/start-here
          cp behind-the-curtain.html _site/behind-the-curtain
          cp behind-the-curtain-access.html _site/behind-the-curtain-access
          cp behind-the-curtain-capstone.html _site/behind-the-curtain-capstone
          cp behind-the-curtain-symbolic-capstone.html _site/behind-the-curtain-symbolic-capstone
          for file in data/behind-the-curtain.json data/behind-the-curtain-pyramid.json data/behind-the-curtain-people-registry.json data/behind-the-curtain-family-access.json data/behind-the-curtain-capstone.json data/power-family-intelligence-layer.json data/power-family-curated-people.json; do cp "$file" "_site/$file"; done
          cp search-index.json sitemap.xml llms.txt _site/
      - name: Compact search fixture before reconciliation
        run: node scripts/compact-cloudflare-search-index.js
      - name: Canonical reconciliation
        run: node scripts/reconcile-power-family-capstone.js
      - name: Production contract guard and public gateways
        run: node scripts/behind-the-curtain-production-guard.js
      - name: Marker leak test
        run: |
          node scripts/hide-visible-compatibility-markers.js --output
          ! grep -RIl 'preservedaftervisiblede-duplication' _site --include='*.html' --exclude-dir='data'
          grep -q 'power-family-public-gateway:start' _site/index.html
          grep -q 'power-family-public-gateway:start' _site/start-here.html
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-family-pr-integrity-${{ github.run_id }}
          path: |
            downloads/power-family-capstone-reconcile.json
            downloads/behind-the-curtain-production-guard.json
            downloads/power-family-public-gateways.json
            downloads/cloudflare-search-index-compaction.json
          if-no-files-found: warn
