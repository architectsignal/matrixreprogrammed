name: Money Intelligence Production Proof

on:
  workflow_run:
    workflows:
      - Matrix Reprogrammed Controlled Production Deploy
    types: [completed]

permissions:
  contents: write

jobs:
  record-production-result:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify public money intelligence routes
        if: github.event.workflow_run.conclusion == 'success'
        env:
          SITE_URL: https://matrixreprogrammed.com
          MONEY_LIVE_ATTEMPTS: '18'
          MONEY_LIVE_DELAY_MS: '5000'
        run: node scripts/money-intelligence-live-test.js
      - name: Record production result
        if: always()
        env:
          RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          COMPLETED_AT: ${{ github.event.workflow_run.updated_at }}
        run: |
          mkdir -p data
          node - <<'NODE'
          const fs=require('fs');
          let live={ok:false,checks:[],routes:[],error:'live test did not run'};
          try{live=JSON.parse(fs.readFileSync('downloads/money-intelligence-live-test.json','utf8'))}catch{}
          const payload={
            ok:process.env.RESULT==='success'&&live.ok===true,
            workflow:'Matrix Reprogrammed Controlled Production Deploy',
            conclusion:process.env.RESULT,
            runId:process.env.RUN_ID,
            runUrl:process.env.RUN_URL,
            deployedHeadSha:process.env.HEAD_SHA,
            completedAt:process.env.COMPLETED_AT,
            live,
            checkedRoutes:['/','/follow-the-money','/making-money','/follow-the-money/people/elon-musk','/data/follow-the-money-top-100.json','/downloads/wealth-guides/start-from-zero.pdf']
          };
          fs.writeFileSync('data/money-production-proof.json',JSON.stringify(payload,null,2)+'\n');
          NODE
      - name: Commit production receipt
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/money-production-proof.json
          git commit -m "Record money intelligence production result" || exit 0
          git push
