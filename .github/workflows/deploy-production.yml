name: Deploy Production Fallback — HARD FREEZE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-freeze:
    name: Manual Cloudflare fallback is locked
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production cost freeze
        run: |
          echo "MANUAL FALLBACK DEPLOYMENT LOCKED."
          echo "GitHub updates remain allowed. No Wrangler or Cloudflare production command is present in this workflow."
          echo "Unlock only after the repository owner confirms free Worker build minutes are available again."
