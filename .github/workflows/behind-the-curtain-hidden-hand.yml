name: Behind the Curtain Hidden Hand Evidence

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches:
      - main
      - agent/hidden-hand-evidence-expansion
    paths:
      - 'behind-the-curtain-access.html'
      - 'behind-the-curtain-hidden-hand.js'
      - 'behind-the-curtain-capstone.html'
      - 'behind-the-curtain-capstone.js'
      - 'behind-the-curtain-capstone-link.js'
      - 'investigation-pulse.js'
      - 'data/behind-the-curtain-intermediar*.json'
      - 'data/behind-the-curtain-continuity-systems.json'
      - 'data/behind-the-curtain-hidden-hand-models.json'
      - 'data/behind-the-curtain-family-principals.json'
      - 'data/behind-the-curtain-symbolic-research.json'
      - 'data/behind-the-curtain-capstone.json'
      - 'data/behind-the-curtain-capstone-sources.json'
      - 'scripts/patch-behind-the-curtain-capstone-link.js'
      - 'scripts/behind-the-curtain-access-test.js'
      - 'scripts/behind-the-curtain-hidden-hand-test.js'
      - 'scripts/behind-the-curtain-capstone-test.js'
      - 'scripts/behind-the-curtain-intermediary-watch.js'
      - '.github/workflows/behind-the-curtain-hidden-hand.yml'

permissions:
  contents: write

concurrency:
  group: behind-the-curtain-hidden-hand-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install audit-visible static capstone gate
        run: node scripts/patch-behind-the-curtain-capstone-link.js
      - name: Validate JavaScript
        run: |
          node --check behind-the-curtain-hidden-hand.js
          node --check behind-the-curtain-capstone.js
          node --check behind-the-curtain-capstone-link.js
          node --check investigation-pulse.js
          node --check scripts/patch-behind-the-curtain-capstone-link.js
          node --check scripts/behind-the-curtain-intermediary-watch.js
          node --check scripts/behind-the-curtain-hidden-hand-test.js
          node --check scripts/behind-the-curtain-capstone-test.js
      - name: Validate hidden-hand and capstone evidence contracts
        run: |
          node scripts/behind-the-curtain-hidden-hand-test.js
          node scripts/behind-the-curtain-capstone-test.js
      - name: Preserve existing Pyramid contracts
        run: |
          node scripts/behind-the-curtain-access-test.js
          node scripts/behind-the-curtain-living-access-test.js
      - name: Publish branch validation receipt and generated gate
        if: github.event_name == 'push' && github.ref_name == 'agent/hidden-hand-evidence-expansion' && !contains(github.event.head_commit.message, '[hidden-hand-validated]')
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const profiles=[1,2,3].flatMap(n=>read(`data/behind-the-curtain-intermediaries-${String(n).padStart(2,'0')}.json`));
          const hiddenSources=read('data/behind-the-curtain-intermediary-sources.json');
          const capstone=read('data/behind-the-curtain-capstone.json');
          const capstoneSources=read('data/behind-the-curtain-capstone-sources.json');
          const accessHtml=fs.readFileSync('behind-the-curtain-access.html','utf8');
          if(!accessHtml.includes('data-capstone-static-gate="true"')) throw new Error('Static capstone gate was not generated');
          const receipt={
            ok:true,
            validatedAt:new Date().toISOString(),
            validatedSha:process.env.GITHUB_SHA,
            workflowRun:process.env.GITHUB_RUN_ID,
            branch:process.env.GITHUB_REF_NAME,
            contracts:{
              pyramid:true,
              livingAccess:true,
              hiddenHand:true,
              capstone:true,
              staticCapstoneLink:true,
              failClosed:true
            },
            counts:{
              intermediaries:profiles.length,
              hiddenHandSources:hiddenSources.length,
              capstoneHouses:capstone.houses.length,
              capstoneModels:capstone.coordinationModels.length,
              symbolicDossiers:capstone.symbolicApex.length,
              capstoneSources:capstoneSources.length,
              staticCapstoneRouteReferences:(accessHtml.match(/behind-the-curtain-capstone\.html/g)||[]).length
            },
            boundary:'This receipt proves the repository evidence and interface contracts passed. It does not prove the truth of speculative, unsupported or metaphysical claims.'
          };
          fs.writeFileSync('data/behind-the-curtain-validation-receipt.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add behind-the-curtain-access.html data/behind-the-curtain-validation-receipt.json
          git commit -m 'Record hidden-hand capstone validation [hidden-hand-validated]'
          git push origin HEAD:agent/hidden-hand-evidence-expansion

  source-watch:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check official source reachability and role signals
        run: node scripts/behind-the-curtain-intermediary-watch.js
      - name: Commit reviewed-source health state
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/behind-the-curtain-intermediary-source-health.json
          if git diff --cached --quiet; then
            echo 'Hidden-hand source health unchanged.'
            exit 0
          fi
          git commit -m 'Refresh hidden-hand source health'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
          done
          exit 1
