name: Cancel Duplicate Predators Repair Run

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cancel-duplicate-predators-repair-run.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cancel-duplicate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Preserve active repair run and cancel pending duplicate
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const activeRunId = 30372085433;
            const duplicateRunId = 30372275747;
            const active = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: activeRunId });
            const duplicate = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: duplicateRunId });
            if (!['queued', 'in_progress', 'completed'].includes(active.data.status)) {
              core.setFailed(`Active repair run ${activeRunId} has unexpected status ${active.data.status}.`);
              return;
            }
            let action = 'duplicate-already-finished';
            if (['queued', 'pending', 'waiting', 'requested'].includes(duplicate.data.status)) {
              await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: duplicateRunId });
              action = 'cancelled-pending-duplicate';
            } else if (duplicate.data.status === 'in_progress') {
              core.setFailed(`Duplicate run ${duplicateRunId} is already in progress; refusing automatic cancellation.`);
              return;
            }
            const payload = {
              ok: true,
              action,
              activeRun: {
                id: activeRunId,
                runNumber: active.data.run_number,
                status: active.data.status,
                conclusion: active.data.conclusion,
                headSha: active.data.head_sha,
                url: active.data.html_url
              },
              duplicateRun: {
                id: duplicateRunId,
                runNumber: duplicate.data.run_number,
                statusBefore: duplicate.data.status,
                conclusionBefore: duplicate.data.conclusion,
                headSha: duplicate.data.head_sha,
                url: duplicate.data.html_url
              },
              recordedAt: new Date().toISOString(),
              boundary: 'Preserve corrected production run 30372085433. Cancel only the later pending duplicate 30372275747; never cancel an in-progress deployment automatically.'
            };
            const path = 'data/predators-repair-duplicate-cancellation.json';
            const content = Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64');
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message: 'Record duplicate production run cancellation', content, branch: 'main', ...(sha ? { sha } : {}) });
            core.info(`${action}; active run ${activeRunId} preserved, duplicate ${duplicateRunId} handled.`);
