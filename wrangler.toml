# Cloudflare Workers deployment configuration
# Production deploy path: GitHub Actions runs npm run build then npx wrangler deploy.
# The strict production boundary remains in src/worker-production.js.
# src/worker-production-autonomy.js delegates fetch traffic unchanged and adds the AI-management scheduled lifecycle.

name = "matrixreprogrammed"
main = "src/worker-production-autonomy.js"
compatibility_date = "2026-06-25"

# Runtime payment credentials and activation switches are managed in the Cloudflare dashboard.
# keep_vars prevents Wrangler deployments from deleting unrelated dashboard values.
keep_vars = true
routes = [
  { pattern = "matrixreprogrammed.com/*", zone_name = "matrixreprogrammed.com" },
  { pattern = "www.matrixreprogrammed.com/*", zone_name = "matrixreprogrammed.com" }
]

[triggers]
# Four of the five Workers Free cron slots are used. The AI-management lifecycle shares the
# existing scheduled events and performs only bounded D1 maintenance when explicitly enabled.
crons = ["5 6 * * *", "15 7 * * 1", "35 * * * *"]
[vars]
EMAIL_AUTOMATION_ENABLED = "true"
EMAIL_TRANSACTIONAL_ENABLED = "true"
BREVO_DOMAIN_AUTHENTICATED = "true"
EMAIL_RETRY_QUARANTINE_BEFORE = "2026-07-18T00:00:00.000Z"
INTELLIGENCE_REPORT_BATCH_LIMIT = "100"
MEMBERS_FROM_EMAIL = "members@matrixreprogrammed.com"
MEMBERS_FROM_NAME = "Matrix Reprogrammed"
MEMBERS_REPLY_TO_EMAIL = "njmgroupfrance@gmail.com"
MEMBERS_REPLY_TO_NAME = "Matrix Reprogrammed Support"
ENABLE_KV_COMPATIBILITY_MIRROR = "false"

# AI management remains fail closed until phases 9-13 migrations and the complete
# release matrix pass. Activation is a separate reviewed production step.
AI_RESOURCE_BROKER_ENABLED = "false"
AI_RESOURCE_EXTERNAL_ENABLED = "false"
AI_RESOURCE_LOCAL_ONLY = "true"
AI_RESOURCE_ZERO_SPEND_LOCK = "true"
AI_RESOURCE_BACKGROUND_ENABLED = "false"
AI_RESOURCE_SCOUT_ENABLED = "false"
AI_RESOURCE_AUTO_APPROVAL_ENABLED = "false"
AI_LOCAL_MODEL_ROUTING_ENABLED = "false"
AI_SITE_DIRECTOR_ENABLED = "false"
AI_OPPORTUNITY_HUNTER_ENABLED = "false"
AI_COMPUTE_RESOURCE_SCOUT_ENABLED = "false"
AI_REMOTE_COMPUTE_ROUTING_ENABLED = "false"
AI_REMOTE_COMPUTE_EXECUTION_ENABLED = "false"
AI_REMOTE_COMPUTE_JOBS_PER_CYCLE = "0"

# Non-active compatibility markers retained for the Phase 7 sandbox audit only.
# PAYPAL_ENVIRONMENT = "sandbox"
# PAYPAL_SANDBOX_ENABLED = "true"
# PAYPAL_PRODUCTION_ENABLED = "false"

[assets]
directory = "./_site"
binding = "ASSETS"
# Static HTML, CSS, JS, images, JSON and public downloads are served directly and do not consume
# the Workers Free 100,000-request daily quota. Only dynamic, authenticated or protected routes
# enter the Worker before asset lookup.
run_worker_first = [
  "/api/*",
  "/.netlify/functions/*",
  "/newsletter-signup",
  "/subscribe-newsletter",
  "/forum-*",
  "/submit-*",
  "/report-*",
