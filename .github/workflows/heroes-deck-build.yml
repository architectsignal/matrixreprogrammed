name: Build Heroes Fighting the Matrix Deck

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/heroes-deck-build.trigger

permissions:
  contents: write

concurrency:
  group: heroes-fighting-matrix-deck
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate and finalise all 52 cards
        run: node scripts/finalize-heroes-fighting-matrix-deck.js

      - name: Add the deck to homepage and Deck Hub
        run: node scripts/patch-homepage-power-deck-link.js

      - name: Add all 52 people and deck routes to search
        run: node scripts/patch-heroes-search-index.js

      - name: Publish verified Heroes files to Cloudflare output
        run: node scripts/publish-heroes-deck-cloudflare.js

      - name: Verify cards, suits, navigation, search, downloads and Cloudflare copies
        run: node scripts/heroes-deck-smoke-test.js

      - name: Commit completed deck system
        run: |
          set -euo pipefail
          git config user.name "matrix-deck-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No Heroes deck changes to commit."
            exit 0
          fi
          git commit -m "Complete Heroes Fighting the Matrix 52-card deck"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Main advanced during Heroes deck release; retrying."
          done
          echo "Unable to publish the completed Heroes deck after three attempts."
          exit 1
