name: Resolve Corrected Predators Production Run

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/record-predators-production-run-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: resolve-corrected-predators-production-run
  cancel-in-progress: true

jobs:
  resolve-production-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve and record latest corrected controlled deployment
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const cutoff = new Date('2026-07-28T15:02:00Z');
            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const target = workflows.data.workflows.find(workflow => workflow.path === '.github/workflows/deploy.yml' || workflow.name === 'Matrix Reprogrammed Controlled Production Deploy');
            if (!target) {
              core.setFailed('Controlled production workflow was not found.');
              return;
            }
            let resolved = null;
            for (let attempt = 1; attempt <= 90; attempt += 1) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: target.id,
                event: 'workflow_dispatch',
                branch: 'main',
                per_page: 50
              });
              resolved = (runs.data.workflow_runs || [])
                .filter(run => new Date(run.created_at) >= cutoff)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0] || null;
              if (resolved && resolved.status === 'completed') break;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            if (!resolved) {
              core.setFailed('No corrected controlled production run was found after the retry cutoff.');
              return;
            }
            const payload = {
              ok: resolved.status === 'completed' && resolved.conclusion === 'success',
              workflowId: target.id,
              workflowName: target.name,
              productionRunId: resolved.id,
              productionRunNumber: resolved.run_number,
              status: resolved.status,
              conclusion: resolved.conclusion,
              event: resolved.event,
              headBranch: resolved.head_branch,
              headSha: resolved.head_sha,
              createdAt: resolved.created_at,
              updatedAt: resolved.updated_at,
              url: resolved.html_url,
              observedAt: new Date().toISOString(),
              cutoff: cutoff.toISOString(),
              boundary: 'Read-only resolution of the latest controlled workflow-dispatch run after the Predators Hit List repair cutoff. This workflow cannot create or rerun a deployment.'
            };
            const path = 'data/predators-repair-production-run.json';
            const content = Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64');
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              let sha;
              try {
                const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                if (!Array.isArray(current.data)) sha = current.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path,
                  message: 'Record corrected Predators production run',
                  content,
                  branch: 'main',
                  ...(sha ? { sha } : {})
                });
                core.info(`Recorded production run ${resolved.id}: ${resolved.status}/${resolved.conclusion || 'pending'}, head ${resolved.head_sha}.`);
                return;
              } catch (error) {
                if (![409, 422].includes(error.status) || attempt === 8) throw error;
                await new Promise(resolve => setTimeout(resolve, attempt * 2000));
              }
            }
