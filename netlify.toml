[build]
  command = "mkdir -p .netlify-disabled && printf '<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><meta name=\"robots\" content=\"noindex,nofollow\"><title>Deployment Disabled</title></head><body><h1>Netlify deployment disabled</h1><p>Matrix Reprogrammed is deployed through Cloudflare.</p></body></html>' > .netlify-disabled/index.html"
  publish = ".netlify-disabled"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Cache-Control = "no-store"

# Netlify is not used for production. These route contracts are retained because
# the repository's pressure tests validate them alongside the Cloudflare routes.
[[redirects]]
  from = "/home"
  to = "/index.html"
  status = 301

[[redirects]]
  from = "/start"
  to = "/start-here.html"
  status = 301

