name: Behind the Curtain Structural Power Intelligence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'behind-the-curtain.html'
      - 'behind-the-curtain.js'
      - 'data/behind-the-curtain.json'
      - 'data/behind-the-curtain-source-intake.json'
      - 'data/entity-registry.json'
      - 'data/relationship-registry.json'
      - 'data/money-overlap-graph.json'
      - 'data/epstein-relationship-public.json'
      - 'data/investigation-knowledge-graph.json'
      - 'scripts/build-behind-the-curtain.js'
      - 'scripts/seed-behind-the-curtain-data.js'
      - 'scripts/patch-behind-the-curtain-links.js'
      - 'scripts/behind-the-curtain-test.js'
      - 'docs/BEHIND_THE_CURTAIN_MASTER.md'
      - '.github/workflows/behind-the-curtain-intelligence.yml'
  push:
    branches: [main, 'agent/behind-the-curtain-structural-power']
    paths:
      - 'data/behind-the-curtain-source-intake.json'
      - 'data/entity-registry.json'
      - 'data/relationship-registry.json'
      - 'data/money-overlap-graph.json'
      - 'data/epstein-relationship-public.json'
      - 'data/investigation-knowledge-graph.json'
      - 'scripts/build-behind-the-curtain.js'
      - 'scripts/seed-behind-the-curtain-data.js'
      - 'scripts/patch-behind-the-curtain-links.js'
      - 'scripts/behind-the-curtain-test.js'
      - 'docs/BEHIND_THE_CURTAIN_MASTER.md'
      - '.github/workflows/behind-the-curtain-intelligence.yml'

permissions:
  contents: write

concurrency:
  group: behind-the-curtain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-git-only:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[curtain-built]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recalculate structural power and patch internal routes
        run: node scripts/build-behind-the-curtain.js
      - name: Validate syntax and evidence contracts
        run: |
          node --check behind-the-curtain.js
          node --check scripts/build-behind-the-curtain.js
          node --check scripts/patch-behind-the-curtain-links.js
          node --check scripts/behind-the-curtain-test.js
          node scripts/behind-the-curtain-test.js
      - name: Commit generated intelligence to Git only
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add behind-the-curtain.html behind-the-curtain.js data/behind-the-curtain.json index.html control-structure.html power-atlas.html follow-the-money.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Behind the Curtain already current."
          else
            git commit -m "Refresh Behind the Curtain intelligence [curtain-built]"
            git push
          fi
      - name: Confirm production cost boundary
        run: echo "GIT-ONLY PASS — the structural-power workflow contains no production deployment step."
