name: Full System Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '47 10 * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'data/**'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'wrangler.toml'
      - 'netlify.toml'
      - '**.html'
      - '**.css'
      - '**.js'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'data/**'
      - 'migrations/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'wrangler.toml'
      - 'netlify.toml'
      - '**.html'
      - '**.css'
      - '**.js'

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: full-system-audit-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  full-system-audit:
    name: Full build, every-page crawl, links, freshness and conclusions
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run full system audit
        run: node scripts/full-system-audit.js

      - name: Audit every generated public page and local link
        run: node scripts/exhaustive-public-site-audit.js

      - name: Crawl every live sitemap page and discovered link
        env:
          SITE_URL: https://matrixreprogrammed.com
          CHECK_EXTERNAL_LINKS: 'true'
          MAX_EXTERNAL_LINKS: '500'
          LIVE_CRAWL_CONCURRENCY: '6'
          LIVE_CRAWL_TIMEOUT_MS: '15000'
        run: node scripts/live-exhaustive-site-crawl.js

      - name: Upload full system audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-audit-reports-${{ github.sha }}
          path: |
            downloads/full-system-audit.json
            downloads/full-system-audit.md
            downloads/exhaustive-public-site-audit.json
            downloads/exhaustive-public-site-audit.md
            downloads/live-exhaustive-site-crawl.json
            downloads/live-exhaustive-site-crawl.md
            downloads/site-wide-function-audit.json
            downloads/site-wide-function-audit.md
            downloads/newsletter-worker-patch-report.json
            downloads/newsletter-persistence-test.json
            downloads/newsletter-persistence-test.md
            downloads/membership-foundation-patch-report.json
            downloads/membership-foundation-test.json
            downloads/membership-foundation-test.md
            downloads/membership-auth-patch-report.json
            downloads/membership-auth-test.json
            downloads/membership-auth-test.md
            downloads/membership-auth-ui-patch.json
            downloads/paypal-membership-patch-report.json
            downloads/paypal-membership-test.json
            downloads/paypal-membership-test.md
            downloads/search-system-repair-report.json
            downloads/search-runtime-hardening-report.json
            downloads/critical-route-drift-report.json
            downloads/critical-route-drift-report.md
            downloads/site-function-harmony-report.json
            downloads/site-function-harmony-report.md
            data/card-dossier-intelligence-pack-audit.json
            downloads/card-dossier-intelligence-pack-audit.md
            site-quality-report.html
            site-freshness-report.html
            data/site-quality-report.json
            data/site-freshness-report.json
            deploy-status.json
            downloads/deploy-status.json
          if-no-files-found: ignore
          retention-days: 21

      - name: Post audit report to GitHub issue
        if: always() && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const title = 'Full System Audit Report';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const mdPath = path.join(process.cwd(), 'downloads', 'full-system-audit.md');
            const localPath = path.join(process.cwd(), 'downloads', 'exhaustive-public-site-audit.json');
            const livePath = path.join(process.cwd(), 'downloads', 'live-exhaustive-site-crawl.json');
            let reportMd = fs.existsSync(mdPath) ? fs.readFileSync(mdPath, 'utf8') : '# Full System Audit\n\nReport file was not generated. Open the workflow logs.';
            let status = '${{ job.status }}';
            let summary = '';
            const readJson = file => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; } };
            const full = readJson(path.join(process.cwd(), 'downloads', 'full-system-audit.json'));
            const local = fs.existsSync(localPath) ? readJson(localPath) : null;
            const live = fs.existsSync(livePath) ? readJson(livePath) : null;
            if (full) status = full.ok && (!local || local.ok) && (!live || live.ok) ? 'PASS' : 'FAIL';
            summary = `\n\n## Machine Summary\n\n- Status: ${status}\n- Commands: ${full?.summary?.commandCount ?? 'unknown'}\n- Failed commands: ${full?.summary?.failedCommands ?? 'unknown'}\n- Local public pages: ${local?.totals?.publicPages ?? 'unknown'}\n- Local link references: ${local?.totals?.linkReferences ?? 'unknown'}\n- Live sitemap pages: ${live?.totals?.sitemapPages ?? 'unknown'}\n- Live internal URLs: ${live?.totals?.internalUrlsChecked ?? 'unknown'}\n- Live external links: ${live?.totals?.externalUrlsChecked ?? 'unknown'}\n- Deep conclusion pages: ${live?.totals?.deepConclusionPages ?? local?.totals?.deepConclusionPages ?? 'unknown'}\n- Hard failures: ${(local?.totals?.hardFailures ?? 0) + (live?.totals?.hardFailures ?? 0)}\n`;
            if (reportMd.length > 45000) reportMd = reportMd.slice(0, 45000) + '\n\n_Report truncated. Open the workflow artifact for the full report._';
            const body = `# Latest Full System Audit\n\nStatus: **${status}**\n\nWorkflow run: ${runUrl}\n\nArtifacts: open the workflow run and download **full-system-audit-reports**.\n${summary}\n---\n\n${reportMd}`;
            const search = await github.rest.search.issuesAndPullRequests({ q: `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open in:title "${title}"` });
            if (search.data.items.length) {
              const issue_number = search.data.items[0].number;
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body: `Full System Audit finished with **${status}**.\n\nRun: ${runUrl}` });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['full-system-audit'] });
            }
