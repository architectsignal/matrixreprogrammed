name: Deploy Production (Manual Fallback)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to run the manual fallback release'
        required: true
        default: 'NO'

permissions:
  contents: read
  actions: read

concurrency:
  group: matrixreprogrammed-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  deploy:
    name: Manual strict-D1 Cloudflare fallback deploy
    runs-on: ubuntu-latest
    timeout-minutes: 110
    if: ${{ github.event.inputs.confirm == 'DEPLOY' }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record exact main commit
        run: echo "DEPLOY_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh public intelligence before release
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          INVESTIGATION_MODE: daily
          INVESTIGATION_CONCURRENCY: '4'
          INVESTIGATION_TIMEOUT_MS: '25000'
        run: |
          node scripts/repair-investigation-source-registry.js
          node scripts/run-investigation-machine.js daily
          node scripts/update-live-intel.js
          node scripts/record-live-intel-check.js
          node scripts/update-seven-day-intel.js
          node scripts/build-outcome-briefings.js
          node scripts/build-daily-brain-brief.js
          node scripts/build-investigation-pages.js
          node scripts/build-mission-intelligence-10.js
          node scripts/build-live-intel-machine.js
          node scripts/patch-conclusion-integrity-cards.js

      - name: Build complete site
        env:
          SOURCE_DOCUMENTS_PER_RUN: '0'
        run: npm run build

      - name: Verify strict Worker and D1 forum wiring
        run: |
          node scripts/forum-persistence-d1-test.js
          node scripts/cloudflare-worker-routes-test.js
          npx wrangler@latest deploy --dry-run

      - name: Reconcile after every legacy generator
        env:
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
        run: node scripts/final-production-reconcile.js

      - name: Run final production gates
        env:
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
        run: |
          node scripts/production-freshness-guard.js
          node scripts/production-sync-test.js
          node scripts/production-deploy-guard.js

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo 'CLOUDFLARE_API_TOKEN is missing' && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo 'CLOUDFLARE_ACCOUNT_ID is missing' && exit 1)

      - name: Apply idempotent forum D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p downloads
          npx --yes wrangler@latest d1 execute matrix-members --remote --file=./migrations/0004_forum_persistence.sql 2>&1 | tee downloads/forum-d1-migration.log

      - name: Deploy strict Worker and exact reconciled assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p downloads
          npx --yes wrangler@latest deploy 2>&1 | tee downloads/wrangler-deploy.log

      - name: Verify live commit, routes, D1 persistence and deferred payments
        env:
          SITE_URL: https://matrixreprogrammed.com
          DEPLOY_COMMIT_SHA: ${{ env.DEPLOY_COMMIT_SHA }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIVE_VERIFY_ATTEMPTS: '36'
          LIVE_VERIFY_DELAY_MS: '10000'
        run: node scripts/verify-live-production.js

      - name: Upload manual fallback proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-production-proof-${{ github.run_id }}
          path: |
            downloads/deploy-manifest.json
            downloads/deploy-health.json
            downloads/production-freshness-guard.json
            downloads/production-sync-test.json
            downloads/production-deploy-guard-report.json
            downloads/forum-persistence-d1-test.json
            downloads/final-production-reconcile.json
            downloads/live-production-verification.json
            downloads/forum-d1-migration.log
            downloads/wrangler-deploy.log
          if-no-files-found: ignore
          retention-days: 60
