name: Observe Current Production Run

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows:
      - Matrix Reprogrammed Controlled Production Deploy
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: observe-current-production-run
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Snapshot latest controlled production run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_json="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "Matrix Reprogrammed Controlled Production Deploy" --limit 1 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url,event)"
          node - "$run_json" <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(process.argv[2]||'[]');
          if(!rows.length) throw new Error('No controlled production run found');
          const run=rows[0];
          fs.mkdirSync('data',{recursive:true});
          fs.writeFileSync('data/current-production-run.json',JSON.stringify({
            ok:run.status==='completed'&&run.conclusion==='success',
            observedAt:new Date().toISOString(),
            ...run
          },null,2)+'\n');
          NODE
      - name: Commit status when changed
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/current-production-run.json
          if git diff --cached --quiet; then
            echo "Production status unchanged"
            exit 0
          fi
          git commit -m "Record current controlled production run"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
          done
          exit 1
