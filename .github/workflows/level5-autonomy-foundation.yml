name: Level 5 Autonomy Foundation

on:
  pull_request:
    paths:
      - 'ai-management/autonomy/autonomous-learning-director.mjs'
      - 'ai-management/autonomy/specialist-ai-director.mjs'
      - 'ai-management/autonomy/specialist-execution-planner.mjs'
      - 'ai-management/autonomy/specialist-local-executor.mjs'
      - 'ai-management/finance/self-financing-director.mjs'
      - 'ai-management/finance/revenue-growth-director.mjs'
      - 'ai-management/config/level5-autonomy-policy.json'
      - 'migrations/phase14_self_financing_growth.sql'
      - 'migrations/phase15_specialist_ai_orchestration.sql'
      - 'migrations/phase16_specialist_execution_specs.sql'
      - 'scripts/run-level5-autonomy-cycle.mjs'
      - 'scripts/run-specialist-local-worker.mjs'
      - 'scripts/level5-autonomy-foundation-test.mjs'
      - 'scripts/self-financing-growth-test.mjs'
      - 'scripts/specialist-ai-director-test.mjs'
      - 'scripts/specialist-execution-planner-test.mjs'
      - 'scripts/specialist-local-executor-test.mjs'
      - 'src/worker-level5-self-financing.js'
      - 'src/worker-specialist-ai.js'
      - 'src/worker-production-autonomy.js'
      - 'wrangler.toml'
      - '.github/workflows/level5-autonomy-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: level5-autonomy-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Verify learning self-financing and specialist boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check syntax
        run: |
          node --check ai-management/autonomy/autonomous-learning-director.mjs
          node --check ai-management/autonomy/specialist-ai-director.mjs
          node --check ai-management/autonomy/specialist-execution-planner.mjs
          node --check ai-management/autonomy/specialist-local-executor.mjs
          node --check ai-management/finance/self-financing-director.mjs
          node --check ai-management/finance/revenue-growth-director.mjs
          node --check scripts/run-level5-autonomy-cycle.mjs
          node --check scripts/run-specialist-local-worker.mjs
          node --check scripts/level5-autonomy-foundation-test.mjs
          node --check scripts/self-financing-growth-test.mjs
          node --check scripts/specialist-ai-director-test.mjs
          node --check scripts/specialist-execution-planner-test.mjs
          node --check scripts/specialist-local-executor-test.mjs
          node --check src/worker-level5-self-financing.js
          node --check src/worker-specialist-ai.js
          node --check src/worker-production-autonomy.js

      - name: Run Level 5 foundation tests
        run: node scripts/level5-autonomy-foundation-test.mjs

      - name: Run self-financing growth tests
        run: node scripts/self-financing-growth-test.mjs

      - name: Run seven-agent orchestration tests
        run: node scripts/specialist-ai-director-test.mjs

      - name: Run specialist local execution planning tests
        run: node scripts/specialist-execution-planner-test.mjs

      - name: Run loopback specialist inference tests
        run: node scripts/specialist-local-executor-test.mjs

      - name: Prove local specialist worker is disabled by default
        run: |
          unset MATRIX_SPECIALIST_LOCAL_INFERENCE_EXECUTION_ENABLED
          node scripts/run-specialist-local-worker.mjs
          grep -F '"skipped": true' downloads/specialist-local-worker-result.json
          grep -F '"external_consequences_performed": 0' downloads/specialist-local-worker-result.json
          grep -F '"money_moved": 0' downloads/specialist-local-worker-result.json
          grep -F '"deployments_performed": 0' downloads/specialist-local-worker-result.json

      - name: Prove finance remains non-executing
        run: |
          grep -F '"automatic_spend_limit_eur": 0' ai-management/config/level5-autonomy-policy.json
          grep -F '"payment_mutation_allowed": false' ai-management/config/level5-autonomy-policy.json
          grep -F '"payout_mutation_allowed": false' ai-management/config/level5-autonomy-policy.json
          grep -F '"borrowing_allowed": false' ai-management/config/level5-autonomy-policy.json
          grep -F '"trading_allowed": false' ai-management/config/level5-autonomy-policy.json
          grep -F '"owner_approval_required_for_any_spend": true' ai-management/config/level5-autonomy-policy.json

      - name: Prove learning cannot weaken safety policy
        run: |
          grep -F '"automatic_policy_mutation_allowed": false' ai-management/config/level5-autonomy-policy.json
          grep -F '"automatic_safety_gate_mutation_allowed": false' ai-management/config/level5-autonomy-policy.json
          grep -F '"automatic_evidence_threshold_mutation_allowed": false' ai-management/config/level5-autonomy-policy.json
          grep -F '"automatic_deployment_gate_mutation_allowed": false' ai-management/config/level5-autonomy-policy.json
          grep -F 'policy_mutation_allowed INTEGER NOT NULL DEFAULT 0 CHECK (policy_mutation_allowed=0)' migrations/phase14_self_financing_growth.sql
          grep -F 'evidence_threshold_mutation_allowed INTEGER NOT NULL DEFAULT 0 CHECK (evidence_threshold_mutation_allowed=0)' migrations/phase14_self_financing_growth.sql
          grep -F 'financial_execution_allowed INTEGER NOT NULL DEFAULT 0 CHECK (financial_execution_allowed=0)' migrations/phase14_self_financing_growth.sql

      - name: Prove growth cannot manipulate evidence or payments
        run: |
          grep -F 'automatic_price_changes_allowed: false' ai-management/finance/revenue-growth-director.mjs
          grep -F 'automatic_payment_flow_changes_allowed: false' ai-management/finance/revenue-growth-director.mjs
          grep -F 'commercial_ranking_may_change_evidence_strength: false' ai-management/finance/revenue-growth-director.mjs
          grep -F 'commercial_ranking_may_hide_contrary_evidence: false' ai-management/finance/revenue-growth-director.mjs
          grep -F 'dark_patterns_allowed: false' ai-management/finance/revenue-growth-director.mjs
          grep -F 'execution_allowed INTEGER NOT NULL DEFAULT 0 CHECK (execution_allowed=0)' migrations/phase14_self_financing_growth.sql

      - name: Prove specialist agents share one spine and cannot bypass hard gates
        run: |
          grep -F '"shared_memory_required": true' ai-management/config/level5-autonomy-policy.json
          grep -F '"shared_evidence_graph_required": true' ai-management/config/level5-autonomy-policy.json
          grep -F '"auditor_gate_before_publication_required": true' ai-management/config/level5-autonomy-policy.json
          grep -F '"explicit_auditor_clearance_required_for_publisher": true' ai-management/config/level5-autonomy-policy.json
          grep -F '"caller_supplied_auditor_clearance_trusted": false' ai-management/config/level5-autonomy-policy.json
          grep -F '"commercial_system_may_change_evidence_strength": false' ai-management/config/level5-autonomy-policy.json
          grep -F "execution_mode TEXT NOT NULL DEFAULT 'plan_or_draft_only' CHECK (execution_mode='plan_or_draft_only')" migrations/phase15_specialist_ai_orchestration.sql
          grep -F 'external_consequence INTEGER NOT NULL DEFAULT 0 CHECK (external_consequence=0)' migrations/phase15_specialist_ai_orchestration.sql
          grep -F 'policy_bypass_used INTEGER NOT NULL DEFAULT 0 CHECK (policy_bypass_used=0)' migrations/phase15_specialist_ai_orchestration.sql
          grep -F 'MATRIX_SPECIALIST_AI_ORCHESTRATION_ENABLED = "false"' wrangler.toml
          grep -F 'external_consequence_execution_allowed: false' src/worker-specialist-ai.js
          grep -F 'automatic_production_deployment_allowed: false' src/worker-specialist-ai.js
          grep -F 'caller_supplied_auditor_clearance_trusted: false' src/worker-specialist-ai.js

      - name: Prove specialist model execution stays local zero-cost and prompt-private
        run: |
          grep -F '"cloud_prompt_material_allowed": false' ai-management/config/level5-autonomy-policy.json
          grep -F '"full_prompt_compilation_location": "owner-controlled-local-machine"' ai-management/config/level5-autonomy-policy.json
          grep -F '"automatic_local_execution_enabled": false' ai-management/config/level5-autonomy-policy.json
          grep -F 'prompt_material_in_cloud_payload INTEGER NOT NULL DEFAULT 0 CHECK (prompt_material_in_cloud_payload=0)' migrations/phase16_specialist_execution_specs.sql
          grep -F 'local_prompt_resolution_required INTEGER NOT NULL DEFAULT 1 CHECK (local_prompt_resolution_required=1)' migrations/phase16_specialist_execution_specs.sql
          grep -F 'cost_ceiling_eur REAL NOT NULL DEFAULT 0 CHECK (cost_ceiling_eur=0)' migrations/phase16_specialist_execution_specs.sql
          grep -F 'paid_fallback_allowed INTEGER NOT NULL DEFAULT 0 CHECK (paid_fallback_allowed=0)' migrations/phase16_specialist_execution_specs.sql
          grep -F 'external_network_inference_allowed INTEGER NOT NULL DEFAULT 0 CHECK (external_network_inference_allowed=0)' migrations/phase16_specialist_execution_specs.sql
          grep -F 'evidence_gate_bypass_allowed INTEGER NOT NULL DEFAULT 0 CHECK (evidence_gate_bypass_allowed=0)' migrations/phase16_specialist_execution_specs.sql
          grep -F 'production_deployment_allowed INTEGER NOT NULL DEFAULT 0 CHECK (production_deployment_allowed=0)' migrations/phase16_specialist_execution_specs.sql
          grep -F 'MATRIX_SPECIALIST_LOCAL_EXECUTION_PLANNING_ENABLED = "false"' wrangler.toml
          grep -F 'MATRIX_SPECIALIST_LOCAL_INFERENCE_EXECUTION_ENABLED' scripts/run-specialist-local-worker.mjs
          grep -F 'prompt_compilation_location: '\''owner-controlled-local-machine'\''' ai-management/autonomy/specialist-execution-planner.mjs
          grep -F "endpoint_scope: 'loopback-only'" ai-management/provider-adapters/local/openai-compatible-local.mjs
          grep -F 'routing_prompt_material_included:' ai-management/autonomy/specialist-local-executor.mjs
          grep -F 'external_consequence_performed: false' ai-management/autonomy/specialist-local-executor.mjs
          grep -F 'production_deployment_performed: false' ai-management/autonomy/specialist-local-executor.mjs
          grep -F 'money_moved: false' ai-management/autonomy/specialist-local-executor.mjs

      - name: Prove remote execution stays disabled in the Level 5 runner
        run: |
          grep -F "AI_REMOTE_COMPUTE_EXECUTION_ENABLED: 'false'" scripts/run-level5-autonomy-cycle.mjs
          grep -F "AI_REMOTE_COMPUTE_JOBS_PER_CYCLE: '0'" scripts/run-level5-autonomy-cycle.mjs
          grep -F 'payment_mutation_allowed: false' scripts/run-level5-autonomy-cycle.mjs
          grep -F 'deployment_performed: false' scripts/run-level5-autonomy-cycle.mjs
          grep -F 'external_consequence_execution_allowed: false' scripts/run-level5-autonomy-cycle.mjs
          grep -F 'specialist_prompts_sent_to_cloud_by_this_runner: false' scripts/run-level5-autonomy-cycle.mjs
