name: Cloudflare Repository Credential Preflight

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cloudflare-repository-credential-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  verify:
    name: Check repository-level Cloudflare token without production environment override
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run read-only repository credential preflight
        id: preflight
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set +e
          mkdir -p downloads
          WHOAMI_STATUS=0
          D1_STATUS=0
          ACCOUNT_STATUS=0
          USER_STATUS=0
          MEMBERSHIP_STATUS=0
          test -n "$CLOUDFLARE_API_TOKEN" || WHOAMI_STATUS=98
          test -n "$CLOUDFLARE_ACCOUNT_ID" || ACCOUNT_STATUS=98
          if [ "$WHOAMI_STATUS" -eq 0 ]; then
            npx --yes wrangler@latest whoami > /tmp/repository-whoami.log 2>&1
            WHOAMI_STATUS=$?
          fi
          if [ "$WHOAMI_STATUS" -eq 0 ] && [ "$ACCOUNT_STATUS" -eq 0 ]; then
            npx --yes wrangler@latest d1 info matrix-members > /tmp/repository-d1.log 2>&1
            D1_STATUS=$?
            ACCOUNT_CODE="$(curl --silent --output /tmp/repository-account.json --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")"
            [ "$ACCOUNT_CODE" = "200" ] || ACCOUNT_STATUS=1
            USER_CODE="$(curl --silent --output /tmp/repository-user.json --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              'https://api.cloudflare.com/client/v4/user')"
            [ "$USER_CODE" = "200" ] || USER_STATUS=1
            MEMBERSHIP_CODE="$(curl --silent --output /tmp/repository-memberships.json --write-out '%{http_code}' \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              'https://api.cloudflare.com/client/v4/memberships')"
            [ "$MEMBERSHIP_CODE" = "200" ] || MEMBERSHIP_STATUS=1
          fi
          export WHOAMI_STATUS D1_STATUS ACCOUNT_STATUS USER_STATUS MEMBERSHIP_STATUS
          node - <<'NODE'
          const fs = require('fs');
          const status = name => Number(process.env[name] || 0);
          const result = {
            ok: status('WHOAMI_STATUS') === 0 && status('D1_STATUS') === 0 && status('ACCOUNT_STATUS') === 0,
            generatedAt: new Date().toISOString(),
            credentialSource: 'repository-secrets-without-production-environment',
            checks: {
              tokenActive: status('WHOAMI_STATUS') === 0,
              accountReadable: status('ACCOUNT_STATUS') === 0,
              d1MatrixMembersReadable: status('D1_STATUS') === 0,
              userDetailsReadable: status('USER_STATUS') === 0,
              membershipsReadable: status('MEMBERSHIP_STATUS') === 0
            },
            statuses: {
              whoami: status('WHOAMI_STATUS'),
              account: status('ACCOUNT_STATUS'),
              d1: status('D1_STATUS'),
              user: status('USER_STATUS'),
              memberships: status('MEMBERSHIP_STATUS')
            },
            safeForD1AwareRelease: status('WHOAMI_STATUS') === 0 && status('D1_STATUS') === 0 && status('ACCOUNT_STATUS') === 0,
            boundary: 'Read-only credential test. No Worker deployment, D1 mutation, secret change, payment action or application-data write occurred.'
          };
          fs.writeFileSync('downloads/cloudflare-repository-credential-preflight.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result, null, 2));
          NODE
          exit 0

      - name: Enforce D1-aware release readiness
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('downloads/cloudflare-repository-credential-preflight.json', 'utf8'));
          if (!result.safeForD1AwareRelease) {
            throw new Error(`Repository-level Cloudflare credential is not D1-ready: ${JSON.stringify(result.checks)}`);
          }
          console.log('REPOSITORY-LEVEL CLOUDFLARE D1 PREFLIGHT PASSED');
          NODE

      - name: Upload sanitized proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-repository-credential-preflight-${{ github.run_id }}
          path: downloads/cloudflare-repository-credential-preflight.json
          if-no-files-found: error
          retention-days: 30
