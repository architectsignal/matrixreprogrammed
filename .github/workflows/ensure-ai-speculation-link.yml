name: Ensure AI Speculation Link

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: ensure-ai-speculation-link
  cancel-in-progress: false

jobs:
  enforce-link:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Insert permanent Answer Engine routes
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('answer-engine.html')
          text = page.read_text(encoding='utf-8')

          speculation = 'ai-speculative-conclusions.html'

          nav_anchor = '<a href="answer-engine.html">AI Answers</a>'
          nav_with_speculation = nav_anchor + '<a href="ai-speculative-conclusions.html">AI Hypotheses</a>'

          if speculation not in text:
              if nav_anchor not in text:
                  raise SystemExit('Current Answer Engine navigation marker not found; refusing unsafe rewrite.')
              text = text.replace(nav_anchor, nav_with_speculation, 1)

          text = text.replace(
              '<script src="investigation-pulse.js"></script>',
              '<script src="investigation-pulse.js?v=20260719-3"></script>'
          )

          page.write_text(text, encoding='utf-8', newline='\n')
          PY

      - name: Verify visible link
        run: |
          grep -q 'href="ai-speculative-conclusions.html">AI Hypotheses</a>' answer-engine.html

      - name: Commit repair when needed
        run: |
          if node scripts/release-freeze-guard.js --is-frozen; then
            echo "Controlled production release freeze active; speculation link repair validated but will not move main."
            exit 0
          fi
          if git diff --quiet -- answer-engine.html; then
            echo "Answer Engine link already present."
            exit 0
          fi
          git config user.name "matrix-link-guard"
          git config user.email "actions@github.com"
          git add answer-engine.html
          git commit -m "Restore permanent AI speculation link [deploy]"
          git push || (git pull --rebase --autostash origin main && git push)
