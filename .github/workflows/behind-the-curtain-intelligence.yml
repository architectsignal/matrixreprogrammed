name: Behind the Curtain Structural Power Intelligence

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'behind-the-curtain.html'
      - 'behind-the-curtain.js'
      - 'behind-the-curtain-access.html'
      - 'behind-the-curtain-access.js'
      - 'behind-the-curtain-access-v2.js'
      - 'behind-the-curtain-capstone.html'
      - 'power-family-intelligence-layer.js'
      - 'power-family-intelligence-layer.css'
      - 'data/power-family-intelligence-layer.json'
      - 'data/behind-the-curtain.json'
      - 'data/behind-the-curtain-pyramid.json'
      - 'data/behind-the-curtain-people-registry.json'
      - 'data/behind-the-curtain-family-access.json'
      - 'data/behind-the-curtain-continuity-layers.json'
      - 'data/behind-the-curtain-living-access.json'
      - 'data/behind-the-curtain-living-access-history.json'
      - 'data/behind-the-curtain-living-access-intake.json'
      - 'data/behind-the-curtain-source-intake.json'
      - 'data/entity-registry.json'
      - 'data/relationship-registry.json'
      - 'data/money-overlap-graph.json'
      - 'data/epstein-relationship-public.json'
      - 'data/investigation-knowledge-graph.json'
      - 'scripts/build-power-family-intelligence-layer.js'
      - 'scripts/power-family-payload/**'
      - 'scripts/build-behind-the-curtain.js'
      - 'scripts/build-behind-the-curtain-tier-registry.js'
      - 'scripts/seed-behind-the-curtain-data.js'
      - 'scripts/seed-behind-the-curtain-living-access.js'
      - 'scripts/patch-behind-the-curtain-links.js'
      - 'scripts/patch-behind-the-curtain-access-link.js'
      - 'scripts/patch-behind-the-curtain-tier-ui.js'
      - 'scripts/behind-the-curtain-test.js'
      - 'scripts/behind-the-curtain-access-test.js'
      - 'scripts/behind-the-curtain-living-access-test.js'
      - 'docs/BEHIND_THE_CURTAIN_MASTER.md'
      - 'docs/MATRIX_FEDIVERSE_MASTER.md'
      - '.github/workflows/behind-the-curtain-intelligence.yml'
  push:
    branches: [main]
    paths:
      - 'behind-the-curtain-capstone.html'
      - 'power-family-intelligence-layer.js'
      - 'power-family-intelligence-layer.css'
      - 'data/power-family-intelligence-layer.json'
      - 'data/behind-the-curtain-pyramid.json'
      - 'data/behind-the-curtain-people-registry.json'
      - 'data/behind-the-curtain-family-access.json'
      - 'data/behind-the-curtain-continuity-layers.json'
      - 'data/behind-the-curtain-living-access.json'
      - 'data/behind-the-curtain-living-access-history.json'
      - 'data/behind-the-curtain-living-access-intake.json'
      - 'data/behind-the-curtain-source-intake.json'
      - 'data/entity-registry.json'
      - 'data/relationship-registry.json'
      - 'data/money-overlap-graph.json'
      - 'data/epstein-relationship-public.json'
      - 'data/investigation-knowledge-graph.json'
      - 'scripts/build-power-family-intelligence-layer.js'
      - 'scripts/power-family-payload/**'
      - 'scripts/build-behind-the-curtain.js'
      - 'scripts/build-behind-the-curtain-tier-registry.js'
      - 'scripts/seed-behind-the-curtain-data.js'
      - 'scripts/seed-behind-the-curtain-living-access.js'
      - 'scripts/patch-behind-the-curtain-links.js'
      - 'scripts/patch-behind-the-curtain-access-link.js'
      - 'scripts/patch-behind-the-curtain-tier-ui.js'
      - 'scripts/behind-the-curtain-test.js'
      - 'scripts/behind-the-curtain-access-test.js'
      - 'scripts/behind-the-curtain-living-access-test.js'
      - 'docs/BEHIND_THE_CURTAIN_MASTER.md'
      - 'docs/MATRIX_FEDIVERSE_MASTER.md'
      - '.github/workflows/behind-the-curtain-intelligence.yml'

permissions:
  contents: write

concurrency:
  group: behind-the-curtain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-git-only:
    if: ${{ github.event_name != 'push' || (!contains(github.event.head_commit.message, '[curtain-built]') && !contains(github.event.head_commit.message, '[tier-built]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate Power-Family Intelligence Layer and Capstone
        run: node scripts/build-power-family-intelligence-layer.js
      - name: Generate independent tier registry and public interface
        shell: bash
        run: |
          node scripts/build-behind-the-curtain-tier-registry.js
          node scripts/patch-behind-the-curtain-tier-ui.js
      - name: Recalculate structures, families, legacy living access and archives
        shell: bash
        run: |
          set +e
          node scripts/build-behind-the-curtain.js > /tmp/behind-the-curtain-build.log 2>&1
          status=$?
          cp /tmp/behind-the-curtain-build.log behind-the-curtain-build.log
          tail -n 200 /tmp/behind-the-curtain-build.log
          exit $status
      - name: Reassert canonical Capstone after all generators
        run: node scripts/build-power-family-intelligence-layer.js
      - name: Upload focused build failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behind-the-curtain-build-failure-${{ github.run_id }}
          path: behind-the-curtain-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Validate syntax, tier independence and evidence contracts
        shell: bash
        run: |
          set +e
          {
            node --check behind-the-curtain.js
            node --check behind-the-curtain-access.js
            node --check behind-the-curtain-access-v2.js
            node --check power-family-intelligence-layer.js
            node --check scripts/build-power-family-intelligence-layer.js
            node --check scripts/build-behind-the-curtain.js
            node --check scripts/build-behind-the-curtain-tier-registry.js
            node --check scripts/patch-behind-the-curtain-tier-ui.js
            node --check scripts/seed-behind-the-curtain-data.js
            node --check scripts/seed-behind-the-curtain-living-access.js
            node --check scripts/patch-behind-the-curtain-links.js
            node --check scripts/patch-behind-the-curtain-access-link.js
            node --check scripts/behind-the-curtain-test.js
            node --check scripts/behind-the-curtain-access-test.js
            node --check scripts/behind-the-curtain-living-access-test.js
            node scripts/build-power-family-intelligence-layer.js
            node scripts/behind-the-curtain-test.js
            node scripts/behind-the-curtain-access-test.js
            node scripts/behind-the-curtain-living-access-test.js
          } > /tmp/behind-the-curtain-validation.log 2>&1
          status=$?
          cp /tmp/behind-the-curtain-validation.log behind-the-curtain-validation.log
          tail -n 240 /tmp/behind-the-curtain-validation.log
          exit $status
      - name: Upload focused validation failure diagnostic
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: behind-the-curtain-validation-failure-${{ github.run_id }}
          path: behind-the-curtain-validation.log
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated intelligence to Git only
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add behind-the-curtain.html behind-the-curtain.js behind-the-curtain-access.html behind-the-curtain-access.js behind-the-curtain-access-v2.js behind-the-curtain-capstone.html power-family-intelligence-layer.js power-family-intelligence-layer.css data/power-family-intelligence-layer.json data/behind-the-curtain.json data/behind-the-curtain-pyramid.json data/behind-the-curtain-people-registry.json data/behind-the-curtain-family-access.json data/behind-the-curtain-continuity-layers.json data/behind-the-curtain-living-access.json data/behind-the-curtain-living-access-history.json data/behind-the-curtain-living-access-intake.json index.html control-structure.html power-atlas.html follow-the-money.html docs/BEHIND_THE_CURTAIN_MASTER.md docs/MATRIX_FEDIVERSE_MASTER.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'Behind the Curtain intelligence is already current.'
          else
            git commit -m 'Refresh Behind the Curtain independent tiers [curtain-built]'
            git push
          fi
      - name: Confirm production cost boundary
        run: echo 'GIT-ONLY PASS — no production deployment step exists in this workflow.'
