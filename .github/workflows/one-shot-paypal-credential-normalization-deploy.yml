name: One-shot PayPal and homepage navigation deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-paypal-credential-normalization-deploy.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch controlled production workflow
        uses: actions/github-script@v7
        with:
          script: |
            const owner=context.repo.owner;
            const repo=context.repo.repo;
            const dispatchedAt=new Date().toISOString();
            await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id:'deploy.yml',ref:'main',inputs:{confirmation:'DEPLOY MATRIX REPROGRAMMED'}});
            await new Promise(resolve=>setTimeout(resolve,7000));
            const runs=await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id:'deploy.yml',branch:'main',event:'workflow_dispatch',per_page:20});
            const started=runs.data.workflow_runs.find(run=>new Date(run.created_at)>=new Date(dispatchedAt));
            const receipt={ok:Boolean(started),dispatchedAt,purpose:'Deploy normalized PayPal OAuth credentials and restore full homepage navigation',run:started?{id:started.id,status:started.status,headSha:started.head_sha,htmlUrl:started.html_url}:null};
            const path='.github/paypal-credential-normalization-deploy.json';
            let sha;
            try{sha=(await github.rest.repos.getContent({owner,repo,path,ref:'main'})).data.sha}catch{}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:'Record final PayPal and homepage navigation deployment',content:Buffer.from(JSON.stringify(receipt,null,2)+'\n').toString('base64'),sha,branch:'main'});
