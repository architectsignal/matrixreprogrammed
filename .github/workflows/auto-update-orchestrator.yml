name: Automatic Site Update Orchestrator

on:
  workflow_dispatch:
    inputs:
      run_weekly_video:
        description: "Run weekly D.O.G video package now: auto, yes, or no"
        required: false
        default: "auto"
      facebook_mode:
        description: "Facebook mode: live or dry-run"
        required: false
        default: "live"
  schedule:
    - cron: "20 7 * * *"
  push:
    branches: [ main ]
    paths:
      - '.github/update-triggers/orchestrator.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: automatic-site-update-orchestrator
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  FACEBOOK_POST_MODE: ${{ github.event.inputs.facebook_mode || 'live' }}
  FACEBOOK_VIDEO_MODE: ${{ github.event.inputs.facebook_mode || 'live' }}
  ELEVENLABS_MODEL_ID: ${{ secrets.ELEVENLABS_MODEL_ID }}

jobs:
  automatic-update:
    name: Generate, repair, audit, commit once, and trigger deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Install weekly video tools when due
        run: |
          MODE="${{ github.event.inputs.run_weekly_video || 'auto' }}"
          DAY="$(date -u +%u)"
          if [ "$MODE" = "yes" ] || { [ "$MODE" = "auto" ] && [ "$DAY" = "1" ]; }; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg librsvg2-bin
          else
            echo "Weekly video tools not needed today."
          fi

      - name: Generate Daily Intel updates
        run: |
          node scripts/intel-drop-engine.js
          node scripts/update-news-from-drop.js
          node scripts/build-intel-archive-page.js
          node scripts/build-black-file-pdf.js

      - name: Build Intel Drop Vault
        run: node scripts/archive-intel-drops-to-vault.js

      - name: Build generated site
        run: npm run build

      - name: Enforce newsletter persistence
        run: |
          node scripts/patch-worker-newsletter-system.js
          node scripts/patch-newsletter-capture-ui.js
          node scripts/newsletter-persistence-test.js

      - name: Repair deploy-critical generated systems
        run: |
          node scripts/repair-search-system.js
          node scripts/repair-generated-site-artifacts.js
          node scripts/ensure-shared-assets.js
          node scripts/patch-worker-newsletter-system.js
          node scripts/newsletter-persistence-test.js
          node scripts/repair-search-system.js
          node scripts/repair-critical-route-drift.js

      - name: Audit branded downloads
        run: node scripts/brand-downloads-audit.js

      - name: Generate Transparent Maintenance report
        run: node scripts/build-transparent-maintenance-report.js

      - name: Generate Weekly D.O.G package when due
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          MODE="${{ github.event.inputs.run_weekly_video || 'auto' }}"
          DAY="$(date -u +%u)"
          if [ "$MODE" = "yes" ] || { [ "$MODE" = "auto" ] && [ "$DAY" = "1" ]; }; then
            echo "Weekly D.O.G video package is due."
            node scripts/build-weekly-dog-video-package.js
            node scripts/generate-weekly-voiceover.js
            node scripts/render-weekly-mp4.js
          else
            echo "Weekly D.O.G video package not due today."
          fi

      - name: Final mission-critical audit
        id: final_audit
        continue-on-error: true
        run: |
          set +e
          mkdir -p downloads
          : > downloads/automatic-orchestrator-final-audit.md
          echo "# Automatic Orchestrator Final Audit" >> downloads/automatic-orchestrator-final-audit.md
          echo "Generated: $(date -u +%FT%TZ)" >> downloads/automatic-orchestrator-final-audit.md
          echo "" >> downloads/automatic-orchestrator-final-audit.md
          failed=0
          run_check () {
            label="$1"
            shift
            echo "Running $label"
            "$@"
            status=$?
            if [ "$status" -ne 0 ]; then
              failed=$((failed+1))
              echo "- $label: failed with exit $status" >> downloads/automatic-orchestrator-final-audit.md
            else
              echo "- $label: ok" >> downloads/automatic-orchestrator-final-audit.md
            fi
          }
          run_check "newsletter worker persistence patch" node scripts/patch-worker-newsletter-system.js
          run_check "newsletter persistence execution test" node scripts/newsletter-persistence-test.js
          run_check "archive intel drops to vault" node scripts/archive-intel-drops-to-vault.js
          run_check "brand downloads audit" node scripts/brand-downloads-audit.js
          run_check "repair search system" node scripts/repair-search-system.js
          run_check "repair generated artifacts" node scripts/repair-generated-site-artifacts.js
          run_check "ensure shared assets" node scripts/ensure-shared-assets.js
          run_check "critical route drift gate" node scripts/repair-critical-route-drift.js
          run_check "site audit" node scripts/audit-site.js
          run_check "site function harmony" node scripts/site-function-harmony-test.js
          run_check "forum board split" node scripts/forum-board-split-test.js
          run_check "mission critical growth" node scripts/mission-critical-growth-test.js
          HARD_FAILURES="$failed" node - <<'NODE'
          const fs = require('fs');
          const failed = Number(process.env.HARD_FAILURES || 0);
          const report = {
            ok: failed === 0,
            resilient: true,
            status: failed === 0 ? 'passed' : 'failed',
            hardFailures: failed,
            generatedAt: new Date().toISOString(),
            note: failed === 0 ? 'All orchestrator audit gates passed.' : 'The living update completed its reporting cycle but is not healthy enough to commit or publish.'
          };
          fs.writeFileSync('downloads/automatic-orchestrator-final-audit.json', JSON.stringify(report, null, 2));
          NODE
          echo "Final audit hard failures: $failed"
          exit "$failed"

      - name: Commit all generated automatic updates once
        if: steps.final_audit.outcome == 'success'
        run: |
          git config user.name "matrix-auto-update-bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated automatic update changes to commit."
            exit 0
          fi
          git commit -m "Automatic site update $(date -u +%F) [deploy]"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push failed on attempt $attempt. Rebasing and retrying."
            git fetch origin main
            git pull --rebase --autostash origin main || { git rebase --abort || true; exit 1; }
            sleep 2
          done
          echo "Push failed after retries."
          exit 1

      - name: Enforce truthful orchestrator status
        if: always()
        env:
          AUTOMATION_HEALTH_MODE: orchestrator
        run: node scripts/automation-health-gate.js

      - name: Publish Facebook daily post
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: node scripts/publish-facebook-post.js

      - name: Publish Facebook weekly video when due
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.run_weekly_video || 'auto' }}"
          DAY="$(date -u +%u)"
          if [ "$MODE" = "yes" ] || { [ "$MODE" = "auto" ] && [ "$DAY" = "1" ]; }; then
            node scripts/publish-facebook-video.js
          else
            echo "Weekly Facebook video publish not due today."
          fi

      - name: Upload automatic update reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-site-update-reports-${{ github.sha }}
          path: |
            downloads/transparent-maintenance-report.json
            downloads/transparent-maintenance-report.md
            downloads/site-intelligence-core.json
            downloads/site-intelligence-core.md
            downloads/site-intelligence-graph.json
            downloads/intel-drop-vault.json
            downloads/intel-drop-vault.md
            downloads/downloads-index.json
            downloads/downloads-index.md
            downloads/search-system-repair-report.json
            downloads/search-runtime-hardening-report.json
            downloads/generated-site-repair-report.json
            downloads/critical-route-drift-report.json
            downloads/critical-route-drift-report.md
            downloads/newsletter-worker-patch-report.json
            downloads/newsletter-persistence-test.json
            downloads/newsletter-persistence-test.md
            downloads/site-function-harmony-report.json
            downloads/site-function-harmony-report.md
            downloads/automatic-orchestrator-final-audit.json
            downloads/automatic-orchestrator-final-audit.md
            downloads/automation-health-orchestrator.json
            downloads/automation-health-orchestrator.md
            public-content-scrub-report.json
            site-brain-health-report.json
            downloads/site-wide-function-audit.json
            downloads/site-wide-function-audit.md
            video-packages/**/package.md
            video-packages/**/package.json
            video-packages/**/weekly-dog-transmission.mp4
          if-no-files-found: ignore
          retention-days: 21
