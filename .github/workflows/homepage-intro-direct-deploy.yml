name: Homepage intro direct production deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-intro-direct-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce Cloudflare zero-overage budget
        env:
          CLOUDFLARE_GIT_BUILDS_DISCONNECTED: ${{ vars.CLOUDFLARE_GIT_BUILDS_DISCONNECTED }}
          CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED: ${{ vars.CLOUDFLARE_ZERO_BILLABLE_USAGE_CONFIRMED }}
          CLOUDFLARE_BUILD_MINUTES_USED: ${{ vars.CLOUDFLARE_BUILD_MINUTES_USED }}
          CLOUDFLARE_USAGE_CHECKED_AT_UTC: ${{ vars.CLOUDFLARE_USAGE_CHECKED_AT_UTC }}
          EXPECTED_CLOUDFLARE_BUILD_MINUTES: '0'
        run: node scripts/cloudflare-usage-budget-guard.js release

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build corrected intro assets into deployed bundle
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/patch-homepage-mask-intro.js
          node scripts/homepage-mask-intro-test.js
          mkdir -p _site
          cp index.html homepage-mask-intro.css homepage-mask-intro-data.js homepage-mask-intro.js _site/
          grep -q 'homepage-mask-intro-data.js?v=20260725-video-v5' _site/index.html
          grep -q 'homepage-mask-intro.js?v=20260725-video-v5' _site/index.html
          grep -q 'matrix-homepage-intro-seen-v5' _site/homepage-mask-intro.js
          test "$(wc -c < _site/homepage-mask-intro-data.js)" -gt 10000

      - name: Deploy corrected bundle to Cloudflare
        id: deploy
        if: steps.build.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@latest deploy --config wrangler.toml

      - name: Verify forced replay and all intro assets
        id: verify
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            nonce="$(date +%s)-$attempt"
            home="$(curl -fsSL -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/?intro=1&direct=$nonce" || true)"
            js="$(curl -fsSL -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/homepage-mask-intro.js?v=20260725-video-v5&direct=$nonce" || true)"
            data="$(curl -fsSL -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/homepage-mask-intro-data.js?v=20260725-video-v5&direct=$nonce" || true)"
            echo "attempt=$attempt homeBytes=${#home} jsBytes=${#js} dataBytes=${#data}"
            if printf '%s' "$home" | grep -q 'data-homepage-mask-intro data-mode="video"' \
              && printf '%s' "$home" | grep -q 'homepage-mask-intro-data.js?v=20260725-video-v5' \
              && printf '%s' "$home" | grep -q 'homepage-mask-intro.js?v=20260725-video-v5' \
              && printf '%s' "$js" | grep -q 'matrix-homepage-intro-seen-v5' \
              && printf '%s' "$js" | grep -q 'globalThis.__MATRIX_INTRO_BASE64__' \
              && test "${#data}" -gt 10000 \
              && printf '%s' "$data" | grep -q 'globalThis.__MATRIX_INTRO_BASE64__'; then
              echo 'Homepage intro v5 live verification passed.'
              exit 0
            fi
            sleep 5
          done
          echo 'Homepage intro v5 live verification failed.'
          exit 1

      - name: Commit production receipt
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          mkdir -p data
          node - <<'NODE'
          const fs = require('fs');
          const build = process.env.BUILD_OUTCOME || 'unknown';
          const deploy = process.env.DEPLOY_OUTCOME || 'unknown';
          const verify = process.env.VERIFY_OUTCOME || 'unknown';
          const payload = {
            ok: build === 'success' && deploy === 'success' && verify === 'success',
            version: '20260725-video-v5',
            mode: 'direct-cloudflare-site-assets',
            recordedAt: new Date().toISOString(),
            runId: Number(process.env.RUN_ID),
            headSha: process.env.HEAD_SHA,
            buildOutcome: build,
            deployOutcome: deploy,
            verifyOutcome: verify,
            forcedReplayUrl: 'https://matrixreprogrammed.com/?intro=1'
          };
          fs.writeFileSync('data/homepage-intro-hotfix-result.json', JSON.stringify(payload, null, 2) + '\n');
          console.log(JSON.stringify(payload));
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/homepage-intro-hotfix-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record direct homepage intro production outcome'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
          done
          exit 1

      - name: Fail closed when any stage failed
        if: always() && (steps.build.outcome != 'success' || steps.deploy.outcome != 'success' || steps.verify.outcome != 'success')
        run: |
          echo "build=${{ steps.build.outcome }} deploy=${{ steps.deploy.outcome }} verify=${{ steps.verify.outcome }}"
          exit 1
