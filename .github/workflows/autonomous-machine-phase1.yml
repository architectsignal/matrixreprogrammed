name: Autonomous Machine Phase 1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/autonomous-machine/**'
      - 'docs/autonomous-intelligence-machine/**'
      - 'data/autonomous-machine/**'
      - '.github/workflows/autonomous-machine-phase1.yml'

permissions:
  contents: read

jobs:
  phase1-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify publication remains disabled
        env:
          AIM_PUBLICATION_MODE: disabled
        run: node scripts/autonomous-machine/phase1-self-test.js
