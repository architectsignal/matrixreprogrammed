name: Test Site

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ test, atlas-layers-upgrade, develop ]
  workflow_dispatch:

concurrency:
  group: test-site-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    name: Build and pressure test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Apply Cloudflare member experience repairs
        run: node scripts/patch-membership-auth-ui.js

      - name: Verify Cloudflare member contracts
        id: member_contracts
        shell: bash
        run: |
          set +e
          mkdir -p downloads
          node scripts/cloudflare-member-experience-test.mjs > downloads/cloudflare-member-contract.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify PayPal active-subscription compatibility
        id: paypal_compatibility
        shell: bash
        run: |
          set +e
          node scripts/paypal-active-subscription-compatibility-test.mjs > downloads/paypal-active-subscription-compatibility.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify canonical Cloudflare origin at runtime
        id: canonical_origin
        shell: bash
        run: |
          set +e
          node scripts/cloudflare-canonical-origin-test.mjs > downloads/cloudflare-canonical-origin.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload focused Cloudflare diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-member-diagnostics-${{ github.run_id }}
          path: |
            downloads/cloudflare-member-contract.log
            downloads/cloudflare-member-experience-test.json
            downloads/paypal-active-subscription-compatibility.log
            downloads/paypal-active-subscription-compatibility-test.json
            downloads/cloudflare-canonical-origin.log
            downloads/cloudflare-canonical-member-origin.json
            downloads/member-login-paypal-newsletter-patch.json
            downloads/membership-auth-ui-patch.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if a focused Cloudflare contract failed
        if: steps.member_contracts.outputs.exit_code != '0' || steps.paypal_compatibility.outputs.exit_code != '0' || steps.canonical_origin.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "member_contracts=${{ steps.member_contracts.outputs.exit_code }}"
          echo "paypal_compatibility=${{ steps.paypal_compatibility.outputs.exit_code }}"
          echo "canonical_origin=${{ steps.canonical_origin.outputs.exit_code }}"
          for log in downloads/cloudflare-member-contract.log downloads/paypal-active-subscription-compatibility.log downloads/cloudflare-canonical-origin.log; do
            if [ -f "$log" ]; then
              echo "===== $log ====="
              cat "$log"
            fi
          done
          exit 1

      - name: Full build and pressure tests
        run: npm run build

      - name: Atlas Layers test
        if: always()
        run: node scripts/atlas-layers-test.js

      - name: Migration Flow test
        if: always()
        run: node scripts/migration-flow-test.js

      - name: Risk Clocks and Forum Cloudflare test
        if: always()
        run: node scripts/global-risk-clocks-test.js

      - name: Update cadence audit
        if: always()
        run: node scripts/update-cadence-test.js

      - name: Upload built site artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: matrixreprogrammed-site-build
          path: _site
          if-no-files-found: error
          retention-days: 7
