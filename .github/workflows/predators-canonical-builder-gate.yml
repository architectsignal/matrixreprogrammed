name: Predators Canonical Builder Gate

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/predators-canonical-builder-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predators-canonical-builder-gate
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test-canonical-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Patch canonical builder and generate page twice
        run: |
          set -euo pipefail
          node --check scripts/patch-predators-builder-hit-list.js
          node --check scripts/exposure-integrity-predators-link.js
          node --check scripts/build-predators-in-power.js
          node scripts/patch-predators-builder-hit-list.js
          node --check scripts/build-predators-in-power.js
          node scripts/build-predators-in-power.js
          grep -q 'exposure-predators-hit-list:start' predators-in-power.html
          grep -q 'href="/hit-list.html"' predators-in-power.html
          grep -q 'Connected Exposure Integrity System' predators-in-power.html
          FIRST_HASH="$(sha256sum predators-in-power.html | awk '{print $1}')"
          node scripts/build-predators-in-power.js
          grep -q 'exposure-predators-hit-list:start' predators-in-power.html
          grep -q 'href="/hit-list.html"' predators-in-power.html
          grep -q 'Connected Exposure Integrity System' predators-in-power.html
          SECOND_HASH="$(sha256sum predators-in-power.html | awk '{print $1}')"
          test "$FIRST_HASH" = "$SECOND_HASH"
          node scripts/exposure-integrity-predators-link.js
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('predators-in-power.html', 'utf8');
          const report = JSON.parse(fs.readFileSync('downloads/exposure-predators-hit-list-link.json', 'utf8'));
          const markerCount = (html.match(/exposure-predators-hit-list:start/g) || []).length;
          if (markerCount !== 1) throw new Error(`Expected one canonical Hit List marker; found ${markerCount}.`);
          if (!html.includes('href="/hit-list.html"')) throw new Error('Canonical page lacks Hit List route.');
          if (!html.includes('href="/timers.html"')) throw new Error('Canonical page lacks timer route.');
          if (!html.includes('href="/source-document-vault.html"')) throw new Error('Canonical page lacks source route.');
          if (!html.includes('href="/trust-corrections.html"')) throw new Error('Canonical page lacks correction route.');
          if (!report.ok || report.canonicalBuilderPatched !== true) throw new Error('Persistent link report did not pass.');
          fs.writeFileSync('downloads/predators-canonical-builder-gate.json', JSON.stringify({
            ok: true,
            generatedAt: new Date().toISOString(),
            markerCount,
            routes: ['/hit-list.html','/timers.html','/source-document-vault.html','/trust-corrections.html'],
            pageBytes: Buffer.byteLength(html),
            boundary: 'The canonical Predators builder itself emitted and preserved the Exposure Integrity links across two consecutive generations.'
          }, null, 2) + '\n');
          NODE

      - name: Record canonical builder proof
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const proof = JSON.parse(fs.readFileSync('downloads/predators-canonical-builder-gate.json', 'utf8'));
            proof.workflowRunId = Number(process.env.GITHUB_RUN_ID);
            proof.workflowRunNumber = Number(process.env.GITHUB_RUN_NUMBER);
            proof.headSha = process.env.GITHUB_SHA;
            const path = 'data/predators-canonical-builder-gate.json';
            const content = Buffer.from(JSON.stringify(proof, null, 2) + '\n').toString('base64');
            for (let attempt = 1; attempt <= 8; attempt += 1) {
              let sha;
              try {
                const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
                if (!Array.isArray(current.data)) sha = current.data.sha;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              try {
                await github.rest.repos.createOrUpdateFileContents({ owner, repo, path, message: 'Record Predators canonical builder gate', content, branch: 'main', ...(sha ? { sha } : {}) });
                return;
              } catch (error) {
                if (![409, 422].includes(error.status) || attempt === 8) throw error;
                await new Promise(resolve => setTimeout(resolve, attempt * 2000));
              }
            }

      - name: Upload gate proof
        uses: actions/upload-artifact@v4
        with:
          name: predators-canonical-builder-proof-${{ github.run_id }}
          path: |
            downloads/predators-canonical-builder-gate.json
            downloads/exposure-predators-hit-list-link.json
            predators-in-power.html
