name: One-shot PayPal redirect production dispatch

on:
  push:
    branches: [main]
    paths:
      - .github/one-shot-paypal-redirect.trigger

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch controlled production workflow and record run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflows = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const target = workflows.data.workflows.find(w => w.name === 'Matrix Reprogrammed Controlled Production Deploy');
            if (!target) return core.setFailed('Controlled production workflow not found');
            const dispatchedAt = Date.now();
            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: target.id, ref: 'main',
              inputs: { confirmation: 'DEPLOY MATRIX REPROGRAMMED' }
            });
            let run = null;
            for (let attempt = 0; attempt < 24 && !run; attempt += 1) {
              await new Promise(resolve => setTimeout(resolve, 2500));
              const runs = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: target.id, event: 'workflow_dispatch', branch: 'main', per_page: 30 });
              run = runs.data.workflow_runs.find(item => Date.parse(item.created_at) >= dispatchedAt - 5000) || null;
            }
            if (!run) return core.setFailed('Dispatched workflow run was not found');
            const receiptPath = '.github/one-shot-paypal-redirect.receipt.json';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path: receiptPath, ref: 'main' });
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (error) { if (error.status !== 404) throw error; }
            const receipt = { ok: true, dispatchedAt: new Date(dispatchedAt).toISOString(), run: { id: run.id, status: run.status, headSha: run.head_sha, htmlUrl: run.html_url } };
            await github.rest.repos.createOrUpdateFileContents({ owner, repo, path: receiptPath, branch: 'main', message: 'Record PayPal redirect production run', content: Buffer.from(JSON.stringify(receipt, null, 2) + '\n').toString('base64'), ...(sha ? { sha } : {}) });
            core.info(`Controlled production run ${run.id}`);
