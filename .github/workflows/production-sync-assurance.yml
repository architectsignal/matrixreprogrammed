name: Production Synchronisation Assurance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/production-sync-assurance.yml'
      - '.github/workflows/daily-investigation-machine.yml'
      - 'src/worker.js'
      - 'src/worker-forum-persistence.js'
      - 'src/worker-production.js'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - 'migrations/0004_forum_persistence.sql'
      - 'scripts/forum-persistence-d1-test.js'
      - 'scripts/cloudflare-worker-routes-test.js'
      - 'scripts/cloudflare-focused-pressure-wrapper.js'
      - 'scripts/site-function-harmony-test.js'
      - 'scripts/repair-generated-site-artifacts.js'
      - 'scripts/final-production-reconcile.js'
      - 'scripts/build-production-health.js'
      - 'scripts/patch-homepage-mask-intro.js'
      - 'scripts/homepage-mask-intro-test.js'
      - 'scripts/patch-membership-tiers.js'
      - 'scripts/patch-conclusion-integrity-cards.js'
      - 'scripts/build-mission-brief-conclusions.js'
      - 'scripts/build-homepage-command-surface.js'
      - 'scripts/build-deploy-manifest.js'
      - 'scripts/update-live-intel.js'
      - 'scripts/record-live-intel-check.js'
      - 'scripts/production-freshness-guard.js'
      - 'scripts/verify-live-production.js'
      - 'scripts/production-sync-test.js'
      - 'scripts/production-deploy-guard.js'
      - 'homepage-mask-intro.css'
      - 'homepage-mask-intro.js'
      - 'assets/intro-eye.svg'
      - 'assets/intro-mask.svg'
      - 'membership.html'
      - 'data/membership-tiers.json'
      - 'data/production-freshness-policy.json'
      - 'package.json'
      - '_headers'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/production-sync-assurance.yml'
      - 'src/worker.js'
      - 'src/worker-forum-persistence.js'
      - 'src/worker-production.js'
      - 'wrangler.toml'
      - 'wrangler.jsonc'
      - 'migrations/0004_forum_persistence.sql'
      - 'scripts/forum-persistence-d1-test.js'
      - 'scripts/cloudflare-worker-routes-test.js'
      - 'scripts/cloudflare-focused-pressure-wrapper.js'
      - 'scripts/site-function-harmony-test.js'
      - 'scripts/repair-generated-site-artifacts.js'
      - 'scripts/final-production-reconcile.js'
      - 'scripts/build-production-health.js'
      - 'scripts/patch-homepage-mask-intro.js'
      - 'scripts/homepage-mask-intro-test.js'
      - 'scripts/patch-membership-tiers.js'
      - 'scripts/patch-conclusion-integrity-cards.js'
      - 'scripts/build-mission-brief-conclusions.js'
      - 'scripts/build-homepage-command-surface.js'
      - 'scripts/build-deploy-manifest.js'
      - 'scripts/update-live-intel.js'
      - 'scripts/record-live-intel-check.js'
      - 'scripts/production-freshness-guard.js'
      - 'scripts/verify-live-production.js'
      - 'scripts/production-sync-test.js'
      - 'scripts/production-deploy-guard.js'
      - 'homepage-mask-intro.css'
      - 'homepage-mask-intro.js'
      - 'assets/intro-eye.svg'
      - 'assets/intro-mask.svg'
      - 'membership.html'
      - 'data/membership-tiers.json'
      - 'data/production-freshness-policy.json'
      - 'package.json'
      - '_headers'

permissions:
  contents: read

concurrency:
  group: production-sync-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assure:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Refresh investigation, Live Intel and conclusions before assurance
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          INVESTIGATION_MODE: daily
          INVESTIGATION_CONCURRENCY: '4'
          INVESTIGATION_TIMEOUT_MS: '25000'
        run: |
          node scripts/repair-investigation-source-registry.js
          node scripts/run-investigation-machine.js daily
          node scripts/update-live-intel.js
          node scripts/record-live-intel-check.js
          node scripts/update-seven-day-intel.js
          node scripts/build-outcome-briefings.js
          node scripts/build-daily-brain-brief.js
          node scripts/build-investigation-pages.js
          node scripts/build-mission-intelligence-10.js
          node scripts/build-live-intel-machine.js
          node scripts/patch-conclusion-integrity-cards.js
      - name: Build normal site
        env:
          SOURCE_DOCUMENTS_PER_RUN: '0'
        run: npm run build
      - name: Verify D1-authoritative forum persistence wiring
        run: node scripts/forum-persistence-d1-test.js
      - name: Bundle strict Worker without deploying
        run: npx --yes wrangler@latest deploy --dry-run
      - name: Reconcile final production output
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/final-production-reconcile.js
      - name: Verify repository and built data freshness
        run: node scripts/production-freshness-guard.js
      - name: Static production synchronization assurance
        run: node scripts/production-sync-test.js
      - name: Verify legacy generators cannot regress release state
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/cloudflare-focused-pressure-wrapper.js
      - name: Production deploy guard
        env:
          DEPLOY_COMMIT_SHA: ${{ github.sha }}
        run: node scripts/production-deploy-guard.js
      - name: Upload assurance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-sync-assurance-${{ github.run_id }}
          path: |
            downloads/production-sync-test.json
            downloads/production-freshness-guard.json
            downloads/production-deploy-guard-report.json
            downloads/forum-persistence-d1-test.json
            downloads/cloudflare-worker-routes-test.json
            downloads/cloudflare-focused-pressure-wrapper.json
            downloads/site-function-harmony-report.json
            downloads/generated-site-repair-report.json
            downloads/final-production-reconcile.json
            downloads/homepage-mask-intro-test.json
            downloads/homepage-mask-intro-report.json
            downloads/membership-tiers-report.json
            downloads/conclusion-integrity-report.json
            downloads/deploy-manifest.json
            downloads/deploy-health.json
            data/speculative-intelligence-synthesis.json
            downloads/speculative-intelligence-synthesis.md
          if-no-files-found: ignore
          retention-days: 30
