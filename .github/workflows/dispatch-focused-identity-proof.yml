name: Dispatch Focused Identity Overlay Proof

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/dispatch-focused-identity-proof.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: dispatch-focused-identity-overlay-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  dispatch-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Dispatch focused proof workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "started_at=$started_at" >> "$GITHUB_OUTPUT"
          code="$(curl -sS -o /tmp/focused-proof-dispatch.json -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/identity-overlay-live-proof.yml/dispatches" \
            -d '{"ref":"main"}')"
          if [ "$code" != '204' ] && [ "$code" != '200' ]; then
            cat /tmp/focused-proof-dispatch.json
            echo "Focused proof dispatch failed with HTTP $code"
            exit 1
          fi
          echo "Focused proof workflow accepted the dispatch with HTTP $code."

      - name: Resolve focused proof run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STARTED_AT: ${{ steps.dispatch.outputs.started_at }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const repository = process.env.GITHUB_REPOSITORY;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28'
          };
          const threshold = Date.parse(process.env.STARTED_AT) - 15000;
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          (async () => {
            let selected = null;
            for (let attempt = 1; attempt <= 24; attempt += 1) {
              const response = await fetch(`https://api.github.com/repos/${repository}/actions/workflows/identity-overlay-live-proof.yml/runs?event=workflow_dispatch&branch=main&per_page=20`, {headers});
              if (!response.ok) throw new Error(`Focused proof run lookup failed: HTTP ${response.status}`);
              const data = await response.json();
              selected = (data.workflow_runs || [])
                .filter(run => Date.parse(run.created_at) >= threshold)
                .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0] || null;
              if (selected) break;
              await sleep(5000);
            }
            if (!selected) throw new Error('Focused proof workflow run was not found after dispatch');
            const receipt = {
              ok: true,
              dispatcherRunId: Number(process.env.GITHUB_RUN_ID),
              proofRunId: selected.id,
              proofRunNumber: selected.run_number,
              status: selected.status,
              conclusion: selected.conclusion,
              event: selected.event,
              headSha: selected.head_sha,
              createdAt: selected.created_at,
              updatedAt: selected.updated_at,
              url: selected.html_url,
              recordedAt: new Date().toISOString()
            };
            fs.mkdirSync('data', {recursive: true});
            fs.writeFileSync('data/identity-affiliation-overlay-proof-dispatch.json', `${JSON.stringify(receipt, null, 2)}\n`);
            console.log(JSON.stringify(receipt, null, 2));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Record focused proof dispatch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/identity-affiliation-overlay-proof-dispatch.json
          git commit -m 'Record focused identity overlay proof dispatch'
          git pull --rebase origin main
          git push origin HEAD:main
