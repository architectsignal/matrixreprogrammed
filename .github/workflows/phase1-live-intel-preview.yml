name: Phase 1 Live Intel Canonical Preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/build-live-intel-canonical-previews.js'
      - 'data/live-intel.json'
      - 'data/intelligence-record.schema.json'
      - 'data/access-tier-policy.json'
      - '.github/workflows/phase1-live-intel-preview.yml'

permissions:
  contents: read

concurrency:
  group: phase1-live-intel-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Validate non-destructive Live Intel previews
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout proposed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate adapter syntax
        run: node --check scripts/build-live-intel-canonical-previews.js

      - name: Record protected source hashes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const files = [
            'data/live-intel.json',
            'data/access-tier-policy.json',
            'data/intelligence-record.schema.json',
            'membership.html'
          ];
          const hashes = Object.fromEntries(files.map(file => [
            file,
            crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')
          ]));
          fs.mkdirSync('downloads/canonical-live-intel-preview', { recursive: true });
          fs.writeFileSync('downloads/canonical-live-intel-preview/source-hashes-before.json', JSON.stringify(hashes, null, 2));
          NODE

      - name: Build Live Intel canonical previews
        run: node scripts/build-live-intel-canonical-previews.js

      - name: Validate Live Intel safety and structure
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const schema = JSON.parse(fs.readFileSync('data/intelligence-record.schema.json', 'utf8'));
          const output = JSON.parse(fs.readFileSync('downloads/canonical-live-intel-preview/live-intel.canonical-preview.json', 'utf8'));
          if (output.mode !== 'preview-only') throw new Error('Preview mode changed');
          if (output.paymentStatus !== 'deferred') throw new Error('Payment boundary changed');
          if (output.enforcementMode !== 'report-only') throw new Error('Tier enforcement changed');
          if (!output.records.length || output.recordCount !== output.records.length) throw new Error('Live Intel preview count invalid');
          const required = schema.required || [];
          const allowedTiers = new Set(schema.$defs.tier.enum);
          let inspected = 0;
          for (const record of output.records) {
            inspected += 1;
            for (const field of required) {
              if (record[field] === undefined || record[field] === null) throw new Error(`${record.id}: missing ${field}`);
            }
            if (record.recordType !== 'signal') throw new Error(`${record.id}: Live Intel record is not a signal`);
            if (record.missionAssessment.outcome !== 'insufficient_evidence') throw new Error(`${record.id}: lead was over-promoted`);
            if (record.evidence.claimClass !== 'disputed_claim') throw new Error(`${record.id}: lead claim class is unsafe`);
            if (record.speculativeConclusion.label !== 'speculative') throw new Error(`${record.id}: speculation label missing`);
            if (record.speculativeConclusion.confidence !== 'very_low') throw new Error(`${record.id}: speculation confidence too high`);
            if (!record.speculativeConclusion.falsifiers.length) throw new Error(`${record.id}: no falsifiers`);
            if (!record.solidConclusion.boundary || !record.evidence.associationBoundary) throw new Error(`${record.id}: evidence boundary missing`);
            if (!allowedTiers.has(record.access.minimumTier)) throw new Error(`${record.id}: invalid tier`);
            if (record.delivery.includeInConvergenceTracker !== false) throw new Error(`${record.id}: unverified lead entered convergence tracker`);
            if (!/does not establish wrongdoing/i.test(record.solidConclusion.text)) throw new Error(`${record.id}: lead conclusion lacks no-wrongdoing boundary`);
          }
          console.log(`LIVE INTEL PREVIEW PASS: ${inspected} leads retained as leads.`);
          NODE

      - name: Prove protected files were not changed
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const before = JSON.parse(fs.readFileSync('downloads/canonical-live-intel-preview/source-hashes-before.json', 'utf8'));
          const changed = [];
          for (const [file, expected] of Object.entries(before)) {
            const actual = crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (actual !== expected) changed.push({ file, expected, actual });
          }
          const report = {
            ok: changed.length === 0,
            generatedAt: new Date().toISOString(),
            checkedFiles: Object.keys(before).length,
            changed,
            boundary: 'Live Intel preview generation must not modify the source feed, canonical schema, tier policy or membership page.'
          };
          fs.writeFileSync('downloads/canonical-live-intel-preview/non-mutation-report.json', JSON.stringify(report, null, 2));
          if (changed.length) throw new Error(JSON.stringify(changed, null, 2));
          console.log(`NON-MUTATION PASS: ${report.checkedFiles} protected files unchanged.`);
          NODE

      - name: Upload Live Intel preview package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-live-intel-preview-${{ github.run_id }}
          path: downloads/canonical-live-intel-preview/
          if-no-files-found: error
          retention-days: 30
