name: Capture Forum Repair Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture-forum-repair-status.yml'
      - '.github/update-triggers/forum-repair-status.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture forum repair and production workflow states
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p downloads
          gh run list --workflow forum-hotfix-now.yml --limit 10 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle > downloads/forum-hotfix-runs.json
          gh run list --workflow permanent-forum-public-surface-repair.yml --limit 10 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle > downloads/permanent-forum-repair-runs.json
          gh run list --workflow deploy.yml --limit 20 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url,displayTitle > downloads/forum-controlled-deploy-runs.json
      - name: Commit status snapshot safely
        run: |
          git config user.name 'forum-repair-status-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add downloads/forum-hotfix-runs.json downloads/permanent-forum-repair-runs.json downloads/forum-controlled-deploy-runs.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record forum repair workflow status'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
