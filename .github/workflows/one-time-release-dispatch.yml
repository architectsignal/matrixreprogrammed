# release-attempt: 5
name: One-Time Confirmed Production Release Dispatcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-release-dispatch.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: matrixreprogrammed-release-dispatch
  cancel-in-progress: false

jobs:
  dispatch-and-prove:
    name: Dispatch and prove controlled release
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Verify explicit one-time authorization
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.head_commit.message }}" = "Dispatch confirmed production release"
          echo "Owner-authorized one-time release dispatcher accepted."

      - name: Dispatch canonical confirmation-gated deployment
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "dispatched_at=$dispatched_at" >> "$GITHUB_OUTPUT"
          payload='{"ref":"main","inputs":{"confirmation":"DEPLOY MATRIX REPROGRAMMED"}}'
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/deploy.yml/dispatches" \
            --data "$payload"
          echo "Canonical production deployment dispatched at $dispatched_at."

      - name: Find and monitor canonical deployment
        id: monitor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DISPATCHED_AT: ${{ steps.dispatch.outputs.dispatched_at }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            response="$(curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/workflows/deploy.yml/runs?event=workflow_dispatch&branch=main&per_page=20")"
            run_id="$(printf '%s' "$response" | jq -r --arg dispatched "$DISPATCHED_AT" '.workflow_runs | map(select(.created_at >= $dispatched)) | sort_by(.created_at) | last | .id // empty')"
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          test -n "$run_id" || { echo "Canonical deployment run was not created."; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Monitoring canonical deployment run $run_id."

          conclusion=""
          status=""
          html_url=""
          head_sha=""
          for attempt in $(seq 1 720); do
            run="$(curl --fail --silent --show-error --location \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs/$run_id")"
            status="$(printf '%s' "$run" | jq -r '.status')"
            conclusion="$(printf '%s' "$run" | jq -r '.conclusion // empty')"
            html_url="$(printf '%s' "$run" | jq -r '.html_url')"
            head_sha="$(printf '%s' "$run" | jq -r '.head_sha')"
            echo "Canonical deployment status: $status${conclusion:+ / $conclusion}"
            if [ "$status" = "completed" ]; then break; fi
            sleep 10
          done
          test "$status" = "completed" || conclusion="timed_out"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "html_url=$html_url" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Record controlled release result on main
        if: always() && steps.monitor.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ steps.monitor.outputs.run_id }}
          CONCLUSION: ${{ steps.monitor.outputs.conclusion }}
          RUN_URL: ${{ steps.monitor.outputs.html_url }}
          DEPLOYED_SHA: ${{ steps.monitor.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-record
          cat > /tmp/release-record/result.json <<JSON
          {
            "authorized": true,
            "authorization": "owner confirmed controlled production release",
            "workflow": "Matrix Reprogrammed Controlled Production Deploy",
            "runId": "$RUN_ID",
            "runUrl": "$RUN_URL",
            "conclusion": "$CONCLUSION",
            "deployedCommit": "$DEPLOYED_SHA",
            "recordedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "paypalLiveCharging": false,
            "paymentBoundary": "Live PayPal charging remains disabled until separately activated through the server-side gates."
          }
          JSON
          content="$(base64 -w 0 /tmp/release-record/result.json)"
          api="https://api.github.com/repos/$REPOSITORY/contents/deployments/last-controlled-release.json"
          existing_sha="$(curl --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api" | jq -r '.sha // empty')"
          jq -n \
            --arg message "Record controlled production release result" \
            --arg content "$content" \
            --arg branch "main" \
            --arg sha "$existing_sha" \
            'if $sha == "" then {message:$message,content:$content,branch:$branch} else {message:$message,content:$content,branch:$branch,sha:$sha} end' \
            > /tmp/release-record/payload.json
          curl --fail-with-body --silent --show-error --location \
            --request PUT \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            --data-binary @/tmp/release-record/payload.json

      - name: Enforce successful controlled deployment
        env:
          CONCLUSION: ${{ steps.monitor.outputs.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONCLUSION" = "success" || { echo "Controlled deployment did not succeed: $CONCLUSION"; exit 1; }
          echo "Controlled production deployment completed successfully."
