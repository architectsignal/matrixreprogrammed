<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Email Status | Matrix Reprogrammed</title>
  <meta name="description" content="Matrix Reprogrammed email verification and subscription status.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="fixes.css">
  <link rel="stylesheet" href="reader-experience.css">
</head>
<body>
  <div class="page">
    <header class="wrap topbar"><a class="brand" href="index.html">MATRIX REPROGRAMMED</a></header>
    <main class="wrap section">
      <div class="eyebrow">Email lifecycle</div>
      <h1 id="status-title">EMAIL STATUS.</h1>
      <section class="card" id="status-card" aria-live="polite">
        <p id="status-copy">Checking the result...</p>
        <p><a class="btn" id="dashboard-link" href="subscriber-dashboard.html" hidden>Open subscriber dashboard</a></p>
        <p><a class="btn alt" href="newsletter.html">Return to newsletter</a></p>
      </section>
    </main>
  </div>
  <script>
  (function(){
    const params=new URLSearchParams(location.search);
    const title=document.getElementById('status-title');
    const copy=document.getElementById('status-copy');
    const dashboard=document.getElementById('dashboard-link');
    const token=params.get('token');
    if(params.get('verified')==='1'){
      title.textContent='EMAIL VERIFIED.';
      copy.textContent='Your address is verified, your selected briefings are active, and the welcome message has been queued.';
      if(token){dashboard.href='subscriber-dashboard.html?token='+encodeURIComponent(token);dashboard.hidden=false;sessionStorage.setItem('matrixEmailPreferenceToken',token)}
    }else if(params.get('unsubscribed')==='1'){
      title.textContent='UNSUBSCRIBED.';
      copy.textContent='Marketing email has been suppressed immediately. Transactional account-security email remains separate.';
    }else{
      title.textContent='EMAIL ACTION FAILED.';
      copy.textContent='The link was invalid, expired or already used. Request a new verification or resubscription email from the newsletter page.';
    }
  })();
  </script>
</body>
</html>
