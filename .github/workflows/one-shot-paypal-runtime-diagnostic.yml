name: One-shot PayPal runtime failure diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/one-shot-paypal-runtime-diagnostic.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Query sanitized PayPal failure ledger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/paypal-diagnostic
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT status,failure_reason,created_at,updated_at FROM paypal_checkout_intent_state WHERE failure_reason IS NOT NULL ORDER BY updated_at DESC LIMIT 10;" --json > .github/paypal-diagnostic/state.json
          npx --yes wrangler@latest d1 execute matrix-members --remote --command="SELECT action,metadata_json,created_at FROM audit_log WHERE action='paypal.subscription.create_failed' ORDER BY created_at DESC LIMIT 10;" --json > .github/paypal-diagnostic/audit.json
          node - <<'NODE'
          const fs=require('fs');
          const rows=payload=>payload.flatMap(item=>item.results||item.result?.results||[]);
          const state=rows(JSON.parse(fs.readFileSync('.github/paypal-diagnostic/state.json','utf8')));
          const audit=rows(JSON.parse(fs.readFileSync('.github/paypal-diagnostic/audit.json','utf8'))).map(row=>{
            let metadata={};
            try{metadata=JSON.parse(row.metadata_json||'{}')}catch{}
            return {created_at:row.created_at,action:row.action,errorCode:metadata.errorCode||null,debugId:metadata.debugId||null,message:metadata.message||null,tier:metadata.tier||null,environment:metadata.environment||null};
          });
          const receipt={ok:true,generatedAt:new Date().toISOString(),state,audit};
          fs.writeFileSync('.github/paypal-runtime-diagnostic.json',JSON.stringify(receipt,null,2)+'\n');
          NODE
      - name: Commit sanitized diagnostic receipt
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const path='.github/paypal-runtime-diagnostic.json';
            const content=fs.readFileSync(path,'utf8');
            let sha;
            try{sha=(await github.rest.repos.getContent({...context.repo,path,ref:'main'})).data.sha}catch{}
            await github.rest.repos.createOrUpdateFileContents({...context.repo,path,message:'Record sanitized PayPal runtime failure diagnostic',content:Buffer.from(content).toString('base64'),sha,branch:'main'});
