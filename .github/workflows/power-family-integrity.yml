name: Power-Family Intelligence Integrity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'behind-the-curtain-capstone.html'
      - 'behind-the-curtain-symbolic-capstone.html'
      - 'power-family-intelligence-layer.js'
      - 'power-family-intelligence-layer.css'
      - 'behind-the-curtain-capstone.js'
      - 'data/power-family-intelligence-layer.json'
      - 'data/power-family-curated-people.json'
      - 'data/behind-the-curtain-family-access.json'
      - 'data/behind-the-curtain-capstone.json'
      - 'scripts/build-power-family-intelligence-layer.js'
      - 'scripts/power-family-intelligence-layer.runtime.js'
      - 'scripts/reconcile-power-family-capstone.js'
      - 'scripts/patch-power-family-public-gateways.js'
      - 'scripts/behind-the-curtain-production-guard.js'
      - 'scripts/behind-the-curtain-production-guard-v2.js'
      - '.github/workflows/power-family-integrity.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: |
          node --check power-family-intelligence-layer.js
          node --check behind-the-curtain-capstone.js
          node --check scripts/power-family-intelligence-layer.runtime.js
          node --check scripts/reconcile-power-family-capstone.js
          node --check scripts/patch-power-family-public-gateways.js
          node --check scripts/behind-the-curtain-production-guard-v2.js

      - name: Parse intelligence datasets
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=[
            'data/power-family-intelligence-layer.json',
            'data/power-family-curated-people.json',
            'data/behind-the-curtain-family-access.json',
            'data/behind-the-curtain-capstone.json',
            'data/behind-the-curtain-pyramid.json',
            'data/behind-the-curtain-people-registry.json'
          ];
          for(const file of files) JSON.parse(fs.readFileSync(file,'utf8'));
          console.log(`Parsed ${files.length} Power-Family and Behind the Curtain datasets.`);
          NODE

      - name: Prepare focused deploy-bundle fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/data
          for file in \
            index.html \
            start-here.html \
            behind-the-curtain.html \
            behind-the-curtain-access.html \
            behind-the-curtain-access-v2.js \
            behind-the-curtain-capstone.html \
            behind-the-curtain-symbolic-capstone.html \
            behind-the-curtain-capstone.js \
            power-family-intelligence-layer.js \
            power-family-intelligence-layer.css; do
            cp "$file" "_site/$file"
          done
          cp index.html _site/index
          cp start-here.html _site/start-here
          cp behind-the-curtain.html _site/behind-the-curtain
          cp behind-the-curtain-access.html _site/behind-the-curtain-access
          cp behind-the-curtain-capstone.html _site/behind-the-curtain-capstone
          cp behind-the-curtain-symbolic-capstone.html _site/behind-the-curtain-symbolic-capstone
          for file in \
            data/behind-the-curtain.json \
            data/behind-the-curtain-pyramid.json \
            data/behind-the-curtain-people-registry.json \
            data/behind-the-curtain-family-access.json \
            data/behind-the-curtain-capstone.json \
            data/power-family-intelligence-layer.json \
            data/power-family-curated-people.json; do
            cp "$file" "_site/$file"
          done
          cp search-index.json sitemap.xml llms.txt _site/

      - name: Reconcile canonical Capstones and discovery routes
        run: node scripts/reconcile-power-family-capstone.js

      - name: Run production contract guard and public gateway checks
        run: node scripts/behind-the-curtain-production-guard.js

      - name: Verify marker cleanup and public gateways
        run: |
          node scripts/hide-visible-compatibility-markers.js --output
          if grep -RIl 'preservedaftervisiblede-duplication' _site --include='*.html' --exclude-dir='data'; then
            echo 'Visible compatibility marker leak remains.'
            exit 1
          fi
          grep -q 'power-family-public-gateway:start' _site/index.html
          grep -q 'power-family-public-gateway:start' _site/start-here.html

      - name: Upload integrity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-family-integrity-${{ github.run_id }}
          path: |
            downloads/power-family-capstone-reconcile.json
            downloads/behind-the-curtain-production-guard.json
            downloads/power-family-public-gateways.json
          if-no-files-found: warn
          retention-days: 30

      - name: Publish integrity status
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const read=file=>{try{return JSON.parse(fs.readFileSync(file,'utf8'))}catch{return null}};
          const payload={
            checkedAt:new Date().toISOString(),
            ok:process.env.JOB_STATUS==='success',
            status:process.env.JOB_STATUS,
            workflowRunId:Number(process.env.RUN_ID),
            runAttempt:Number(process.env.RUN_ATTEMPT),
            headSha:process.env.HEAD_SHA,
            reconciliation:read('downloads/power-family-capstone-reconcile.json'),
            productionGuard:read('downloads/behind-the-curtain-production-guard.json'),
            publicGateways:read('downloads/power-family-public-gateways.json')
          };
          fs.mkdirSync('data',{recursive:true});
          fs.writeFileSync('data/power-family-integrity-status.json',`${JSON.stringify(payload,null,2)}\n`);
          NODE
          cp data/power-family-integrity-status.json /tmp/power-family-integrity-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp /tmp/power-family-integrity-status.json data/power-family-integrity-status.json
            git add data/power-family-integrity-status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Power-Family integrity status"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
