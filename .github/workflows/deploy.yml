name: Matrix Reprogrammed Production Deploy — HARD FREEZE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-freeze:
    name: Cloudflare production deployment is locked
    runs-on: ubuntu-latest
    steps:
      - name: Enforce production cost freeze
        run: |
          echo "PRODUCTION DEPLOYMENT LOCKED."
          echo "The local intelligence machine may continue running and pushing changes to GitHub."
          echo "Cloudflare Worker deployment is disabled until the repository owner explicitly restores it after free build minutes return."
