name: Review Queue Speculation Live Proof

on:
  workflow_run:
    workflows:
      - Matrix Reprogrammed Controlled Production Deploy
    types: [completed]

permissions:
  contents: write

jobs:
  verify-live-speculation:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify live review-queue speculation
        env:
          SITE_URL: https://matrixreprogrammed.com
          SPECULATION_LIVE_ATTEMPTS: '18'
          SPECULATION_LIVE_DELAY_MS: '5000'
        run: node scripts/review-queue-speculation-live-test.js
      - name: Commit live receipt safely
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          cp downloads/review-queue-speculation-live-test.json data/review-queue-speculation-live-proof.json
          for attempt in 1 2 3; do
            git add data/review-queue-speculation-live-proof.json
            git commit -m "Record live review queue speculation proof" || true
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
