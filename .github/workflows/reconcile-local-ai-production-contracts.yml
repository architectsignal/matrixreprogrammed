name: Reconcile Local AI Production Contracts

on:
  push:
    branches:
      - build/local-execution-daemon-v1
    paths:
      - .github/workflows/reconcile-local-ai-production-contracts.yml

permissions:
  contents: write

concurrency:
  group: reconcile-local-ai-production-contracts
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/local-execution-daemon-v1
          fetch-depth: 0

      - name: Restore current production safety proofs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/deploy.yml')
          text = path.read_text(encoding='utf-8')

          old_rollback = """          if (!rollback.ok || !rollback.bookmark) throw new Error('D1 rollback point is missing');
          if (rollback.commit !== process.env.DEPLOY_COMMIT_SHA) throw new Error('Rollback point is not bound to deployment commit');
"""
          new_rollback = """          if(!rollback.ok||!rollback.bookmark) throw new Error('Validated D1 rollback point is missing');
          if (rollback.commit !== process.env.DEPLOY_COMMIT_SHA) throw new Error('D1 rollback point is not bound to the deployment commit');
          if (!String(rollback.restoreCommand || '').includes(String(rollback.bookmark))) throw new Error('D1 rollback restore command is incomplete');
          console.log(`Validated D1 rollback point ${rollback.bookmark} for ${rollback.commit}.`);
"""

          old_payment = """          const settings = rows(payment);
          const sandbox = settings.find(row => row.environment === 'sandbox');
          if (!sandbox || Number(sandbox.checkout_enabled) !== 0) throw new Error('Sandbox checkout must remain closed');
"""
          new_payment = """          const settings = rows(payment);
          const sandbox = settings.find(row => row.environment === 'sandbox');
          const live = settings.find(row => row.environment === 'live');
          if (!sandbox || !live) throw new Error('Missing PayPal runtime settings');
          if (Number(sandbox.checkout_enabled) !== 0) throw new Error('Sandbox checkout must remain closed outside an explicit rehearsal');
"""

          old_summary = """          console.log('D1 phases 9-12 verified with local execution and Opportunity Hunter zero-spend constraints.');
"""
          new_summary = """          console.log(`D1 phases 9-12 verified with local execution and Opportunity Hunter zero-spend constraints; live PayPal checkout state preserved at ${Number(live.checkout_enabled)}.`);
"""

          replacements = [
              (old_rollback, new_rollback, 'rollback proof'),
              (old_payment, new_payment, 'PayPal state proof'),
              (old_summary, new_summary, 'PayPal preservation receipt'),
          ]
          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one {label} target, found {count}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

          grep -F "if(!rollback.ok||!rollback.bookmark) throw new Error('Validated D1 rollback point is missing')" .github/workflows/deploy.yml
          grep -F 'Sandbox checkout must remain closed outside an explicit rehearsal' .github/workflows/deploy.yml
          grep -F 'live PayPal checkout state preserved' .github/workflows/deploy.yml

      - name: Commit reconciled contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'matrix-reprogrammed-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/deploy.yml
          git diff --cached --check
          git commit -m 'Restore production safety proofs for local AI release'
          git push origin HEAD:build/local-execution-daemon-v1
