name: Death Files Production Proof

on:
  workflow_run:
    workflows:
      - Matrix Reprogrammed Controlled Production Deploy
    types:
      - completed

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  record-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify live Death Files routes
        id: verify
        shell: bash
        run: |
          set +e
          mkdir -p data
          landing_status="$(curl -L -sS -o /tmp/death-files.html -w '%{http_code}' https://matrixreprogrammed.com/death-files.html)"
          epstein_status="$(curl -L -sS -o /tmp/death-file-epstein.html -w '%{http_code}' https://matrixreprogrammed.com/death-file-jeffrey-epstein.html)"
          landing_marker=false
          epstein_marker=false
          grep -q 'THE DEATH FILES' /tmp/death-files.html && landing_marker=true
          grep -q 'DEATH FILE:' /tmp/death-file-epstein.html && grep -q 'Signal Drop' /tmp/death-file-epstein.html && epstein_marker=true
          node - <<'NODE'
          const fs=require('fs');
          const payload={
            observedAt:new Date().toISOString(),
            workflowRunId:Number(process.env.RUN_ID),
            workflowRunNumber:Number(process.env.RUN_NUMBER),
            workflowConclusion:process.env.RUN_CONCLUSION,
            deployedHeadSha:process.env.RUN_HEAD_SHA,
            event:process.env.RUN_EVENT,
            live:{
              landing:{url:'https://matrixreprogrammed.com/death-files.html',status:Number(process.env.LANDING_STATUS),marker:process.env.LANDING_MARKER==='true'},
              epsteinDossier:{url:'https://matrixreprogrammed.com/death-file-jeffrey-epstein.html',status:Number(process.env.EPSTEIN_STATUS),marker:process.env.EPSTEIN_MARKER==='true'}
            },
            productionVerified:process.env.RUN_CONCLUSION==='success'&&process.env.LANDING_STATUS==='200'&&process.env.EPSTEIN_STATUS==='200'&&process.env.LANDING_MARKER==='true'&&process.env.EPSTEIN_MARKER==='true'
          };
          fs.writeFileSync('data/death-files-production-proof.json',JSON.stringify(payload,null,2)+'\n');
          NODE
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          LANDING_STATUS: ${{ steps.verify.outputs.landing_status }}
          EPSTEIN_STATUS: ${{ steps.verify.outputs.epstein_status }}
          LANDING_MARKER: ${{ steps.verify.outputs.landing_marker }}
          EPSTEIN_MARKER: ${{ steps.verify.outputs.epstein_marker }}

      - name: Rebuild proof reliably
        shell: bash
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set +e
          landing_status="$(curl -L -sS -o /tmp/death-files.html -w '%{http_code}' https://matrixreprogrammed.com/death-files.html)"
          epstein_status="$(curl -L -sS -o /tmp/death-file-epstein.html -w '%{http_code}' https://matrixreprogrammed.com/death-file-jeffrey-epstein.html)"
          landing_marker=false
          epstein_marker=false
          grep -q 'THE DEATH FILES' /tmp/death-files.html && landing_marker=true
          grep -q 'DEATH FILE:' /tmp/death-file-epstein.html && grep -q 'Signal Drop' /tmp/death-file-epstein.html && epstein_marker=true
          LANDING_STATUS="$landing_status" EPSTEIN_STATUS="$epstein_status" LANDING_MARKER="$landing_marker" EPSTEIN_MARKER="$epstein_marker" node - <<'NODE'
          const fs=require('fs');
          const payload={observedAt:new Date().toISOString(),workflowRunId:Number(process.env.RUN_ID),workflowRunNumber:Number(process.env.RUN_NUMBER),workflowConclusion:process.env.RUN_CONCLUSION,deployedHeadSha:process.env.RUN_HEAD_SHA,event:process.env.RUN_EVENT,live:{landing:{url:'https://matrixreprogrammed.com/death-files.html',status:Number(process.env.LANDING_STATUS),marker:process.env.LANDING_MARKER==='true'},epsteinDossier:{url:'https://matrixreprogrammed.com/death-file-jeffrey-epstein.html',status:Number(process.env.EPSTEIN_STATUS),marker:process.env.EPSTEIN_MARKER==='true'}},productionVerified:process.env.RUN_CONCLUSION==='success'&&process.env.LANDING_STATUS==='200'&&process.env.EPSTEIN_STATUS==='200'&&process.env.LANDING_MARKER==='true'&&process.env.EPSTEIN_MARKER==='true'};
          fs.writeFileSync('data/death-files-production-proof.json',JSON.stringify(payload,null,2)+'\n');
          NODE

      - name: Commit production proof
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/death-files-production-proof.json
          git diff --cached --quiet && exit 0
          git commit -m 'Record Death Files production proof'
          git push origin main