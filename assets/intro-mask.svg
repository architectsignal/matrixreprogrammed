<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" role="img" aria-labelledby="title desc">
  <title id="title">Anonymous revolutionary mask</title>
  <desc id="desc">A highly detailed ivory theatrical mask with arched brows, pointed moustache and goatee, isolated on a transparent background.</desc>
  <defs>
    <radialGradient id="ivory" cx="42%" cy="26%" r="78%">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset=".18" stop-color="#f0e4c7"/>
      <stop offset=".48" stop-color="#d0bd94"/>
      <stop offset=".76" stop-color="#8d754e"/>
      <stop offset="1" stop-color="#3a2a17"/>
    </radialGradient>
    <linearGradient id="cheek" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e6"/>
      <stop offset=".5" stop-color="#d8c39e"/>
      <stop offset="1" stop-color="#756042"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b96e69" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#a74f4a" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8b3d38" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21150c"/>
      <stop offset=".5" stop-color="#050301"/>
      <stop offset="1" stop-color="#25160b"/>
    </linearGradient>
    <filter id="surface" x="-25%" y="-25%" width="150%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency=".012 .1" numOctaves="4" seed="31" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="grain"><feFuncA type="table" tableValues="0 .18"/></feComponentTransfer>
      <feBlend in="SourceGraphic" in2="grain" mode="multiply"/>
      <feDropShadow dx="0" dy="36" stdDeviation="34" flood-color="#000" flood-opacity=".94"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#e9d7a7" flood-opacity=".2"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
