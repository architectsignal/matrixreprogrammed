name: Matrix Local Agent Tests

on:
  pull_request:
    paths:
      - 'local-agent/**'
      - 'ai-management/local-runtime/**'
      - 'src/worker-local-job-api.js'
      - 'src/worker-production-autonomy.js'
      - 'migrations/phase11_local_job_queue.sql'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/local-agent-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run local agent tests
        run: node local-agent/matrix-local-agent.test.mjs
      - name: Run control-plane client tests
        run: node local-agent/control-plane-client.test.mjs
      - name: Run local queue tests
        run: node ai-management/local-runtime/job-queue.test.mjs
      - name: Check Worker queue API syntax
        run: |
          node --check src/worker-local-job-api.js
          node --check src/worker-production-autonomy.js
      - name: Verify controlled Phase 11 migration wiring
        run: |
          grep -F 'migrations/phase11_local_job_queue.sql' .github/workflows/deploy.yml
          grep -F "'ai_local_jobs','ai_local_job_receipts'" .github/workflows/deploy.yml
          grep -F 'downloads/d1-local-job-schema.json' .github/workflows/deploy.yml
