name: Probability Machine

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/scenario-probability-engine.js'
      - 'src/worker-scenario-probability.js'
      - 'src/probability-machine/**'
      - 'src/worker-production-autonomy.js'
      - 'probability-machine.*'
      - 'data/scenario-registry.json'
      - 'scripts/scenario-probability-test.mjs'
      - '.github/workflows/probability-machine.yml'
  push:
    branches:
      - main
      - 'agent/probability-machine-v1'
    paths:
      - 'src/scenario-probability-engine.js'
      - 'src/worker-scenario-probability.js'
      - 'src/probability-machine/**'
      - 'src/worker-production-autonomy.js'
      - 'probability-machine.*'
      - 'data/scenario-registry.json'
      - 'scripts/scenario-probability-test.mjs'
      - '.github/workflows/probability-machine.yml'

permissions:
  contents: read

jobs:
  deterministic-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run Probability Machine contract
        run: node scripts/scenario-probability-test.mjs
      - name: Verify production wrapper syntax
        run: node --check src/worker-production-autonomy.js
