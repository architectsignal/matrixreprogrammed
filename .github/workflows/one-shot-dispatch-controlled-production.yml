name: Homepage intro production hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/one-shot-controlled-production.trigger

permissions:
  contents: read

concurrency:
  group: homepage-intro-production-hotfix
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Generate and install homepage video intro
        run: |
          set -euo pipefail
          node scripts/patch-homepage-mask-intro.js
          mkdir -p _site
          cp index.html _site/index.html
          cp homepage-mask-intro.css _site/homepage-mask-intro.css
          cp homepage-mask-intro-data.js _site/homepage-mask-intro-data.js
          cp homepage-mask-intro.js _site/homepage-mask-intro.js
          grep -q '20260725-video-v5' _site/index.html
          grep -q 'matrix-homepage-intro-seen-v5' _site/homepage-mask-intro.js
          test "$(wc -c < _site/homepage-mask-intro-data.js)" -gt 10000

      - name: Deploy corrected production assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.toml

      - name: Verify live forced replay
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            nonce="$(date +%s)-$attempt"
            home="$(curl -fsSL -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/?intro=1&hotfix=$nonce" || true)"
            js="$(curl -fsSL -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/homepage-mask-intro.js?v=20260725-video-v5&hotfix=$nonce" || true)"
            data="$(curl -fsSL -H 'Cache-Control: no-cache' "https://matrixreprogrammed.com/homepage-mask-intro-data.js?v=20260725-video-v5&hotfix=$nonce" || true)"
            if printf '%s' "$home" | grep -q 'homepage-mask-intro-data.js?v=20260725-video-v5' \
              && printf '%s' "$home" | grep -q 'homepage-mask-intro.js?v=20260725-video-v5' \
              && printf '%s' "$js" | grep -q 'matrix-homepage-intro-seen-v5' \
              && test "${#data}" -gt 10000; then
              echo 'VERIFIED: homepage intro v5 is live.'
              exit 0
            fi
            sleep 5
          done
          exit 1
