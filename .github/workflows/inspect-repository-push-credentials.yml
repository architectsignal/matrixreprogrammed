name: Inspect Repository Push Credentials
on:
  push:
    branches:
      - agent/final-pinned-production-20260807
    paths:
      - '.github/workflows/inspect-repository-push-credentials.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List credential identifiers referenced by workflows
        shell: bash
        run: |
          set -euo pipefail
          grep -RhoE 'secrets\.[A-Za-z0-9_]+' .github/workflows | sort -u || true
          echo '--- ssh/deploy/PAT references ---'
          grep -RniE 'ssh-agent|deploy.key|private.key|personal.access|(^|[^A-Z])PAT([^A-Z]|$)|REPO_TOKEN|WORKFLOW_TOKEN|GH_TOKEN' .github/workflows || true
